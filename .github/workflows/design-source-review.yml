name: Design source review

on:
  schedule:
    - cron: '23 15 * * *'
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/design-source-review.yml'
      - 'scripts/watch_design_sources.py'
      - 'scripts/test_watch_design_sources.py'
      - 'evals/vision/score*.py'
      - 'evals/vision/test_score.py'
      - 'evals/social-design/status.py'
      - 'evals/social-design/test_status.py'
      - 'evidence/benchmark-v1/social-*-live-r*.json'
      - 'evidence/benchmark-v1/social-*-confirmation-r*.json'
  push:
    branches:
      - design-mcp/source-review-ci
    paths:
      - '.github/workflows/design-source-review.yml'
      - 'scripts/watch_design_sources.py'
      - 'scripts/test_watch_design_sources.py'
      - 'evals/vision/score*.py'
      - 'evals/vision/test_score.py'
      - 'evals/social-design/status.py'
      - 'evals/social-design/test_status.py'
      - 'evidence/benchmark-v1/social-*-live-r*.json'
      - 'evidence/benchmark-v1/social-*-confirmation-r*.json'

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test source parsing
        run: python3 -m unittest discover -s scripts -p 'test_watch_design_sources.py'
      - name: Test live critique verification
        run: python3 -m unittest discover -s evals/vision -p 'test_score.py'
      - name: Test social design release gates and replay the archive
        run: |
          python3 -m unittest discover -s evals/social-design -p 'test_status.py'
          python3 evals/social-design/status.py
      - name: Collect public leads for review
        shell: bash
        run: python3 scripts/watch_design_sources.py | tee -a "$GITHUB_STEP_SUMMARY"
