name: Specific landing visual comparison

on:
  push:
    branches: [design-mcp/specific-landing-captures]
    paths: ['.github/workflows/playwriter-baseline.yml', 'evidence/benchmark-v1/candidate-inputs/**', 'evals/v1/render.py']

permissions:
  contents: read

jobs:
  captures:
    runs-on: macos-15
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install the isolated renderer
        shell: bash
        run: |
          python -m pip install 'fastmcp==4.2.4'
          npm install --prefix "$RUNNER_TEMP/playwriter" --ignore-scripts --no-fund --no-audit 'playwriter@0.12.0'
          curl -fsSL https://storage.googleapis.com/chrome-for-testing-public/158.0.8127.36/mac-arm64/chrome-mac-arm64.zip -o "$RUNNER_TEMP/chrome.zip"
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP/browser"
      - name: Capture both viewports with Playwriter MCP
        shell: bash
        run: |
          chrome="$RUNNER_TEMP/browser/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          "$chrome" --version
          python evals/v1/render.py \
            --cells evidence/benchmark-v1/candidate-inputs --scratch "$RUNNER_TEMP/profile" \
            --playwriter "$RUNNER_TEMP/playwriter/node_modules/.bin/playwriter" --chrome "$chrome"
          python - <<'PY'
          from pathlib import Path
          import json
          for path in Path('evidence/benchmark-v1/candidate-inputs').rglob('index.html'):
              record = json.loads(path.with_name('render.json').read_text())
              assert record['browser'].endswith('158.0.8127.36'), record['browser']
              assert all(item['status'] == 'rendered' for item in record['captures'].values()), record
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: specific-landing-captures
          path: evidence/benchmark-v1/candidate-inputs/
          if-no-files-found: error
          retention-days: 7
