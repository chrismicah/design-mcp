name: Portable package install and doctor

on:
  push:
    branches: [master, design-mcp/portable-package-ci, design-mcp/curated-default, design-mcp/form-rollout, design-mcp/direct-install-proof, design-mcp/url-session-proof]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install:
    name: ${{ matrix.host.arch }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
        host:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 12
    steps:
      - name: Check out the portability candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select the exact Python interpreter
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install from the pinned Git revision using pipx and uv
        shell: bash
        env:
          EXPECTED_PYTHON: ${{ matrix.python }}
          EXPECTED_ARCH: ${{ matrix.host.arch }}
          PYTHON_EXECUTABLE: ${{ steps.python.outputs.python-path }}
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash scripts/verify_install_matrix.sh --check-host 15 "$EXPECTED_ARCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test "$("$PYTHON_EXECUTABLE" -I -c 'import platform; print(platform.machine())')" = "$EXPECTED_ARCH"
          echo "Architecture: $(uname -m), $(sw_vers -productVersion), $("$PYTHON_EXECUTABLE" -V)" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/verify_clean_install.sh "$GITHUB_WORKSPACE" "$PYTHON_EXECUTABLE" \
            "$RUNNER_TEMP/design-install" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
