name: Registry and design skill retrieval on the 36 frozen briefs

on:
  push:
    branches: [design-mcp/registry-and-skill-benchmark]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        candidate: [shadcn, ui-ux-pro-max]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install and probe without account configuration
        shell: bash
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          probe="$RUNNER_TEMP/probe"
          fixture="$RUNNER_TEMP/components-project"
          mkdir -p "$probe" "$fixture" "$RUNNER_TEMP/probe-home"
          if [[ "$CANDIDATE" == shadcn ]]; then
            python -m pip install 'fastmcp==4.2.4'
            npm install --prefix "$fixture" --ignore-scripts --no-fund --no-audit shadcn@4.23.0
            node - "$fixture/package-lock.json" <<'JS'
            const lock = require(process.argv[2]);
            const item = lock.packages['node_modules/shadcn'];
            if (item.version !== '4.23.0' ||
                item.integrity !== 'sha512-lKgq7QPFgkV/6EOrMCwvEn7ZAw/YnM/grhxzJmK4cZdw3E4F3Ut2EmWvrn2E+vzJp1y/76mxU185OSkXo9Ff+Q==') {
              throw new Error('Unexpected shadcn package pin');
            }
          JS
            cat > "$fixture/components.json" <<'JSON'
          {
            "$schema": "https://ui.shadcn.com/schema.json",
            "style": "new-york",
            "rsc": false,
            "tsx": true,
            "tailwind": {"config": "", "css": "app/globals.css", "baseColor": "neutral", "cssVariables": true, "prefix": ""},
            "aliases": {"components": "@/components", "utils": "@/lib/utils"}
          }
          JSON
            pin=shadcn@4.23.0
            launch="$fixture/node_modules/.bin/shadcn"
          else
            pin=a38d04c3d5c298c851dbe5e6ee1965ee3de42cb5
            git -C "$fixture" init
            git -C "$fixture" fetch --depth 1 https://github.com/nextlevelbuilder/ui-ux-pro-max-skill.git "$pin"
            git -C "$fixture" checkout --detach FETCH_HEAD
            test "$(git -C "$fixture" rev-parse HEAD)" = "$pin"
            launch="$fixture/src/ui-ux-pro-max/scripts/search.py"
          fi
          env -i PATH="$PATH" XDG_CONFIG_HOME="$RUNNER_TEMP/probe-home" python evals/v1/probe_registry_and_skill.py "$CANDIDATE" \
            --pin "$pin" --cwd "$fixture" --launch "$launch" --out "$probe/$CANDIDATE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frozen-retrieval-${{ matrix.candidate }}
          path: ${{ runner.temp }}/probe/*.json
          if-no-files-found: error
          retention-days: 7
