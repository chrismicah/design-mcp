name: Native Swift review proof

on:
  push:
    branches:
      - design-mcp/swift-review-proof
      - design-mcp/review-integration
      - design-mcp/swift-reference-fixture

permissions:
  contents: read

jobs:
  native:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify the exact reference candidate source
        if: github.ref_name == 'design-mcp/swift-reference-fixture'
        shell: bash
        run: |
          expected=f17bd6f79fff62d1ec3e051b29d930ccb32b3a46
          git diff --exit-code "$expected" HEAD -- design_mcp integrations/desktop evals/vision/fixtures/swift evals/vision/verify_swift_capture.py pyproject.toml
      - name: Install Design MCP and generate the fixture project
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/design-review"
          "$RUNNER_TEMP/design-review/bin/python" -m pip install .
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.48.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          printf '620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892  %s\n' "$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          generator=$(find "$RUNNER_TEMP/xcodegen" -type f -path '*/bin/xcodegen')
          "$generator" generate --spec evals/vision/fixtures/swift/project.yml
      - name: Open the Swift app, exercise the native control, and review captured geometry
        shell: bash
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcodebuild test -project evals/vision/fixtures/swift/ReviewFixture.xcodeproj \
            -scheme ReviewFixture -destination 'platform=macOS,arch=arm64' -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/derived" -resultBundlePath "$RUNNER_TEMP/native-review.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/xcode.log"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/native-review.xcresult" --output-path "$RUNNER_TEMP/attachments"
          "$RUNNER_TEMP/design-review/bin/python" evals/vision/verify_swift_capture.py \
            "$RUNNER_TEMP/attachments" "$RUNNER_TEMP/design-review/bin/design-mcp" "$RUNNER_TEMP/swift-proof"
      - name: Archive the same tested SwiftUI app for reference Mac QA
        if: github.ref_name == 'design-mcp/swift-reference-fixture'
        shell: bash
        run: |
          app="$RUNNER_TEMP/derived/Build/Products/Debug/ReviewFixture.app"
          executable="$app/Contents/MacOS/ReviewFixture"
          info="$app/Contents/Info.plist"
          proof="$RUNNER_TEMP/swift-reference-app"
          mkdir -p "$proof"
          test -x "$executable"
          test "$(lipo -archs "$executable")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")" = org.designmcp.reviewfixture
          codesign --verify --strict "$app"
          otool -l "$executable" | grep -Eq 'minos[[:space:]]+13\.0$$'
          ditto -c -k --keepParent "$app" "$proof/ReviewFixture.zip"
          test "$(stat -f %z "$proof/ReviewFixture.zip")" -lt 4194304
          (
            cd "$proof"
            shasum -a 256 ReviewFixture.zip > archive.sha256
          )
          shasum -a 256 "$executable" | awk '{print $1}' > "$proof/executable.sha256"
          {
            sw_vers
            uname -m
            printf 'Candidate f17bd6f79fff62d1ec3e051b29d930ccb32b3a46\n'
            printf 'Harness %s\n' "$GITHUB_SHA"
          } > "$proof/build.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.ref_name == 'design-mcp/swift-reference-fixture'
        with:
          name: swift-reference-app
          path: ${{ runner.temp }}/swift-reference-app/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: swift-review-receipt
          path: |
            ${{ runner.temp }}/swift-proof/
            ${{ runner.temp }}/attachments/manifest.json
            ${{ runner.temp }}/xcode.log
          if-no-files-found: warn
          retention-days: 7
