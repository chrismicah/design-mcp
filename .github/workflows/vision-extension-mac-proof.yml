name: macOS Chrome review extension keyboard proof

on:
  push:
    branches: [design-mcp/chrome-mac-proof]

permissions:
  contents: read

jobs:
  popup:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 12
    env:
      CHROME_VERSION: '158.0.8127.36'
      DESIGN_MCP_CANDIDATE: '2fcd31221671590152401d958b904141e438e453'
      FIRST_ACTIVATION_TRIALS: '3'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: '${{ env.DESIGN_MCP_CANDIDATE }}'
          path: pinned-source
          persist-credentials: false
      - name: Record runner and checkout identity
        shell: bash
        run: |
          proof="$RUNNER_TEMP/extension-mac-proof"
          mkdir -p "$proof"
          {
            sw_vers
            uname -m
            printf 'Harness %s\n' "$(git rev-parse HEAD)"
            printf 'Candidate %s\n' "$(git -C pinned-source rev-parse HEAD)"
            node --version
          } | tee "$proof/runner.txt"
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C pinned-source rev-parse HEAD)" = "$DESIGN_MCP_CANDIDATE"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install the checkout and prepare the pinned browser
        shell: bash
        run: |
          proof="$RUNNER_TEMP/extension-mac-proof"
          app="$RUNNER_TEMP/browser/chrome-mac-arm64/Google Chrome for Testing.app"
          exec > >(tee "$proof/setup.log") 2>&1
          python -m venv "$RUNNER_TEMP/design-review"
            "$RUNNER_TEMP/design-review/bin/python" -m pip install ./pinned-source 'pillow>=11,<13'
          curl -fsSL "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/mac-arm64/chrome-mac-arm64.zip" -o "$RUNNER_TEMP/chrome.zip"
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP/browser"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          {
            printf 'Google Chrome for Testing %s\n%s\n' "$version" "$bundle_id"
            file "$app/Contents/MacOS/Google Chrome for Testing"
          } | tee "$proof/browser-version.txt"
          test "$version" = "$CHROME_VERSION"
          xcrun swiftc evals/vision/chrome_smoke_key.swift -o "$RUNNER_TEMP/chrome_smoke_key"
      - name: Exercise the real toolbar popup and reopen the saved preview
        shell: bash
        run: |
          proof="$RUNNER_TEMP/extension-mac-proof"
          cli="$RUNNER_TEMP/design-review/bin/design-mcp"
          extension="$RUNNER_TEMP/review-extension"
          chrome="$RUNNER_TEMP/browser/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          exec > >(tee "$proof/attempt.log") 2>&1
          installed=$("$cli" review --extension-path)
            diff -qr pinned-source/design_mcp/review/extension "${installed%%$'\n'*}"
          cp -R "${installed%%$'\n'*}" "$extension"
          python - "$extension/manifest.json" <<'PY'
          from pathlib import Path
          import json, sys

          path = Path(sys.argv[1])
          manifest = json.loads(path.read_text())
          manifest.setdefault('commands', {})['_execute_action'] = {
              'suggested_key': {'default': 'Ctrl+Shift+Y', 'mac': 'Command+Shift+Y'}
          }
          path.write_text(json.dumps(manifest))
          PY
          export DESIGN_MCP_CHROME_KEY_HELPER="$RUNNER_TEMP/chrome_smoke_key"
          for ((sample=1; sample<=FIRST_ACTIVATION_TRIALS; sample++)); do
            trial="$proof"
            [[ $sample == 1 ]] || trial="$proof/sample-$sample"
            if node --experimental-websocket evals/vision/extension_smoke.mjs "$chrome" "$cli" "$extension" "$trial"; then
              printf 'Trial %s completed\n' "$sample"
            else
              printf 'Trial %s failed with exit code %s\n' "$sample" "$?"
            fi
          done
          python - "$proof" "$FIRST_ACTIVATION_TRIALS" "$CHROME_VERSION" <<'PY'
          from math import ceil, isfinite
          from pathlib import Path
          import json, sys

          root, count, version = Path(sys.argv[1]), int(sys.argv[2]), sys.argv[3]
          rows = []
          for sample in range(1, count + 1):
              trial = root if sample == 1 else root / f'sample-{sample}'
              receipt = trial / 'extension-review.json'
              record = json.loads(receipt.read_text()) if receipt.exists() else {}
              timings = record.get('firstActivation', {})
              passed = (record.get('browserChecksPassed') is True and record.get('browser') == f'Chrome/{version}'
                        and all(type(timings.get(key)) in (int, float) and isfinite(timings[key]) and timings[key] > 0
                                for key in ('openMs', 'scanMs')))
              rows.append({'sample': sample, 'passed': passed, 'timings': timings,
                           'error': record.get('error') if record else 'missing receipt',
                           'profile': record.get('chromeProfile')})
          distinct_profiles = len({row['profile'] for row in rows if row['profile']}) == count
          report = {'scope': 'First keyboard toolbar activation in separate Chrome processes and empty profiles. '
                             'Scan follows the profile-scoped native-host install. Includes observation overhead.',
                    'expected_trials': count, 'trials': rows, 'distinct_profiles': distinct_profiles}
          if count >= 30 and distinct_profiles and all(row['passed'] for row in rows):
              report['p95'] = {
                  metric: sorted(row['timings'][metric] for row in rows)[ceil(count * .95) - 1]
                  for metric in ('openMs', 'scanMs')
              }
          (root / 'first-activation-series.json').write_text(json.dumps(report, indent=2) + '\n')
          if not distinct_profiles or not all(row['passed'] for row in rows):
              raise SystemExit('One or more first-activation trials failed')
          PY
      - name: Verify and archive the visibly masked saved capture
        shell: bash
        run: |
          proof="$RUNNER_TEMP/extension-mac-proof"
          "$RUNNER_TEMP/design-review/bin/python" - "$proof" "$CHROME_VERSION" <<'PY' 2>&1 | tee "$proof/mask-verification.log"
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, io, json, re, shutil, sys

          root = Path(sys.argv[1])
          proof_path = root / 'extension-review.json'
          proof = json.loads(proof_path.read_text())
          assert proof['browserChecksPassed'], proof
          assert proof['browser'] == f'Chrome/{sys.argv[2]}', proof['browser']
          preview = Path(proof['previewFolder'])
          html = (preview / 'preview.html').read_text()
          evidence = (preview / 'evidence.json').read_text()
          assert 'fixture-redaction-sentinel-' not in html + evidence
          frame = json.loads(evidence)['frames'][0]
          assert frame['masks']['applied'] and frame['masks']['counts']['field'] == 1
          match = re.search(r'data:image/png;base64,([A-Za-z0-9+/=]+)', html)
          assert match, 'Saved preview is missing the embedded capture'
          content = base64.b64decode(match[1], validate=True)
          assert hashlib.sha256(content).hexdigest() == frame['screenshot']['sha256']

          field = proof['field']
          with Image.open(io.BytesIO(content)) as image:
              sx = image.width / field['viewport'][0]
              sy = image.height / field['viewport'][1]
              left = max(0, round(field['x'] * sx)) + 2
              top = max(0, round(field['y'] * sy)) + 2
              right = min(image.width, round((field['x'] + field['width']) * sx)) - 2
              bottom = min(image.height, round((field['y'] + field['height']) * sy)) - 2
              assert right - left >= 3 and bottom - top >= 3, 'No visible field interior to verify'
              interior = image.convert('RGB').crop((left, top, right, bottom))
              assert interior.getextrema() == ((138, 138), (143, 143), (152, 152)), 'Field is not visibly masked'

          saved = root / 'saved-preview'
          saved.mkdir()
          for name in ('preview.html', 'evidence.json'):
              shutil.copyfile(preview / name, saved / name)
          proof.update(passed=True, phase='complete', verifiedMaskInterior=True, privateValueAbsentFromArtifacts=True)
          proof_path.write_text(json.dumps(proof, indent=2) + '\n')
          print('Verified the saved capture masks the seeded field with the expected pixels.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: extension-mac-review-receipt
          path: |
            ${{ runner.temp }}/extension-mac-proof/*.txt
            ${{ runner.temp }}/extension-mac-proof/*.log
            ${{ runner.temp }}/extension-mac-proof/*.json
            ${{ runner.temp }}/extension-mac-proof/*.png
            ${{ runner.temp }}/extension-mac-proof/sample-*/extension-review.json
            ${{ runner.temp }}/extension-mac-proof/saved-preview/
          if-no-files-found: warn
          retention-days: 7
