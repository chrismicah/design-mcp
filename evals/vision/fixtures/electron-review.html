<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Desk review fixture</title>
<style>
  main { padding: 24px; }
  #covered { position: relative; margin-block: 24px; width: max-content; }
  #cover { position: absolute; inset: 0; background: #333; }
  #clipped { position: fixed; right: -30px; bottom: 20px; width: 100px; }
</style>
<main>
  <h1>Desk review fixture</h1>
  <button id="reveal">Reveal control</button>
  <p id="status" role="status">Control covered</p>
  <section id="covered">
    <button>Covered control</button>
    <span id="cover" aria-hidden="true"></span>
  </section>
  <label>Local note <input value="desktop-review-fixture-private-marker"></label>
  <button id="clipped">Clipped control</button>
  <button hidden>Hidden control</button>
  <button disabled>Disabled control</button>
</main>
<script src="electron-review.js"></script>
