<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>John Snow’s Soho map | Wellcome Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gloock:wght@400&family=News+Cycle:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #173532;
      --surface: #102623;
      --ink: #fff1d6;
      --muted: #b5c1aa;
      --accent: #f3c77c;
      --line: rgba(255, 241, 214, .25);
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "News Cycle", sans-serif;
      font-size: 1.1rem;
      line-height: 1.4;
    }

    button, a { font: inherit; }

    a {
      color: inherit;
      text-decoration-thickness: 1px;
      text-underline-offset: .2em;
    }

    :focus-visible {
      outline: 2px solid var(--paper);
      outline-offset: 2px;
      box-shadow: 0 0 0 6px var(--ink);
    }

    main {
      max-width: 1600px;
      min-height: 100svh;
      margin: auto;
      padding: clamp(1rem, 2.5vw, 2.5rem);
    }

    .page {
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(17rem, .75fr);
      gap: clamp(1.25rem, 3vw, 3.5rem);
      align-items: start;
    }

    .object {
      min-width: 0;
      margin: 0;
    }

    .map-frame {
      position: relative;
      width: fit-content;
      max-width: 100%;
      margin: auto;
      line-height: 0;
    }

    .map-frame > img {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: calc(100svh - 6rem);
      object-fit: contain;
    }

    .locator {
      position: absolute;
      left: 50%;
      top: 40%;
      width: 16%;
      height: 15%;
      border: 3px solid var(--accent);
      box-shadow: 0 0 0 1px var(--surface);
      pointer-events: none;
    }

    .object-caption {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: .2rem 1rem;
      margin-top: .6rem;
      color: var(--muted);
      font-size: .9rem;
    }

    .reading {
      padding-top: clamp(.25rem, 2vw, 2rem);
    }

    .collection {
      margin: 0 0 .9rem;
      color: var(--muted);
      font-size: 1rem;
    }

    h1 {
      max-width: 11ch;
      margin: 0;
      font-family: "Gloock", Georgia, serif;
      font-size: clamp(2.15rem, 4vw, 4.5rem);
      font-weight: 400;
      letter-spacing: -.02em;
      line-height: 1.03;
    }

    .identity {
      margin: 1rem 0 1.5rem;
      color: var(--muted);
    }

    .action {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 3.25rem;
      padding: .7rem 1.1rem;
      border: 0;
      border-radius: 2px;
      background: var(--accent);
      color: var(--paper);
      font-weight: 700;
      cursor: pointer;
    }

    .action:hover { background: var(--ink); }

    .intro {
      max-width: 34ch;
      margin: 1.5rem 0 0;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
    }

    .intro p { margin: 0 0 .7rem; }

    .detail {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(17rem, .75fr);
      gap: clamp(1.25rem, 3vw, 3.5rem);
      align-items: start;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
    }

    .detail[hidden], .locator[hidden], .status[hidden] {
      display: none;
    }

    .crop {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 0;
      line-height: 0;
    }

    .crop img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* The keys sit outside the reproduction and align with the marks. */
    .crop-key {
      position: absolute;
      left: 0;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      border: 2px solid var(--paper);
      border-radius: 50%;
      background: var(--accent);
      color: var(--paper);
      font: 700 1rem/1 "News Cycle", sans-serif;
      box-shadow: 0 0 0 2px var(--ink);
    }

    .crop-key.pump { top: 37%; }
    .crop-key.deaths { top: 55%; }

    .detail-copy {
      padding: 1.2rem;
      background: var(--surface);
    }

    h2 {
      margin: 0 0 1rem;
      font-family: "Gloock", Georgia, serif;
      font-size: clamp(1.7rem, 2.4vw, 2.35rem);
      font-weight: 400;
      line-height: 1.1;
    }

    .reading-item {
      display: grid;
      grid-template-columns: 2rem 1fr;
      gap: .75rem;
      padding: .9rem 0;
      border-top: 1px solid var(--line);
    }

    .reading-item p { margin: 0; }

    .key {
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      background: var(--accent);
      color: var(--paper);
      font-weight: 700;
    }

    .reading-item strong {
      display: block;
      margin-bottom: .15rem;
      font-size: 1.1rem;
    }

    .overview {
      max-width: 13rem;
      margin: 1.25rem 0 0;
    }

    .overview .map-frame > img {
      width: 100%;
      max-height: none;
    }

    .overview .locator { border-width: 2px; }

    .overview figcaption {
      margin-top: .4rem;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.3;
    }

    .status {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 700px) {
      main { padding: .85rem 1rem 2rem; }

      .page {
        display: flex;
        flex-direction: column;
        gap: .8rem;
      }

      .reading {
        display: contents;
      }

      .heading {
        order: 0;
      }

      .object {
        order: 1;
        width: 100%;
      }

      .controls {
        order: 2;
        width: 100%;
      }

      .detail {
        order: 3;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding-top: 1rem;
      }

      .detail[hidden] { display: none; }

      .collection {
        margin-bottom: .2rem;
        font-size: .9rem;
      }

      h1 {
        max-width: none;
        font-size: clamp(1.8rem, 8vw, 2.6rem);
      }

      .identity {
        margin: .3rem 0 0;
        font-size: .95rem;
      }

      .map-frame > img {
        max-height: 43svh;
      }

      .object-caption {
        margin-top: .25rem;
        font-size: .82rem;
      }

      .intro {
        margin-top: 1rem;
      }

      .crop {
        width: calc(100% - 1rem);
        margin-left: 1rem;
      }

      .detail-copy { width: 100%; }

      .overview {
        max-width: 10rem;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .detail:not([hidden]) {
        animation: reveal 240ms ease-out;
      }

      @keyframes reveal {
        from { opacity: 0; transform: translateY(.4rem); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="page">
      <figure class="object">
        <div class="map-frame">
          <img
            src="/fixture/soho.jpg"
            width="1601"
            height="1486"
            alt="The whole original print of John Snow’s map of the 1854 Soho outbreak."
          >
          <span class="locator" aria-hidden="true" hidden></span>
        </div>
        <figcaption class="object-caption">
          <span>John Snow, 1855</span>
          <span>
            <a href="https://wellcomecollection.org/works/uxgfjt62">Wellcome Collection</a>
            · Public Domain Mark
          </span>
        </figcaption>
      </figure>

      <div class="reading">
        <header class="heading">
          <p class="collection">Wellcome Collection</p>
          <h1>John Snow’s Soho map</h1>
          <p class="identity">The 1854 outbreak · Original print, 1855</p>
        </header>

        <div class="controls">
          <button
            class="action"
            id="detail-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="broad-street-detail"
          >Read the Broad Street detail</button>

          <div class="intro">
            <p>The circle beside <strong>PUMP</strong> identifies a public water pump.</p>
            <p>Each black bar records one death.</p>
          </div>
        </div>
      </div>

      <section
        class="detail"
        id="broad-street-detail"
        aria-labelledby="detail-title"
        hidden
      >
        <figure class="crop">
          <img
            src="/fixture/broad-street.jpg"
            width="720"
            height="628"
            alt="Enlarged detail of Broad Street and Cambridge Street on the map, showing PUMP beside a circle and a nearby stack of black bars."
          >
          <span class="crop-key pump" aria-hidden="true">1</span>
          <span class="crop-key deaths" aria-hidden="true">2</span>
        </figure>

        <div class="detail-copy">
          <h2 id="detail-title">Reading the marks</h2>

          <div class="reading-item">
            <span class="key" aria-hidden="true">1</span>
            <p><strong>Circle beside PUMP</strong>A public water pump.</p>
          </div>

          <div class="reading-item">
            <span class="key" aria-hidden="true">2</span>
            <p><strong>Black bars</strong>Each printed bar represents one recorded death.</p>
          </div>

          <figure class="overview">
            <div class="map-frame">
              <img
                src="/fixture/soho.jpg"
                width="1601"
                height="1486"
                alt=""
              >
              <span class="locator" aria-hidden="true"></span>
            </div>
            <figcaption>The outline shows the approximate location of the detail on the whole print.</figcaption>
          </figure>
        </div>
      </section>
    </div>
    <span class="status" id="status" role="status" aria-live="polite"></span>
  </main>

  <script>
    (() => {
      const button = document.getElementById("detail-toggle");
      const detail = document.getElementById("broad-street-detail");
      const locator = document.querySelector(".object .locator");
      const status = document.getElementById("status");

      button.addEventListener("click", () => {
        const opening = button.getAttribute("aria-expanded") !== "true";
        detail.hidden = !opening;
        locator.hidden = !opening;
        button.setAttribute("aria-expanded", String(opening));
        button.textContent = opening
          ? "Return to the map"
          : "Read the Broad Street detail";
        status.textContent = opening
          ? "Broad Street detail is open."
          : "Broad Street detail is closed.";
      });
    })();
  </script>
</body>
</html>
