<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Departures · Spur</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--paper,#fafaf7);color:var(--ink,#212724);font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,Arial,sans-serif}main,header{width:min(1160px,90%);margin:auto}header,.row{display:flex;align-items:center;justify-content:space-between;gap:1rem}header{padding:22px 0;border-bottom:1px solid currentColor}h1,h2,h3,p{margin:0}h1,h2,h3{line-height:1.05;letter-spacing:-.045em}h1{font-size:clamp(2.8rem,6vw,5.8rem)}h2{font-size:2rem}p+p{margin-top:1em}.brand{font-size:1.4rem;font-weight:750;letter-spacing:-.05em}.label{font:700 .75rem/1.4 ui-monospace,monospace;text-transform:uppercase;letter-spacing:.1em}button,summary,a{font:inherit;cursor:pointer}button{min-height:44px;padding:10px 18px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:5px;font-weight:650}button:hover,summary:hover,a:hover{filter:brightness(.88);text-decoration:underline}.primary{color:white;background:var(--accent,#284a3a);border-color:transparent}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #0086cb;outline-offset:4px}dialog{background:var(--paper,#fff);color:inherit;width:min(520px,90%);max-height:85dvh;border:1px solid;padding:28px;border-radius:8px}dialog::backdrop{background:#101923aa}dialog h2{margin-bottom:16px}dialog form{margin-top:24px}details{border-top:1px solid;padding:0}summary{padding:15px 0;font-weight:600}details p{padding-bottom:16px}svg{display:block;width:100%;height:auto}
body{--paper:#e7edf1;--ink:#102743;--accent:#173f73}header,main{max-width:520px}header{border:0}.brand{font-style:italic;font-size:2.1rem}.ticket{position:relative;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 10px 32px #25466314}.route{background:#133354;color:white;padding:24px}.route h1{font-size:4rem}.track{height:32px;position:relative;overflow:hidden;margin:14px 0 0;background:linear-gradient(155deg,transparent 39%,#9dc4df 40% 42%,transparent 43%),linear-gradient(0deg,transparent 60%,#a7d4d8 60% 69%,transparent 69%)}.depart{padding:22px}.time{display:block;font-weight:750;font-size:4.4rem;line-height:1;letter-spacing:-.07em}.platform{background:#f8cc66;padding:4px 10px;border-radius:4px;white-space:nowrap;font-weight:bold}.stub{padding:16px 22px;border-top:2px dashed #bccbd7}.primary{width:100%}section+section{margin:24px 0}details{border-color:#b9c7cf}.serial{font:700 2.2rem monospace;letter-spacing:.04em}
</style></head>
<body><header><b class="brand">Spur</b><span>Commuter rail</span></header><main><section class="ticket"><div class="route"><span class="label">Departure to</span><h1>Union</h1><div class="track" aria-hidden="true"></div></div><div class="depart"><span class="label">Departs</span><div class="row"><b class="time">08:42</b><span class="platform">Platform 3</span></div></div><div class="stub"><button id="reveal" class="primary">Reveal ticket</button></div></section><section aria-label="Travel options"><details><summary>Next departure · 08:58</summary><p>08:58 to Union, 16 minutes after the 08:42 service.</p></details><details><summary>Weekly pass</summary><p>One pass for a week of commuter rail travel.</p></details></section></main><dialog aria-labelledby="dialog-title"><h2 id="dialog-title">Union</h2><p>08:42 · Platform 3</p><p class="serial">TKT-0837</p><form method="dialog"><button>Back to departure</button></form></dialog>
<script>
document.querySelector('#reveal').onclick = () => document.querySelector('dialog').showModal();
</script>
</body></html>
