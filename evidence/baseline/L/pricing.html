<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pricing · Relay Notes</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--paper,#fafaf7);color:var(--ink,#212724);font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,Arial,sans-serif}main,header{width:min(1160px,90%);margin:auto}header,.row{display:flex;align-items:center;justify-content:space-between;gap:1rem}header{padding:22px 0;border-bottom:1px solid currentColor}h1,h2,h3,p{margin:0}h1,h2,h3{line-height:1.05;letter-spacing:-.045em}h1{font-size:clamp(2.8rem,6vw,5.8rem)}h2{font-size:2rem}p+p{margin-top:1em}.brand{font-size:1.4rem;font-weight:750;letter-spacing:-.05em}.label{font:700 .75rem/1.4 ui-monospace,monospace;text-transform:uppercase;letter-spacing:.1em}button,summary,a{font:inherit;cursor:pointer}button{min-height:44px;padding:10px 18px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:5px;font-weight:650}button:hover,summary:hover,a:hover{filter:brightness(.88);text-decoration:underline}.primary{color:white;background:var(--accent,#284a3a);border-color:transparent}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #0086cb;outline-offset:4px}dialog{background:var(--paper,#fff);color:inherit;width:min(520px,90%);max-height:85dvh;border:1px solid;padding:28px;border-radius:8px}dialog::backdrop{background:#101923aa}dialog h2{margin-bottom:16px}dialog form{margin-top:24px}details{border-top:1px solid;padding:0}summary{padding:15px 0;font-weight:600}details p{padding-bottom:16px}svg{display:block;width:100%;height:auto}
body{--ink:#222346;--paper:#f5f5fb;--accent:#4341a2}.intro{margin:clamp(32px,7vh,80px) 0 26px}h1{max-width:900px;font-size:clamp(2.8rem,6vw,5.6rem)}fieldset{border:none;padding:0;margin:0}legend{padding:0 0 14px}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.plan{background:white;border:2px solid #d7d8e4;border-radius:14px;padding:24px;cursor:pointer}.plan:has(input:checked){border-color:#5047ad;background:#eae8fc}.plan:focus-within{outline:3px solid #1673bb;outline-offset:2px}.plan .row{font-size:1.4rem;font-weight:700}.plan input{accent-color:#49429c;width:20px;height:20px}.price{font-size:clamp(36px,5vw,62px);font-weight:700;letter-spacing:-.08em}.cost{padding:22px 0;border-bottom:1px solid #b9b8cb;margin-bottom:18px}.features{display:block}.next{justify-content:flex-end;margin:22px 0}.brand i{color:#5047ad}@media(max-width:660px){.plans{grid-template-columns:1fr;gap:8px}.plan{display:grid;grid-template-columns:1fr auto;align-items:center;padding:14px}.plan .row{flex-direction:row-reverse;justify-content:flex-end}.cost{padding:0;border:none;margin:0}.price{font-size:27px}.features{grid-column:1/-1;font-size:.93rem}.next button{width:100%}.intro{margin:22px 0 16px}}
</style></head>
<body><header><b class="brand"><i aria-hidden="true">≋</i> Relay Notes</b><span>Pricing</span></header><main><div class="intro"><h1>Interview transcription plans</h1></div><form id="plans"><fieldset><legend>Choose your monthly plan</legend><div class="plans"><label class="plan"><span class="row">Solo<input type="radio" name="plan" value="Solo" data-price="12" data-hours="10" checked></span><span class="cost" style="display:block"><b class="price">$12</b> / month</span><span class="features"><b>10 hours</b> of transcription<br>Individual transcripts</span></label><label class="plan"><span class="row">Team<input type="radio" name="plan" value="Team" data-price="28" data-hours="40" ></span><span class="cost" style="display:block"><b class="price">$28</b> / month</span><span class="features"><b>40 hours</b> of transcription<br>Shared vocabulary</span></label><label class="plan"><span class="row">Studio<input type="radio" name="plan" value="Studio" data-price="60" data-hours="120" ></span><span class="cost" style="display:block"><b class="price">$60</b> / month</span><span class="features"><b>120 hours</b> of transcription<br>Approvals</span></label></div></fieldset><div class="row next"><button class="primary">Continue with <span id="choice">Solo</span> →</button></div></form></main><dialog aria-labelledby="dialog-title"><h2 id="dialog-title">Plan summary</h2><p id="review"></p><form method="dialog"><button>Back to plans</button></form></dialog>
<script>
const plans = document.querySelector('#plans');
plans.onchange = () => { document.querySelector('#choice').textContent = plans.elements.plan.value; };
plans.onsubmit = event => {
  event.preventDefault();
  const plan = plans.querySelector(':checked');
  document.querySelector('#review').textContent = plan.value + ' · $' + plan.dataset.price + ' per month · ' + plan.dataset.hours + ' transcription hours.';
  document.querySelector('dialog').showModal();
};
</script>
</body></html>
