<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Morning shift · Linehaul</title><style>*{box-sizing:border-box}html{color-scheme:light}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--paper)}main{max-width:1100px;margin:auto;padding:0 clamp(20px,5vw,70px) 48px}header{display:flex;align-items:center;justify-content:space-between;min-height:80px;border-bottom:1px solid currentColor;gap:12px}h1,h2,p{margin:0}h1{line-height:1.04;letter-spacing:-.055em}button,summary,a{font:inherit;cursor:pointer;color:inherit}button{border:0}button,summary{min-height:44px}a{text-underline-offset:4px}:focus-visible{outline:3px solid #3378ce;outline-offset:4px}svg{display:block;width:100%;height:auto}small{font-size:.84rem}dialog{background:var(--paper);color:var(--ink);border:1px solid;padding:28px;width:min(400px,90vw)}dialog::backdrop{background:#15171880}dialog button{margin-top:22px;padding:10px 18px}

:root{--paper:#f1f4f2;--ink:#172e2d}header strong{font-size:26px;letter-spacing:-.05em}.mark{color:#247463}h1{font-size:clamp(40px,6vw,68px);margin:42px 0 24px}.alert{background:#233e3d;color:white;border-radius:8px;display:flex;align-items:center;justify-content:space-between;padding:24px;gap:12px}.alert b{display:block;font-size:24px;color:#ffcf91}.alert button{border-radius:4px;padding:10px 16px;background:#ffcf91;color:#263a35}h2{margin:32px 0 12px}table{border-collapse:collapse;width:100%;text-align:left;background:white;font-variant-numeric:tabular-nums}td,th{padding:15px;border-bottom:1px solid #d3ddd8}thead{background:#e0e9e3}tbody th{font-family:monospace;font-size:17px}.late td:last-child{color:#913f0d;font-weight:650}.focus{background:#ffecd4;box-shadow:inset 4px 0 #a4511c}@media(max-width:500px){td,th{padding:14px 9px}.alert{padding:17px}.alert b{font-size:19px}}</style></head><body><main><header><strong><span class="mark" aria-hidden="true">▰</span> Linehaul</strong><small>Dispatch</small></header><h1>Morning shift</h1><section class="alert" aria-label="Delayed load"><div><small>LS-057 · Bay 4</small><b>19 minutes delayed</b></div><button id="focus">Focus delay</button></section><h2>Loads <small>(5)</small></h2><table aria-label="Morning loads"><thead><tr><th>Load</th><th>Location</th><th>Status</th></tr></thead><tbody><tr class="late" id="delay" tabindex="-1"><th scope="row">LS-057</th><td>Bay 4</td><td>Delayed 19 min</td></tr><tr><th scope="row">LS-061</th><td>Bay 2</td><td>Due in 9 min</td></tr><tr><th scope="row">LS-063</th><td>Bay 1</td><td>Loading</td></tr><tr><th scope="row">LS-065</th><td>Bay 5</td><td>Scheduled</td></tr><tr><th scope="row">LS-069</th><td>Bay 3</td><td>Scheduled</td></tr></tbody></table></main><script>document.querySelector('#focus').onclick=()=>{const row=document.querySelector('#delay');row.classList.add('focus');row.focus()};</script></body></html>
