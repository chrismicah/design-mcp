<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Departure ticket · Spur</title><style>*{box-sizing:border-box}html{color-scheme:light}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--paper)}main{max-width:1100px;margin:auto;padding:0 clamp(20px,5vw,70px) 48px}header{display:flex;align-items:center;justify-content:space-between;min-height:80px;border-bottom:1px solid currentColor;gap:12px}h1,h2,p{margin:0}h1{line-height:1.04;letter-spacing:-.055em}button,summary,a{font:inherit;cursor:pointer;color:inherit}button{border:0}button,summary{min-height:44px}a{text-underline-offset:4px}:focus-visible{outline:3px solid #3378ce;outline-offset:4px}svg{display:block;width:100%;height:auto}small{font-size:.84rem}dialog{background:var(--paper);color:var(--ink);border:1px solid;padding:28px;width:min(400px,90vw)}dialog::backdrop{background:#15171880}dialog button{margin-top:22px;padding:10px 18px}
