<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pricing · Relay Notes</title><style>*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:0 clamp(20px,5vw,72px) 50px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 0;border-bottom:1px solid}h1,h2,h3,p{margin:0}button,input,summary,a{font:inherit;color:inherit}summary,a,button,label{cursor:pointer}button,summary{min-height:44px}summary{padding:10px 0}a{text-underline-offset:4px}:focus-visible{outline:3px solid #2876c7;outline-offset:4px}svg{width:100%;height:auto;display:block}

:root{--paper:#f7f6fb;--ink:#221936}header b{font-size:24px;letter-spacing:-.05em}h1{font-size:clamp(44px,7vw,78px);letter-spacing:-.07em;line-height:1.05;margin:44px 0 10px}fieldset{margin:26px 0 18px;padding:0;border:0;min-width:0}legend{font-weight:650;margin-bottom:10px}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{position:relative;border:2px solid #d6d1df;background:white;border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:8px}label:has(:checked){border-color:#6640a5;background:#ede5fb}input{accent-color:#603a99;position:absolute;top:18px;right:18px;width:18px;height:18px}label strong{font-size:20px}.price{font-size:42px;letter-spacing:-.06em;font-weight:650}.price small{font-size:14px;letter-spacing:0;font-weight:400;margin-left:4px}button{background:#4f2d81;color:white;border:0;border-radius:7px;padding:12px 22px;font-weight:650}#review{margin:32px 0;padding:24px;border-left:4px solid #7950aa;background:white}#review p{margin:10px 0 16px}@media(max-width:630px){.plans{grid-template-columns:1fr}label{display:grid;grid-template-columns:1fr auto;gap:2px;padding:12px 40px 12px 15px}.price{grid-column:2;grid-row:1/4;align-self:center;font-size:28px}label span:not(.price){grid-column:1;font-size:14px}input{right:7px;top:calc(50% - 12px)}h1{margin-top:30px}}</style></head><body><main><header><b>Relay Notes</b><span>Pricing</span></header><h1>Choose your plan</h1><p>Interview transcription, billed monthly.</p><form id="chooser"><fieldset><legend>Monthly plans</legend><div class="plans"><label><input type="radio" name="plan" value="Solo" checked><strong>Solo</strong><span class="price">$12<small>/month</small></span><span>10 transcription hours</span></label><label><input type="radio" name="plan" value="Team" ><strong>Team</strong><span class="price">$28<small>/month</small></span><span>40 transcription hours</span><span>Shared vocabulary</span></label><label><input type="radio" name="plan" value="Studio" ><strong>Studio</strong><span class="price">$60<small>/month</small></span><span>120 transcription hours</span><span>Approvals</span></label></div></fieldset><button>Continue with Solo</button></form><section id="review" hidden><h2 tabindex="-1">Plan selected</h2><p></p><button>Change plan</button></section></main><script>const chooser=document.querySelector('#chooser'), review=document.querySelector('#review');
const selected=()=>chooser.querySelector(':checked');
chooser.onchange=()=>{chooser.querySelector('button').textContent='Continue with '+selected().value};
chooser.onsubmit=event=>{event.preventDefault();review.querySelector('p').textContent=Array.from(selected().parentElement.children).slice(1).map(item=>item.textContent).join(' · ');chooser.hidden=true;review.hidden=false;review.querySelector('h2').focus()};
review.querySelector('button').onclick=()=>{review.hidden=true;chooser.hidden=false;selected().focus()};</script></body></html>
