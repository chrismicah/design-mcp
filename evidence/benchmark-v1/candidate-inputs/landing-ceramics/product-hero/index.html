<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oat Glaze Bowl · Kiln &amp; Field</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&amp;family=Instrument+Sans:wght@400..700&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #f3ebe0;
      --ink: #2a1610;
      --sand: #d8b68c;
      --oat: #f4deb7;
      --clay: #81543b;
      --mulberry: #6b2148;
      --secondary: #634c40;
      --rule: rgb(78 47 31 / 25%);
      --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
      --sans: "Instrument Sans", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 1rem/1.5 var(--sans);
    }

    body:has(dialog[open]) { overflow: hidden; }

    button {
      color: inherit;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px var(--paper);
    }

    svg { display: block; }

    .frame {
      inline-size: min(82.5rem, calc(100% - clamp(2.25rem, 9.4vw, 9rem)));
      margin-inline: auto;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-block-size: 5.25rem;
      border-block-end: 1px solid var(--rule);
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: .6rem;
      font: 600 clamp(1.45rem, 2.15vw, 1.95rem)/1 var(--serif);
      letter-spacing: -.048em;
    }

    .wordmark svg { color: var(--mulberry); }

    .bag-trigger {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      min-block-size: 2.75rem;
      padding: .25rem .1rem .25rem .45rem;
      border: 0;
      border-radius: .25rem;
      background: transparent;
      font-size: .95rem;
      font-weight: 600;
    }

    .bag-count {
      display: grid;
      place-items: center;
      inline-size: 1.5rem;
      block-size: 1.5rem;
      border: 1px solid var(--rule);
      border-radius: 50%;
      color: var(--mulberry);
      font-size: .76rem;
      font-variant-numeric: tabular-nums;
    }

    .bag-trigger.contains-bowl .bag-count {
      border-color: var(--mulberry);
      background: var(--mulberry);
      color: var(--paper);
    }

    .product {
      display: grid;
      grid-template-columns: minmax(0, 1.58fr) minmax(0, 1fr);
      align-items: center;
      gap: clamp(2.5rem, 6vw, 5.5rem);
      padding-block: clamp(1.5rem, 3.6vw, 3.25rem) clamp(1.5rem, 3.4vw, 3rem);
      border-block-end: 1px solid var(--rule);
    }

    .plate {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      aspect-ratio: 1.2;
      margin: 0;
      border: 1px solid rgb(88 51 28 / 22%);
      background: radial-gradient(
        ellipse at 29% 23%, #ecd4ae 0%, var(--sand) 62%, #bf986f 100%
      );
    }

    .plate::after {
      position: absolute;
      inset: clamp(.5rem, 1vw, .875rem);
      border: 1px solid rgb(88 51 28 / 23%);
      pointer-events: none;
      content: "";
    }

    .plate > svg {
      position: absolute;
      inset: 0;
      inline-size: 100%;
      block-size: 100%;
    }

    .details { min-inline-size: 0; }

    .studio {
      margin: 0 0 .7rem;
      color: var(--mulberry);
      font-size: .94rem;
      font-weight: 600;
    }

    h1 {
      margin: 0;
      font: 600 clamp(3.6rem, 6.1vw, 5.9rem)/.96 var(--serif);
      letter-spacing: -.049em;
    }

    h1 span { display: block; }

    .maker {
      margin: 1.25rem 0 0;
      color: var(--secondary);
      font-size: 1.125rem;
    }

    .purchase-facts {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: .25rem 1rem;
      min-block-size: 4.125rem;
      margin-block: 2rem 1.05rem;
      padding-block: .6rem;
      border-block: 1px solid var(--rule);
    }

    .price {
      margin: 0;
      font: 550 2rem/1 var(--serif);
      letter-spacing: -.04em;
    }

    .shipping {
      margin: 0;
      color: var(--secondary);
      font-size: .98rem;
      font-weight: 500;
    }

    .add-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      inline-size: 100%;
      min-block-size: 3.625rem;
      padding: .75rem 1.35rem .75rem 1.55rem;
      border: 1px solid var(--mulberry);
      border-radius: 100vw;
      background: var(--mulberry);
      color: var(--paper);
      text-align: left;
      font-size: 1.05rem;
      font-weight: 650;
    }

    .add-button:hover { background: #541936; }

    .add-button.contains-bowl {
      background: transparent;
      color: var(--mulberry);
    }

    .add-button.contains-bowl:hover { background: rgb(107 33 72 / 7%); }
    .add-button .bag-mark { display: none; }
    .add-button.contains-bowl .plus-mark { display: none; }
    .add-button.contains-bowl .bag-mark { display: block; }

    .confirmation {
      min-block-size: 1.5rem;
      margin: .55rem 0 0;
      padding-inline: .1rem;
      color: var(--mulberry);
      font-size: .94rem;
      font-weight: 600;
    }

    .bag-panel {
      position: fixed;
      inset: 0 0 0 auto;
      inline-size: min(100%, 26rem);
      block-size: 100%;
      max-inline-size: none;
      max-block-size: none;
      margin: 0;
      padding: 1.65rem clamp(1.15rem, 6vw, 2rem);
      border: 0;
      border-inline-start: 1px solid var(--rule);
      background: var(--paper);
      color: var(--ink);
      box-shadow: -10px 0 40px rgb(42 22 16 / 13%);
      overscroll-behavior: contain;
    }

    .bag-panel::backdrop { background: rgb(42 22 16 / 35%); }

    .bag-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-block-end: 1.05rem;
      border-block-end: 1px solid var(--rule);
    }

    .bag-heading h2 {
      margin: 0;
      font: 600 2.35rem/1.05 var(--serif);
      letter-spacing: -.045em;
    }

    .close-button {
      display: grid;
      place-items: center;
      inline-size: 2.75rem;
      block-size: 2.75rem;
      border: 1px solid var(--rule);
      border-radius: 50%;
      background: transparent;
    }

    .close-button:hover { background: rgb(107 33 72 / 7%); }

    .bag-empty {
      margin-block: 1.5rem;
      color: var(--secondary);
    }

    .bag-item {
      display: grid;
      grid-template-columns: 4.5rem minmax(0, 1fr) auto;
      align-items: center;
      gap: .85rem;
      padding-block: 1.35rem;
      border-block-end: 1px solid var(--rule);
    }

    .bag-thumbnail {
      inline-size: 100%;
      block-size: 3.6rem;
      background: var(--sand);
    }

    .bag-item p { margin: 0; }
    .item-name, .item-price { font-weight: 650; }

    .item-quantity {
      color: var(--secondary);
      font-size: .88rem;
    }

    .remove-button {
      min-block-size: 2.75rem;
      margin-block-start: .45rem;
      padding-inline: .15rem;
      border: 0;
      border-radius: .2rem;
      background: transparent;
      color: var(--mulberry);
      text-decoration: underline;
      text-underline-offset: .2em;
    }

    @media (prefers-reduced-motion: no-preference) {
      .bag-trigger.contains-bowl .bag-count,
      .add-button.contains-bowl {
        animation: settle 240ms ease-out;
      }

      @keyframes settle {
        from { transform: translateY(4px); }
        to { transform: translateY(0); }
      }
    }

    @media (max-width: 52rem) {
      .product {
        grid-template-columns: minmax(0, 1fr);
        gap: 1.6rem;
      }

      .plate { aspect-ratio: 1.3; }
      h1 { font-size: clamp(2.375rem, 11.4vw, 4.625rem); }
      h1 span { display: inline; }
    }

    @media (max-width: 36rem) {
      .masthead { min-block-size: 4.125rem; }

      .product {
        padding-block-start: 1.05rem;
        gap: 1.5rem;
      }

      .plate { max-block-size: max(12.5rem, 35svh); }
      .studio { margin-block-end: .55rem; }

      .maker {
        margin-block-start: .75rem;
        font-size: 1.0625rem;
      }

      .purchase-facts {
        min-block-size: 3.6rem;
        margin-block: 1.35rem .85rem;
      }

      .add-button { min-block-size: 3.5rem; }
    }
  </style>
</head>
<body>
  <header class="masthead frame">
    <div class="wordmark">
      <svg width="28" height="29" viewBox="0 0 28 29" aria-hidden="true"
           fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 24V13a9 9 0 0 1 18 0v11M3 24h22"/>
        <path d="M9 15h10c-.6 3.1-2.3 4.7-5 4.7S9.6 18.1 9 15Z"/>
      </svg>
      <span>Kiln &amp; Field</span>
    </div>

    <button class="bag-trigger" id="bag-trigger" type="button"
            aria-label="Bag, 0 items" aria-haspopup="dialog" aria-controls="bag-panel">
      <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"
           fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 8h14l1.2 12H3.8L5 8Z M9 9V6a3 3 0 0 1 6 0v3"/>
      </svg>
      <span>Bag</span>
      <span class="bag-count" id="bag-count" aria-hidden="true">0</span>
    </button>
  </header>

  <main class="product frame">
    <figure class="plate">
      <svg viewBox="0 0 840 640" preserveAspectRatio="xMidYMid slice" role="img"
           aria-labelledby="bowl-title bowl-description" xmlns="http://www.w3.org/2000/svg">
        <title id="bowl-title">Oat Glaze Bowl illustration</title>
        <desc id="bowl-description">A rounded bowl with a pale, speckled glaze, drawn on warm ochre paper.</desc>
        <defs>
          <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency=".63" numOctaves="3"
                          seed="14" stitchTiles="stitch"/>
            <feColorMatrix type="saturate" values="0"/>
          </filter>

          <radialGradient id="cast-shadow">
            <stop stop-color="#613b26" stop-opacity=".48"/>
            <stop offset=".58" stop-color="#6c4129" stop-opacity=".25"/>
            <stop offset="1" stop-color="#6c4129" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="contact-shadow">
            <stop stop-color="#492d21" stop-opacity=".66"/>
            <stop offset="1" stop-color="#492d21" stop-opacity="0"/>
          </radialGradient>

          <linearGradient id="foot-tone" x1="312" y1="482" x2="544" y2="511" gradientUnits="userSpaceOnUse">
            <stop stop-color="#d4a478"/>
            <stop offset=".46" stop-color="#ab774f"/>
            <stop offset="1" stop-color="#75482f"/>
          </linearGradient>
          <linearGradient id="wall-tone" x1="209" y1="303" x2="451" y2="497" gradientUnits="userSpaceOnUse">
            <stop stop-color="#fff0d0"/>
            <stop offset=".28" stop-color="#f5deba"/>
            <stop offset=".61" stop-color="#e1b88c"/>
            <stop offset=".86" stop-color="#bd8b5c"/>
            <stop offset="1" stop-color="#a36d47"/>
          </linearGradient>
          <radialGradient id="wall-light" cx="36%" cy="0%" r="82%">
            <stop stop-color="#fff4d4" stop-opacity=".66"/>
            <stop offset="1" stop-color="#f4deb7" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="rim-tone" x1="245" y1="156" x2="604" y2="377" gradientUnits="userSpaceOnUse">
            <stop stop-color="#fff3d7"/>
            <stop offset=".48" stop-color="#f4deb7"/>
            <stop offset="1" stop-color="#dfb987"/>
          </linearGradient>
          <radialGradient id="well-tone" cx="49%" cy="87%" r="82%">
            <stop stop-color="#f6e1bc"/>
            <stop offset=".49" stop-color="#ebcda5"/>
            <stop offset=".81" stop-color="#c7956c"/>
            <stop offset="1" stop-color="#9b6a47"/>
          </radialGradient>
          <radialGradient id="well-light">
            <stop stop-color="#fff5d7" stop-opacity=".43"/>
            <stop offset="1" stop-color="#fff5d7" stop-opacity="0"/>
          </radialGradient>

          <pattern id="glaze-flecks" width="97" height="89" patternUnits="userSpaceOnUse"
                   patternTransform="rotate(-8)">
            <g fill="none" stroke-linecap="round">
              <path stroke="#81543b" stroke-width="1.25" stroke-opacity=".53"
                    d="M4 17h.1 M8 65h.1 M15 40h.1 M19 82h.1 M23 10h.1 M29 55h.1
                       M34 30h.1 M41 76h.1 M43 14h.1 M49 43h.1 M53 63h.1 M58 4h.1
                       M63 21h.1 M66 80h.1 M72 48h.1 M80 13h.1 M83 72h.1 M92 56h.1"/>
              <path stroke="#6d452e" stroke-width="2.05" stroke-opacity=".38"
                    d="M12 29l.35 .16 M25 73l.45 -.13 M38 49l.23 .25 M52 23l.4 .17
                       M61 58l.28 -.1 M76 34l.38 .12 M88 86l.39 .13 M91 5l.3 .25"/>
              <path stroke="#fff2d1" stroke-width="1.8" stroke-opacity=".67"
                    d="M9 77h.1 M21 47h.1 M35 16h.1 M49 83h.1 M61 33h.1
                       M71 62h.1 M87 25h.1 M93 68h.1"/>
            </g>
          </pattern>

          <path id="bowl-wall"
                d="M92 263 C98 314 132 374 192 421 C254 468 325 491 421 493
                   C523 497 610 471 672 425 C731 380 765 321 773 252
                   L739 219 L122 230Z"/>
          <path id="bowl-rim"
                d="M92 263 C90 207 234 153 420 150 C604 146 767 198 773 251
                   C779 307 629 352 445 358 C258 365 93 321 92 263Z"/>
          <path id="bowl-well"
                d="M108 260 C106 215 246 169 420 166 C591 162 748 206 755 251
                   C760 294 615 336 441 341 C263 346 109 309 108 260Z"/>
          <clipPath id="wall-clip"><use href="#bowl-wall"/></clipPath>
          <clipPath id="well-clip"><use href="#bowl-well"/></clipPath>
        </defs>

        <rect width="840" height="640" filter="url(#paper-grain)" opacity=".42"
              style="mix-blend-mode: soft-light"/>

        <g id="bowl-drawing" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="473" cy="491" rx="342" ry="64" transform="rotate(4 473 491)"
                   fill="url(#cast-shadow)"/>
          <ellipse cx="428" cy="505" rx="167" ry="27" fill="url(#contact-shadow)"/>
          <path d="M546 508c40 2 83 5 125 5 M562 516c31 2 58 5 84 5 M538 522c29 3 48 4 68 5"
                fill="none" stroke="#70482f" stroke-width="1.15" opacity=".25"/>

          <path d="M309 458 C313 475 317 491 326 500 C356 521 486 522 525 500
                   C535 492 539 476 540 459Z"
                fill="url(#foot-tone)" stroke="#67412d" stroke-width="2.4"/>
          <path d="M320 491 C342 506 387 512 427 512 C469 512 507 507 529 494"
                fill="none" stroke="#e3b78b" stroke-width="2.1" opacity=".67"/>

          <use href="#bowl-wall" fill="url(#wall-tone)"/>
          <g clip-path="url(#wall-clip)">
            <rect x="85" y="305" width="697" height="190" fill="url(#wall-light)"/>
            <path d="M96 348 C177 420 303 457 425 453 C563 450 687 410 775 332
                     L788 387 C707 462 590 508 425 512 C269 510 158 454 88 398Z"
                  fill="#845537" opacity=".14"/>
            <rect x="88" y="230" width="692" height="270" fill="url(#glaze-flecks)"/>
            <g fill="none">
              <path d="M104 308 C158 355 280 387 421 387 C557 387 691 353 753 304"
                    stroke="#fff1d1" stroke-width="2.65" opacity=".68"/>
              <path d="M119 333 C193 384 302 408 412 410 M467 409 C576 406 668 381 730 338"
                    stroke="#916142" stroke-width="1.2" opacity=".37"/>
              <path d="M136 357 C207 406 320 431 430 432 C536 432 632 407 697 371"
                    stroke="#f6d9aa" stroke-width="2.1" opacity=".62"/>
              <path d="M173 396 C213 425 266 444 319 456 M345 462 C446 480 554 460 626 430"
                    stroke="#784d33" stroke-width="1.45" opacity=".34"/>
              <path d="M219 431 C262 453 327 469 385 472 M427 476 C486 476 552 461 584 451"
                    stroke="#efc795" stroke-width="1.8" opacity=".59"/>
            </g>
          </g>
          <use href="#bowl-wall" fill="none" stroke="#66442f" stroke-width="2.35" opacity=".8"/>

          <use href="#bowl-rim" fill="url(#rim-tone)" stroke="#734c33" stroke-width="2.3"/>
          <use href="#bowl-well" fill="url(#well-tone)"/>
          <g clip-path="url(#well-clip)">
            <ellipse cx="398" cy="287" rx="237" ry="62" fill="url(#well-light)"/>
            <path d="M96 247 C165 190 300 160 421 162 C560 158 684 186 765 239
                     L769 249 C697 210 574 181 421 183 C278 185 156 217 97 264Z"
                  fill="#74462e" opacity=".17"/>
            <rect x="100" y="163" width="662" height="185" fill="url(#glaze-flecks)" opacity=".83"/>
            <g fill="none">
              <path d="M133 240 C180 210 279 189 404 187 M443 188 C558 185 668 210 718 239"
                    stroke="#81543b" stroke-width="1.35" opacity=".36"/>
              <path d="M158 264 C201 233 312 210 419 209 C524 207 624 225 679 251"
                    stroke="#f7dfb8" stroke-width="1.8" opacity=".5"/>
              <path d="M236 290 C269 309 347 322 438 321 C518 321 594 306 630 285"
                    stroke="#a47753" stroke-width="1.5" opacity=".34"/>
              <path d="M279 296 C318 309 378 314 438 313 M472 312 C523 309 563 299 589 287"
                    stroke="#fff2d0" stroke-width="2" opacity=".64"/>
            </g>
          </g>
          <use href="#bowl-well" fill="none" stroke="#976947" stroke-width="1.85" opacity=".76"/>

          <path d="M117 231 C176 183 302 157 422 156 C544 153 668 179 726 215
                   M120 290 C172 330 297 352 435 351 C567 350 692 323 745 285"
                fill="none" stroke="#fff2d4" stroke-width="3.8" opacity=".94"/>
          <path d="M103 280 C145 323 274 357 432 359 C574 360 697 330 755 285"
                fill="none" stroke="#784e34" stroke-width="1.6" opacity=".61"/>
        </g>
      </svg>
    </figure>

    <div class="details">
      <p class="studio">Small-batch pottery</p>
      <h1>Oat Glaze <span>Bowl</span></h1>
      <p class="maker">We throw and glaze this bowl in Milwaukee.</p>

      <div class="purchase-facts">
        <p class="price">$46</p>
        <p class="shipping">Ships in 5 days</p>
      </div>

      <button class="add-button" id="add-button" type="button">
        <span id="add-label">Add to bag</span>
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"
             fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path class="plus-mark" d="M12 5v14M5 12h14"/>
          <path class="bag-mark" d="M5 8h14l1.2 12H3.8L5 8Z M9 9V6a3 3 0 0 1 6 0v3"/>
        </svg>
      </button>
      <p class="confirmation" id="confirmation" role="status" aria-atomic="true"></p>
    </div>
  </main>

  <dialog class="bag-panel" id="bag-panel" aria-labelledby="bag-title" closedby="any">
    <div class="bag-heading">
      <h2 id="bag-title">Your bag</h2>
      <form method="dialog">
        <button class="close-button" id="close-bag" type="submit" aria-label="Close bag" autofocus>
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"
               fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round">
            <path d="m6 6 12 12M18 6 6 18"/>
          </svg>
        </button>
      </form>
    </div>

    <p class="bag-empty" id="bag-empty">Your bag is empty.</p>
    <div id="bag-content" hidden>
      <div class="bag-item">
        <svg class="bag-thumbnail" viewBox="60 115 748 447" aria-hidden="true">
          <use href="#bowl-drawing"/>
        </svg>
        <div>
          <p class="item-name">Oat Glaze Bowl</p>
          <p class="item-quantity">Quantity 1</p>
        </div>
        <p class="item-price">$46</p>
      </div>
      <button class="remove-button" id="remove-button" type="button"
              aria-label="Remove Oat Glaze Bowl">Remove</button>
    </div>
  </dialog>

  <script>
    const bagTrigger = document.getElementById("bag-trigger");
    const bagCount = document.getElementById("bag-count");
    const bagPanel = document.getElementById("bag-panel");
    const bagEmpty = document.getElementById("bag-empty");
    const bagContent = document.getElementById("bag-content");
    const addButton = document.getElementById("add-button");
    const addLabel = document.getElementById("add-label");
    const confirmation = document.getElementById("confirmation");
    const closeBag = document.getElementById("close-bag");
    const removeButton = document.getElementById("remove-button");

    // The bag holds one bowl and resets when the page reloads.
    let hasBowl = false;

    function renderBag() {
      bagCount.textContent = hasBowl ? "1" : "0";
      bagTrigger.setAttribute("aria-label", hasBowl ? "Bag, 1 item" : "Bag, 0 items");
      bagTrigger.classList.toggle("contains-bowl", hasBowl);
      addButton.classList.toggle("contains-bowl", hasBowl);
      addLabel.textContent = hasBowl ? "View bag" : "Add to bag";
      bagEmpty.hidden = hasBowl;
      bagContent.hidden = !hasBowl;
    }

    bagTrigger.addEventListener("click", () => bagPanel.showModal());

    addButton.addEventListener("click", () => {
      if (hasBowl) {
        bagPanel.showModal();
        return;
      }

      hasBowl = true;
      renderBag();
      confirmation.textContent = "Oat Glaze Bowl added to your bag.";
    });

    removeButton.addEventListener("click", () => {
      hasBowl = false;
      renderBag();
      confirmation.textContent = "";
      closeBag.focus();
    });
  </script>
</body>
</html>
