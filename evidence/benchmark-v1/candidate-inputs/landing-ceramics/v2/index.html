<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oat Glaze Bowl | Kiln &amp; Field</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
  <style>
    :root {
      --paper: #f7efe4;
      --ink: #2a1610;
      --muted: #624b3f;
      --clay: #7a4b35;
      --rule: #d6c3b2;
      --berry: #6b2148;
      --berry-hover: #541938;
      --display: Fraunces, Georgia, serif;
      --body: "Instrument Sans", Arial, sans-serif;
      --gutter: clamp(20px, 6vw, 96px);
      --header-height: 80px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 1rem/1.5 var(--body);
    }

    button {
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 4px;
    }

    svg { display: block; }

    .page-width {
      width: min(1280px, calc(100% - var(--gutter) * 2));
      margin-inline: auto;
    }

    .site-header { border-bottom: 1px solid var(--rule); }

    .header-content {
      min-height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font: 600 1.65rem/1 var(--display);
      letter-spacing: -.045em;
      white-space: nowrap;
    }

    .brand svg, .shipping svg {
      color: var(--clay);
      flex: none;
    }

    .bag-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 0 0 8px;
      min-height: 44px;
      border: 0;
      background: transparent;
      font-size: .9375rem;
      font-weight: 600;
    }

    .bag-trigger:hover { color: var(--berry); }

    .bag-count {
      display: grid;
      place-items: center;
      min-width: 25px;
      height: 25px;
      margin-left: 2px;
      border-radius: 50%;
      background: #eaded1;
      font-size: .75rem;
      font-variant-numeric: tabular-nums;
    }

    .bag-trigger.has-item .bag-count {
      background: var(--berry);
      color: var(--paper);
      animation: count-tick 240ms ease-out;
    }

    @keyframes count-tick {
      45% { transform: translateY(-4px); }
    }

    .product {
      display: grid;
      grid-template-columns: minmax(0, 1.44fr) minmax(0, 1fr);
      align-items: center;
      gap: clamp(30px, 5.4vw, 82px);
      padding-block: clamp(36px, 4.2vw, 64px) 64px;
    }

    .artwork {
      position: relative;
      margin: 0;
      overflow: hidden;
      aspect-ratio: 720 / 640;
      background: #d8ae89;
    }

    .artwork > svg {
      width: 100%;
      height: 100%;
    }

    .artwork::after {
      position: absolute;
      inset: 12px;
      border: 1px solid #5d382534;
      pointer-events: none;
      content: "";
    }

    .details { max-width: 430px; }

    .eyebrow {
      margin: 0 0 17px;
      color: var(--clay);
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font: 600 clamp(3.35rem, 5.9vw, 5.375rem)/.98 var(--display);
      letter-spacing: -.05em;
    }

    h1 em {
      display: block;
      font-weight: 500;
    }

    .provenance {
      max-width: 32ch;
      margin: 25px 0 29px;
      color: var(--muted);
      font-size: 1.125rem;
    }

    .shipping {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      min-height: 61px;
      border-top: 1px solid var(--rule);
      font-size: .975rem;
    }

    .shipping strong { font-weight: 600; }

    .purchase-row {
      display: flex;
      align-items: center;
      gap: clamp(21px, 2.7vw, 38px);
    }

    .price {
      flex: none;
      margin: 0;
      font: 600 2.125rem/1 var(--display);
      letter-spacing: -.05em;
    }

    .purchase-button {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 57px;
      padding: 0 22px;
      border: 0;
      border-radius: 100px;
      background: var(--berry);
      color: var(--paper);
      text-align: left;
      font-weight: 600;
      transition: background-color 160ms ease-out, transform 160ms ease-out;
    }

    .purchase-button:hover { background: var(--berry-hover); }
    .purchase-button:active { transform: translateY(2px); }
    .purchase-button:focus-visible { box-shadow: 0 0 0 4px var(--paper); }

    .purchase-button .arrow,
    .purchase-button.is-filled .plus { display: none; }
    .purchase-button.is-filled .arrow { display: block; }

    .confirmation {
      min-height: 1.5em;
      margin: 10px 0 0;
      color: var(--berry);
      font-size: .875rem;
      font-weight: 600;
    }

    .purchase-button.is-filled + .confirmation::before {
      display: inline-block;
      width: 6px;
      height: 10px;
      margin-right: 9px;
      border: solid currentColor;
      border-width: 0 1.5px 1.5px 0;
      transform: rotate(45deg);
      content: "";
    }

    .bag-dialog {
      position: fixed;
      inset: calc(var(--header-height) + 12px)
        max(var(--gutter), calc((100vw - 1280px) / 2)) auto auto;
      width: min(405px, calc(100% - var(--gutter) * 2));
      max-width: none;
      max-height: calc(100dvh - var(--header-height) - 24px);
      margin: 0;
      padding: 24px;
      overflow: auto;
      border: 1px solid var(--rule);
      border-radius: 5px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 16px 50px #2a16102b;
    }

    .bag-dialog::backdrop { background: #2a161052; }

    .dialog-header, .bag-item-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .dialog-header {
      padding-bottom: 12px;
      border-bottom: 1px solid var(--rule);
    }

    .dialog-header h2 {
      margin: 0;
      font: 600 1.875rem/1.1 var(--display);
      letter-spacing: -.04em;
    }

    .close-bag {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid var(--rule);
      border-radius: 50%;
      background: transparent;
    }

    .close-bag:hover { background: #eaded1; }

    .bag-empty { margin: 19px 0 4px; }
    .bag-item { padding-top: 18px; }

    .bag-item-heading h3 {
      margin: 0;
      font: 600 1.3rem/1.2 var(--display);
    }

    .bag-item-heading span { font-weight: 600; }

    .bag-item p {
      margin: 5px 0 3px;
      color: var(--muted);
      font-size: .9375rem;
    }

    .remove-item {
      min-height: 44px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--berry);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @media (max-width: 760px) {
      :root {
        --gutter: 20px;
        --header-height: 62px;
      }

      body { padding-bottom: calc(108px + env(safe-area-inset-bottom, 0px)); }
      .brand { font-size: 1.45rem; }
      .brand svg { width: 29px; }

      .product {
        grid-template-columns: minmax(0, 1fr);
        gap: 25px;
        max-width: 560px;
        padding-block: 18px 12px;
      }

      .artwork { aspect-ratio: 1; }
      .artwork::after { inset: 9px; }
      .details { max-width: none; }

      .eyebrow {
        margin-bottom: 10px;
        font-size: .6875rem;
      }

      h1 { font-size: clamp(2.35rem, 12.25vw, 3.75rem); }
      h1 em { display: inline; }

      .provenance {
        max-width: 36ch;
        margin: 15px 0 18px;
        font-size: 1rem;
      }

      .shipping { min-height: 50px; }

      .purchase {
        position: fixed;
        z-index: 1;
        inset: auto 0 0;
        padding: 11px var(--gutter) calc(11px + env(safe-area-inset-bottom, 0px));
        border-top: 1px solid var(--rule);
        background: var(--paper);
        box-shadow: 0 -5px 24px #2a16100d;
      }

      .purchase-row { max-width: 560px; margin-inline: auto; }
      .price { font-size: 1.875rem; }
      .purchase-button { min-height: 52px; }

      .confirmation {
        position: absolute;
        inset: auto 0 100%;
        min-height: 0;
        margin: 0;
        text-align: center;
      }

      .confirmation:not(:empty) {
        padding: 7px var(--gutter);
        border-top: 1px solid var(--rule);
        background: #efe0dc;
      }

      .bag-dialog {
        inset: auto 0 0;
        width: 100%;
        max-height: 85dvh;
        padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        border-radius: 12px 12px 0 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bag-trigger.has-item .bag-count { animation: none; }
      .purchase-button { transition: none; }
      .purchase-button:active { transform: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">

  </header>

            <span id="purchase-label">Add to bag</span>
            <svg class="plus" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">

  <dialog class="bag-dialog" id="bag-dialog" aria-labelledby="bag-title">

      <h2 id="bag-title">Your bag</h2>
      <form method="dialog">
        <button class="close-bag" type="submit" aria-label="Close bag" autofocus>

            <path d="m4 4 8 8m0-8-8 8"/>
          </svg>
        </button>
      </form>
    </div>
    <p class="bag-empty" id="bag-empty">Your bag is empty.</p>
    <div class="bag-item" id="bag-item" hidden>
      <div class="bag-item-heading">
        <h3>Oat Glaze Bowl</h3>
        <span>$46</span>
      </div>
      <p>Quantity 1</p>
      <button class="remove-item" id="remove-item" type="button">Remove</button>
    </div>
  </dialog>

  <script>
    const bagTrigger = document.getElementById("bag-trigger");
    const bagCount = document.getElementById("bag-count");
    const bagDialog = document.getElementById("bag-dialog");
    const bagEmpty = document.getElementById("bag-empty");
    const bagItem = document.getElementById("bag-item");
    const purchaseButton = document.getElementById("purchase-button");
    const purchaseLabel = document.getElementById("purchase-label");
    const confirmation = document.getElementById("confirmation");
    const removeItem = document.getElementById("remove-item");

    let inBag = false;

    function updateBag(message) {
      bagCount.textContent = inBag ? "1" : "0";
      bagTrigger.setAttribute("aria-label", inBag ? "Bag, 1 item" : "Bag, 0 items");
      bagTrigger.classList.toggle("has-item", inBag);
      bagEmpty.hidden = inBag;
      bagItem.hidden = !inBag;
      purchaseButton.classList.toggle("is-filled", inBag);
      purchaseButton.setAttribute("aria-haspopup", inBag ? "dialog" : "false");
      purchaseLabel.textContent = inBag ? "View bag" : "Add to bag";
      confirmation.textContent = message;
    }

    bagTrigger.addEventListener("click", () => bagDialog.showModal());

    purchaseButton.addEventListener("click", () => {
      if (inBag) {
        bagDialog.showModal();
        return;
      }

      inBag = true;
      updateBag("Added to bag");
    });

    removeItem.addEventListener("click", () => {
      inBag = false;
      updateBag("Bowl removed from your bag");
      bagDialog.querySelector(".close-bag").focus();
    });
  </script>
</body>
</html>
