<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#152b34">
  <title>Second Spin | Bike Tune-ups</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --ink: #152b34;
      --paper: #f3f2e7;
      --sheet: #faf9f0;
      --receipt: #e9ece1;
      --orange: #e88c46;
      --muted: #43574f;
      --rule: #aeb8aa;
      --serif: "Instrument Serif", "Times New Roman", serif;
      --gutter: clamp(20px, 5.5vw, 80px);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 400 16px/1.5 "IBM Plex Sans", system-ui, sans-serif;
    }

    .frame {
      width: calc(100% - 2 * var(--gutter));
      max-width: 1200px;
      margin-inline: auto;
    }

    .masthead {
      color: var(--paper);
      background: var(--ink);
    }

    .masthead .frame {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 74px;
      padding-block: 10px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font: 400 36px/1 var(--serif);
      white-space: nowrap;
    }

    .brand svg {
      flex: none;
      color: var(--orange);
    }

    .book-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 44px;
      padding: 8px 14px;
      color: var(--ink);
      background: var(--orange);
      border-radius: 2px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

    .book-link:hover { background: #f5ad75; }

    .book-link:focus-visible {
      outline: 2px solid var(--paper);
      outline-offset: 3px;
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      align-items: center;
      gap: clamp(24px, 4vw, 60px);
      padding-block: 44px 46px;
    }

    .service-type {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 17px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .service-type::before {
      content: "";
      width: 22px;
      height: 2px;
      background: var(--orange);
    }

    .hero-title {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 10px clamp(14px, 2vw, 28px);
    }

    h1 {
      margin: 0;
      font: 400 clamp(76px, 8.65vw, 125px)/.88 var(--serif);
      letter-spacing: -.025em;
    }

    h1 em { padding-inline-end: .06em; }

    .service-price {
      display: inline-block;
      padding: .07em .27em .14em;
      margin-block-end: .08em;
      border: 1px solid var(--ink);
      background: var(--orange);
      font: 400 clamp(36px, 3.7vw, 54px)/1 var(--serif);
    }

    .illustration {
      min-width: 0;
      padding-inline-start: clamp(16px, 2.5vw, 36px);
      border-inline-start: 1px solid var(--rule);
    }

    .illustration svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--receipt);
      border: 1px solid var(--rule);
    }

    .work-order {
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr);
      border: 1px solid var(--ink);
      background: var(--sheet);
      box-shadow: 4px 4px 0 #d8ddd0;
      scroll-margin-top: 22px;
    }

    .work-order:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 5px;
    }

    .chooser, .summary {
      min-width: 0;
      padding: 32px clamp(22px, 3vw, 44px) 30px;
    }

    .chooser fieldset {
      min-inline-size: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .chooser legend, .summary h2 {
      margin: 0;
      padding: 0;
      font: 400 clamp(35px, 3.4vw, 48px)/1 var(--serif);
      letter-spacing: -.02em;
    }

    .schedule {
      margin: 7px 0 22px;
      color: var(--muted);
    }

    .days {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(51px, 1fr));
      gap: 8px;
    }

    .day {
      position: relative;
      display: block;
      cursor: pointer;
    }

    .day input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: inherit;
    }

    .day span {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 67px;
      padding: 6px 2px;
      border: 1px solid #73847a;
      border-radius: 2px;
      font-size: 15px;
      font-weight: 600;
    }

    .day span::before {
      content: "";
      width: 13px;
      height: 13px;
      border: 1px solid currentColor;
      border-radius: 50%;
    }

    .day:hover span { background: #f8e4d0; }

    .day input:checked + span {
      border-color: var(--ink);
      background: var(--orange);
    }

    .day input:checked + span::before {
      background: var(--ink);
      box-shadow: inset 0 0 0 2px var(--orange);
    }

    .day input:focus-visible + span {
      box-shadow: 0 0 0 2px var(--sheet);
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .summary {
      border-inline-start: 1px dashed #7a8c84;
      background: var(--receipt);
    }

    .details {
      margin: 15px 0 0;
      border-block-start: 1px solid var(--rule);
    }

    .detail {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-block-end: 1px solid var(--rule);
    }

    .detail dt { color: var(--muted); }

    .detail dd {
      margin: 0;
      font-weight: 600;
      text-align: right;
    }

    .detail dd.pending {
      color: var(--muted);
      font-weight: 400;
    }

    .detail.amount {
      padding: 12px 0 0;
      border: 0;
    }

    .amount dd {
      font: 400 46px/.92 var(--serif);
    }

    .shop-address {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 21px 0 0;
      padding-block-end: 32px;
      color: var(--muted);
      font-style: normal;
      font-weight: 500;
    }

    .shop-address svg { flex: none; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (prefers-reduced-motion: no-preference) {
      html { scroll-behavior: smooth; }
      .book-link, .day span { transition: background-color 150ms ease-out; }
    }

    @media (forced-colors: active) {
      .day input:checked + span {
        outline: 2px solid Highlight;
        outline-offset: -2px;
      }
      .day input:checked + span::before { border-width: 4px; }
    }

    @media (max-width: 760px) {
      .masthead .frame { min-height: 66px; }
      .brand { gap: 7px; font-size: 31px; }
      .brand svg { width: 25px; height: 25px; }
      .book-link { gap: 8px; padding-inline: 10px; font-size: 13px; }

      .hero {
        display: block;
        padding-block: 29px 30px;
      }

      .service-type { margin-block-end: 16px; }
      h1 { font-size: clamp(58px, 18.5vw, 98px); }
      .service-price { font-size: 36px; }

      .illustration {
        position: absolute;
        top: 35px;
        right: 0;
        width: 86px;
        height: 86px;
        overflow: hidden;
        padding: 0;
        border: 1px solid var(--rule);
      }

      .illustration svg {
        position: absolute;
        top: -70px;
        left: -146px;
        width: 320px;
        max-width: none;
        border: 0;
      }

      .work-order { grid-template-columns: minmax(0, 1fr); }
      .chooser, .summary { padding: 22px 20px; }
      .schedule { margin-block-end: 17px; }
      .day span { min-height: 57px; }

      .summary {
        border-inline-start: 0;
        border-block-start: 1px dashed #7a8c84;
      }

      .details { margin-block-start: 12px; }
      .amount dd { font-size: 41px; }
      .shop-address { margin-block-start: 18px; }
    }

    @media (max-width: 355px) {
      .illustration { display: none; }
      .brand { font-size: 28px; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="frame">
      <div class="brand">
        <svg width="31" height="31" viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true">
          <circle cx="16" cy="16" r="13.6" stroke-width="2" stroke-dasharray="2.2 2.07"/>
          <circle cx="16" cy="16" r="10.7" stroke-width="1.5"/>
          <circle cx="16" cy="16" r="3.7" stroke-width="1.5"/>
          <path d="M16 5.3v7m0 7.4v7M5.3 16h7m7.4 0h7M8.45 8.45l4.93 4.93m5.24 5.24 4.93 4.93m0-15.1-4.93 4.93m-5.24 5.24-4.93 4.93" stroke-width="1.3"/>
        </svg>
        Second Spin
      </div>
      <a class="book-link" href="#booking">
        Book a tune-up
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3v10m-4-4 4 4 4-4"/>
        </svg>
      </a>
    </div>
  </header>

  <main class="frame">
    <div class="hero">
      <div>
        <p class="service-type">Bike repair</p>
        <div class="hero-title">
          <h1>48-hour<br><em>tune-ups</em></h1>
          <span class="service-price">$85</span>
        </div>
      </div>

      <div class="illustration" aria-hidden="true">
        <svg viewBox="0 0 440 244" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="draft-grid" width="12" height="12" patternUnits="userSpaceOnUse">
              <circle cx="6" cy="6" r=".75" fill="#152b34" opacity=".25"/>
            </pattern>
          </defs>
          <path d="M0 0h440v244H0z" fill="url(#draft-grid)"/>
          <g stroke="#50675c" stroke-width="1">
            <path d="M17 26V14h12m382 0h12v12m0 192v12h-12m-382 0H17v-12"/>
            <path d="M26 132h197M125 38v189m92-72h107m-63-43v101" opacity=".65" stroke-dasharray="4 5"/>
            <path d="M42 220h166m-166-4v8m166-8v8" opacity=".7"/>
          </g>

          <g stroke="#152b34">
            <circle cx="125" cy="132" r="86" stroke-dasharray="1 3.5"/>
            <circle cx="125" cy="132" r="81" stroke-width="4.5"/>
            <circle cx="125" cy="132" r="76" stroke-width="1.2"/>
            <path d="M125 56l-5 72m34-66-24 67m49-51-50 49m66-24-64 32m70-3-71 5m65 24-67-24m51 49-50-49m25 65-32-64m3 70 5-72m-34 66 24-67m-49 51 50-49m-66 24 64-32m-70 3 71-5m-65-24 67 24M71 78l50 49M96 62l32 64" stroke-width="1" opacity=".68"/>
          </g>

          <g stroke-linecap="round" stroke-linejoin="round">
            <path d="M125 132 224 58 261 155Z M224 58 441 43 M261 155 442 62" stroke="#152b34" stroke-width="9"/>
            <path d="M125 132 224 58 261 155Z M224 58 441 43 M261 155 442 62" stroke="#e9ece1" stroke-width="5.5"/>
            <path d="m224 58-9-26m5 15 8-2" stroke="#152b34" stroke-width="4"/>
            <path d="M185 28c4-3 11-4 20-3l34 3c4 0 4 4 0 5l-20 4c-11 2-27-1-34-4-2-1-2-4 0-5Z" fill="#152b34"/>
          </g>

          <circle cx="125" cy="132" r="10" fill="#f3f2e7" stroke="#152b34" stroke-width="1.8"/>
          <path d="M125 120l135 7a28 28 0 1 1-7 55l-131-38a12 12 0 0 1 3-24Z" stroke="#152b34" stroke-width="2.4"/>
          <path d="M125 120l135 7a28 28 0 1 1-7 55l-131-38a12 12 0 0 1 3-24Z" stroke="#e9ece1" stroke-width=".9" stroke-dasharray="2 3"/>
          <circle cx="125" cy="132" r="3.5" fill="#152b34"/>

          <g stroke="#152b34">
            <circle cx="261" cy="155" r="24" fill="#e88c46" stroke-width="2"/>
            <circle cx="261" cy="155" r="18" stroke-width="1"/>
            <path d="m266 145 6 10-5 9h-12l-5-9 6-10z" stroke-width="1.2"/>
            <circle cx="261" cy="155" r="5" fill="#f3f2e7" stroke-width="1.5"/>
            <path d="m261 155 36 27" stroke-width="7" stroke-linecap="round"/>
            <path d="m261 155 36 27" stroke="#f3f2e7" stroke-width="3.4" stroke-linecap="round"/>
            <rect x="288" y="180" width="24" height="7" rx="2" fill="#f3f2e7" stroke-width="1.7"/>
          </g>
        </svg>
      </div>
    </div>

    <section id="booking" class="work-order" aria-label="Tune-up booking" tabindex="-1">
      <div class="chooser">
        <fieldset id="day-picker" aria-describedby="schedule">
          <legend>Choose a day</legend>
          <p class="schedule" id="schedule">Bookings Tuesday to Saturday</p>
          <div class="days">
            <label class="day">
              <input type="radio" name="day" value="Tuesday" aria-label="Tuesday">
              <span>Tue</span>
            </label>
            <label class="day">
              <input type="radio" name="day" value="Wednesday" aria-label="Wednesday">
              <span>Wed</span>
            </label>
            <label class="day">
              <input type="radio" name="day" value="Thursday" aria-label="Thursday">
              <span>Thu</span>
            </label>
            <label class="day">
              <input type="radio" name="day" value="Friday" aria-label="Friday">
              <span>Fri</span>
            </label>
            <label class="day">
              <input type="radio" name="day" value="Saturday" aria-label="Saturday">
              <span>Sat</span>
            </label>
          </div>
        </fieldset>
      </div>

      <section class="summary" aria-labelledby="summary-title">
        <h2 id="summary-title">Booking summary</h2>
        <dl class="details">
          <div class="detail">
            <dt>Day</dt>
            <dd class="pending" id="selected-day">Select a day</dd>
          </div>
          <div class="detail">
            <dt>Service</dt>
            <dd>Bike tune-up</dd>
          </div>
          <div class="detail">
            <dt>Turnaround</dt>
            <dd>48 hours</dd>
          </div>
          <div class="detail amount">
            <dt>Price</dt>
            <dd>$85</dd>
          </div>
        </dl>
        <p class="visually-hidden" id="booking-status" role="status" aria-atomic="true"></p>
      </section>
    </section>

    <address class="shop-address">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
        <path d="M15.5 8c0 4.1-5.5 8.8-5.5 8.8S4.5 12.1 4.5 8a5.5 5.5 0 1 1 11 0Z"/>
        <circle cx="10" cy="8" r="1.8"/>
      </svg>
      41 Elm Street
    </address>
  </main>

  <script>
    const dayPicker = document.getElementById("day-picker");
    const selectedDay = document.getElementById("selected-day");
    const bookingStatus = document.getElementById("booking-status");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    function updateSummary(announce = false) {
      const choice = dayPicker.querySelector("input:checked");
      selectedDay.textContent = choice ? choice.value : "Select a day";
      selectedDay.classList.toggle("pending", !choice);

      if (announce && choice) {
        bookingStatus.textContent = `Booking summary updated for ${choice.value}.`;

        if (!reducedMotion.matches) {
          selectedDay.parentElement.animate(
            [{ backgroundColor: "#f5cbab" }, { backgroundColor: "transparent" }],
            { duration: 260, easing: "ease-out" }
          );
        }
      }
    }

    dayPicker.addEventListener("change", () => updateSummary(true));
    window.addEventListener("pageshow", () => updateSummary());
    updateSummary();
  </script>
</body>
</html>
