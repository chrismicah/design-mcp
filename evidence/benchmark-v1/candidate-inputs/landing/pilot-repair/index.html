<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3ebe0">
  <title>Alto Carmo | Cinder Supply</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #f3ebe0;
      --ink: #2a1610;
      --black-plum: #351827;
      --plum: #6b2148;
      --copper: #ba5e35;
      --label-stock: #f8e4c5;
      --muted: #684e45;
      --rule: rgba(42, 22, 16, .22);
      --display: "Fraunces", Georgia, serif;
      --body: "Instrument Sans", sans-serif;
      --gutter: clamp(20px, 4.45vw, 64px);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 16px/1.5 var(--body);
    }

    body:has(dialog[open]) { overflow: hidden; }

    button {
      color: inherit;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }

    button svg { flex-shrink: 0; }

    [hidden] { display: none !important; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .page-width {
      width: calc(100% - var(--gutter) - var(--gutter));
      max-width: 1320px;
      margin-inline: auto;
    }

    .masthead {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--rule);
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font: 600 27px/1 var(--display);
      letter-spacing: -.055em;
      white-space: nowrap;
    }

    .wordmark svg { color: var(--plum); }

    .bag-toggle {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 5px 8px 5px 13px;
      border: 1px solid var(--rule);
      border-radius: 100px;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
    }

    .bag-toggle:hover { border-color: var(--plum); }

    .bag-count {
      display: grid;
      min-width: 24px;
      height: 24px;
      padding-inline: 5px;
      place-items: center;
      border-radius: 100px;
      background: var(--plum);
      color: var(--paper);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .product {
      display: grid;
      grid-template-columns: minmax(0, 1.52fr) minmax(0, 1fr);
      align-items: center;
      gap: clamp(32px, 5.6vw, 84px);
      padding-block: 28px 48px;
    }

    .stage {
      margin: 0;
      position: relative;
      aspect-ratio: 760 / 650;
      overflow: hidden;
      background: var(--black-plum);
    }

    .product-art {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .package-serif { font-family: var(--display); font-weight: 600; }
    .package-sans { font-family: var(--body); font-weight: 600; }

    .buy-block {
      width: 100%;
      max-width: 480px;
      padding-block: 20px;
    }

    .classification {
      margin: 0 0 13px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
    }

    h1, h2, h3, p, dl, dd { margin: 0; }

    h1 {
      font: 600 clamp(3.25rem, 6.15vw, 5.65rem)/.99 var(--display);
      letter-spacing: -.065em;
    }

    .tasting {
      margin-top: 15px;
      color: var(--plum);
      font-size: clamp(19px, 1.65vw, 24px);
      font-weight: 500;
      letter-spacing: -.035em;
    }

    .facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-block: 34px 22px;
      padding-block: 15px;
      border-block: 1px solid var(--rule);
    }

    .facts > div + div {
      padding-inline-start: 20px;
      border-inline-start: 1px solid var(--rule);
    }

    .facts dt {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .facts dd {
      margin-top: 3px;
      font-size: 18px;
      font-weight: 600;
    }

    .add-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      min-height: 62px;
      padding: 10px 20px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: var(--plum);
      color: var(--paper);
      font-size: 17px;
      font-weight: 600;
    }

    .add-button:hover { background: #551934; }

    .add-button:focus-visible {
      outline-offset: 2px;
      box-shadow: 0 0 0 2px var(--paper);
    }

    .add-label {
      display: inline-flex;
      align-items: center;
      gap: 11px;
    }

    .button-price {
      min-width: 58px;
      padding-inline-start: 16px;
      border-inline-start: 1px solid rgba(243, 235, 224, .38);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .purchase-status {
      min-height: 1.5em;
      margin-top: 9px;
      color: var(--plum);
      font-size: 14px;
      font-weight: 600;
    }

    dialog {
      position: fixed;
      inset: 0 0 0 auto;
      width: min(100%, 430px);
      max-width: none;
      height: 100%;
      max-height: none;
      margin: 0;
      padding: 0;
      border: 0;
      background: var(--paper);
      color: var(--ink);
      box-shadow: -16px 0 60px rgba(42, 22, 16, .24);
    }

    dialog::backdrop { background: rgba(35, 15, 25, .59); }

    .drawer {
      min-height: 100%;
      padding: 24px clamp(20px, 6vw, 32px) 32px;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 17px;
      border-bottom: 1px solid var(--rule);
    }

    .drawer-header h2 {
      font: 600 38px/1.1 var(--display);
      letter-spacing: -.06em;
    }

    .icon-button {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      padding: 0;
      border: 1px solid var(--rule);
      border-radius: 50%;
      background: transparent;
    }

    .empty-bag { padding-block: 25px; }

    .text-button {
      min-height: 44px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--plum);
      font-size: 14px;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .bag-item {
      display: grid;
      grid-template-columns: 70px minmax(0, 1fr);
      gap: 16px;
      padding-block: 24px;
      border-bottom: 1px solid var(--rule);
    }

    .bag-thumb {
      display: block;
      width: 70px;
      height: 96px;
      background: var(--black-plum);
    }

    .bag-item-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 2px 10px;
    }

    .bag-item h3 {
      font: 600 25px/1.1 var(--display);
      letter-spacing: -.05em;
    }

    .unit-price, .bag-size {
      color: var(--muted);
      font-size: 14px;
    }

    .bag-size { margin-top: 4px; }

    .item-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px 14px;
      margin-top: 11px;
    }

    .stepper {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--rule);
      border-radius: 4px;
      font-variant-numeric: tabular-nums;
    }

    .stepper button {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .stepper button:hover { background: rgba(107, 33, 72, .08); }

    .stepper span {
      min-width: 18px;
      text-align: center;
      font-size: 14px;
    }

    .subtotal {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-top: 19px;
      font-size: 18px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 880px) {
      .product {
        grid-template-columns: minmax(0, 1fr);
        gap: 26px;
      }

      .stage { aspect-ratio: 1.55; }

      .buy-block {
        max-width: 540px;
        justify-self: center;
        padding-block: 0;
      }

      h1 { font-size: clamp(3.25rem, 10vw, 5rem); }
    }

    @media (max-width: 600px) {
      .masthead { min-height: 68px; }

      .wordmark { font-size: 24px; }
      .wordmark svg { width: 23px; height: 23px; }

      .product {
        gap: 23px;
        padding-block: 14px 26px;
      }

      .stage {
        aspect-ratio: auto;
        height: clamp(190px, 32svh, 268px);
      }

      .classification { margin-bottom: 7px; }

      h1 { font-size: clamp(2.9rem, 15.5vw, 4.65rem); }

      .tasting { margin-top: 10px; }
      .facts { margin-block: 23px 17px; padding-block: 11px; }
      .add-button { min-height: 56px; padding-inline: 16px; }
    }
  </style>
</head>
<body>
  <header class="masthead page-width">
    <div class="wordmark">
      <svg width="27" height="27" viewBox="0 0 32 32" aria-hidden="true">
        <path fill="currentColor" d="M17.4 1.7c2.3 5.5 1.4 9.1-1.7 13.4 3.1-.8 5.2-3 6.3-5.7 3.4 3.9 5.4 7.6 4.3 11.7-1.4 5.2-5.3 8.6-11 8.6-5.8 0-10.2-4.1-10-9.6.1-5.7 5.7-9.7 12.1-18.4Z"/>
        <path fill="var(--paper)" d="M17.9 17.6c1.2 2.1 2.1 3.4 1.6 5.2-.4 1.9-2 3.2-3.9 3.2-2.1 0-3.5-1.4-3.4-3.1.1-2 2.7-3.7 5.7-5.3Z"/>
      </svg>

    <button class="bag-toggle" id="open-bag" type="button"
      aria-haspopup="dialog" aria-controls="shopping-bag" aria-label="Bag, 0 bags">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M5 8h14l1 13H4L5 8Z"/>
        <path d="M9 9V6a3 3 0 0 1 6 0v3"/>
      </svg>
      <span>Bag</span>
      <span class="bag-count" id="bag-count" aria-hidden="true">0</span>
    </button>
  </header>

  <main class="product page-width" aria-labelledby="product-title">

          </linearGradient>
          <linearGradient id="side-foil" x1="0%" y1="90%" x2="100%" y2="69%">
            <stop stop-color="#431e19"/>

          <linearGradient id="seal-foil" x1="0%" y1="40%" x2="100%" y2="53%">

              <path d="M16 65c-7-7-8-14-5-22 8 5 10 13 8 21m-4-16 3 14" fill="#edcaa5"/>

              <path d="M17 69C8 64 0 69 0 77c0 7 9 13 18 12 11 0 20-6 20-13 0-7-9-11-17-8Z" fill="#edc9a5"/>
              <path d="M16 75c4-4 11-3 13 1 1 4-4 8-9 8-5 1-8-5-4-9Z" fill="#b47a65"/>
              <path d="m19 77 5-2m-6 5 7-3m-5 5 6-3M4 72l3-2M2 76l4-2m-3 6 4-2m-2 5 5-2m-1 5 5-2m17 0 3-4"
                stroke-width=".65"/>
            </g>

            <text class="package-sans" x="15" y="222" font-size="10" fill="#2a1610">Small-batch coffee</text>
            <text class="package-sans" x="190" y="222" font-size="10" text-anchor="end" fill="#2a1610">250 g</text>
          </g>
        </g>

        <rect width="760" height="650" filter="url(#studio-grain)" opacity=".19"
          style="mix-blend-mode: soft-light"/>
      </svg>
    </figure>

    <section class="buy-block" aria-label="Alto Carmo coffee">
      <p class="classification">Small-batch coffee</p>
      <h1 id="product-title">Alto Carmo</h1>
      <p class="tasting">Notes of cacao and plum</p>

      <dl class="facts">
        <div>
          <dt>Bag size</dt>
          <dd>250 g</dd>
        </div>
        <div>
          <dt>Roasted</dt>
          <dd>November 19</dd>
        </div>
      </dl>

      <button class="add-button" id="add-to-bag" type="button"
        aria-label="Add to bag, one 250 g bag of Alto Carmo for $19">
        <span class="add-label">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M10 4v12M4 10h12"/>
          </svg>
          Add to bag
        </span>
        <span class="button-price">$19</span>
      </button>
      <p class="purchase-status" id="purchase-status" role="status" aria-atomic="true"></p>
    </section>
  </main>

  <dialog id="shopping-bag" aria-labelledby="bag-title">
    <div class="drawer">
      <header class="drawer-header">
        <h2 id="bag-title">Your bag</h2>
        <button id="close-bag" class="icon-button" type="button" aria-label="Close bag" autofocus>
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="m5 5 10 10m0-10L5 15"/>
          </svg>
        </button>
      </header>

      <div id="empty-bag" class="empty-bag">
        <p>Your bag is empty.</p>
        <button id="back-to-coffee" class="text-button" type="button">View Alto Carmo</button>
      </div>

      <div id="filled-bag" hidden>
        <div class="bag-item">
          <svg class="bag-thumb" viewBox="172 48 414 548" aria-hidden="true">
            <use href="#illustrated-pouch"/>
          </svg>
          <div>
            <div class="bag-item-heading">
              <h3>Alto Carmo</h3>
              <span class="unit-price">$19 each</span>
            </div>
            <p class="bag-size">250 g per bag</p>
            <div class="item-controls">
              <div class="stepper" role="group" aria-label="Quantity">
                <button id="subtract-one" type="button" aria-label="Remove one bag">
                  <svg width="16" height="16" viewBox="0 0 20 20" fill="none"
                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                    <path d="M5 10h10"/>
                  </svg>
                </button>
                <span id="item-quantity">1</span>
                <button id="add-one" type="button" aria-label="Add one bag">
                  <svg width="16" height="16" viewBox="0 0 20 20" fill="none"
                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                    <path d="M5 10h10m-5-5v10"/>
                  </svg>
                </button>
              </div>
              <button id="remove-coffee" class="text-button" type="button" aria-label="Remove Alto Carmo from bag">Remove</button>
            </div>
          </div>
        </div>
        <dl class="subtotal">
          <dt>Subtotal</dt>
          <dd id="subtotal">$19</dd>
        </dl>
      </div>

      <p id="bag-status" class="sr-only" role="status" aria-atomic="true"></p>
    </div>
  </dialog>

  <script>
    const unitPrice = 19;
    const storageKey = "cinder-supply-alto-carmo-quantity";
    const addButton = document.getElementById("add-to-bag");
    const openBagButton = document.getElementById("open-bag");
    const closeBagButton = document.getElementById("close-bag");
    const backToCoffee = document.getElementById("back-to-coffee");
    const bag = document.getElementById("shopping-bag");
    const bagCount = document.getElementById("bag-count");
    const itemQuantity = document.getElementById("item-quantity");
    const emptyBag = document.getElementById("empty-bag");
    const filledBag = document.getElementById("filled-bag");
    const subtotal = document.getElementById("subtotal");
    const purchaseStatus = document.getElementById("purchase-status");
    const bagStatus = document.getElementById("bag-status");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const numberFormat = new Intl.NumberFormat("en-US");
    let quantity = 0;
    let returnFocus = openBagButton;
    let countAnimation;
    let pressedBackdrop = false;

    // The bag persists across reloads within the current tab.
    try {
      const savedQuantity = Number(sessionStorage.getItem(storageKey));
      if (Number.isSafeInteger(savedQuantity) && savedQuantity > 0) {
        quantity = savedQuantity;
      }
    } catch {
      // The in-memory bag also works when storage is unavailable.
    }

    function describeQuantity() {
      return `${quantity} ${quantity === 1 ? "bag" : "bags"}`;
    }

    function renderBag() {
      bagCount.textContent = quantity;
      itemQuantity.textContent = quantity;
      openBagButton.setAttribute("aria-label", `Bag, ${describeQuantity()}`);
      subtotal.textContent = `$${numberFormat.format(quantity * unitPrice)}`;
      emptyBag.hidden = quantity > 0;
      filledBag.hidden = quantity === 0;
    }

    function updateQuantity(nextQuantity) {
      quantity = Math.max(0, nextQuantity);
      try {
        sessionStorage.setItem(storageKey, String(quantity));
      } catch {
        // The rendered bag stays usable without storage.
      }
      renderBag();
    }

    function updateFromDrawer(nextQuantity) {
      updateQuantity(nextQuantity);
      purchaseStatus.textContent = "";
      if (quantity === 0) {
        backToCoffee.focus();
        bagStatus.textContent = "Your bag is empty.";
      } else {
        bagStatus.textContent = `${describeQuantity()} in your bag. Subtotal ${subtotal.textContent}.`;
      }
    }

    addButton.addEventListener("click", () => {
      updateQuantity(quantity + 1);
      purchaseStatus.textContent = quantity === 1
        ? "Alto Carmo added to your bag."
        : `Alto Carmo added. ${describeQuantity()} in your bag.`;

      if (!reducedMotion.matches && bagCount.animate) {
        countAnimation?.cancel();
        countAnimation = bagCount.animate(
          [{ transform: "translateY(-4px)" }, { transform: "translateY(0)" }],
          { duration: 240, easing: "ease-out" }
        );
      }
    });

    openBagButton.addEventListener("click", () => {
      returnFocus = openBagButton;
      bagStatus.textContent = "";
      bag.showModal();
    });

    closeBagButton.addEventListener("click", () => bag.close());
    backToCoffee.addEventListener("click", () => {
      returnFocus = addButton;
      bag.close();
    });

    bag.addEventListener("close", () => returnFocus.focus());
    bag.addEventListener("pointerdown", (event) => {
      pressedBackdrop = event.target === bag;
    });
    bag.addEventListener("click", (event) => {
      if (pressedBackdrop && event.target === bag) bag.close();
      pressedBackdrop = false;
    });

    document.getElementById("subtract-one").addEventListener("click", () => {
      updateFromDrawer(quantity - 1);
    });
    document.getElementById("add-one").addEventListener("click", () => {
      updateFromDrawer(quantity + 1);
    });
    document.getElementById("remove-coffee").addEventListener("click", () => {
      updateFromDrawer(0);
    });

    renderBag();
  </script>
</body>
</html>
