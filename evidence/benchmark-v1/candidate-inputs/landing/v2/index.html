<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3ebe0">
  <meta name="description" content="Alto Carmo from Cinder Supply. A 250 g bag of small-batch coffee with tasting notes of cacao and plum.">
  <title>Alto Carmo | Cinder Supply</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..650&amp;family=Instrument+Sans:wght@400..700&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #f3ebe0;
      --ink: #2a1610;
      --muted: #664e43;
      --plum: #6b2148;
      --bronze: #9a673b;
      --gold: #d7aa69;
      --rule: #cdbeb0;
      --display: "Fraunces", Georgia, serif;
      --interface: "Instrument Sans", sans-serif;
      --gutter: clamp(22px, 5vw, 80px);
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--interface); }
    html:has(.bag-panel[open]) { overflow: hidden; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; font: inherit; cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    :focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
      box-shadow: 0 0 0 2px var(--paper);
    }

    .shell {
      width: min(1320px, calc(100% - var(--gutter) - var(--gutter)));
      margin-inline: auto;
    }

    .site-header { border-bottom: 1px solid var(--rule); }
    .header-inner {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      font: 600 clamp(23px, 2.1vw, 29px)/1 var(--display);
      letter-spacing: -.055em;
      white-space: nowrap;
    }

    .wordmark svg { width: 27px; height: 29px; color: var(--plum); flex: none; }
    .bag-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 10px 0 13px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
    }

    .bag-toggle:hover, .icon-button:hover, .step:hover { background: #e9ded1; }
    .bag-toggle svg { width: 17px; height: 17px; }
    .bag-count {
      display: grid;
      place-items: center;
      min-width: 22px;
      min-height: 22px;
      padding-inline: 4px;
      border-radius: 999px;
      background: #e9d9df;
      color: var(--plum);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .launch {
      display: grid;
      grid-template-columns: minmax(0, 1.57fr) minmax(0, 1fr);
      align-items: center;
      gap: clamp(36px, 6vw, 92px);
      padding-block: clamp(22px, 3.05vw, 56px) clamp(44px, 6vw, 88px);
    }

    .portrait {
      position: relative;
      margin: 0;
      aspect-ratio: 780 / 710;
      background: var(--bronze);
      isolation: isolate;
    }

    .portrait::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgb(42 22 16 / 20%);
      pointer-events: none;
    }

    .portrait > svg { display: block; width: 100%; height: 100%; }
    .pack-display { font-family: var(--display); }
    .pack-type { font-family: var(--interface); }

    .product { max-width: 470px; }
    .product-kind { margin: 0 0 15px; color: var(--muted); font-size: 16px; font-weight: 500; }
    h1 {
      margin: 0 0 32px -.035em;
      font: 600 clamp(72px, 7.5vw, 113px)/.87 var(--display);
      letter-spacing: -.066em;
    }

    h1 span { display: block; }
    .facts { margin: 0 0 26px; border-top: 1px solid var(--rule); }
    .facts > div {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: baseline;
      gap: 16px;
      padding-block: 13px;
      border-bottom: 1px solid var(--rule);
    }

    .facts dt { color: var(--muted); font-size: 15px; }
    .facts dd { margin: 0; text-align: right; font-size: 17px; font-weight: 600; }
    .purchase-button {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      width: 100%;
      min-height: 60px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 3px;
      background: var(--plum);
      color: #fff5e9;
      font-size: 17px;
      font-weight: 650;
      text-align: left;
    }

    .purchase-button:hover { background: #551939; }
    .purchase-button span { display: grid; place-items: center; padding: 10px 20px; }
    .purchase-button .price {
      min-width: 83px;
      border-left: 1px solid rgb(255 245 233 / 32%);
      font-variant-numeric: tabular-nums;
    }

    .bag-panel {
      position: fixed;
      inset: 0 0 0 auto;
      width: min(100%, 456px);
      height: 100%;
      height: 100dvh;
      max-width: none;
      max-height: none;
      margin: 0;
      padding: 0;
      overflow: auto;
      overscroll-behavior: contain;
      border: 0;
      background: var(--paper);
      color: var(--ink);
      box-shadow: -14px 0 58px rgb(27 11 13 / 19%);
    }

    .bag-panel::backdrop { background: rgb(29 15 17 / 54%); }
    .bag-panel[open] { animation: drawer-in 240ms ease-out both; }
    @keyframes drawer-in { from { transform: translateX(100%); } }
    @keyframes sheet-in { from { transform: translateY(100%); } }

    .bag-layout {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      padding: 30px;
    }

    .bag-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--rule);
    }

    .bag-header h2 {
      margin: 0;
      font: 600 43px/.99 var(--display);
      letter-spacing: -.055em;
    }

    .icon-button, .step {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .icon-button { border: 1px solid var(--rule); border-radius: 50%; }
    .icon-button svg { width: 18px; height: 18px; }

    .bag-item {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      align-items: start;
      gap: 16px;
      padding-block: 24px;
      border-bottom: 1px solid var(--rule);
    }

    .bag-thumb { display: block; width: 100%; height: 97px; background: var(--gold); }
    .bag-item-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .bag-item-heading h3 {
      margin: 0;
      font: 600 25px/1.05 var(--display);
      letter-spacing: -.04em;
    }

    .bag-item-price, .subtotal { font-weight: 650; font-variant-numeric: tabular-nums; }
    .bag-size { margin: 5px 0 9px; color: var(--muted); font-size: 14px; }
    .item-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
    .quantity {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--rule);
      border-radius: 3px;
    }

    .quantity span { min-width: 23px; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums; }
    .step { font-size: 20px; line-height: 1; }
    .remove {
      min-height: 44px;
      padding: 0 4px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .empty { margin: 24px 0; color: var(--muted); }
    .bag-footer { margin-top: auto; padding-top: 26px; }
    .subtotal { display: flex; justify-content: space-between; gap: 16px; margin: 0 0 16px; }
    .back-to-coffee {
      width: 100%;
      min-height: 52px;
      padding: 10px 16px;
      border: 1px solid var(--plum);
      border-radius: 3px;
      background: transparent;
      color: var(--plum);
      font-weight: 650;
    }

    .back-to-coffee:hover { background: #e9d9df; }
    [hidden] { display: none !important; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 760px) {
      .header-inner { min-height: 63px; }
      .wordmark svg { width: 24px; height: 26px; }
      .launch {
        grid-template-columns: minmax(0, 1fr);
        gap: 25px;
        max-width: 576px;
        padding-block: 16px calc(104px + env(safe-area-inset-bottom));
      }

      .portrait { aspect-ratio: 1 / 1.035; }
      .product { max-width: none; }
      .product-kind { margin-bottom: 9px; font-size: 14px; }
      h1 { margin-bottom: 22px; font-size: clamp(43px, 15.35vw, 80px); line-height: .97; }
      h1 span { display: inline; }
      .facts { margin-bottom: 0; }
      .facts > div { padding-block: 11px; }
      .facts dd { font-size: 16px; }

      .purchase-dock {
        position: fixed;
        z-index: 2;
        inset: auto 0 0;
        padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--rule);
        background: var(--paper);
      }

      .purchase-button { max-width: 576px; min-height: 54px; margin-inline: auto; }
      .purchase-button span { padding-inline: 16px; }
      .purchase-button .price { min-width: 74px; }
    }

    @media (max-width: 540px) {
      .bag-panel {
        inset: auto 0 0;
        width: 100%;
        height: auto;
        max-height: 89vh;
        max-height: 89dvh;
        border-radius: 11px 11px 0 0;
      }

      .bag-panel[open] { animation-name: sheet-in; }
      .bag-layout { min-height: min(395px, 89dvh); padding: 22px 22px max(22px, env(safe-area-inset-bottom)); }
      .bag-header h2 { font-size: 38px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bag-panel[open] { animation: none; }
    }
  </style>
</head>

    <section class="product" aria-labelledby="coffee-name">
      <p class="product-kind">Small-batch coffee</p>
      <h1 id="coffee-name">Alto <span>Carmo</span></h1>
      <dl class="facts">
        <div><dt>Tasting notes</dt><dd>Cacao and plum</dd></div>
        <div><dt>Roasted</dt><dd>November 19</dd></div>
        <div><dt>Bag size</dt><dd>250 g</dd></div>
      </dl>
      <div class="purchase-dock">
        <button class="purchase-button" id="add-to-bag" type="button" aria-label="Add to bag, Alto Carmo, 250 g, $19" aria-haspopup="dialog" aria-controls="bag-panel">
          <span>Add to bag</span>
          <span class="price">$19</span>
        </button>
      </div>
    </section>
  </main>

  <dialog class="bag-panel" id="bag-panel" aria-labelledby="bag-title">
    <div class="bag-layout">
      <header class="bag-header">
        <h2 id="bag-title">Your bag</h2>
        <button class="icon-button" type="button" aria-label="Close bag" data-close autofocus>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18"/>
          </svg>
        </button>
      </header>
      <p class="sr-only" id="bag-status" role="status"></p>
      <p class="empty" id="empty-bag">Your bag is empty.</p>
      <article class="bag-item" id="bag-item" aria-labelledby="bag-item-name" hidden>
        <svg class="bag-thumb" viewBox="158 58 470 575" aria-hidden="true">
          <use href="#coffee-pouch"/>
        </svg>
        <div>
          <div class="bag-item-heading">
            <h3 id="bag-item-name">Alto Carmo</h3>
            <span class="bag-item-price" id="item-price">$19</span>
          </div>
          <p class="bag-size">250 g</p>
          <div class="item-actions">
            <div class="quantity" role="group" aria-label="Quantity">
              <button class="step" id="decrease" type="button" aria-label="Remove one bag of Alto Carmo">−</button>
              <span id="quantity-value">1</span>
              <button class="step" id="increase" type="button" aria-label="Add one bag of Alto Carmo">+</button>
            </div>
            <button class="remove" id="remove-item" type="button" aria-label="Remove Alto Carmo from your bag">Remove</button>
          </div>
        </div>
      </article>
      <div class="bag-footer">
        <p class="subtotal" id="subtotal" hidden><span>Subtotal</span><span id="subtotal-price">$19</span></p>
        <button class="back-to-coffee" id="back-to-coffee" type="button" data-close>Back to Alto Carmo</button>
      </div>
    </div>
  </dialog>

  <script>
    const bag = document.getElementById("bag-panel");
    const openButton = document.getElementById("open-bag");
    const addButton = document.getElementById("add-to-bag");
    const backButton = document.getElementById("back-to-coffee");
    const bagCount = document.getElementById("bag-count");
    const bagStatus = document.getElementById("bag-status");
    const bagItem = document.getElementById("bag-item");
    const emptyBag = document.getElementById("empty-bag");
    const quantityValue = document.getElementById("quantity-value");
    const itemPrice = document.getElementById("item-price");
    const subtotal = document.getElementById("subtotal");
    const subtotalPrice = document.getElementById("subtotal-price");
    const storageKey = "cinder-supply.alto-carmo.quantity";
    const unitPrice = 19;
    const numberFormat = new Intl.NumberFormat("en", { maximumFractionDigits: 0 });

    let quantity = 0;
    let returnFocus = null;
    let pressedBackdrop = false;

    try {
      const savedQuantity = Number(localStorage.getItem(storageKey));
      if (Number.isSafeInteger(savedQuantity) && savedQuantity >= 0) {
        quantity = savedQuantity;
      }
    } catch {
      // The bag also works in memory when browser storage is unavailable.
    }

    function renderBag() {
      const isEmpty = quantity === 0;
      const total = "$" + numberFormat.format(unitPrice * quantity);

      bagCount.textContent = quantity;
      openButton.setAttribute("aria-label", `Bag, ${quantity} ${quantity === 1 ? "item" : "items"}`);
      quantityValue.textContent = quantity;
      itemPrice.textContent = total;
      subtotalPrice.textContent = total;
      bagItem.hidden = isEmpty;
      subtotal.hidden = isEmpty;
      emptyBag.hidden = !isEmpty;
    }

    function setQuantity(nextQuantity) {
      quantity = nextQuantity;
      try {
        localStorage.setItem(storageKey, String(quantity));
      } catch {
        // Retain the current quantity in memory.
      }
      renderBag();
    }

    function showBag(trigger, announcement = "") {
      returnFocus = trigger;
      bagStatus.textContent = "";
      bag.showModal();
      if (announcement) {
        requestAnimationFrame(() => {
          if (bag.open) bagStatus.textContent = announcement;
        });
      }
    }

    function updateFromBag(nextQuantity) {
      setQuantity(nextQuantity);
      if (quantity === 0) {
        bagStatus.textContent = "Your bag is empty.";
        backButton.focus();
      } else {
        bagStatus.textContent = `${quantity} ${quantity === 1 ? "bag" : "bags"} of Alto Carmo in your bag.`;
      }
    }

    openButton.addEventListener("click", () => showBag(openButton));
    addButton.addEventListener("click", () => {
      setQuantity(quantity + 1);
      showBag(addButton, "One bag of Alto Carmo added.");
    });

    document.getElementById("decrease").addEventListener("click", () => updateFromBag(quantity - 1));
    document.getElementById("increase").addEventListener("click", () => updateFromBag(quantity + 1));
    document.getElementById("remove-item").addEventListener("click", () => updateFromBag(0));

    bag.querySelectorAll("[data-close]").forEach(button => {
      button.addEventListener("click", () => bag.close());
    });

    function isBackdrop(event) {
      if (event.target !== bag) return false;
      const { left, right, top, bottom } = bag.getBoundingClientRect();
      return event.clientX < left || event.clientX > right || event.clientY < top || event.clientY > bottom;
    }

    bag.addEventListener("pointerdown", event => {
      pressedBackdrop = isBackdrop(event);
    });

    bag.addEventListener("click", event => {
      if (pressedBackdrop && isBackdrop(event)) bag.close();
      pressedBackdrop = false;
    });

    bag.addEventListener("close", () => {
      pressedBackdrop = false;
      returnFocus?.focus({ preventScroll: true });
    });

    renderBag();
  </script>
