<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; form-action 'none'; base-uri 'none'">
  <title>Museum group visit request</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600&amp;family=Source+Sans+3:wght@400;600&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --ink: #203136;
      --paper: #f5f8f6;
      --green: #175f55;
      --celadon: #aec3b7;
      --brass: #d8a761;
      --white: #fff;
      --muted: color-mix(in srgb, var(--ink) 76%, var(--celadon));
      --rule: color-mix(in srgb, var(--celadon) 82%, var(--paper));
      --control-border: color-mix(in srgb, var(--celadon) 58%, var(--ink));
      --selected: color-mix(in srgb, var(--celadon) 42%, var(--paper));
      --error: #9c3530;
      --display: "Barlow Semi Condensed", "Trebuchet MS", sans-serif;
      --body: "Source Sans 3", "Trebuchet MS", sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 1.0625rem/1.4 var(--body);
    }

    .page {
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
      gap: clamp(2.5rem, 6vw, 5.5rem);
      width: min(77.5rem, calc(100% - clamp(2rem, 10vw, 10rem)));
      margin-inline: auto;
      padding-block: clamp(2.5rem, 8vh, 5.25rem) 3.5rem;
    }

    h1, h2, p, dl, dd {
      margin: 0;
    }

    h1 {
      font: 600 clamp(3.6rem, 6.15vw, 5.5rem)/.92 var(--display);
      letter-spacing: -.025em;
    }

    .intro p {
      max-width: 34ch;
      margin-block-start: 1rem;
      color: var(--muted);
      font-size: 1.2rem;
      line-height: 1.3;
    }

    .gallery {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      aspect-ratio: 1.29;
      margin-block-start: 1.9rem;
      background:
        radial-gradient(ellipse at 9% 5%, var(--paper) -18%, transparent 68%),
        linear-gradient(121deg, var(--celadon) 30%, color-mix(in srgb, var(--celadon) 69%, var(--green)));
    }

    .gallery::before,
    .gallery::after,
    .alcove::before,
    .alcove::after,
    .pedestal::before {
      position: absolute;
      content: "";
    }

    .gallery::before {
      inset: 77% 0 0;
      background: linear-gradient(163deg, var(--celadon), color-mix(in srgb, var(--celadon) 57%, var(--green)));
    }

    .gallery::after {
      inset: 0;
      clip-path: polygon(0 0, 57% 0, 25% 77%, 57% 100%, 0 100%);
      background: linear-gradient(115deg, rgb(255 255 255 / .43), rgb(255 255 255 / .05));
    }

    .alcove {
      position: absolute;
      z-index: 1;
      inset: 10% 20% 12% 19%;
      overflow: hidden;
      border-radius: 50% 50% 0 0 / 47% 47% 0 0;
      background: linear-gradient(123deg, var(--ink), var(--green) 60%, color-mix(in srgb, var(--celadon) 30%, var(--green)));
      box-shadow: .7rem .9rem 1.7rem rgb(32 49 54 / .26), inset 0 0 0 1px rgb(245 248 246 / .14);
    }

    .alcove::before {
      inset: 9% 13% 0 15%;
      border-radius: 50% 50% 0 0 / 45% 45% 0 0;
      background: linear-gradient(148deg, color-mix(in srgb, var(--celadon) 35%, var(--green)), var(--green) 55%, var(--ink) 94%);
      box-shadow: inset .45rem .35rem 1rem rgb(32 49 54 / .35);
    }

    .alcove::after {
      inset: 84% 0 0;
      clip-path: polygon(15% 0, 87% 0, 100% 100%, 0 100%);
      background: linear-gradient(161deg, color-mix(in srgb, var(--ink) 58%, var(--green)), var(--green));
    }

    .pedestal {
      position: absolute;
      z-index: 1;
      inset: auto 28% 7% 36%;
      height: 15%;
      background: linear-gradient(90deg, var(--celadon) 74%, color-mix(in srgb, var(--celadon) 55%, var(--green)) 74%);
      box-shadow: .45rem .4rem .65rem rgb(32 49 54 / .30);
    }

    .pedestal::before {
      inset: -28% 0 100%;
      clip-path: polygon(12% 0, 90% 0, 100% 100%, 0 100%);
      background: color-mix(in srgb, var(--celadon) 55%, var(--paper));
    }

    .sculpture {
      position: absolute;
      z-index: 2;
      inset: auto auto 24% 41%;
      width: 26%;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 56% 43%, transparent 25%, rgb(255 255 255 / .33) 26%, transparent 31%),
        linear-gradient(136deg, color-mix(in srgb, var(--brass) 68%, var(--paper)), var(--brass) 45%, color-mix(in srgb, var(--brass) 68%, var(--ink)));
      mask-image: radial-gradient(circle at 56% 43%, transparent 24%, #000 25.5%);
      box-shadow: inset 1px 1px 0 rgb(255 255 255 / .34);
    }

    .panel {
      min-width: 0;
      margin-block-start: .6rem;
    }

    .section {
      border-block-start: 1px solid var(--rule);
      padding-block-start: 1.125rem;
    }

    .section + .section {
      margin-block-start: 1.8rem;
    }

    fieldset {
      min-inline-size: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend {
      padding: 0;
    }

    .section-title {
      margin-block-end: .65rem;
      font: 600 1.55rem/1.1 var(--display);
    }

    .section-fields {
      display: grid;
      gap: .8rem;
    }

    .field-label {
      display: block;
      margin-block-end: .25rem;
      font-weight: 600;
    }

    .size-label {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: .2rem .65rem;
    }

    .hint, .privacy {
      color: var(--muted);
      font-size: .9375rem;
    }

    .text-input, button {
      font: inherit;
    }

    .text-input {
      display: block;
      width: 100%;
      min-height: 2.875rem;
      padding: .48rem .7rem;
      border: 1px solid var(--control-border);
      border-radius: 3px;
      background: var(--white);
      color: var(--ink);
    }

    .text-input:focus {
      border-color: var(--green);
    }

    .text-input[aria-invalid="true"] {
      border-color: var(--error);
    }

    .text-input.short {
      width: 7.5rem;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .6rem;
    }

    .choice {
      display: flex;
      gap: .6rem;
      align-items: center;
      min-height: 2.875rem;
      padding: .53rem .7rem;
      border: 1px solid var(--control-border);
      border-radius: 3px;
      background: var(--white);
      cursor: pointer;
    }

    .choice input {
      flex: none;
      width: 1.1rem;
      height: 1.1rem;
      margin: 0;
      accent-color: var(--green);
    }

    .choice:has(input:checked) {
      border-color: var(--green);
      background: var(--selected);
    }

    .choice:has(input[aria-invalid="true"]) {
      border-color: var(--error);
    }

    .text-input:focus-visible,
    .button:focus-visible,
    .choice:has(input:focus-visible),
    .receipt h2:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }

    .choice input:focus-visible {
      outline: none;
    }

    .error {
      margin-block-start: .3rem;
      color: var(--error);
      font-size: .9375rem;
    }

    .form-action {
      margin-block-start: 1.5rem;
    }

    .button {
      min-height: 3rem;
      padding: .6rem 1.25rem;
      border: 1px solid var(--green);
      border-radius: 3px;
      background: var(--green);
      color: var(--white);
      font-weight: 600;
      cursor: pointer;
    }

    .button.secondary {
      background: transparent;
      color: var(--green);
    }

    @media (hover: hover) {
      .button:hover {
        background: var(--ink);
        border-color: var(--ink);
      }

      .button.secondary:hover {
        background: var(--selected);
        color: var(--ink);
      }
    }

    .privacy {
      margin-block-start: .55rem;
    }

    .receipt {
      border-block-start: 1px solid var(--rule);
      padding-block-start: 1.125rem;
    }

    .receipt:not([hidden]) {
      animation: receipt-in 220ms ease-out both;
    }

    .receipt h2 {
      width: fit-content;
      font: 600 clamp(2.1rem, 4vw, 3.25rem)/1.02 var(--display);
      letter-spacing: -.02em;
    }

    .receipt dl {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      margin-block: 1.35rem .8rem;
      padding-block: .95rem 1rem;
      border-block: 1px solid var(--rule);
    }

    .receipt dt {
      color: var(--muted);
      font-size: .9375rem;
    }

    .receipt dd {
      margin-block-start: .15rem;
      font: 600 1.8rem/1.1 var(--display);
    }

    .receipt .button {
      margin-block-start: 1.25rem;
    }

    @keyframes receipt-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 64rem) {
      .panel {
        --legend-space: clamp(9rem, 12vw, 11.25rem);
      }

      .section > fieldset {
        position: relative;
      }

      .section-title {
        position: absolute;
        inset: 0 auto auto 0;
      }

      .section-fields, .form-action {
        margin-inline-start: var(--legend-space);
      }
    }

    @media (max-width: 47.5rem) {
      .page {
        width: min(33.75rem, calc(100% - 2rem));
        grid-template-columns: minmax(0, 1fr);
        gap: 1.5rem;
        padding-block: 1.6rem 2.25rem;
      }

      .intro {
        display: grid;
        grid-template-columns: minmax(0, 1fr) clamp(5rem, 26vw, 8rem);
        gap: .9rem;
        align-items: start;
      }

      h1 {
        font-size: clamp(2.55rem, 13vw, 4.25rem);
      }

      .intro p {
        margin-block-start: .7rem;
        font-size: 1.0625rem;
      }

      .gallery {
        aspect-ratio: .9;
        margin-block-start: .15rem;
      }

      .panel {
        margin-block-start: 0;
      }

      .section {
        padding-block-start: .9rem;
      }

      .section + .section {
        margin-block-start: 1.3rem;
      }

      .section-title {
        font-size: 1.4rem;
      }

      .form-action {
        margin-block-start: 1.25rem;
      }

      .form-action .button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .receipt:not([hidden]) {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="intro">
      <div>
        <h1 id="page-title">Group visit<br>request</h1>
        <p>Plan a museum visit for 1–25&nbsp;people.</p>
      </div>
      <div class="gallery" aria-hidden="true">
        <div class="alcove">
          <div class="pedestal"></div>
          <div class="sculpture"></div>
        </div>
      </div>
    </header>

    <div class="panel">
      <form id="visit-form" aria-labelledby="page-title" novalidate>
        <div class="section">
          <fieldset>
            <legend class="section-title">Contact details</legend>
            <div class="section-fields">
              <div>
                <label class="field-label" for="contact-name">Contact name</label>
                <input class="text-input" id="contact-name" name="contact-name" autocomplete="name" aria-describedby="name-error" required>
                <p class="error" id="name-error" hidden></p>
              </div>
              <div>
                <label class="field-label" for="email">Email</label>
                <input class="text-input" type="email" id="email" name="email" autocomplete="email" autocapitalize="none" spellcheck="false" aria-describedby="email-error" required>
                <p class="error" id="email-error" hidden></p>
              </div>
            </div>
          </fieldset>
        </div>

        <div class="section">
          <fieldset>
            <legend class="section-title">Visit details</legend>
            <div class="section-fields">
              <div>
                <div class="size-label">
                  <label class="field-label" for="group-size">Group size</label>
                  <span class="hint" id="size-hint">1–25 people</span>
                </div>
                <input class="text-input short" type="number" inputmode="numeric" id="group-size" name="group-size" min="1" max="25" step="1" aria-describedby="size-hint size-error" required>
                <p class="error" id="size-error" hidden></p>
              </div>
              <fieldset>
                <legend class="field-label">Visit type</legend>
                <div class="choices">
                  <label class="choice">
                    <input type="radio" name="visit-type" value="Quiet visit" aria-describedby="type-error" required>
                    <span>Quiet visit</span>
                  </label>
                  <label class="choice">
                    <input type="radio" name="visit-type" value="Guided visit" aria-describedby="type-error" required>
                    <span>Guided visit</span>
                  </label>
                </div>
                <p class="error" id="type-error" hidden></p>
              </fieldset>
            </div>
          </fieldset>
        </div>

        <div class="form-action">
          <button class="button" type="submit">Confirm visit details</button>
          <p class="privacy">Your details stay on this page.</p>
        </div>
      </form>

      <section class="receipt" id="receipt" aria-labelledby="receipt-title" hidden>
        <h2 id="receipt-title" tabindex="-1" aria-describedby="confirmed-details">Visit details confirmed</h2>
        <dl id="confirmed-details">
          <div>
            <dt>Group size</dt>
            <dd id="confirmed-size"></dd>
          </div>
          <div>
            <dt>Visit type</dt>
            <dd id="confirmed-type"></dd>
          </div>
        </dl>
        <p class="privacy">Your details stay on this page.</p>
        <button class="button secondary" type="button" id="edit-details">Edit details</button>
      </section>
    </div>
  </main>

  <script>
    const form = document.getElementById("visit-form");
    const contactName = document.getElementById("contact-name");
    const email = document.getElementById("email");
    const groupSize = document.getElementById("group-size");
    const visitTypes = [...form.querySelectorAll('[name="visit-type"]')];
    const receipt = document.getElementById("receipt");

    const fields = [
      {
        inputs: [contactName],
        error: document.getElementById("name-error"),
        message: () => contactName.value.trim() ? "" : "Enter a contact name."
      },
      {
        inputs: [email],
        error: document.getElementById("email-error"),
        message: () => email.validity.valid ? "" : "Enter a valid email address."
      },
      {
        inputs: [groupSize],
        error: document.getElementById("size-error"),
        message: () => groupSize.validity.valid ? "" : "Enter a whole number from 1 to 25."
      },
      {
        inputs: visitTypes,
        error: document.getElementById("type-error"),
        message: () => visitTypes.some(input => input.checked) ? "" : "Choose a visit type."
      }
    ];

    function validate(field) {
      const message = field.message();
      field.error.textContent = message;
      field.error.hidden = !message;
      for (const input of field.inputs) {
        if (message) {
          input.setAttribute("aria-invalid", "true");
        } else {
          input.removeAttribute("aria-invalid");
        }
      }
      return !message;
    }

    form.addEventListener("input", event => {
      const field = fields.find(field => field.inputs.includes(event.target));
      if (field && !field.error.hidden) validate(field);
    });

    form.addEventListener("submit", event => {
      event.preventDefault();
      const invalidFields = fields.filter(field => !validate(field));
      if (invalidFields.length) {
        invalidFields[0].inputs[0].focus();
        return;
      }

      const count = groupSize.valueAsNumber;
      document.getElementById("confirmed-size").textContent = count === 1 ? "1 person" : `${count} people`;
      document.getElementById("confirmed-type").textContent = visitTypes.find(input => input.checked).value;
      form.hidden = true;
      receipt.hidden = false;
      document.getElementById("receipt-title").focus();
    });

    document.getElementById("edit-details").addEventListener("click", () => {
      receipt.hidden = true;
      form.hidden = false;
      contactName.focus();
    });
  </script>
</body>
</html>
