<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request a binding quote</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f8f6;
      --ink: #203136;
      --pine: #153f39;
      --green: #175f55;
      --brass: #eabb77;
      --rust: #9e342c;
      --ground: color-mix(in srgb, var(--pine) 8%, var(--paper));
      --rule: color-mix(in srgb, var(--ink) 23%, var(--paper));
      --edge: color-mix(in srgb, var(--ink) 58%, var(--paper));
      --muted: color-mix(in srgb, var(--ink) 75%, var(--paper));
      --tint: color-mix(in srgb, var(--green) 9%, var(--paper));
      --display: "Barlow Semi Condensed", "Arial Narrow", sans-serif;
      --body: "Source Sans 3", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: clamp(1rem, 5vw, 4.5rem);
      place-items: center;
      background: var(--ground);
      color: var(--ink);
      font: 1rem/1.45 var(--body);
    }

    .quote-sheet {
      display: grid;
      grid-template-columns: minmax(0, 36%) minmax(0, 1fr);
      width: min(100%, 70rem);
      min-height: 34rem;
      border: 1px solid var(--rule);
      background: var(--paper);
      box-shadow: 0 0.375rem 0 -0.125rem var(--rule);
    }

    .cover {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 2rem;
      padding: 3rem clamp(1.5rem, 3.1vw, 2.875rem) 2rem;
      background: var(--pine);
      color: var(--paper);
    }

    .cover::before {
      position: absolute;
      inset: 0.75rem;
      border: 1px solid color-mix(in srgb, var(--paper) 24%, transparent);
      content: "";
      pointer-events: none;
    }

    h1, h2 {
      margin: 0;
      font-family: var(--display);
      font-weight: 600;
    }

    h1 {
      font-size: clamp(2.5rem, 4.3vw, 3.875rem);
      line-height: 0.99;
      letter-spacing: -0.028em;
    }

    h1 span { display: block; }

    .cover-art {
      display: block;
      align-self: center;
      width: calc(100% + 1.5rem);
      height: auto;
    }

    .worksheet {
      --label-width: clamp(7.5rem, 12vw, 9rem);
      --column-gap: 1.375rem;
      --input-offset: calc(var(--label-width) + var(--column-gap));
      min-width: 0;
      padding: 3.25rem clamp(1.5rem, 3.65vw, 3.25rem);
    }

    .entry-row, .format-section, .actions, .summary-row {
      border-block-start: 1px solid var(--rule);
    }

    .entry-row, .format-section {
      padding-block: 1.5rem;
    }

    .entry-row, .summary-row {
      display: grid;
      grid-template-columns: var(--label-width) minmax(0, 1fr);
      gap: var(--column-gap);
    }

    .field-label, .format-fields legend, .summary-row dt {
      font-size: 1.0625rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .field-label { padding-block-start: 0.875rem; }

    .format-fields {
      position: relative;
      min-inline-size: 0;
      margin: 0;
      padding: 0 0 0 var(--input-offset);
      border: 0;
    }

    .format-fields legend {
      position: absolute;
      inset-block-start: 0.875rem;
      inset-inline-start: 0;
      padding: 0;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .option {
      position: relative;
      display: grid;
      align-content: center;
      justify-items: start;
      gap: 0.375rem;
      min-block-size: 6rem;
      padding: 0.75rem 1rem;
      border: 1px solid var(--edge);
      cursor: pointer;
      font-weight: 600;
    }

    .option svg {
      width: 2.625rem;
      height: 1.75rem;
      color: var(--green);
    }

    .option input {
      position: absolute;
      inset-block-start: 0.875rem;
      inset-inline-end: 0.875rem;
      width: 1.125rem;
      height: 1.125rem;
      margin: 0;
      accent-color: var(--green);
      cursor: pointer;
    }

    .option:hover { border-color: var(--green); }

    .option:has(:checked) {
      border-color: var(--green);
      background: var(--tint);
      box-shadow: inset 0 0 0 1px var(--green);
    }

    .option:has(:focus-visible), .text-input:focus-visible, button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }

    .option input:focus-visible { outline: none; }

    .text-input {
      display: block;
      width: 100%;
      min-height: 3.25rem;
      padding: 0.625rem 0.875rem;
      border: 1px solid var(--edge);
      border-radius: 0;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
    }

    .text-input::placeholder {
      color: var(--muted);
      opacity: 1;
    }

    .quantity-line {
      display: flex;
      align-items: center;
      gap: 0.875rem;
    }

    .quantity-line .text-input { width: 6rem; }
    .hint { color: var(--muted); }

    .error {
      margin: 0.5rem 0 0;
      color: var(--rust);
      font-weight: 600;
    }

    .text-input[aria-invalid="true"],
    .option:has([aria-invalid="true"]) {
      border-color: var(--rust);
    }

    .actions {
      padding-block-start: 1.5rem;
      padding-inline-start: var(--input-offset);
    }

    button {
      min-block-size: 3.25rem;
      padding: 0.625rem 1.5rem;
      border: 1px solid var(--green);
      border-radius: 0;
      background: var(--green);
      color: var(--paper);
      font: 700 1.0625rem/1.25 var(--body);
      cursor: pointer;
    }

    button:hover {
      border-color: var(--pine);
      background: var(--pine);
    }

    .secondary {
      background: transparent;
      color: var(--green);
    }

    .secondary:hover { background: var(--tint); }

    .summary h2 {
      margin-block-end: 1.5rem;
      font-size: clamp(2.125rem, 3vw, 2.75rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      scroll-margin-block: 1rem;
    }

    .summary dl { margin: 0; }

    .summary-row {
      align-items: baseline;
      padding-block: 1.125rem;
    }

    .summary-row dd {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    @media (prefers-reduced-motion: no-preference) {
      .summary:not([hidden]) { animation: reveal 200ms ease-out; }

      @keyframes reveal {
        from { opacity: 0; transform: translateY(0.25rem); }
        to { opacity: 1; transform: translateY(0); }
      }
    }

    @media (max-width: 49rem) {
      body {
        padding: 1rem;
        place-items: start center;
      }

      .quote-sheet {
        grid-template-columns: minmax(0, 1fr);
        max-width: 33rem;
        min-height: 0;
      }

      .cover {
        display: grid;
        grid-template-columns: minmax(0, 1fr) clamp(5.25rem, 25vw, 9rem);
        align-items: center;
        gap: 0.5rem;
        padding: 1.625rem 1.25rem;
      }

      .cover::before { inset: 0.5rem; }

      h1 { font-size: clamp(2rem, 8.6vw, 3.125rem); }

      .cover-art {
        width: calc(100% + 0.375rem);
        margin-inline-start: -0.1875rem;
      }

      .worksheet { padding: 1.25rem 1.25rem 1.5rem; }

      .entry-row, .format-section { padding-block: 0.875rem; }

      .entry-row {
        grid-template-columns: minmax(0, 1fr);
        gap: 0.5rem;
      }

      .field-label { padding: 0; }

      .format-fields { padding: 0; }

      .format-fields legend {
        position: static;
        margin-block-end: 0.5rem;
      }

      .option {
        min-block-size: 5rem;
        padding-inline: 0.75rem;
      }

      .option input { inset-inline-end: 0.75rem; }
      .text-input { min-height: 3rem; }

      .actions {
        padding-block-start: 1rem;
        padding-inline-start: 0;
      }

      .actions button { width: 100%; }

      .summary-row {
        grid-template-columns: minmax(0, 7.5rem) minmax(0, 1fr);
        gap: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <main class="quote-sheet" aria-labelledby="quote-title">
    <header class="cover">
      <h1 id="quote-title">Request a <span>binding quote</span></h1>

      <svg class="cover-art" viewBox="0 0 360 280" fill="none"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <g stroke="currentColor" opacity=".26">
          <path d="M17 56V26h31m265 222h30v-30M10 26h14m-7-7v14m319 215h14m-7-7v14"/>
          <path d="M68 50c34-12 66-16 96-12m116 191c19-9 36-14 50-17"
                stroke-dasharray="2 5"/>
        </g>

        <path d="M19 99C68 72 117 66 158 83c38-34 86-54 139-58l49 156
                 c-50 9-93 29-127 65-52-15-108-9-161 13Z"
              fill="currentColor" fill-opacity=".04" stroke="currentColor"
              stroke-opacity=".58" stroke-width="1.4"/>
        <path d="M29 90c48-22 91-27 130-12 39-36 85-54 132-54l43 144
                 c-43 6-84 25-119 55-49-16-96-7-149 14Z"
              fill="currentColor" fill-opacity=".13" stroke="currentColor"
              stroke-opacity=".88" stroke-width="1.5"/>
        <path d="M159 78c39-36 85-54 132-54l43 144c-43 6-84 25-119 55Z"
              fill="currentColor" fill-opacity=".07"/>
        <path d="M66 237c53-21 100-30 149-14 35-30 76-49 119-55l3 9
                 c-46 8-85 28-120 59-48-17-97-7-152 13Z"
              fill="currentColor" fill-opacity=".08" stroke="currentColor"
              stroke-opacity=".66" stroke-width="1.3"/>

        <g stroke="currentColor">
          <path d="M65 242c54-21 102-30 151-14 35-30 76-49 119-57
                   M65 246c55-21 103-30 152-14 35-31 76-50 119-58
                   M159 78c17 41 38 97 56 145l2 13"
                opacity=".48" stroke-width="1.2"/>
          <path d="M63 112c27-10 54-14 79-10m-76 22c28-10 54-14 80-10
                   m-76 22c27-10 54-14 69-11m-60 47c28-9 58-13 86-8
                   m-82 20c28-9 58-13 71-9M192 87c26-18 51-27 77-33
                   m-73 45c26-18 52-27 77-33m-73 45c26-18 45-25 64-29
                   m-51 63c26-18 50-28 77-33m-73 45c25-18 46-26 65-31"
                opacity=".28"/>
        </g>

        <g stroke="var(--brass)">
          <path d="M168 101q4 6 7 18m8 21q5 7 7 18m8 22q4 6 7 18"
                stroke-width="2.6"/>
          <path d="M205 198c14 18 12 40 27 48 20 10 33-7 18-12
                   -10-5-16 6-5 13 16 10 42-5 54-16"
                stroke-width="1.7"/>
        </g>
        <g fill="var(--brass)">
          <circle cx="168" cy="101" r="2"/>
          <circle cx="175" cy="119" r="2"/>
          <circle cx="183" cy="140" r="2"/>
          <circle cx="190" cy="158" r="2"/>
          <circle cx="198" cy="180" r="2"/>
          <circle cx="205" cy="198" r="2"/>
        </g>
      </svg>
    </header>

    <div class="worksheet">
      <form id="quote-form" aria-label="Quote details" novalidate>
        <div class="format-section">
          <fieldset class="format-fields">
            <legend>Format</legend>
            <div class="options">
              <label class="option">
                <input type="radio" name="format" value="Paperback"
                       aria-describedby="format-error" required>
                <svg viewBox="0 0 48 32" fill="none" stroke="currentColor"
                     stroke-width="1.4" stroke-linejoin="round" aria-hidden="true">
                  <path d="M6 18 29 7l13 5-23 11Z" fill="currentColor" fill-opacity=".09"/>
                  <path d="M6 18q-1 2 0 4l13 5 23-11v-4M19 23v4m4-4 16-7"/>
                </svg>
                <span>Paperback</span>
              </label>
              <label class="option">
                <input type="radio" name="format" value="Hardcover"
                       aria-describedby="format-error" required>
                <svg viewBox="0 0 48 32" fill="none" stroke="currentColor"
                     stroke-width="1.4" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 16 29 4l15 6-24 12Z" fill="currentColor" fill-opacity=".14"/>
                  <path d="M5 16v7l15 6 24-12M20 22v7m2-3 20-10v-4"/>
                </svg>
                <span>Hardcover</span>
              </label>
            </div>
            <p class="error" id="format-error" hidden></p>
          </fieldset>
        </div>

        <div class="entry-row">
          <label class="field-label" for="copies">Number of copies</label>
          <div>
            <div class="quantity-line">
              <input class="text-input" id="copies" name="copies" type="number"
                     min="1" max="100" step="1" inputmode="numeric"
                     aria-describedby="copies-range copies-error" required>
              <span class="hint" id="copies-range">1 to 100</span>
            </div>
            <p class="error" id="copies-error" hidden></p>
          </div>
        </div>

        <div class="entry-row">
          <label class="field-label" for="email">Contact email</label>
          <div>
            <input class="text-input" id="email" name="email" type="email"
                   autocomplete="email" autocapitalize="none" spellcheck="false"
                   placeholder="name@example.com" aria-describedby="email-error" required>
            <p class="error" id="email-error" hidden></p>
          </div>
        </div>

        <div class="actions">
          <button type="submit">Review request</button>
        </div>
      </form>

      <section class="summary" id="summary" aria-labelledby="summary-title" hidden>
        <h2 id="summary-title" tabindex="-1">Request summary</h2>
        <dl>
          <div class="summary-row">
            <dt>Format</dt>
            <dd id="summary-format"></dd>
          </div>
          <div class="summary-row">
            <dt>Number of copies</dt>
            <dd id="summary-copies"></dd>
          </div>
          <div class="summary-row">
            <dt>Contact email</dt>
            <dd id="summary-email"></dd>
          </div>
        </dl>
        <div class="actions">
          <button class="secondary" id="edit-details" type="button">Edit details</button>
        </div>
      </section>
    </div>
  </main>

  <script>
    const form = document.getElementById('quote-form');
    const formats = form.elements.namedItem('format');
    const copies = document.getElementById('copies');
    const email = document.getElementById('email');
    const summary = document.getElementById('summary');
    const summaryTitle = document.getElementById('summary-title');

    const fields = [
      {
        controls: Array.from(formats),
        error: document.getElementById('format-error'),
        isValid: () => Boolean(formats.value),
        message: 'Choose paperback or hardcover.'
      },
      {
        controls: [copies],
        error: document.getElementById('copies-error'),
        isValid: () => copies.validity.valid,
        message: 'Enter a whole number from 1 to 100.'
      },
      {
        controls: [email],
        error: document.getElementById('email-error'),
        isValid: () => email.validity.valid,
        message: 'Enter an email address such as name@example.com.'
      }
    ];

    function updateError(field) {
      const invalid = !field.isValid();
      field.error.textContent = invalid ? field.message : '';
      field.error.hidden = !invalid;

      for (const control of field.controls) {
        control.setAttribute('aria-invalid', String(invalid));
      }

      return invalid;
    }

    for (const field of fields) {
      for (const control of field.controls) {
        control.addEventListener('input', () => {
          if (!field.error.hidden) updateError(field);
        });
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const [firstInvalid] = fields.filter(updateError);
      if (firstInvalid) {
        firstInvalid.controls[0].focus();
        return;
      }

      document.getElementById('summary-format').textContent = formats.value;
      document.getElementById('summary-copies').textContent = String(copies.valueAsNumber);
      document.getElementById('summary-email').textContent = email.value;

      form.hidden = true;
      summary.hidden = false;
      summaryTitle.focus();
    });

    document.getElementById('edit-details').addEventListener('click', () => {
      summary.hidden = true;
      form.hidden = false;

      const selectedFormat = form.querySelector('input[name="format"]:checked');
      (selectedFormat || formats[0]).focus();
    });
  </script>
</body>
</html>
