<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request a bookbinding quote</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@700&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --carbon: #24261d;
      --parchment: #f3efe4;
      --paper: #fffcf3;
      --brass: #f2ca55;
      --walnut: #625b4d;
      --oxide: #a33628;
      --rule: color-mix(in srgb, var(--walnut) 28%, var(--paper));
      --field-edge: color-mix(in srgb, var(--walnut) 75%, var(--paper));
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--parchment);
      color: var(--carbon);
      font: 400 1.0625rem/1.4 "Atkinson Hyperlegible", sans-serif;
    }

    button, input { font: inherit; }

    .workbench {
      display: grid;
      place-items: center;
      min-block-size: 100vh;
      min-block-size: 100svh;
      padding: clamp(24px, 5vh, 64px) clamp(24px, 5vw, 76px);
    }

    .quote-book {
      display: grid;
      grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
      inline-size: min(100%, 1168px);
      min-block-size: 624px;
      border: 1px solid var(--rule);
      background: var(--paper);
      box-shadow: 0 24px 40px -33px rgb(36 38 29 / 45%);
    }

    .cover {
      position: relative;
      display: grid;
      place-items: center;
      background-color: var(--carbon);
      background-image:
        radial-gradient(ellipse at 47% 42%, rgb(255 252 243 / 9%), transparent 70%),
        repeating-linear-gradient(0deg, transparent 0 2px, rgb(255 252 243 / 3%) 2px 3px),
        repeating-linear-gradient(90deg, transparent 0 3px, rgb(36 38 29 / 30%) 3px 4px);
    }

    .cover::before {
      position: absolute;
      inset: 16px;
      border: 1px solid rgb(242 202 85 / 32%);
      content: "";
      pointer-events: none;
    }

    .binding-study {
      display: block;
      inline-size: calc(100% - 64px);
      max-inline-size: 496px;
      block-size: auto;
    }

    .sheet {
      min-inline-size: 0;
      padding: 50px clamp(30px, 4.6vw, 68px);
      background: linear-gradient(90deg, rgb(36 38 29 / 4%), transparent 18px);
    }

    .sheet-inner {
      max-inline-size: 480px;
      margin-inline: auto;
    }

    .binder {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 7px;
      color: var(--walnut);
      font-size: 1rem;
    }

    .binder svg { flex: none; }

    .title {
      margin: 0 0 28px;
      font: 700 clamp(3rem, 5.1vw, 4.625rem)/1 "Archivo Narrow", sans-serif;
      letter-spacing: -0.025em;
    }

    .request-form {
      display: grid;
      gap: 19px;
    }

    fieldset {
      min-inline-size: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend, .field-label {
      display: block;
      margin-block-end: 7px;
      padding: 0;
      font-weight: 700;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .option {
      position: relative;
      cursor: pointer;
    }

    .option-input {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      margin: 0;
      opacity: 0;
    }

    .option-face {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 5px 8px;
      min-block-size: 77px;
      padding: 9px 13px;
      border: 1px solid var(--field-edge);
      border-radius: 2px;
    }

    .option-name {
      grid-column: 1 / -1;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .radio-mark {
      display: grid;
      place-items: center;
      inline-size: 17px;
      block-size: 17px;
      border: 1.5px solid var(--walnut);
      border-radius: 50%;
    }

    .option:hover .option-face {
      background: color-mix(in srgb, var(--brass) 12%, var(--paper));
    }

    .option-input:checked + .option-face {
      border-color: var(--carbon);
      background: color-mix(in srgb, var(--brass) 28%, var(--paper));
    }

    .option-input:checked + .option-face .radio-mark {
      border-color: currentColor;
    }

    .option-input:checked + .option-face .radio-mark::after {
      inline-size: 7px;
      block-size: 7px;
      border: 4px solid currentColor;
      border-radius: 50%;
      content: "";
    }

    .quantity-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 13px;
    }

    .text-input {
      inline-size: 100%;
      min-block-size: 46px;
      padding: 9px 12px;
      border: 1px solid var(--field-edge);
      border-radius: 2px;
      background: var(--paper);
      color: var(--carbon);
    }

    .text-input::placeholder {
      color: var(--walnut);
      opacity: 1;
    }

    #copies { inline-size: 112px; }

    .hint {
      color: var(--walnut);
      font-size: 0.9375rem;
    }

    .error {
      margin: 6px 0 0;
      color: var(--oxide);
      font-size: 0.9375rem;
      font-weight: 700;
    }

    .text-input[aria-invalid="true"],
    .option-input[aria-invalid="true"] + .option-face {
      border-color: var(--oxide);
    }

    .action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-block-size: 50px;
      inline-size: 100%;
      padding: 10px 16px;
      border: 1px solid var(--carbon);
      border-radius: 2px;
      background: var(--brass);
      color: var(--carbon);
      font-weight: 700;
      cursor: pointer;
    }

    .action:hover {
      background: color-mix(in srgb, var(--brass) 92%, var(--carbon));
    }

    .action--edit { background: var(--paper); }

    .action--edit:hover {
      background: color-mix(in srgb, var(--brass) 16%, var(--paper));
    }

    .option-input:focus-visible + .option-face,
    .text-input:focus-visible,
    .action:focus-visible {
      outline: 2px solid var(--carbon);
      outline-offset: 3px;
    }

    .action:focus-visible { box-shadow: 0 0 0 3px var(--paper); }
    .title:focus { outline: none; }

    .summary {
      margin: 0 0 24px;
      border-block-start: 1px solid var(--rule);
    }

    .summary div {
      display: grid;
      grid-template-columns: minmax(0, 8.5rem) minmax(0, 1fr);
      gap: 12px;
      padding: 15px 0;
      border-block-end: 1px solid var(--rule);
    }

    .summary dt { color: var(--walnut); }

    .summary dd {
      margin: 0;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    #review:not([hidden]) {
      animation: reveal 220ms ease-out;
    }

    @keyframes reveal {
      from { opacity: 0.65; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 780px) {
      .workbench {
        align-items: start;
        padding: 14px;
      }

      .quote-book {
        grid-template-columns: minmax(0, 1fr);
        inline-size: min(100%, 520px);
        min-block-size: 0;
      }

      .cover { block-size: 184px; }
      .cover::before { inset: 10px; }

      .binding-study {
        inline-size: auto;
        max-inline-size: calc(100% - 32px);
        block-size: 161px;
      }

      .sheet {
        padding: 22px clamp(18px, 5.6vw, 34px) 25px;
        background: linear-gradient(180deg, rgb(36 38 29 / 4%), transparent 14px);
      }

      .title {
        margin-block-end: 21px;
        font-size: clamp(2.625rem, 9vw, 3.65rem);
      }

      .request-form { gap: 16px; }
      .option-face { min-block-size: 70px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #review:not([hidden]) { animation: none; }
    }

    @media (forced-colors: active) {
      .option-input:focus-visible + .option-face,
      .text-input:focus-visible,
      .action:focus-visible {
        outline-color: Highlight;
      }
    }
  </style>
</head>
<body>
  <main class="workbench">
    <div class="quote-book">
      <div class="cover" aria-hidden="true">
        <svg class="binding-study" viewBox="22 40 515 402" xmlns="http://www.w3.org/2000/svg" focusable="false">
          <defs>
            <path id="cover-board" d="M45 186 228 120 413 54 517 286 338 352q-8 5-14 3l-177 61Z"/>
            <path id="left-leaf" d="M59 184c57-17 98-39 130-54 18-9 31-12 41-6l102 220c-15-7-30-3-47 5-42 19-82 31-128 42Z"/>
            <path id="right-leaf" d="M230 124c47-38 108-51 173-58l99 208c-68 14-123 40-170 70Z"/>
            <pattern id="bookcloth" width="5" height="5" patternUnits="userSpaceOnUse">
              <path d="M.5 0v5M0 .5h5" stroke="var(--carbon)" stroke-opacity=".22" stroke-width=".6"/>
              <path d="M2.5 0v5M0 2.5h5" stroke="var(--paper)" stroke-opacity=".35" stroke-width=".6"/>
            </pattern>
            <linearGradient id="left-fold" x1="249" y1="248" x2="281" y2="233" gradientUnits="userSpaceOnUse">
              <stop stop-color="var(--walnut)" stop-opacity="0"/>
              <stop offset="1" stop-color="var(--walnut)" stop-opacity=".27"/>
            </linearGradient>
            <linearGradient id="right-fold" x1="281" y1="233" x2="313" y2="218" gradientUnits="userSpaceOnUse">
              <stop stop-color="var(--walnut)" stop-opacity=".22"/>
              <stop offset="1" stop-color="var(--walnut)" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="loose-thread" x1="322" y1="332" x2="351" y2="380" gradientUnits="userSpaceOnUse">
              <stop stop-color="var(--oxide)"/>
              <stop offset="1" stop-color="var(--brass)"/>
            </linearGradient>
            <filter id="book-shadow" x="-20%" y="-60%" width="140%" height="220%">
              <feGaussianBlur stdDeviation="12"/>
            </filter>
          </defs>

          <ellipse cx="284" cy="354" rx="216" ry="35" transform="rotate(-17 284 354)"
                   fill="var(--carbon)" opacity=".85" filter="url(#book-shadow)"/>

          <path d="M45 186 228 120 413 54 517 286v10l-179 65q-8 5-14 3l-177 61-102-230Z"
                fill="var(--walnut)" stroke="var(--carbon)" stroke-width="1.2"/>
          <use href="#cover-board" fill="var(--brass)" stroke="var(--carbon)" stroke-width="1.2"/>
          <use href="#cover-board" fill="url(#bookcloth)"/>
          <path d="m49 189 101 221 174-59m15-3 171-63" fill="none"
                stroke="var(--paper)" stroke-opacity=".43" stroke-width=".9"/>

          <path d="m59 184 171-60 173-58 99 208v13c-77 16-128 42-165 66q-4 4-11 0c-57 17-115 35-169 51L59 196Z"
                fill="var(--parchment)" stroke="var(--walnut)" stroke-width=".9"/>
          <path d="M158 396c52-15 93-29 130-46q22-10 41-2m-171 52c52-15 93-29 130-46q22-10 39-2
                   M338 346c50-32 104-52 163-67m-160 70c49-31 102-50 160-66"
                fill="none" stroke="var(--walnut)" stroke-opacity=".52" stroke-width=".8"/>

          <use href="#left-leaf" fill="var(--paper)"/>
          <use href="#right-leaf" fill="var(--paper)"/>
          <use href="#left-leaf" fill="url(#left-fold)"/>
          <use href="#right-leaf" fill="url(#right-fold)"/>

          <g fill="none" stroke="var(--walnut)" stroke-opacity=".29" stroke-width=".9" stroke-linecap="round">
            <path d="M88 201c42-14 85-33 121-53
                     M94 214c42-14 85-33 121-53
                     M100 227c42-14 85-33 121-53
                     M106 240c42-14 73-27 99-42
                     M118 266c42-14 85-33 121-53
                     M124 279c42-14 85-33 121-53
                     M130 292c42-14 85-33 121-53
                     M136 305c42-14 66-25 91-39"/>
            <path d="M266 143c32-20 70-34 117-44
                     M272 156c32-20 70-34 117-44
                     M278 169c32-20 70-34 117-44
                     M284 182c32-20 54-29 86-37
                     M296 208c32-20 70-34 117-44
                     M302 221c32-20 70-34 117-44
                     M308 234c32-20 70-34 117-44
                     M314 247c32-20 70-34 117-44
                     M320 260c32-20 61-31 91-38"/>
          </g>

          <path d="m230 124 102 220" stroke="var(--walnut)" stroke-opacity=".61" stroke-width="1"/>
          <path d="M243 151h.1m10 17h.1m12 31h.1m10 17h.1m11 30h.1m10 17h.1m11 31h.1m10 16h.1"
                stroke="var(--walnut)" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M243 151q8 4 10 17m12 31q8 4 10 17m11 30q8 4 10 17m11 31q8 4 10 16"
                fill="none" stroke="var(--oxide)" stroke-width="2" stroke-linecap="round"/>
          <path d="M326 331c-7 11-7 23 5 33 18 16 56 9 76 20 18 10 16 24-2 29-13 4-36-3-35-13
                   1-12 22-12 36-7 17 6 34 12 59 4"
                fill="none" stroke="url(#loose-thread)" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="sheet">
        <div class="sheet-inner">
          <p class="binder">
            <svg width="21" height="19" viewBox="0 0 24 20" fill="none" aria-hidden="true" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round">
              <path d="M12 5C8.8 2.5 4.8 2.8 2 3.7v11c3.3-.9 6.7-.7 10 1.7 3.3-2.4 6.7-2.6 10-1.7v-11C19.2 2.8 15.2 2.5 12 5Zm0 0v11.4"/>
            </svg>
            Independent bookbinding
          </p>

          <section id="details" aria-labelledby="details-title">
            <h1 class="title" id="details-title" tabindex="-1">Request a quote</h1>

            <form class="request-form" id="quote-form" novalidate>
              <fieldset>
                <legend>Book format</legend>
                <div class="options">
                  <label class="option">
                    <input class="option-input" type="radio" name="format" value="Paperback" required aria-describedby="format-error">
                    <span class="option-face">
                      <svg width="27" height="25" viewBox="0 0 28 26" fill="none" aria-hidden="true" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m5.5 18 3-13.5h14L19.4 18H5.5c-2.2.4-2.1 4.1.2 4.1h14l3.5-14M6.2 20h11.1M11.4 8.3h6.8"/>
                      </svg>
                      <span class="radio-mark" aria-hidden="true"></span>
                      <span class="option-name">Paperback</span>
                    </span>
                  </label>

                  <label class="option">
                    <input class="option-input" type="radio" name="format" value="Hardcover" required aria-describedby="format-error">
                    <span class="option-face">
                      <svg width="27" height="25" viewBox="0 0 28 26" fill="none" aria-hidden="true" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 3.7h15v15H7a2.2 2.2 0 1 0 0 4.4h15M7 3.7a2.2 2.2 0 0 0-2.2 2.2v15m4-17.2v15M7 20.9h13M12.2 8h6v4.8h-6z"/>
                      </svg>
                      <span class="radio-mark" aria-hidden="true"></span>
                      <span class="option-name">Hardcover</span>
                    </span>
                  </label>
                </div>
                <p class="error" id="format-error" hidden></p>
              </fieldset>

              <div>
                <label class="field-label" for="copies">Number of copies</label>
                <div class="quantity-row">
                  <input class="text-input" id="copies" name="copies" type="number"
                         min="1" max="100" step="1" inputmode="numeric" required
                         aria-describedby="copies-hint copies-error">
                  <span class="hint" id="copies-hint">1 to 100 copies</span>
                </div>
                <p class="error" id="copies-error" hidden></p>
              </div>

              <div>
                <label class="field-label" for="email">Contact email</label>
                <input class="text-input" id="email" name="email" type="email"
                       autocomplete="email" autocapitalize="none" spellcheck="false"
                       placeholder="name@example.com" required aria-describedby="email-error">
                <p class="error" id="email-error" hidden></p>
              </div>

              <button class="action" id="review-button" type="submit" disabled>
                Review request
                <svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3.5 10h12m-5-5 5 5-5 5"/>
                </svg>
              </button>
            </form>
          </section>

          <section id="review" aria-labelledby="review-title" hidden>
            <h1 class="title" id="review-title" tabindex="-1">Request summary</h1>
            <dl class="summary">
              <div>
                <dt>Book format</dt>
                <dd id="summary-format"></dd>
              </div>
              <div>
                <dt>Number of copies</dt>
                <dd id="summary-copies"></dd>
              </div>
              <div>
                <dt>Contact email</dt>
                <dd id="summary-email"></dd>
              </div>
            </dl>
            <button class="action action--edit" id="edit-button" type="button">Edit details</button>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById("quote-form");
    const details = document.getElementById("details");
    const review = document.getElementById("review");
    const format = form.elements.namedItem("format");
    const copies = document.getElementById("copies");
    const email = document.getElementById("email");

    const fields = [
      {
        inputs: Array.from(format),
        error: document.getElementById("format-error"),
        message: () => format.value ? "" : "Choose paperback or hardcover."
      },
      {
        inputs: [copies],
        error: document.getElementById("copies-error"),
        message() {
          if (copies.validity.badInput) return "Enter a whole number from 1 to 100.";
          if (copies.validity.valueMissing) return "Enter the number of copies.";
          return copies.validity.valid ? "" : "Enter a whole number from 1 to 100.";
        }
      },
      {
        inputs: [email],
        error: document.getElementById("email-error"),
        message() {
          if (email.validity.valueMissing) return "Enter your contact email.";
          return email.validity.valid ? "" : "Enter an email address like name@example.com.";
        }
      }
    ];

    function validateField(field) {
      const message = field.message();
      field.error.textContent = message;
      field.error.hidden = !message;

      for (const input of field.inputs) {
        if (message) {
          input.setAttribute("aria-invalid", "true");
        } else {
          input.removeAttribute("aria-invalid");
        }
      }

      return !message;
    }

    form.addEventListener("input", (event) => {
      const field = fields.find(({ inputs }) => inputs.includes(event.target));
      if (field && !field.error.hidden) validateField(field);
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const invalidFields = fields.filter((field) => !validateField(field));
      if (invalidFields.length) {
        invalidFields[0].inputs[0].focus();
        return;
      }

      document.getElementById("summary-format").textContent = format.value;
      document.getElementById("summary-copies").textContent = copies.valueAsNumber;
      document.getElementById("summary-email").textContent = email.value;

      details.hidden = true;
      review.hidden = false;
      document.getElementById("review-title").focus();
    });

    document.getElementById("edit-button").addEventListener("click", () => {
      review.hidden = true;
      details.hidden = false;
      document.getElementById("details-title").focus();
    });

    document.getElementById("review-button").disabled = false;
  </script>
</body>
</html>
