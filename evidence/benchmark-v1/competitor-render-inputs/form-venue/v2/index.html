<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4ef">
  <title>Ceramics workshop reservation</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f4ef;
      --ink: #1d2a2e;
      --slate: #4a5b61;
      --cobalt: #264e78;
      --wash: #dde7ec;
      --burgundy: #982f39;
      --rule: color-mix(in srgb, var(--ink) 29%, var(--paper));
      --control-line: color-mix(in srgb, var(--slate) 74%, var(--paper));
      --field: color-mix(in srgb, white 58%, var(--paper));
      --display: "Newsreader", Georgia, serif;
      --body: "Source Sans 3", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 400 1.0625rem/1.45 var(--body);
    }

    h1, h2, p, figure, dl, dd { margin: 0; }
    button, input { font: inherit; }

    .sheet {
      width: min(calc(100% - 5rem), 74rem);
      margin: clamp(2rem, 9vh, 6rem) auto;
      padding-block: clamp(2rem, 3.2vw, 3rem);
      border-block-start: 1px solid var(--ink);
      border-block-end: 1px solid var(--rule);
    }

    .spread {
      display: grid;
      grid-template-columns: minmax(0, 1.23fr) minmax(0, 1fr);
      gap: clamp(2rem, 4vw, 3.5rem);
    }

    .workshop-title {
      font: 500 clamp(4.25rem, 8.2vw, 7.5rem)/.87 var(--display);
      letter-spacing: -.047em;
    }

    .artwork {
      aspect-ratio: 1.78;
      margin-block-start: 1.875rem;
      overflow: hidden;
      background: var(--cobalt);
    }

    .artwork svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .reservation {
      min-width: 0;
      padding-block-start: .375rem;
      padding-inline-start: clamp(1.75rem, 3.8vw, 3.5rem);
      border-inline-start: 1px solid var(--rule);
    }

    .panel-title {
      margin-block-end: 1.25rem;
      font: 500 clamp(2.125rem, 3.2vw, 2.75rem)/1.04 var(--display);
      letter-spacing: -.035em;
      scroll-margin-block-start: 1rem;
    }

    .panel-title:focus { outline: none; }

    fieldset {
      min-inline-size: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .field-label {
      display: block;
      margin-block-end: .375rem;
      padding: 0;
      font-weight: 600;
      line-height: 1.3;
    }

    .session-options { border-block-start: 1px solid var(--rule); }

    .session-choice {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: .75rem;
      min-block-size: 3.25rem;
      padding: .375rem .75rem;
      border-block-end: 1px solid var(--rule);
      cursor: pointer;
    }

    .session-choice input {
      width: 1.125rem;
      height: 1.125rem;
      margin: 0;
      accent-color: var(--cobalt);
    }

    .session-copy {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: .375rem .75rem;
    }

    .session-day { font-size: 1.125rem; font-weight: 600; }
    .session-time { color: var(--slate); white-space: nowrap; }
    .session-choice:has(input:checked) { background: var(--wash); }

    .session-choice:has(input:focus-visible) {
      outline: 2px solid var(--cobalt);
      outline-offset: -2px;
    }

    .session-choice input:focus-visible { outline: none; }

    .contact-fields {
      display: grid;
      gap: .875rem;
      margin-block-start: 1.25rem;
    }

    .text-input {
      display: block;
      width: 100%;
      min-height: 3rem;
      padding: .625rem .75rem;
      border: 1px solid var(--control-line);
      border-radius: 0;
      color: var(--ink);
      background: var(--field);
    }

    .text-input:focus-visible {
      border-color: var(--cobalt);
      outline: 2px solid var(--cobalt);
      outline-offset: 2px;
    }

    .seat-group { margin-block-start: 1.125rem; }

    .seat-options {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      width: min(100%, 15rem);
      border: 1px solid var(--control-line);
      background: var(--field);
    }

    .seat-choice {
      position: relative;
      cursor: pointer;
    }

    .seat-choice + .seat-choice { border-inline-start: 1px solid var(--control-line); }

    .seat-choice input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: 0;
      clip-path: inset(50%);
    }

    .seat-choice span {
      display: grid;
      min-block-size: 2.75rem;
      place-items: center;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .seat-choice input:checked + span {
      color: var(--paper);
      background: var(--cobalt);
    }

    .seat-choice input:focus-visible + span {
      outline: 2px solid currentColor;
      outline-offset: -5px;
    }

    .session-options:has([aria-invalid="true"]),
    .seat-options:has([aria-invalid="true"]) {
      outline: 1px solid var(--burgundy);
      outline-offset: -1px;
    }

    .text-input[aria-invalid="true"] { border-color: var(--burgundy); }

    .field-error {
      color: var(--burgundy);
      font-size: .9375rem;
      font-weight: 600;
      line-height: 1.35;
    }

    .field-error:not(:empty) { margin-block-start: .375rem; }

    .button {
      min-height: 3.375rem;
      margin-block-start: 1.375rem;
      padding: .625rem 1.125rem;
      border: 1px solid var(--cobalt);
      border-radius: 0;
      font-weight: 700;
      cursor: pointer;
    }

    .button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px var(--paper);
    }

    .reserve-button {
      width: 100%;
      color: var(--paper);
      background: var(--cobalt);
    }

    .edit-button {
      color: var(--cobalt);
      background: transparent;
    }

    @media (hover: hover) {
      .session-choice:hover, .seat-choice:hover span, .edit-button:hover {
        background: var(--wash);
      }

      .reserve-button:hover {
        background: color-mix(in srgb, var(--cobalt) 70%, var(--ink));
      }
    }

    .confirmation:not([hidden]) { animation: confirm-in 220ms ease-out; }

    .confirmation-mark {
      display: block;
      width: 2.75rem;
      height: 2.75rem;
      margin-block-end: 1rem;
      color: var(--cobalt);
    }

    .details { border-block-start: 1px solid var(--rule); }

    .details > div {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: .75rem;
      padding-block: .75rem;
      border-block-end: 1px solid var(--rule);
    }

    .details dt { color: var(--slate); }

    .details dd {
      text-align: end;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    @keyframes confirm-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 49rem) {
      .sheet {
        width: min(calc(100% - 2.75rem), 36rem);
        margin-block: 1.25rem;
        padding-block: 1.125rem 1.375rem;
      }

      .spread { grid-template-columns: minmax(0, 1fr); gap: 1.375rem; }
      .workshop-title { font-size: clamp(3.25rem, 15vw, 6rem); }
      .artwork { aspect-ratio: 2.42; margin-block-start: 1.25rem; }

      .reservation {
        padding-block-start: 1.25rem;
        padding-inline-start: 0;
        border-block-start: 1px solid var(--rule);
        border-inline-start: 0;
      }

      .panel-title { margin-block-end: 1rem; }
      .contact-fields { gap: .8125rem; margin-block-start: 1rem; }
      .text-input { min-height: 2.75rem; padding-block: .5rem; }
      .seat-group { margin-block-start: 1rem; }
      .button { min-height: 3.125rem; margin-block-start: 1.125rem; }
    }

    @media (max-width: 32rem) {
      .session-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .session-choice { min-block-size: 3.8125rem; gap: .625rem; }
      .session-choice + .session-choice { border-inline-start: 1px solid var(--rule); }
      .session-copy { flex-direction: column; align-items: start; gap: 0; line-height: 1.2; }
      .session-time { font-size: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .confirmation:not([hidden]) { animation: none; }
    }

    @media (forced-colors: active) {
      .seat-choice input:checked + span {
        forced-color-adjust: none;
        color: HighlightText;
        background: Highlight;
      }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="spread">
      <header>
        <h1 class="workshop-title">Ceramics<br>workshop</h1>

        <figure class="artwork" aria-hidden="true">
          <svg viewBox="0 0 680 360" preserveAspectRatio="xMidYMid slice" focusable="false">
            <defs>
              <linearGradient id="canvas" x2="1" y2="1">
                <stop stop-color="#5b7c9d"/>
                <stop offset=".55" stop-color="#2b527c"/>
                <stop offset="1" stop-color="#182f4c"/>
              </linearGradient>
              <linearGradient id="window-light" x2=".85" y2="1">
                <stop stop-color="#d7e5ed" stop-opacity=".35"/>
                <stop offset="1" stop-color="#d7e5ed" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="clay-edge" x2=".82" y2="1">
                <stop stop-color="#c0cfd4"/>
                <stop offset=".55" stop-color="#637e93"/>
                <stop offset="1" stop-color="#354d64"/>
              </linearGradient>
              <radialGradient id="porcelain" cx=".32" cy=".23" r=".85">
                <stop stop-color="#fffcf0"/>
                <stop offset=".58" stop-color="#e9ebe1"/>
                <stop offset=".88" stop-color="#c3ced0"/>
                <stop offset="1" stop-color="#90a7b5"/>
              </radialGradient>
              <radialGradient id="bowl-well" cx=".60" cy=".65" r=".73">
                <stop stop-color="#f7f5e8"/>
                <stop offset=".54" stop-color="#e5ebe5"/>
                <stop offset=".85" stop-color="#aec4cf"/>
                <stop offset="1" stop-color="#8ca9bb"/>
              </radialGradient>
              <linearGradient id="paint" x2=".9" y2="1">
                <stop stop-color="#668eac"/>
                <stop offset=".45" stop-color="#365e89"/>
                <stop offset="1" stop-color="#233f64"/>
              </linearGradient>
              <filter id="shadow" x="-35%" y="-35%" width="180%" height="190%">
                <feGaussianBlur stdDeviation="13"/>
              </filter>
              <filter id="grain">
                <feTurbulence type="fractalNoise" baseFrequency=".71" numOctaves="3" stitchTiles="stitch"/>
                <feColorMatrix type="saturate" values="0"/>
              </filter>
              <pattern id="clay-speckles" width="57" height="49" patternUnits="userSpaceOnUse">
                <g fill="#304c63">
                  <circle cx="5" cy="8" r=".7"/>
                  <circle cx="14" cy="30" r=".6"/>
                  <circle cx="23" cy="13" r="1"/>
                  <circle cx="31" cy="40" r=".55"/>
                  <circle cx="42" cy="5" r=".52"/>
                  <circle cx="48" cy="24" r=".8"/>
                  <circle cx="53" cy="36" r=".5"/>
                  <path d="M7 43l2-.7M34 22l1.6 .6" fill="none" stroke="#304c63" stroke-width=".7"/>
                </g>
              </pattern>
              <path id="bowl-shape" d="M337 35C383 33 423 45 454 73C483 100 498 137 497 176C497 215 481 250 452 274C422 300 385 311 344 310C304 310 267 298 239 273C211 247 195 211 197 171C198 131 213 97 240 71C267 46 298 36 337 35Z"/>
            </defs>

            <rect width="680" height="360" fill="url(#canvas)"/>
            <path d="M0 0H286L49 360H0Z" fill="url(#window-light)" opacity=".58"/>
            <path d="M310 0h26L100 360H74Z" fill="url(#window-light)" opacity=".34"/>
            <path d="M680 201c-78 25-124 79-176 159h176Z" fill="#132943" opacity=".19"/>

            <g transform="translate(15 -2) rotate(-8 347 174)">
              <use href="#bowl-shape" transform="translate(16 19)" fill="#102239" filter="url(#shadow)" opacity=".74"/>
              <use href="#bowl-shape" transform="translate(4 8)" fill="url(#clay-edge)"/>
              <use href="#bowl-shape" fill="url(#porcelain)" stroke="#e9eddf" stroke-width="1.1"/>

              <path d="M338 52C386 49 430 67 458 102C485 136 488 179 475 217C459 258 421 284 382 294C344 303 299 295 268 278C232 258 210 221 211 180C210 143 225 109 251 85C274 64 306 53 338 52Z"
                    fill="none" stroke="url(#paint)" stroke-width="15" opacity=".88"/>
              <path d="M217 156C227 108 267 66 318 60M367 57C417 62 455 87 473 129M477 209C460 253 422 284 369 293M325 292C283 286 250 268 225 233"
                    fill="none" stroke="#24476c" stroke-width="3.1" stroke-linecap="round" opacity=".58"/>

              <path d="M344 68C388 65 425 82 450 114C475 145 476 184 459 220C442 254 404 278 359 282C313 285 269 268 245 239C223 212 217 174 230 139C245 97 291 71 344 68Z"
                    fill="url(#bowl-well)" stroke="#eef0e2" stroke-width="1.5"/>

              <g fill="none" stroke-linecap="round">
                <path d="M246 139C267 97 315 82 357 85C396 86 428 103 447 131"
                      stroke="#456d91" stroke-width="2.2" opacity=".47"/>
                <path d="M242 149C255 114 285 96 317 90M399 93C424 102 445 118 453 143"
                      stroke="#698ea9" stroke-width="1.2" opacity=".46"/>
                <path d="M444 198C435 231 398 252 359 254C321 256 285 240 269 215C252 189 262 157 288 138C313 120 353 116 384 126"
                      stroke="#658aa6" stroke-width="2.4" opacity=".44"/>
                <path d="M432 202C416 230 388 242 357 242C325 242 294 229 281 207"
                      stroke="#fdf9e9" stroke-width="2.1" opacity=".74"/>
                <path d="M381 215C356 227 318 220 307 201C296 181 312 162 333 158C354 152 373 157 384 169"
                      stroke="#7696a8" stroke-width="1.6" opacity=".38"/>
                <path d="M341 187c9-7 21-8 30-2"
                      stroke="#7896aa" stroke-width="1.4" opacity=".39"/>
                <path d="M207 159C218 99 260 60 320 44M371 42C408 46 434 58 456 79"
                      stroke="#fffbed" stroke-width="2.4" opacity=".8"/>
                <path d="M430 284C458 269 478 242 488 214"
                      stroke="#f2f1e6" stroke-width="1.8" opacity=".65"/>
              </g>

              <use href="#bowl-shape" fill="url(#clay-speckles)" opacity=".25"/>
            </g>

            <rect width="680" height="360" filter="url(#grain)" opacity=".24" style="mix-blend-mode: soft-light"/>
          </svg>
        </figure>
      </header>

      <section class="reservation" aria-label="Reservation">
        <form id="reservation-form" aria-labelledby="form-title" novalidate>
          <h2 class="panel-title" id="form-title" tabindex="-1">Your reservation</h2>

          <fieldset>
            <legend class="field-label">Workshop time</legend>
            <div class="session-options">
              <label class="session-choice">
                <input type="radio" name="session" value="Saturday at 10 am" aria-describedby="session-error" required>
                <span class="session-copy">
                  <span class="session-day">Saturday</span>
                  <span class="session-time">10 am</span>
                </span>
              </label>
              <label class="session-choice">
                <input type="radio" name="session" value="Sunday at 2 pm" aria-describedby="session-error">
                <span class="session-copy">
                  <span class="session-day">Sunday</span>
                  <span class="session-time">2 pm</span>
                </span>
              </label>
            </div>
            <p class="field-error" id="session-error" aria-live="polite"></p>
          </fieldset>

          <div class="contact-fields">
            <div>
              <label class="field-label" for="guest-name">Name</label>
              <input class="text-input" id="guest-name" name="guestName" type="text"
                     autocomplete="name" aria-describedby="name-error" required>
              <p class="field-error" id="name-error" aria-live="polite"></p>
            </div>

            <div>
              <label class="field-label" for="guest-email">Email address</label>
              <input class="text-input" id="guest-email" name="guestEmail" type="email"
                     autocomplete="email" autocapitalize="none" spellcheck="false"
                     aria-describedby="email-error" required>
              <p class="field-error" id="email-error" aria-live="polite"></p>
            </div>
          </div>

          <fieldset class="seat-group">
            <legend class="field-label">Seats</legend>
            <div class="seat-options">
              <label class="seat-choice">
                <input type="radio" name="seats" value="1" aria-label="1 seat" aria-describedby="seats-error" checked required>
                <span>1</span>
              </label>
              <label class="seat-choice">
                <input type="radio" name="seats" value="2" aria-label="2 seats" aria-describedby="seats-error">
                <span>2</span>
              </label>
              <label class="seat-choice">
                <input type="radio" name="seats" value="3" aria-label="3 seats" aria-describedby="seats-error">
                <span>3</span>
              </label>
              <label class="seat-choice">
                <input type="radio" name="seats" value="4" aria-label="4 seats" aria-describedby="seats-error">
                <span>4</span>
              </label>
            </div>
            <p class="field-error" id="seats-error" aria-live="polite"></p>
          </fieldset>

          <button class="button reserve-button" type="submit">Reserve seats</button>
        </form>

        <div class="confirmation" id="confirmation" hidden>
          <svg class="confirmation-mark" viewBox="0 0 44 44" aria-hidden="true" focusable="false">
            <circle cx="22" cy="22" r="20.5" fill="var(--wash)" stroke="currentColor"/>
            <path d="m14.5 22 5 5 10-10" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h2 class="panel-title" id="confirmation-title" tabindex="-1">Reservation confirmed</h2>
          <dl class="details">
            <div><dt>Workshop time</dt><dd id="confirmed-time"></dd></div>
            <div><dt>Seats</dt><dd id="confirmed-seats"></dd></div>
            <div><dt>Name</dt><dd id="confirmed-name"></dd></div>
            <div><dt>Email address</dt><dd id="confirmed-email"></dd></div>
          </dl>
          <button class="button edit-button" id="edit-reservation" type="button">Edit reservation</button>
        </div>
      </section>
    </div>
  </main>

  <script>
    const form = document.getElementById("reservation-form");
    const confirmation = document.getElementById("confirmation");
    const sessionChoices = form.elements.namedItem("session");
    const seatChoices = form.elements.namedItem("seats");
    const nameInput = document.getElementById("guest-name");
    const emailInput = document.getElementById("guest-email");
    let attemptedSubmit = false;

    function showError(controls, errorId, message) {
      const error = document.getElementById(errorId);

      if (error.textContent !== message) {
        error.textContent = message;
      }

      for (const control of controls) {
        if (message) {
          control.setAttribute("aria-invalid", "true");
        } else {
          control.removeAttribute("aria-invalid");
        }
      }

      return message ? controls[0] : null;
    }

    function emailError() {
      if (emailInput.validity.valueMissing) {
        return "Enter your email address.";
      }

      if (emailInput.validity.typeMismatch) {
        return "Enter an email address like name@example.com.";
      }

      return "";
    }

    function validate() {
      const problems = [
        showError(sessionChoices, "session-error",
          sessionChoices.value ? "" : "Choose a workshop time."),
        showError([nameInput], "name-error",
          nameInput.value.trim() ? "" : "Enter your name."),
        showError([emailInput], "email-error", emailError()),
        showError(seatChoices, "seats-error",
          seatChoices.value ? "" : "Choose how many seats to reserve.")
      ];

      return problems.find(Boolean);
    }

    form.addEventListener("input", () => {
      if (attemptedSubmit) {
        validate();
      }
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      attemptedSubmit = true;

      const firstProblem = validate();
      if (firstProblem) {
        firstProblem.focus();
        return;
      }

      document.getElementById("confirmed-time").textContent = sessionChoices.value;
      document.getElementById("confirmed-seats").textContent = seatChoices.value;
      document.getElementById("confirmed-name").textContent = nameInput.value.trim();
      document.getElementById("confirmed-email").textContent = emailInput.value.trim();

      form.hidden = true;
      confirmation.hidden = false;
      document.getElementById("confirmation-title").focus();
    });

    document.getElementById("edit-reservation").addEventListener("click", () => {
      attemptedSubmit = false;
      confirmation.hidden = true;
      form.hidden = false;
      document.getElementById("form-title").focus();
    });
  </script>
</body>
</html>
