<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f2e8">
  <title>Oat Glaze Bowl | Kiln &amp; Field</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f2e8;
      --ink: #30241d;
      --muted: #635347;
      --rust: #89442e;
      --rust-dark: #703420;
      --rule: #d9c9b8;
      --serif: "Instrument Serif", Georgia, serif;
      --sans: "DM Sans", system-ui, sans-serif;
      --gutter: clamp(24px, 5.55vw, 80px);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 18% 0%, #fcf7ef, transparent 65%), var(--paper);
      color: var(--ink);
      font: 400 1rem/1.55 var(--sans);
    }

    button {
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 2px solid var(--rust);
      outline-offset: 4px;
    }

    .shell {
      width: calc(100% - 2 * var(--gutter));
      max-width: 1280px;
      margin-inline: auto;
    }

    .masthead { border-bottom: 1px solid var(--rule); }

    .masthead .shell {
      display: flex;
      min-height: 80px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 11px;
      font: 400 2.15rem/1 var(--serif);
      letter-spacing: -.035em;
      white-space: nowrap;
    }

    .wordmark svg { flex: none; }

    .bag-trigger {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      gap: 8px;
      padding: 0;
      border: 0;
      border-radius: 2px;
      background: transparent;
      font-size: .875rem;
      font-weight: 600;
    }

    .bag-trigger:hover { color: var(--rust); }

    .bag-count {
      display: grid;
      width: 24px;
      height: 24px;
      place-items: center;
      margin-left: 2px;
      border: 1px solid var(--rule);
      border-radius: 50%;
      font-size: .75rem;
      line-height: 1;
    }

    .bag-trigger.has-bowl .bag-count {
      border-color: var(--rust);
      background: var(--rust);
      color: #fff8ee;
    }

    .product {
      display: grid;
      grid-template-columns: minmax(0, 1.63fr) minmax(0, 1fr);
      align-items: center;
      gap: clamp(38px, 6.2vw, 96px);
      padding-block: clamp(42px, 4.3vw, 68px) 64px;
    }

    .plate {
      position: relative;
      isolation: isolate;
      margin: 0;
      background: #ead8bd;
      box-shadow: 0 1px 3px #5537201a;
    }

    .plate::after {
      position: absolute;
      z-index: 1;
      inset: clamp(9px, 1.15vw, 17px);
      border: 1px solid #78533948;
      content: "";
      pointer-events: none;
    }

    .plate > svg { display: block; width: 100%; height: auto; }

    .plate figcaption {
      position: absolute;
      bottom: clamp(16px, 2.35vw, 34px);
      left: clamp(19px, 2.55vw, 37px);
      color: #5b4130;
      font-size: .625rem;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .details { max-width: 425px; }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 0 0 20px;
      color: var(--rust);
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 25px;
      height: 1px;
      background: currentColor;
      content: "";
    }

    h1 {
      margin: 0;
      font: 400 clamp(4.4rem, 7.1vw, 6.6rem)/.88 var(--serif);
      letter-spacing: -.034em;
    }

    h1 em {
      display: block;
      color: var(--rust);
      font-weight: 400;
    }

    .price {
      margin: 24px 0 12px;
      font-size: 1.375rem;
      font-weight: 500;
    }

    .description {
      max-width: 32ch;
      margin: 0;
      color: var(--muted);
      text-wrap: balance;
    }

    .buy-button {
      display: flex;
      width: 100%;
      min-height: 57px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 28px;
      padding: 0 20px;
      border: 1px solid transparent;
      border-radius: 3px;
      background: var(--rust);
      color: #fff9f0;
      font-size: .9375rem;
      font-weight: 600;
      transition: background-color 160ms ease;
    }

    .buy-button:hover { background: var(--rust-dark); }

    .shipping {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: .875rem;
    }

    .shipping svg { flex: none; color: var(--rust); }

    html:has(.bag[open]) { overflow: hidden; }

    .bag {
      --enter-x: 24px;
      --enter-y: 0;
      position: fixed;
      inset: 0 0 0 auto;
      width: min(100%, 440px);
      max-width: none;
      height: 100%;
      height: 100dvh;
      max-height: none;
      margin: 0;
      padding: 0;
      overflow: auto;
      border: 0;
      background: var(--paper);
      color: var(--ink);
      box-shadow: -12px 0 60px #2e1c2330;
    }

    .bag[open] { animation: arrive 200ms ease-out; }
    .bag::backdrop { background: #33251d69; }

    @keyframes arrive {
      from { opacity: .55; transform: translate(var(--enter-x), var(--enter-y)); }
      to { opacity: 1; transform: translate(0, 0); }
    }

    .bag-content { padding: 30px 32px 34px; }

    .bag-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .bag-heading h2 {
      flex: 1;
      margin: 0;
      font: 400 clamp(2.25rem, 7vw, 2.8rem)/1 var(--serif);
      letter-spacing: -.025em;
    }

    .confirmation {
      display: grid;
      width: 27px;
      height: 27px;
      flex: none;
      place-items: center;
      border: 1px solid #b87d65;
      border-radius: 50%;
      color: var(--rust);
    }

    .close-bag {
      display: grid;
      width: 44px;
      height: 44px;
      flex: none;
      place-items: center;
      padding: 0;
      border: 1px solid var(--rule);
      border-radius: 50%;
      background: transparent;
    }

    .close-bag:hover, .return-button:hover { background: #ede1d2; }

    .bag-line {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: start;
      gap: 14px;
      padding-block: 18px;
      border-block: 1px solid var(--rule);
    }

    .bag-thumbnail {
      display: block;
      width: 88px;
      height: 72px;
      background: #ead8bd;
    }

    .bag-name {
      display: block;
      font: 400 1.55rem/1.15 var(--serif);
    }

    .bag-quantity, .empty-bag {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .875rem;
    }

    .remove-button {
      min-height: 34px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--rust);
      font-size: .8125rem;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .bag-price { font-size: .9375rem; font-weight: 600; }
    .empty-bag { padding-block: 18px; border-top: 1px solid var(--rule); }

    .return-button {
      width: 100%;
      min-height: 48px;
      margin-top: 24px;
      border: 1px solid #a68c77;
      border-radius: 3px;
      background: transparent;
      font-size: .875rem;
      font-weight: 600;
    }

    @media (max-width: 800px) {
      .masthead .shell { min-height: 65px; }
      .wordmark { gap: 8px; font-size: 1.9rem; }
      .wordmark svg { width: 26px; height: 32px; }

      .product {
        max-width: 570px;
        grid-template-columns: minmax(0, 1fr);
        gap: 28px;
        padding-block: 22px 46px;
      }

      .details { max-width: none; }
      .eyebrow { margin-bottom: 12px; }
      h1 { font-size: clamp(2.75rem, 14vw, 4.8rem); line-height: .98; }
      h1 em { display: inline; }
      .price { margin: 12px 0 9px; font-size: 1.25rem; }
      .description { text-wrap: pretty; }
      .buy-button { min-height: 54px; margin-top: 22px; }
    }

    @media (max-width: 520px) {
      .bag {
        --enter-x: 0;
        --enter-y: 18px;
        inset: auto 0 0;
        width: 100%;
        height: auto;
        max-height: calc(100dvh - 16px);
        border-radius: 14px 14px 0 0;
      }

      .bag-content {
        padding: 22px 24px calc(24px + env(safe-area-inset-bottom));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bag[open] { animation: none; }
      .buy-button { transition: none; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="shell">
      <div class="wordmark">
        <svg width="31" height="37" viewBox="0 0 32 38" aria-hidden="true">
          <path d="M2 36V16a14 14 0 0 1 28 0v20Z" fill="#89442e"/>
          <g fill="none" stroke="#f8ebd8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7.5 21h17c-1.7 5.3-4.5 7.6-8.5 7.6S9.2 26.3 7.5 21Z" stroke-width="1.2"/>
            <path d="M12.6 31.4h6.8M16 10v6m-3-3h6" stroke-width="1"/>
          </g>
        </svg>
        <span>Kiln &amp; Field</span>
      </div>

      <button class="bag-trigger" id="open-bag" type="button"
              aria-haspopup="dialog" aria-controls="bag" aria-label="Bag, 0 items">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.45" stroke-linejoin="round" aria-hidden="true">
          <path d="M5.5 8.5h13l1.2 12H4.3l1.2-12Z"/>
          <path d="M9 10V6a3 3 0 0 1 6 0v4" stroke-linecap="round"/>
        </svg>
        Bag <span class="bag-count" id="bag-count" aria-hidden="true">0</span>
      </button>
    </div>
  </header>

  <main class="shell product">
    <figure class="plate">
      <svg width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="drawing-title">
        <title id="drawing-title">Drawing of the Oat Glaze Bowl in warm cream and clay tones</title>
        <defs>
          <linearGradient id="plate-paper" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop stop-color="#f2e5d0"/>
            <stop offset=".57" stop-color="#e9d7bb"/>
            <stop offset="1" stop-color="#d9bb98"/>
          </linearGradient>
          <radialGradient id="plate-light" cx="32%" cy="24%" r="72%">
            <stop stop-color="#fff6e1" stop-opacity=".87"/>
            <stop offset=".71" stop-color="#f6e7cd" stop-opacity=".22"/>
            <stop offset="1" stop-color="#f6e7cd" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="outer-glaze" x1="22%" y1="1%" x2="80%" y2="98%">
            <stop stop-color="#ffefd2"/>
            <stop offset=".39" stop-color="#f1dcba"/>
            <stop offset=".7" stop-color="#d8b68d"/>
            <stop offset="1" stop-color="#a77855"/>
          </linearGradient>
          <radialGradient id="outer-light">
            <stop stop-color="#fff3d9" stop-opacity=".86"/>
            <stop offset="1" stop-color="#fff3d9" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="inner-glaze" x1="36%" y1="0%" x2="58%" y2="100%">
            <stop stop-color="#a57b56"/>
            <stop offset=".25" stop-color="#bf9872"/>
            <stop offset=".63" stop-color="#e2c7a1"/>
            <stop offset=".89" stop-color="#f1ddba"/>
            <stop offset="1" stop-color="#dbc29b"/>
          </linearGradient>
          <linearGradient id="rim-glaze" x1="13%" y1="8%" x2="89%" y2="96%">
            <stop stop-color="#fff1d6"/>
            <stop offset=".53" stop-color="#f6e3c4"/>
            <stop offset="1" stop-color="#bf986f"/>
          </linearGradient>
          <linearGradient id="foot-clay" x1="0%" y1="0%" x2="85%" y2="100%">
            <stop stop-color="#d3aa7f"/>
            <stop offset="1" stop-color="#805639"/>
          </linearGradient>
          <filter id="soft-shadow" x="-25%" y="-100%" width="150%" height="300%">
            <feGaussianBlur stdDeviation="17"/>
          </filter>
          <filter id="contact-shadow" x="-25%" y="-100%" width="150%" height="300%">
            <feGaussianBlur stdDeviation="5"/>
          </filter>
          <filter id="paper-tooth" x="0%" y="0%" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency=".74" numOctaves="3" seed="13" stitchTiles="stitch"/>
            <feColorMatrix type="saturate" values="0"/>
          </filter>
          <pattern id="glaze-flecks" width="143" height="119" patternUnits="userSpaceOnUse" patternTransform="rotate(-11)">
            <g fill="#775439" opacity=".48">
              <circle cx="8" cy="12" r=".8"/><ellipse cx="35" cy="5" rx="1.3" ry=".7"/>
              <circle cx="61" cy="14" r=".55"/><circle cx="91" cy="9" r=".95"/>
              <circle cx="121" cy="18" r=".55"/><circle cx="134" cy="7" r=".8"/>
              <circle cx="23" cy="31" r=".6"/><circle cx="50" cy="38" r=".95"/>
              <ellipse cx="76" cy="26" rx=".8" ry="1.25"/><circle cx="103" cy="37" r=".68"/>
              <circle cx="137" cy="38" r=".52"/><circle cx="10" cy="54" r=".7"/>
              <circle cx="34" cy="59" r="1.05"/><circle cx="66" cy="53" r=".6"/>
              <circle cx="89" cy="64" r=".66"/><ellipse cx="115" cy="56" rx="1.25" ry=".75"/>
              <circle cx="129" cy="72" r=".65"/><circle cx="19" cy="81" r=".9"/>
              <ellipse cx="47" cy="77" rx=".8" ry="1.3"/><circle cx="74" cy="87" r=".6"/>
              <circle cx="105" cy="81" r=".94"/><circle cx="139" cy="96" r=".7"/>
              <circle cx="4" cy="105" r=".68"/><circle cx="37" cy="98" r=".55"/>
              <circle cx="58" cy="107" r="1"/><circle cx="83" cy="110" r=".65"/>
              <ellipse cx="113" cy="104" rx=".7" ry="1.1"/><circle cx="125" cy="116" r=".62"/>
            </g>
            <g fill="#fff5db" opacity=".65">
              <circle cx="17" cy="18" r="1"/><circle cx="45" cy="22" r=".74"/>
              <circle cx="97" cy="27" r="1.05"/><circle cx="122" cy="43" r=".72"/>
              <circle cx="57" cy="67" r=".8"/><circle cx="8" cy="73" r=".76"/>
              <circle cx="84" cy="77" r="1"/><circle cx="119" cy="92" r=".85"/>
              <circle cx="30" cy="110" r=".8"/><circle cx="92" cy="96" r=".7"/>
            </g>
          </pattern>

          <path id="bowl-wall" d="M92 249C104 301 137 352 187 391c43 33 103 48 168 49 76 2 135-14 181-48 44-32 77-85 92-146-55 40-152 65-266 70-113 3-216-22-270-67Z"/>
          <path id="bowl-rim" d="M91 248c0-32 96-69 226-73 132-5 263 15 302 49 36 32-31 65-109 83-89 21-216 23-306 2-61-14-114-40-113-61Z"/>
          <path id="bowl-well" d="M105 247c1-26 94-58 213-63 123-5 248 16 288 44 34 24-32 53-105 71-85 21-200 21-287 2-58-12-110-36-109-54Z"/>
          <clipPath id="wall-clip"><use href="#bowl-wall"/></clipPath>
          <clipPath id="well-clip"><use href="#bowl-well"/></clipPath>

          <g id="bowl-drawing">
            <path d="M0 0h720v560H0z" fill="url(#plate-paper)"/>
            <path d="M0 0h720v560H0z" fill="url(#plate-light)"/>

            <g transform="translate(0 -23)" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="394" cy="437" rx="233" ry="35" transform="rotate(-5 394 437)"
                       fill="#835535" opacity=".27" filter="url(#soft-shadow)"/>
              <path d="M226 436c61-19 181-22 269-15 40 3 64 10 64 16-30 15-113 21-196 19-56 0-105-8-137-20Z"
                    fill="#855737" opacity=".27" filter="url(#contact-shadow)"/>
              <ellipse cx="359" cy="448" rx="109" ry="10" fill="#70482f" opacity=".55" filter="url(#contact-shadow)"/>

              <path d="m205 443 15-3m-33 9 28-6m-4 10 36-8m-19 11 33-8m-21 13 34-9m-7 11 29-8m169 6 53-12m-38 14 56-13m-37 15 67-16m-34 13 43-10m-16 7 28-8m-38-9 35-8m-20 3 33-8m-12 3 22-6"
                    fill="none" stroke="#8f6546" stroke-width=".9" opacity=".27"/>

              <path d="M255 418c1 12 10 24 32 29 36 9 107 11 147 0 17-4 28-13 29-27Z"
                    fill="url(#foot-clay)" stroke="#80593e" stroke-width="1.45"/>
              <path d="M275 440c30 13 113 17 157 2m-134 6c27 6 78 7 110 2"
                    fill="none" stroke="#efd0a6" stroke-width="1.2" opacity=".45"/>

              <use href="#bowl-wall" fill="url(#outer-glaze)"/>
              <g clip-path="url(#wall-clip)">
                <ellipse cx="237" cy="320" rx="252" ry="108" fill="url(#outer-light)"/>
                <path d="M143 363c70 58 156 69 226 67 80-2 152-30 199-73l-12 87H150Z"
                      fill="#a37551" opacity=".2"/>
                <path d="M92 252h539v191H92z" fill="url(#glaze-flecks)" opacity=".96"/>
                <g fill="none" stroke="#865c41" opacity=".29">
                  <path d="M107 280c62 43 165 68 273 65 100-3 172-25 221-57" stroke-width="1.1"/>
                  <path d="M126 314c61 40 150 64 247 62 87-2 156-25 207-58" stroke-width="1"/>
                  <path d="M153 348c56 36 138 56 218 54 74-2 131-21 175-49" stroke-width="1.1"/>
                  <path d="M183 379c61 36 123 44 191 42 56-2 112-17 153-43" stroke-width=".95"/>
                  <path d="M212 398c45 25 100 33 146 33 55 0 95-9 137-30" stroke-width=".75"/>
                  <path d="M121 299c26 19 53 32 85 43m237 70c28-5 50-14 71-25m-286 21c30 12 56 18 83 21" stroke-width=".8"/>
                </g>
                <path d="M111 289c54 34 118 51 187 58m-159-17c54 33 128 53 202 54m-163-12c55 31 109 40 169 42m39 10c44-3 82-13 115-29"
                      fill="none" stroke="#fff0d3" stroke-width="1.35" opacity=".68"/>
                <path d="m454 413 22-6m-7 1 20-6m-9 8 19-7m5-9 14-6m-4 7 11-6m5-10 16-10m-3 6 14-10"
                      fill="none" stroke="#805436" stroke-width=".8" opacity=".46"/>
              </g>
              <use href="#bowl-wall" fill="none" stroke="#805d43" stroke-width="1.85" opacity=".8"/>

              <use href="#bowl-rim" fill="url(#rim-glaze)" stroke="#876246" stroke-width="1.9"/>
              <use href="#bowl-well" fill="url(#inner-glaze)"/>
              <g clip-path="url(#well-clip)">
                <ellipse cx="343" cy="286" rx="205" ry="41" fill="url(#outer-light)" opacity=".58"/>
                <path d="M105 183h514v141H105z" fill="url(#glaze-flecks)" opacity=".76"/>
                <path d="M119 235c55-36 142-48 231-46 104 1 192 20 241 46"
                      fill="none" stroke="#67452f" stroke-width="2.3" opacity=".23"/>
                <g fill="none" stroke="#895f45" opacity=".32">
                  <path d="M132 249c48-33 131-49 225-48 94 2 173 19 217 45" stroke-width="1"/>
                  <path d="M158 259c43-27 117-44 199-42 80 1 147 15 191 38" stroke-width="1"/>
                  <path d="M186 268c39-22 106-36 173-35 64 1 126 13 161 32" stroke-width=".9"/>
                  <path d="M221 274c31-15 88-24 139-24 49 0 96 8 126 22" stroke-width=".85"/>
                  <path d="M258 280c29-10 62-15 100-15 37-1 69 4 89 12" stroke-width=".75"/>
                </g>
                <path d="M164 262c56 27 127 42 197 42 72 0 142-13 197-38"
                      fill="none" stroke="#fff3d5" stroke-width="1.15" opacity=".64"/>
                <path d="M278 284c44 10 118 9 162-1m-120 1c26 4 57 4 82 0"
                      fill="none" stroke="#af8660" stroke-width=".8" opacity=".39"/>
              </g>
              <use href="#bowl-well" fill="none" stroke="#866043" stroke-width="1.25" opacity=".67"/>
              <path d="M104 231c37-29 130-51 219-53m17 0c87-1 151 7 203 20M106 268c56 37 153 55 245 55 100 0 195-20 247-48"
                    fill="none" stroke="#fff3db" stroke-width="1.9" opacity=".83"/>
              <path d="M127 285c52 28 139 46 228 47 82 1 153-13 215-37"
                    fill="none" stroke="#9a6d4c" stroke-width="1.25" opacity=".37"/>
            </g>

            <rect width="720" height="560" fill="#fff" filter="url(#paper-tooth)"
                  opacity=".29" style="mix-blend-mode:multiply"/>
          </g>
        </defs>
        <use href="#bowl-drawing"/>
      </svg>
      <figcaption>Product illustration</figcaption>
    </figure>

    <section class="details" aria-labelledby="product-name">
      <p class="eyebrow">Small-batch pottery</p>
      <h1 id="product-name">Oat Glaze <em>Bowl</em></h1>
      <p class="price">$46</p>
      <p class="description">Thrown and glazed by the maker in Milwaukee.</p>

      <button class="buy-button" id="buy-button" type="button"
              aria-haspopup="dialog" aria-controls="bag">
        <span id="buy-label">Add to bag</span>
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 12h15m-6-6 6 6-6 6"/>
        </svg>
      </button>

      <p class="shipping">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/>
          <path d="m4 7.5 8 4.5 8-4.5M12 12v9M8 5.3l8 4.5"/>
        </svg>
        Ships in 5 days
      </p>
    </section>
  </main>

  <dialog class="bag" id="bag" aria-labelledby="bag-title" closedby="any">
    <form class="bag-content" method="dialog">
      <div class="bag-heading">
        <span class="confirmation" id="confirmation" hidden>
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3.5 8.2 2.8 2.8 6.2-6.2"/>
          </svg>
        </span>
        <h2 id="bag-title">Your bag</h2>
        <button class="close-bag" type="submit" aria-label="Close bag" autofocus>
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor"
               stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
            <path d="m5 5 10 10M15 5 5 15"/>
          </svg>
        </button>
      </div>

      <p class="empty-bag" id="empty-bag">Your bag is empty.</p>

      <div id="bag-item" hidden>
        <div class="bag-line">
          <svg class="bag-thumbnail" viewBox="51 104 618 424" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <use href="#bowl-drawing"/>
          </svg>
          <div>
            <span class="bag-name">Oat Glaze Bowl</span>
            <p class="bag-quantity">Quantity 1</p>
            <button class="remove-button" id="remove-bowl" type="button" aria-label="Remove Oat Glaze Bowl">
              Remove
            </button>
          </div>
          <span class="bag-price">$46</span>
        </div>
        <p class="shipping">Ships in 5 days</p>
      </div>

      <button class="return-button" id="return-button" type="submit">Back to bowl</button>
    </form>
  </dialog>

  <script>
    const bag = document.querySelector("#bag");
    const bagTitle = document.querySelector("#bag-title");
    const confirmation = document.querySelector("#confirmation");
    const openBagButton = document.querySelector("#open-bag");
    const bagCount = document.querySelector("#bag-count");
    const buyButton = document.querySelector("#buy-button");
    const buyLabel = document.querySelector("#buy-label");
    const emptyBag = document.querySelector("#empty-bag");
    const bagItem = document.querySelector("#bag-item");
    const returnButton = document.querySelector("#return-button");
    let hasBowl = false;

    function updateBag() {
      bagCount.textContent = hasBowl ? "1" : "0";
      openBagButton.classList.toggle("has-bowl", hasBowl);
      openBagButton.setAttribute("aria-label", hasBowl ? "Bag, 1 item" : "Bag, 0 items");
      buyLabel.textContent = hasBowl ? "View bag" : "Add to bag";
      emptyBag.hidden = hasBowl;
      bagItem.hidden = !hasBowl;
    }

    function showBag(justAdded = false) {
      bagTitle.textContent = justAdded ? "Added to your bag" : "Your bag";
      confirmation.hidden = !justAdded;
      bag.showModal();
    }

    buyButton.addEventListener("click", () => {
      const justAdded = !hasBowl;
      hasBowl = true;
      updateBag();
      showBag(justAdded);
    });

    openBagButton.addEventListener("click", () => showBag());

    document.querySelector("#remove-bowl").addEventListener("click", () => {
      hasBowl = false;
      bagTitle.textContent = "Your bag";
      confirmation.hidden = true;
      updateBag();
      returnButton.focus();
    });
  </script>
</body>
</html>
