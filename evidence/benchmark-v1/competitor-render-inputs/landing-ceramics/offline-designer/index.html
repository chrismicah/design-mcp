<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F7F3E8">
  <title>Oat Glaze Bowl · Kiln &amp; Field</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 12h26c-1 8-6 13-13 13S4 20 3 12Z' fill='%2334442C'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&amp;family=Work+Sans:wght@400;500;600&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #F7F3E8;
      --ink: #282B22;
      --muted: #555B4C;
      --moss: #49583E;
      --spruce: #34442C;
      --oat: #E4CCA3;
      --flax: #D4CCB8;
      --display: "Fraunces", Georgia, serif;
      --text: "Work Sans", "Trebuchet MS", sans-serif;
      --gutter: clamp(1.25rem, 4.8vw, 4.75rem);
      scrollbar-gutter: stable;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 1rem/1.5 var(--text);
    }

    button {
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 2px solid var(--spruce);
      outline-offset: 4px;
    }

    .shell {
      width: min(calc(100% - var(--gutter) - var(--gutter)), 82rem);
      margin-inline: auto;
    }

    .masthead {
      min-height: 5.375rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid var(--flax);
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: .65rem;
      font: 600 clamp(1.45rem, 2.4vw, 1.875rem)/1 var(--display);
      letter-spacing: -.05em;
      white-space: nowrap;
    }

    .wordmark svg {
      flex: none;
      width: 1.95rem;
      height: 1.95rem;
      color: var(--spruce);
    }

    .bag-button {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      min-height: 2.75rem;
      padding: 0 0 0 .6rem;
      border: 0;
      background: transparent;
      font-size: .93rem;
      font-weight: 500;
    }

    .bag-button:hover .bag-label {
      text-decoration: underline;
      text-underline-offset: .24em;
    }

    .bag-count {
      display: grid;
      place-items: center;
      min-width: 1.5rem;
      min-height: 1.5rem;
      padding-inline: .3rem;
      border-radius: 50%;
      background: #E4E7D8;
      color: var(--spruce);
      font-size: .75rem;
      font-variant-numeric: tabular-nums;
    }

    .product {
      display: grid;
      grid-template-columns: minmax(0, 1.62fr) minmax(0, 1fr);
      align-items: center;
      gap: clamp(2.25rem, 6.2vw, 6.25rem);
      padding-block: clamp(2.25rem, 4.1vw, 4rem) 3rem;
    }

    .study { margin: 0; }

    .plate {
      position: relative;
      isolation: isolate;
      aspect-ratio: 760 / 620;
      background: var(--moss);
    }

    .plate > svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .plate::after {
      content: "";
      position: absolute;
      inset: clamp(.65rem, 1.5vw, 1.35rem);
      border: 1px solid rgb(247 243 232 / 34%);
      pointer-events: none;
    }

    figcaption {
      display: flex;
      align-items: center;
      gap: .65rem;
      margin-top: .75rem;
      color: var(--muted);
      font-size: .8125rem;
    }

    figcaption::before {
      content: "";
      width: 1.3rem;
      height: 1px;
      background: var(--flax);
    }

    .details {
      width: min(100%, 27rem);
      padding-bottom: 1.5rem;
    }

    .category {
      margin: 0 0 .95rem;
      color: var(--moss);
      font-size: .9375rem;
      font-weight: 500;
    }

    h1 {
      margin: 0;
      font: 500 clamp(3.3rem, 6.85vw, 6.125rem)/.94 var(--display);
      letter-spacing: -.057em;
    }

    h1 span { display: block; }

    .price {
      margin: 1.35rem 0 1.1rem;
      font: 500 2.125rem/1 var(--display);
      letter-spacing: -.045em;
    }

    .origin {
      margin: 0;
      max-width: 37ch;
      color: var(--muted);
      text-wrap: pretty;
    }

    .purchase {
      margin-top: 1.65rem;
      padding-top: 1rem;
      border-top: 1px solid var(--flax);
    }

    .shipping {
      display: flex;
      align-items: center;
      gap: .55rem;
      margin: 0 0 .9rem;
      color: var(--spruce);
      font-size: .9375rem;
      font-weight: 500;
    }

    .shipping svg { flex: none; }

    .buy-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      width: 100%;
      min-height: 3.5rem;
      padding: .85rem 1.125rem;
      border: 1px solid transparent;
      background: var(--spruce);
      color: var(--paper);
      font-weight: 600;
      text-align: start;
    }

    .buy-button:hover { background: #263522; }

    html:has(.bag-dialog[open]) { overflow: hidden; }

    .bag-dialog {
      inset: 0;
      width: min(calc(100% - 2.5rem), 29rem);
      max-height: calc(100dvh - 2.5rem);
      margin: auto;
      padding: 1.65rem 1.75rem 1.5rem;
      overflow: auto;
      border: 1px solid var(--flax);
      background: var(--paper);
      color: var(--ink);
    }

    .bag-dialog::backdrop { background: rgb(31 38 27 / 49%); }

    .bag-dialog[open] {
      animation: open-bag 180ms ease-out both;
    }

    @keyframes open-bag {
      from { opacity: 0; transform: translateY(.5rem); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bag-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .75rem;
      margin-bottom: .95rem;
    }

    .bag-heading h2 {
      margin: 0;
      font: 500 clamp(1.875rem, 5vw, 2.45rem)/1.05 var(--display);
      letter-spacing: -.045em;
    }

    .close-bag {
      display: grid;
      place-items: center;
      flex: none;
      width: 2.75rem;
      height: 2.75rem;
      margin-inline-end: -.5rem;
      border: 0;
      background: transparent;
    }

    .close-bag:hover { background: #EBE7DB; }

    .empty-bag, .bag-item {
      margin: 0;
      padding-top: 1rem;
      border-top: 1px solid var(--flax);
    }

    .empty-bag { color: var(--muted); }

    .bag-item:not([hidden]) {
      display: grid;
      grid-template-columns: 4.5rem minmax(0, 1fr) auto;
      align-items: start;
      gap: .85rem;
    }

    .bag-thumbnail {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      background: var(--moss);
    }

    .bag-product, .bag-price {
      margin: 0;
      font-weight: 600;
    }

    .bag-quantity {
      margin: .18rem 0 0;
      color: var(--muted);
      font-size: .875rem;
    }

    .remove-button {
      min-height: 2.75rem;
      padding: 0 .3rem;
      margin-inline-start: -.3rem;
      border: 0;
      background: transparent;
      color: var(--spruce);
      font-size: .875rem;
      text-decoration: underline;
      text-underline-offset: .23em;
    }

    @media (max-width: 48rem) {
      .masthead { min-height: 4.125rem; }

      .product {
        grid-template-columns: minmax(0, 1fr);
        gap: 1.3rem;
        padding-block: 1.25rem 2.25rem;
      }

      .plate { aspect-ratio: 1.12; }

      figcaption { margin-top: .55rem; }

      .details { padding-bottom: 0; }

      .category { margin-bottom: .4rem; }
      h1 { font-size: clamp(2.1rem, 12.35vw, 4.75rem); line-height: 1; }
      h1 span { display: inline; }

      .price {
        margin: .7rem 0 .65rem;
        font-size: 1.75rem;
      }

      .origin { font-size: .975rem; }

      .purchase {
        margin-top: 1.05rem;
        padding-top: .85rem;
      }

      .shipping { margin-bottom: .75rem; }
    }

    @media (max-width: 32rem) {
      .bag-dialog {
        inset: auto 0 0;
        width: 100%;
        max-width: none;
        max-height: calc(100dvh - 1rem);
        margin: 0;
        padding: 1.25rem 1.25rem max(1.25rem, env(safe-area-inset-bottom));
        border: 0;
        border-top: 1px solid var(--flax);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bag-dialog[open] { animation: none; }
    }
  </style>
</head>

        <p class="shipping">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="8.75"/>
            <path d="M12 7.5v5l3 1.75"/>
          </svg>
          Ships in 5 days
        </p>

        <button class="buy-button" id="buy-bowl" type="button" aria-haspopup="dialog"
                aria-controls="bag">
          <span id="buy-label">Add to bag</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 8h14l1 12H4L5 8Z"/>
            <path d="M9 10V7a3 3 0 0 1 6 0v3"/>
          </svg>
        </button>
      </div>
    </section>
  </main>

  <dialog id="bag" class="bag-dialog" aria-labelledby="bag-title" closedby="any">
    <div class="bag-heading">
      <h2 id="bag-title">Your bag</h2>
      <form method="dialog">
        <button class="close-bag" type="submit" aria-label="Close bag" autofocus>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18"/>
          </svg>
        </button>
      </form>
    </div>
    <p class="empty-bag" id="empty-bag" tabindex="-1">Your bag is empty.</p>

    <div class="bag-item" id="bag-item" hidden>
      <svg class="bag-thumbnail" viewBox="65 105 640 440" aria-hidden="true">
        <use href="#bowl-study"/>
      </svg>
      <div>
        <p class="bag-product">Oat Glaze Bowl</p>
        <p class="bag-quantity">Quantity 1</p>
        <button class="remove-button" id="remove-bowl" type="button"
                aria-label="Remove Oat Glaze Bowl">Remove</button>
      </div>
      <p class="bag-price">$46</p>
    </div>
  </dialog>

  <script>
    const bag = document.getElementById("bag");
    const bagTitle = document.getElementById("bag-title");
    const bagButton = document.getElementById("open-bag");
    const bagCount = document.getElementById("bag-count");
    const bagItem = document.getElementById("bag-item");
    const emptyBag = document.getElementById("empty-bag");
    const buyButton = document.getElementById("buy-bowl");
    const buyLabel = document.getElementById("buy-label");
    const removeButton = document.getElementById("remove-bowl");

    // The bag holds one bowl in page memory.
    let inBag = false;

    function renderBag() {
      bagCount.textContent = inBag ? "1" : "0";
      bagButton.setAttribute("aria-label", inBag ? "Bag, 1 item" : "Bag, empty");
      buyLabel.textContent = inBag ? "View bag" : "Add to bag";
      bagItem.hidden = !inBag;
      emptyBag.hidden = inBag;
    }

    function openBag(title) {
      bagTitle.textContent = title;
      bag.showModal();
    }

    buyButton.addEventListener("click", () => {
      const added = !inBag;
      inBag = true;
      renderBag();
      openBag(added ? "Added to your bag" : "Your bag");
    });

    bagButton.addEventListener("click", () => openBag("Your bag"));

    removeButton.addEventListener("click", () => {
      inBag = false;
      bagTitle.textContent = "Your bag";
      renderBag();
      emptyBag.focus();
    });
  </script>
</body>
</html>
