<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3ebe0">
  <title>Oat Glaze Bowl | Kiln &amp; Field</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&amp;family=Instrument+Sans:wght@400..700&amp;display=swap">
  <style>
    :root {
      --paper: #f3ebe0;
      --stock: #e5d5c1;
      --oat: #c7a783;
      --ink: #2a1610;
      --quiet: #685247;
      --accent: #6b2148;
      --rule: rgb(42 22 16 / 20%);
      --display: "Fraunces", Georgia, serif;
      --body: "Instrument Sans", "Trebuchet MS", sans-serif;
      --gutter: clamp(1.25rem, 5.55vw, 5rem);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--body);
      line-height: 1.5;
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }

    .frame {
      width: min(80rem, calc(100% - var(--gutter) - var(--gutter)));
      margin-inline: auto;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 5.5rem;
      border-bottom: 1px solid var(--rule);
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-family: var(--display);
      font-size: 1.8rem;
      font-weight: 580;
      letter-spacing: -0.048em;
      line-height: 1;
    }

    .kiln-mark {
      flex: none;
      color: var(--accent);
    }

    .bag-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 2.75rem;
      padding: 0.3rem 0.45rem 0.3rem 0.8rem;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: transparent;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .bag-toggle:hover {
      border-color: var(--ink);
    }

    .bag-count {
      display: grid;
      place-items: center;
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 50%;
      background: var(--stock);
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
    }

    .bag-count[data-filled] {
      background: var(--accent);
      color: var(--paper);
      animation: settle 240ms ease-out;
    }

    @keyframes settle {
      from { transform: translateY(-4px); }
      to { transform: translateY(0); }
    }

    .product {
      display: grid;
      grid-template-columns: minmax(0, 1.47fr) minmax(0, 1fr);
      align-items: center;
      gap: clamp(2rem, 6.1vw, 6rem);
      padding-block: clamp(2rem, 3.6vw, 3.25rem) clamp(2.5rem, 5.5vw, 5rem);
    }

    .plate {
      margin: 0;
      border: 1px solid rgb(42 22 16 / 14%);
      background: var(--stock);
    }

    .plate > svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .product-details {
      width: min(100%, 29rem);
    }

    .studio-note {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin: 0 0 0.95rem;
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .studio-note::before {
      width: 1.5rem;
      height: 1px;
      background: currentColor;
      content: "";
    }

    h1 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(3.625rem, 6.15vw, 5.625rem);
      font-weight: 600;
      letter-spacing: -0.054em;
      line-height: 0.97;
    }

    h1 span {
      display: block;
    }

    .provenance {
      max-width: 32ch;
      margin: 1.3rem 0 0;
      color: var(--quiet);
      font-size: 1.125rem;
      line-height: 1.55;
    }

    .purchase {
      margin-top: 1.85rem;
      padding-top: 1.05rem;
      border-top: 1px solid var(--rule);
    }

    .purchase-facts {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.6rem 1.25rem;
    }

    .price {
      font-family: var(--display);
      font-size: 2.55rem;
      font-weight: 510;
      letter-spacing: -0.055em;
      line-height: 1;
    }

    .shipping {
      display: inline-flex;
      align-items: center;
      gap: 0.48rem;
      margin: 0;
      color: var(--quiet);
      font-size: 0.95rem;
      font-weight: 550;
    }

    .shipping svg {
      flex: none;
    }

    .primary-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      width: 100%;
      min-height: 3.65rem;
      padding: 0.75rem 1.2rem;
      border: 1px solid transparent;
      border-radius: 0.25rem;
      background: var(--accent);
      color: var(--paper);
      font-weight: 650;
      text-align: left;
    }

    .primary-button:hover {
      background: color-mix(in srgb, var(--accent) 82%, var(--ink));
    }

    .primary-button:focus-visible {
      box-shadow: 0 0 0 3px var(--paper);
    }

    #purchase-button {
      margin-top: 1.2rem;
    }

    .purchase-status {
      min-height: 1.45rem;
      margin: 0.65rem 0 0;
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .bag-panel {
      position: fixed;
      inset: 0 0 0 auto;
      width: min(100%, 28rem);
      max-width: none;
      height: 100%;
      height: 100dvh;
      max-height: none;
      margin: 0;
      padding: clamp(1.25rem, 5vw, 2rem);
      border: 0;
      background: var(--paper);
      color: var(--ink);
      overflow: auto;
    }

    .bag-panel[open] {
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
    }

    .bag-panel::backdrop {
      background: rgb(42 22 16 / 42%);
    }

    .bag-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--rule);
    }

    .bag-heading h2 {
      margin: 0;
      font-family: var(--display);
      font-size: 2.35rem;
      font-weight: 560;
      letter-spacing: -0.05em;
      line-height: 1;
    }

    .close-bag {
      display: grid;
      place-items: center;
      width: 2.75rem;
      height: 2.75rem;
      padding: 0;
      border: 1px solid var(--rule);
      border-radius: 50%;
      background: transparent;
    }

    .close-bag:hover {
      border-color: var(--ink);
    }

    .bag-empty {
      margin: 0;
      color: var(--quiet);
    }

    .bag-item {
      display: grid;
      grid-template-columns: 5rem minmax(0, 1fr) auto;
      align-items: start;
      gap: 0.9rem;
    }

    .bag-thumb {
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      border: 1px solid var(--rule);
      background: var(--stock);
    }

    .bag-item h3 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.25rem;
      font-weight: 590;
      line-height: 1.2;
    }

    .bag-quantity {
      margin: 0.28rem 0 0;
      color: var(--quiet);
      font-size: 0.875rem;
    }

    .bag-item-price {
      font-weight: 650;
    }

    .remove-bowl {
      min-height: 2.75rem;
      margin-top: 0.15rem;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 0.22em;
    }

    .bag-footer {
      margin-top: auto;
    }

    .bag-footer .primary-button {
      justify-content: center;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 50rem) {
      :root {
        --gutter: clamp(1.125rem, 5.12vw, 2rem);
      }

      .frame {
        max-width: 37rem;
      }

      .masthead {
        min-height: 4.125rem;
      }

      .wordmark {
        gap: 0.45rem;
        font-size: 1.53rem;
      }

      .kiln-mark {
        width: 1.7rem;
        height: auto;
      }

      .product {
        grid-template-columns: minmax(0, 1fr);
        gap: 1.55rem;
        padding-block: 1.125rem 2rem;
      }

      .product-details {
        width: 100%;
      }

      .studio-note {
        margin-bottom: 0.62rem;
      }

      h1 {
        font-size: clamp(2.5rem, 12.25vw, 4.125rem);
        line-height: 1.02;
      }

      h1 span {
        display: inline;
      }

      .provenance {
        max-width: 38ch;
        margin-top: 0.72rem;
        font-size: 1.06rem;
      }

      .purchase {
        margin-top: 1.25rem;
        padding-top: 0.85rem;
      }

      .price {
        font-size: 2.3rem;
      }

      #purchase-button {
        min-height: 3.5rem;
        margin-top: 0.9rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bag-count[data-filled] {
        animation: none;
      }
    }
  </style>
</head>

      <span>Bag</span>
      <span class="bag-count" id="bag-count" aria-hidden="true">0</span>
    </button>
  </header>

            <path d="M119 295c-4-46 87-89 204-105 92-12 202 0 261 31"
              stroke="#fff6e2" stroke-width="3.4" opacity=".84"/>
            <path d="M123 317c39 50 151 74 267 66 96-7 187-33 231-72"
              stroke="#795236" stroke-width="1.05" opacity=".69"/>
            <path d="M132 322c45 38 145 60 251 55 85-4 163-25 211-56"
              stroke="#fff1d6" stroke-width="3.3" opacity=".82"/>
            <path d="M613 235c11 7 22 21 22 33" stroke="#fff2d8" stroke-width="2.2" opacity=".66"/>
          </g>
        </g>

        <rect width="760" height="670" filter="url(#paper-grain)" opacity=".19"
          style="mix-blend-mode: multiply" pointer-events="none"/>
        <rect x="19.5" y="19.5" width="721" height="631" fill="none"
          stroke="#755841" stroke-opacity=".34"/>
      </svg>
    </figure>

    <section class="product-details" aria-labelledby="product-title">
      <p class="studio-note">Small-batch pottery</p>
      <h1 id="product-title">Oat Glaze <span>Bowl</span></h1>
      <p class="provenance">Thrown and glazed by the maker in Milwaukee.</p>

      <div class="purchase">
        <div class="purchase-facts">
          <data class="price" value="46">$46</data>
          <p class="shipping">
            <svg width="19" height="19" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="m10 2.5 6.8 3.6v7.8L10 17.5l-6.8-3.6V6.1L10 2.5Z
                M3.4 6.3 10 9.8l6.6-3.5M10 9.8v7.5M6.6 4.4l6.8 3.6"
                stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Ships in 5 days
          </p>
        </div>

        <button class="primary-button" id="purchase-button" type="button">
          <span id="purchase-label">Add to bag</span>
          <svg width="21" height="21" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path id="purchase-icon" d="M10 4v12M4 10h12" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <p class="purchase-status" id="purchase-status" role="status" aria-atomic="true"></p>
      </div>
    </section>
  </main>

  <dialog class="bag-panel" id="bag-panel" aria-labelledby="bag-title" closedby="any">
    <div class="bag-heading">
      <h2 id="bag-title">Your bag</h2>
      <form method="dialog">
        <button class="close-bag" type="submit" aria-label="Close bag" autofocus>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="m4.5 4.5 9 9m0-9-9 9" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </form>
    </div>

    <p class="bag-empty" id="bag-empty">Your bag is empty.</p>
    <div class="bag-item" id="bag-item" hidden>
      <svg class="bag-thumb" width="80" height="80" viewBox="65 65 630 630" aria-hidden="true">
        <use href="#bowl-print"/>
      </svg>
      <div>
        <h3>Oat Glaze Bowl</h3>
        <p class="bag-quantity">Quantity 1</p>
        <button class="remove-bowl" id="remove-bowl" type="button"
          aria-label="Remove Oat Glaze Bowl">Remove</button>
      </div>
      <data class="bag-item-price" value="46">$46</data>
    </div>
    <p class="visually-hidden" id="bag-status" role="status"></p>

    <form class="bag-footer" method="dialog">
      <button class="primary-button" id="back-to-bowl" type="submit">Back to bowl</button>
    </form>
  </dialog>

  <script>
    const bagToggle = document.getElementById("bag-toggle");
    const bagCount = document.getElementById("bag-count");
    const bagPanel = document.getElementById("bag-panel");
    const bagEmpty = document.getElementById("bag-empty");
    const bagItem = document.getElementById("bag-item");
    const bagStatus = document.getElementById("bag-status");
    const purchaseButton = document.getElementById("purchase-button");
    const purchaseLabel = document.getElementById("purchase-label");
    const purchaseIcon = document.getElementById("purchase-icon");
    const purchaseStatus = document.getElementById("purchase-status");
    const removeBowl = document.getElementById("remove-bowl");
    const backToBowl = document.getElementById("back-to-bowl");

    // The bag holds one bowl for the current page visit.
    let bowlIsInBag = false;

    function setBowlInBag(isInBag) {
      bowlIsInBag = isInBag;
      bagCount.textContent = isInBag ? "1" : "0";
      bagCount.toggleAttribute("data-filled", isInBag);
      bagToggle.setAttribute("aria-label", isInBag ? "Bag, 1 item" : "Bag, 0 items");

      bagEmpty.hidden = isInBag;
      bagItem.hidden = !isInBag;

      purchaseLabel.textContent = isInBag ? "View bag" : "Add to bag";
      purchaseIcon.setAttribute("d", isInBag ? "m4.5 10 3.6 3.6 7.4-7.4" : "M10 4v12M4 10h12");
      purchaseStatus.textContent = isInBag ? "Oat Glaze Bowl added to your bag." : "";
    }

    bagToggle.addEventListener("click", () => bagPanel.showModal());

    purchaseButton.addEventListener("click", () => {
      if (bowlIsInBag) {
        bagPanel.showModal();
        return;
      }
      setBowlInBag(true);
    });

    removeBowl.addEventListener("click", () => {
      setBowlInBag(false);
      backToBowl.focus();
      bagStatus.textContent = "Oat Glaze Bowl removed. Your bag is empty.";
    });

    bagPanel.addEventListener("close", () => {
      bagStatus.textContent = "";
    });
  </script>
</body>
</html>
