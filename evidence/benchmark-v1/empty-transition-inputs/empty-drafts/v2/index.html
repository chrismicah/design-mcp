<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Article drafts · Publishing desk</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f5ef;
      --ink: #1d2a2e;
      --red: #982e37;
      --celadon: #dce7de;
      --slate: #475854;
      --rule: #adbdb5;
      --serif: "Newsreader", Georgia, serif;
      --sans: "Source Sans 3", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 1.0625rem / 1.45 var(--sans);
    }

    .frame {
      width: min(1160px, calc(100% - clamp(40px, 8vw, 112px)));
      margin-inline: auto;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 76px;
      border-bottom: 1px solid var(--rule);
    }

    .desk {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 700;
    }

    .desk svg { flex: none; }

    .local {
      color: var(--slate);
      font-size: .9375rem;
      white-space: nowrap;
    }

    main { padding-bottom: 36px; }

    .page-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 14px;
      padding-block: clamp(34px, 4vw, 55px) 18px;
      border-bottom: 1px solid var(--ink);
    }

    h1, h2, h3 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
    }

    h1 {
      font-size: clamp(3.25rem, 5.8vw, 5.25rem);
      letter-spacing: -.045em;
      line-height: .96;
    }

    .count {
      margin: 0;
      color: var(--slate);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .spread {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, .93fr);
      align-items: center;
      gap: clamp(36px, 6vw, 88px);
      padding-block: 32px;
      border-bottom: 1px solid var(--rule);
    }

    .workflow {
      min-width: 0;
      max-width: 550px;
    }

    h2 {
      font-size: clamp(2.7rem, 4.2vw, 3.8rem);
      line-height: 1;
      letter-spacing: -.04em;
    }

    .intro {
      max-width: 42ch;
      margin: 10px 0 0;
      color: var(--slate);
      font-size: 1.125rem;
    }

    form { margin-top: 28px; }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .entry {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }

    input, button {
      min-height: 52px;
      border-radius: 2px;
      font: inherit;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 10px 13px;
      border: 1px solid var(--slate);
      background: #fff;
      color: var(--ink);
    }

    input[aria-invalid="true"] { border-color: var(--red); }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 9px 17px;
      border: 1px solid var(--red);
      background: var(--red);
      color: var(--paper);
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .create:hover {
      border-color: var(--ink);
      background: var(--ink);
    }

    .clear {
      background: transparent;
      color: var(--red);
    }

    .clear:hover {
      background: var(--red);
      color: var(--paper);
    }

    input:focus-visible, button:focus-visible, .draft-name:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }

    .field-error {
      margin: 8px 0 0;
      color: var(--red);
      font-size: .9375rem;
    }

    .draft-row {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 15px;
      align-items: center;
      margin-block: 22px 18px;
      padding-block: 16px;
      border-block: 1px solid var(--rule);
    }

    .draft-row svg { background: var(--celadon); }

    .draft-name {
      padding-top: .12em;
      font-size: clamp(1.8rem, 3vw, 2.65rem);
      line-height: 1.08;
      letter-spacing: -.025em;
      overflow-wrap: anywhere;
    }

    .proof {
      position: relative;
      aspect-ratio: 1.17;
      overflow: hidden;
      background-color: var(--celadon);
      background-image: radial-gradient(
        circle, rgb(71 88 84 / 24%) .65px, transparent .9px
      );
      background-size: 16px 16px;
    }

    .proof::after {
      position: absolute;
      inset: 14px;
      border: 1px solid rgb(71 88 84 / 25%);
      content: "";
      pointer-events: none;
    }

    .proof-art {
      display: block;
      width: 100%;
      height: 100%;
    }

    .proof-empty, .proof-filled {
      transition: opacity 240ms ease-out, transform 240ms ease-out;
    }

    .proof-filled {
      opacity: 0;
      transform: translateY(5px);
    }

    .proof[data-filled="true"] .proof-empty {
      opacity: 0;
      transform: translateY(-4px);
    }

    .proof[data-filled="true"] .proof-filled {
      opacity: 1;
      transform: translateY(0);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 780px) {
      .spread {
        grid-template-columns: minmax(0, 1fr);
        gap: 28px;
        padding-block: 28px 24px;
      }

      .proof {
        height: clamp(220px, 58vw, 320px);
        aspect-ratio: auto;
      }
    }

    @media (max-width: 520px) {
      .masthead { min-height: 64px; }
      .page-heading { padding-bottom: 13px; }

      h1 { font-size: clamp(2.375rem, 13vw, 3.75rem); }
      h2 { font-size: 2.75rem; }
      .count { font-size: 1rem; }
      .intro { font-size: 1.0625rem; }

      form { margin-top: 22px; }
      .entry { grid-template-columns: minmax(0, 1fr); }
      .proof::after { inset: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .proof-empty, .proof-filled { transition: none; }
    }
  </style>
</head>
<body>
  <header class="masthead frame">
    <div class="desk">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" fill="var(--red)"/>
        <path d="M10 7.5h8l4 4v13H10z M18 7.5v4h4 M13.5 16h5 M13.5 19.5h5"
              fill="none" stroke="var(--paper)" stroke-width="1.35"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Publishing desk</span>
    </div>
    <span class="local">Local demo</span>
  </header>

  <main class="frame">
    <div class="page-heading">
      <h1>Article drafts</h1>
      <p class="count" id="draft-count">0 drafts</p>
    </div>

    <div class="spread">
      <div class="workflow">
        <section id="empty-state" aria-labelledby="empty-heading">
          <h2 id="empty-heading">No drafts yet</h2>
          <p class="intro">Give your article a title to get started.</p>

          <form id="draft-form" novalidate>
            <label for="article-title">Article title</label>
            <div class="entry">
              <input id="article-title" name="title" type="text" autocomplete="off" required>
              <button class="create" type="submit">
                <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M8 3v10M3 8h10" fill="none" stroke="currentColor"
                        stroke-width="1.6" stroke-linecap="round"/>
                </svg>
                Create draft
              </button>
            </div>
            <p class="field-error" id="title-error" role="alert" hidden>
              Enter a title for your draft.
            </p>
          </form>
        </section>

        <section id="filled-state" aria-labelledby="filled-heading" hidden>
          <h2 id="filled-heading">Your draft</h2>
          <div class="draft-row">
            <svg width="42" height="42" viewBox="0 0 42 42" aria-hidden="true">
              <path d="M14 10h9l5 5v17H14z M23 10v5h5 M17.5 20h7 M17.5 24h7"
                    fill="none" stroke="var(--red)" stroke-width="1.45"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h3 class="draft-name" id="draft-name" tabindex="-1"></h3>
          </div>
          <button class="clear" type="button" id="clear-draft">Clear draft</button>
        </section>
      </div>

      <div class="proof" id="proof-sheet" aria-hidden="true">
        <svg class="proof-art" viewBox="0 0 480 400" focusable="false">
          <path d="M51 83V63h20 M408 63h21v20
                   M51 317v20h20 M408 337h21v-20"
                fill="none" stroke="var(--slate)" stroke-opacity=".55"/>

          <g transform="rotate(-10 222 202)">
            <rect x="112" y="79" width="220" height="267"
                  fill="var(--slate)" opacity=".12"/>
            <rect x="108" y="73" width="220" height="267"
                  fill="var(--rule)" stroke="var(--slate)" stroke-width="1.15"/>
            <path d="M120 85h196v243H120z"
                  fill="none" stroke="var(--slate)" stroke-opacity=".45"/>
          </g>

          <g transform="rotate(7 235 200)" stroke-linejoin="round">
            <path d="M134 61h174l36 36v252H134z" fill="var(--ink)" opacity=".12"/>
            <path d="M128 54h174l36 36v252H128z"
                  fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
            <path d="M302 54v36h36z"
                  fill="var(--celadon)" stroke="var(--ink)" stroke-width="1.3"/>
            <path d="M156 82v232" stroke="var(--red)" stroke-opacity=".4"/>
            <path d="M170 302h137" stroke="var(--rule)"/>

            <g class="proof-empty" fill="none" stroke-linecap="round">
              <path d="M170 125h137 M170 163h137 M170 181h137
                       M170 199h137 M170 217h137 M170 235h137"
                    stroke="var(--rule)" stroke-dasharray="2 4"/>
              <path d="M173 105v20m-4-20h8m-8 20h8"
                    stroke="var(--red)" stroke-width="2.2"/>
            </g>

            <g class="proof-filled" fill="none" stroke-linecap="round">
              <path d="M172 110h109 M172 125h75"
                    stroke="var(--ink)" stroke-width="5"/>
              <path d="M172 156h131 M172 168h114 M172 180h125 M172 192h87
                       M172 215h119 M172 227h127 M172 239h100"
                    stroke="var(--slate)" stroke-width="2.7" opacity=".65"/>
              <path d="m281 279 7 7 15-17"
                    stroke="var(--red)" stroke-width="2.7"/>
            </g>
          </g>

          <g transform="translate(353 316) rotate(27)" stroke-linejoin="round">
            <path d="M-8 -155q0 -6 6 -6h4q6 0 6 6v130L0 0l-8 -25z"
                  fill="var(--red)" stroke="var(--ink)" stroke-width="1.1"/>
            <path d="M-8 -145h16v14H-8z"
                  fill="var(--celadon)" stroke="var(--ink)" stroke-width="1.1"/>
            <path d="M-8 -25H8L0 0z"
                  fill="var(--paper)" stroke="var(--ink)" stroke-width="1.1"/>
            <path d="m-2.6 -8 2.6 8 2.6 -8z" fill="var(--ink)"/>
            <path d="M-3 -126v95" stroke="var(--paper)" stroke-opacity=".45"/>
          </g>
        </svg>
      </div>
    </div>

    <p class="visually-hidden" id="draft-status" role="status"></p>
  </main>

  <script>
    const storageKey = "publishing-desk.demo-draft";
    const form = document.getElementById("draft-form");
    const titleInput = document.getElementById("article-title");
    const titleError = document.getElementById("title-error");
    const emptyState = document.getElementById("empty-state");
    const filledState = document.getElementById("filled-state");
    const draftName = document.getElementById("draft-name");
    const draftCount = document.getElementById("draft-count");
    const proofSheet = document.getElementById("proof-sheet");
    const status = document.getElementById("draft-status");

    function readDraft() {
      try {
        return localStorage.getItem(storageKey)?.trim() ?? "";
      } catch {
        return "";
      }
    }

    function renderDraft(title) {
      const hasDraft = title !== "";
      draftName.textContent = title;
      draftCount.textContent = hasDraft ? "1 draft" : "0 drafts";
      proofSheet.dataset.filled = String(hasDraft);
      emptyState.hidden = hasDraft;
      filledState.hidden = !hasDraft;
    }

    function updateDraft(title) {
      try {
        if (title) {
          localStorage.setItem(storageKey, title);
        } else {
          localStorage.removeItem(storageKey);
        }
      } catch {
        // The current page can hold the draft when browser storage is blocked.
      }
      renderDraft(title);
    }

    function showTitleError(show) {
      titleError.hidden = !show;
      if (show) {
        titleInput.setAttribute("aria-invalid", "true");
        titleInput.setAttribute("aria-describedby", "title-error");
      } else {
        titleInput.removeAttribute("aria-invalid");
        titleInput.removeAttribute("aria-describedby");
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const title = titleInput.value.trim();

      if (!title) {
        showTitleError(true);
        titleInput.focus();
        return;
      }

      showTitleError(false);
      updateDraft(title);
      draftName.focus();
      status.textContent = "Draft created.";
    });

    titleInput.addEventListener("input", () => {
      if (titleInput.value.trim()) showTitleError(false);
    });

    document.getElementById("clear-draft").addEventListener("click", () => {
      form.reset();
      showTitleError(false);
      updateDraft("");
      titleInput.focus();
      status.textContent = "Draft cleared.";
    });

    renderDraft(readDraft());
  </script>
</body>
</html>
