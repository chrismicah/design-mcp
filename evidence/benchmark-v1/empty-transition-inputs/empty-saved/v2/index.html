<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saved trails</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@700&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f5ef;
      --cedar: #172f27;
      --fern: #41634f;
      --lichen: #b9c9a8;
      --ochre: #f4c95d;
      --shale: #51645a;
      --rule: color-mix(in srgb, var(--fern) 32%, var(--paper));
      --display: "Archivo Narrow", "Franklin Gothic Medium", sans-serif;
      --body: "Atkinson Hyperlegible", "Trebuchet MS", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      min-block-size: 100vh;
      margin: 0;
      border-block-start: 5px solid var(--cedar);
      background: var(--paper);
      color: var(--cedar);
      font: 1.0625rem / 1.45 var(--body);
    }

    main {
      max-inline-size: 72.5rem;
      margin-inline: auto;
      padding: clamp(2rem, 7vw, 6.25rem) clamp(1.25rem, 4vw, 2.25rem) 4rem;
    }

    .masthead {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      column-gap: clamp(.75rem, 2vw, 1.25rem);
      margin-block-end: clamp(1.125rem, 2vw, 1.625rem);
      padding-block-end: clamp(1rem, 1.7vw, 1.5rem);
      border-block-end: 1px solid var(--rule);
    }

    .masthead h1 {
      margin: 0;
      font: 700 clamp(3rem, 5.5vw, 5rem) / .98 var(--display);
      letter-spacing: -.035em;
    }

    .masthead-mark {
      display: grid;
      inline-size: clamp(2.625rem, 4.5vw, 3.75rem);
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid var(--rule);
      border-radius: 3px;
      background: color-mix(in srgb, var(--lichen) 28%, var(--paper));
    }

    .icon {
      flex: none;
      inline-size: 1.25rem;
      block-size: 1.25rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .masthead-mark .icon {
      inline-size: 56%;
      block-size: 56%;
      stroke-width: 1.4;
    }

    .list-status {
      align-self: end;
      margin: 0 0 .25rem;
      color: var(--shale);
    }

    .recommendation {
      display: grid;
      grid-template-columns: minmax(0, 1.48fr) minmax(0, 1fr);
      overflow: hidden;
      border-radius: 4px;
      background: var(--cedar);
      color: var(--paper);
    }

    .artwork-library {
      position: absolute;
      inline-size: 0;
      block-size: 0;
      overflow: hidden;
    }

    .artwork {
      position: relative;
      overflow: hidden;
      background: var(--fern);
    }

    .artwork > svg {
      position: absolute;
      inset: 0;
      display: block;
      inline-size: 100%;
      block-size: 100%;
    }

    .trail-plate {
      min-block-size: clamp(20rem, 28vw, 25.5rem);
    }

    .trail-sign {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-inline-size: 0;
      padding: clamp(1.5rem, 3.6vw, 3.25rem);
      border-inline-start: 1px solid color-mix(in srgb, var(--lichen) 28%, var(--cedar));
    }

    .trail-context {
      margin: 0 0 .625rem;
      color: var(--lichen);
      font-weight: 700;
    }

    .trail-name {
      inline-size: fit-content;
      max-inline-size: 100%;
      margin: 0;
      font: 700 clamp(2.65rem, 4.4vw, 4rem) / 1 var(--display);
      letter-spacing: -.025em;
      overflow-wrap: anywhere;
    }

    .trail-name:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 5px;
      border-radius: 2px;
    }

    .trail-distance {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin: .75rem 0 0;
      font-size: 1.125rem;
    }

    .trail-sign .trail-distance { color: var(--lichen); }
    .trail-distance .icon { inline-size: 1.125rem; block-size: 1.125rem; }

    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .625rem;
      min-block-size: 3.25rem;
      padding: .625rem 1.125rem;
      border: 1px solid transparent;
      border-radius: 3px;
      font: inherit;
      font-weight: 700;
      line-height: 1.2;
      cursor: pointer;
    }

    .action:focus-visible {
      outline: 2px solid var(--paper);
      outline-offset: 2px;
      box-shadow: 0 0 0 6px var(--cedar);
    }

    .save-action {
      margin-block-start: clamp(1.375rem, 2.6vw, 2.25rem);
      background: var(--ochre);
      color: var(--cedar);
    }

    .save-action:hover {
      background: color-mix(in srgb, var(--ochre) 78%, var(--paper));
    }

    .saved-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .saved-entry {
      display: grid;
      grid-template-columns: minmax(0, 11.5rem) minmax(0, 1fr) auto;
      align-items: center;
      gap: clamp(1rem, 2.5vw, 2rem);
      padding: .875rem 1.375rem .875rem .875rem;
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: color-mix(in srgb, var(--lichen) 16%, var(--paper));
    }

    .trail-thumb {
      aspect-ratio: 18 / 11;
      border-radius: 2px;
    }

    .saved-entry .trail-name { font-size: clamp(2rem, 3vw, 2.875rem); }
    .saved-entry .trail-distance { margin-block-start: .375rem; color: var(--shale); }

    .remove-action {
      border-color: var(--fern);
      background: transparent;
      color: var(--cedar);
    }

    .remove-action:hover {
      background: color-mix(in srgb, var(--lichen) 42%, var(--paper));
    }

    @media (max-width: 44rem) {
      .masthead {
        grid-template-columns: auto minmax(0, 1fr);
        row-gap: .3rem;
      }

      .masthead-mark {
        grid-row: 1 / span 2;
        align-self: start;
        margin-block-start: .15rem;
      }

      .list-status {
        grid-column: 2;
        margin: 0;
      }

      .recommendation { grid-template-columns: minmax(0, 1fr); }

      .trail-plate {
        min-block-size: 0;
        aspect-ratio: 18 / 11;
      }

      .trail-sign {
        padding: 1.375rem 1.5rem 1.5rem;
        border-inline-start: 0;
        border-block-start: 1px solid color-mix(in srgb, var(--lichen) 28%, var(--cedar));
      }
    }

    @media (max-width: 32rem) {
      .saved-entry {
        grid-template-columns: minmax(0, 6rem) minmax(0, 1fr);
        gap: .875rem;
        padding: .875rem;
      }

      .remove-action { grid-column: 1 / -1; }
    }

    @media (prefers-reduced-motion: no-preference) {
      #saved-view:not([hidden]) .saved-entry {
        animation: settle 240ms ease-out;
      }

      @keyframes settle {
        from { transform: translateY(7px); }
        to { transform: translateY(0); }
      }
    }
  </style>
</head>

  <main>
    <header class="masthead">
      <div class="masthead-mark" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24" focusable="false">
          <use href="#bookmark"/>
          <path d="m7.9 12.6 2.8-3.2 2.2 2.2 3.1-3.4"/>
        </svg>
      </div>
      <h1>Saved trails</h1>
      <p class="list-status" id="list-status" role="status" aria-atomic="true">No trails saved yet</p>
    </header>

    <section class="recommendation" id="nearby-view" aria-labelledby="nearby-label">
      <div class="artwork trail-plate" aria-hidden="true">
        <svg viewBox="0 0 720 440" preserveAspectRatio="xMidYMid slice" focusable="false">
          <use href="#cedar-bend-art" width="720" height="440"/>
        </svg>
      </div>

      <div class="trail-sign">
        <p class="trail-context" id="nearby-label">Nearby trail</p>
        <h2 class="trail-name" id="nearby-name" tabindex="-1">Cedar Bend</h2>
        <p class="trail-distance">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <use href="#distance-mark"/>
          </svg>
          <span>2.4 miles</span>
        </p>

        <button class="action save-action" id="save-trail" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <use href="#bookmark"/>
          </svg>
          Save trail
        </button>
      </div>
    </section>

    <section id="saved-view" aria-label="Saved trail list" hidden>
      <ul class="saved-list" role="list">
        <li class="saved-entry">
          <div class="artwork trail-thumb" aria-hidden="true">
            <svg viewBox="0 0 720 440" preserveAspectRatio="xMidYMid slice" focusable="false">
              <use href="#cedar-bend-art" width="720" height="440"/>
            </svg>
          </div>

          <div>
            <h2 class="trail-name" id="saved-name" tabindex="-1">Cedar Bend</h2>
            <p class="trail-distance">2.4 miles</p>
          </div>

          <button class="action remove-action" id="remove-trail" type="button">
            Remove trail
          </button>
        </li>
      </ul>
    </section>
  </main>

  <script>
    const nearbyView = document.getElementById("nearby-view");
    const savedView = document.getElementById("saved-view");
    const listStatus = document.getElementById("list-status");
    const nearbyName = document.getElementById("nearby-name");
    const savedName = document.getElementById("saved-name");

    // The saved list starts empty on each page load.
    function updateSavedTrails(isSaved) {
      nearbyView.hidden = isSaved;
      savedView.hidden = !isSaved;
      listStatus.textContent = isSaved ? "1 saved trail" : "No trails saved yet";

      const visibleTrailName = isSaved ? savedName : nearbyName;
      visibleTrailName.focus();
    }

    document.getElementById("save-trail").addEventListener("click", () => {
      updateSavedTrails(true);
    });

    document.getElementById("remove-trail").addEventListener("click", () => {
      updateSavedTrails(false);
    });
  </script>
</body>
</html>
