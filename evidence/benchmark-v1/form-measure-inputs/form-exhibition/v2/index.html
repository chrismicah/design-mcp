<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; form-action 'none'; base-uri 'none'">
  <title>Group visit request</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #efe9dc;
      --ivory: #fbf8f0;
      --ink: #1d2a2e;
      --gallery: #233d37;
      --patina: #a8baae;
      --brass: #d4a460;
      --muted: #4d5c54;
      --rule: #b9bbad;
      --edge: #788479;
      --selected: #e1e8dd;
      --display: "Newsreader", Georgia, serif;
      --body: "Source Sans 3", "Trebuchet MS", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 1.0625rem/1.4 var(--body);
    }

    h1, h2, p, figure, dl, dd { margin: 0; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }

    :where(button, input, label.choice):focus-visible,
    .choice:has(input:focus-visible) {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px var(--paper);
    }

    .shell {
      width: min(75rem, calc(100% - 2.75rem));
      margin-inline: auto;
    }

    .masthead {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding-block: 1.4rem;
      border-bottom: 1px solid var(--rule);
      color: var(--gallery);
    }

    .masthead svg { flex: none; }

    .masthead span {
      padding-top: .2rem;
      font: 500 1.625rem/1 var(--display);
      letter-spacing: -.025em;
    }

    .layout {
      display: grid;
      grid-template:
        "intro art" auto
        "work art" 1fr / minmax(0, 1.35fr) minmax(0, 1fr);
      align-items: start;
      column-gap: clamp(2.5rem, 5.75vw, 5.5rem);
      row-gap: 1.65rem;
      padding-block: clamp(2.5rem, 3.6vw, 3.5rem) 3.5rem;
    }

    .intro { grid-area: intro; }

    h1, h2 {
      font-family: var(--display);
      font-weight: 500;
      letter-spacing: -.042em;
    }

    h1 {
      font-size: clamp(3rem, 5.15vw, 4.75rem);
      line-height: 1;
    }

    .intro p {
      margin-top: .4rem;
      color: var(--muted);
      font: italic 500 1.35rem/1.3 var(--display);
    }

    .gallery {
      grid-area: art;
      position: relative;
      overflow: hidden;
      aspect-ratio: 4 / 5;
      background: var(--gallery);
    }

    .gallery > svg {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .work {
      grid-area: work;
      border-top: 1px solid var(--rule);
      padding-top: 1.4rem;
    }

    .request-form { display: grid; gap: 1.5rem; }

    .contact-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .field { min-width: 0; }

    .field > label, legend {
      display: block;
      margin-bottom: .45rem;
      padding: 0;
      font-weight: 650;
    }

    .text-input {
      width: 100%;
      min-height: 3.125rem;
      padding: .55rem .75rem;
      border: 1px solid var(--edge);
      border-radius: 2px;
      background: var(--ivory);
    }

    .size-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .75rem;
    }

    .size-range { color: var(--muted); font-size: .975rem; }

    .stepper {
      display: inline-grid;
      grid-template-columns: 2.85rem 4rem 2.85rem;
      min-height: 3.125rem;
      border: 1px solid var(--edge);
      border-radius: 2px;
      background: var(--ivory);
    }

    .stepper button {
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--gallery);
    }

    .stepper button[aria-disabled="true"] {
      color: #727e73;
      background: #edece2;
      cursor: default;
    }

    .stepper input {
      width: 100%;
      min-width: 0;
      padding: 0 .2rem;
      border: 0;
      border-inline: 1px solid var(--edge);
      border-radius: 0;
      appearance: textfield;
      background: transparent;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    .stepper input::-webkit-inner-spin-button,
    .stepper input::-webkit-outer-spin-button {
      margin: 0;
      appearance: none;
    }

    .stepper :focus-visible { position: relative; z-index: 1; }

    fieldset {
      min-inline-size: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .65rem;
    }

    .choice {
      display: flex;
      align-items: center;
      gap: .65rem;
      min-height: 3.25rem;
      padding: .65rem .8rem;
      border: 1px solid var(--edge);
      border-radius: 2px;
      background: var(--ivory);
      font-weight: 600;
      cursor: pointer;
    }

    .choice input {
      flex: none;
      width: 1.125rem;
      height: 1.125rem;
      margin: 0;
      accent-color: var(--gallery);
    }

    .choice input:focus-visible { outline: none; box-shadow: none; }

    .choice:has(input:checked) {
      background: var(--selected);
      border-color: var(--gallery);
      box-shadow: inset 0 0 0 1px var(--gallery);
    }

    .choice:has(input:checked:focus-visible) {
      box-shadow: 0 0 0 3px var(--paper), inset 0 0 0 1px var(--gallery);
    }

    .primary, .secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 1.4rem;
      min-height: 3.25rem;
      padding: .65rem 1.2rem;
      border: 1px solid var(--gallery);
      border-radius: 2px;
      font-weight: 650;
    }

    .primary {
      justify-self: start;
      min-width: 13rem;
      background: var(--gallery);
      color: var(--ivory);
    }

    .secondary { background: transparent; color: var(--gallery); }

    @media (hover: hover) {
      .primary:hover { background: #335348; }
      .stepper button:not([aria-disabled="true"]):hover,
      .choice:not(:has(input:checked)):hover,
      .secondary:hover { background: var(--selected); }
    }

    .confirmation:not([hidden]) { animation: reveal 220ms ease-out both; }

    .confirmation-mark {
      display: grid;
      place-items: center;
      width: 2.75rem;
      height: 2.75rem;
      margin-bottom: 1rem;
      border: 1px solid var(--gallery);
      border-radius: 50%;
      background: var(--selected);
      color: var(--gallery);
    }

    h2 { font-size: clamp(2.3rem, 4vw, 3.5rem); line-height: 1; }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-block: 1.5rem;
      border-block: 1px solid var(--rule);
    }

    .summary > div { padding: 1rem 0 .9rem; }
    .summary > div + div { padding-left: 1rem; border-left: 1px solid var(--rule); }
    .summary dt { color: var(--muted); font-size: .975rem; font-weight: 600; }

    .summary dd {
      margin-top: .35rem;
      font: 500 clamp(1.6rem, 3.4vw, 2.2rem)/1.15 var(--display);
      letter-spacing: -.025em;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 56rem) {
      .shell { width: min(42rem, calc(100% - 2.75rem)); }

      .layout {
        grid-template: "intro" auto "art" auto "work" auto / minmax(0, 1fr);
        gap: 1.2rem;
        padding-block: 1.8rem 2.5rem;
      }

      h1 { font-size: clamp(2.15rem, 10.6vw, 4rem); }
      .gallery { aspect-ratio: 2.95; max-height: 10.5rem; }
      .work { border-top: 0; padding-top: 0; }
    }

    @media (max-width: 35rem) {
      .masthead { padding-block: .95rem; }
      .masthead svg { width: 29px; height: 29px; }
      .masthead span { font-size: 1.45rem; }
      .intro p { font-size: 1.18rem; }
      .contact-fields { grid-template-columns: minmax(0, 1fr); gap: .85rem; }
      .request-form { gap: 1.05rem; }
      .primary { min-width: 0; justify-self: stretch; }
    }

    @media (prefers-reduced-motion: reduce) {
      .confirmation:not([hidden]) { animation: none; }
    }
  </style>
</head>
<body>
  <header class="masthead shell">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
      <rect x="1" y="1" width="32" height="32" rx="1" stroke="currentColor"/>
      <path d="M7 27V16a10 10 0 0 1 20 0v11M11 27V16a6 6 0 0 1 12 0v11M5 27h24"
            stroke="currentColor" stroke-width="1.35"/>
    </svg>
    <span>Museum visits</span>
  </header>

  <main class="layout shell">
    <div class="intro">
      <h1 id="page-title">Group visit request</h1>
      <p id="local-note">Your details stay on this page.</p>
    </div>

    <figure class="gallery" aria-hidden="true">
      <svg viewBox="0 0 480 600" preserveAspectRatio="xMidYMid slice" focusable="false">
        <defs>
          <linearGradient id="print-ground" x2="1" y2="1">
            <stop stop-color="#314940"/>
            <stop offset="1" stop-color="var(--gallery)"/>
          </linearGradient>
          <linearGradient id="stone" x2="1" y2=".25">
            <stop stop-color="#9dae9d"/>
            <stop offset=".48" stop-color="#6f897c"/>
            <stop offset="1" stop-color="#445f54"/>
          </linearGradient>
          <linearGradient id="wall" x2=".85" y2="1">
            <stop stop-color="#1a332e"/>
            <stop offset="1" stop-color="#517166"/>
          </linearGradient>
          <linearGradient id="bronze" x2=".85" y2="1">
            <stop stop-color="#f2d9a1"/>
            <stop offset=".5" stop-color="var(--brass)"/>
            <stop offset="1" stop-color="#9c703d"/>
          </linearGradient>
          <linearGradient id="plinth" x2="1" y2=".85">
            <stop stop-color="#d1d4ba"/>
            <stop offset="1" stop-color="#9eae98"/>
          </linearGradient>
          <pattern id="grain" width="29" height="23" patternUnits="userSpaceOnUse">
            <path d="M2 4h1m11 7h1m6-9h1M5 19h1m19-3h1M16 22h1"
                  stroke="var(--paper)" stroke-width=".7" opacity=".32"/>
            <path d="M7 8h1m14 1h1M3 13h1m9 4h1m12 5h1"
                  stroke="var(--ink)" stroke-width=".7" opacity=".26"/>
          </pattern>
          <clipPath id="gallery-opening">
            <path d="M109 518V249a131 131 0 0 1 262 0v269Z"/>
          </clipPath>
          <path id="gallery-sculpture" fill-rule="evenodd"
                d="M241 225a72 72 0 1 1 0 144 72 72 0 1 1 0-144Zm0 26a46 46 0 1 0 0 92 46 46 0 1 0 0-92Z"/>
        </defs>

        <rect width="480" height="600" fill="url(#print-ground)"/>
        <rect x="20" y="20" width="440" height="560" fill="none"
              stroke="var(--patina)" opacity=".47"/>
        <path d="M20 39V20h19m402 0h19v19M20 561v19h19m402 0h19v-19"
              fill="none" stroke="var(--patina)"/>

        <path d="M59 528V243a181 181 0 0 1 362 0v285Z" fill="url(#stone)"/>
        <path d="M59 528V243a181 181 0 0 1 362 0v285"
              fill="none" stroke="var(--patina)" opacity=".7"/>
        <path d="M75 528V244a165 165 0 0 1 330 0v284M91 528V247a149 149 0 0 1 298 0v281"
              fill="none" stroke="var(--paper)" opacity=".43"/>

        <g clip-path="url(#gallery-opening)">
          <rect x="109" y="118" width="262" height="400" fill="url(#wall)"/>
          <path d="M109 249a131 131 0 0 1 216-100c-21-10-41-14-65-14-65 0-115 51-115 118v187l-36 78Z"
                fill="#1a342e"/>
          <path d="M146 428V253a114 114 0 0 1 224-30" fill="none"
                stroke="var(--patina)" opacity=".32"/>
          <path d="M332 151h50L269 431h-73Z" fill="var(--patina)" opacity=".25"/>
          <path d="M109 431h262v87H109Z" fill="#70897b"/>
          <path d="M196 431h73l73 87H115Z" fill="var(--patina)" opacity=".3"/>
          <path d="M109 431h262m-262 43h262m-262 24h262M167 431l-66 87m130-87-15 87m75-87 32 87"
                fill="none" stroke="var(--paper)" opacity=".22"/>

          <path d="M184 473h91l91 35h-86Z" fill="#233c34" opacity=".34"/>
          <path d="M184 391l34-23h92l-35 23Z" fill="#c2cbb1"/>
          <path d="M275 391l35-23v82l-35 23Z" fill="#648073"/>
          <path d="M184 391h91v82h-91Z" fill="url(#plinth)"/>
          <path d="M184 391h91" stroke="#dce1c7" opacity=".8"/>
          <ellipse cx="246" cy="373" rx="26" ry="3.8" fill="#3d594b" opacity=".42"/>

          <use href="#gallery-sculpture" transform="translate(10 4)" fill="#7d5c3e"/>
          <use href="#gallery-sculpture" fill="url(#bronze)"/>
          <use href="#gallery-sculpture" fill="url(#grain)" opacity=".6"/>
          <path d="M185 263a66 66 0 0 1 101-16"
                fill="none" stroke="#f5e1b3" opacity=".75" stroke-linecap="round"/>
        </g>

        <path d="M109 518V249a131 131 0 0 1 262 0v269"
              fill="none" stroke="#c7d1bd" opacity=".68"/>
        <path d="M59 528h362l13 13H46Z" fill="#a1b09b"/>
        <path d="M46 541h388v9H46Z" fill="#4d685c"/>
        <path d="M46 550h388M59 528h362" stroke="var(--patina)" opacity=".65"/>
        <rect x="21" y="21" width="438" height="558" fill="url(#grain)" opacity=".62"/>
      </svg>
    </figure>

    <div class="work">
      <form id="visit-form" class="request-form" aria-labelledby="page-title" aria-describedby="local-note">
        <div class="contact-fields">
          <div class="field">
            <label for="contact-name">Contact name</label>
            <input class="text-input" id="contact-name" name="contactName"
                   autocomplete="name" pattern=".*\S.*" required>
          </div>
          <div class="field">
            <label for="contact-email">Email</label>
            <input class="text-input" id="contact-email" name="email" type="email"
                   autocomplete="email" required>
          </div>
        </div>

        <div class="field">
          <label for="group-size">Group size</label>
          <div class="size-row">
            <div class="stepper">
              <button type="button" id="decrease-size" aria-label="Decrease group size"
                      aria-controls="group-size" aria-disabled="true">
                <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
              </button>
              <input id="group-size" name="groupSize" type="number" inputmode="numeric"
                     min="1" max="25" step="1" value="1" aria-describedby="size-range" required>
              <button type="button" id="increase-size" aria-label="Increase group size"
                      aria-controls="group-size" aria-disabled="false">
                <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M3.5 8h9M8 3.5v9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
            <span class="size-range" id="size-range">1–25 people</span>
            <span class="sr-only" id="size-status" role="status"></span>
          </div>
        </div>

        <fieldset>
          <legend>Visit type</legend>
          <div class="choices">
            <label class="choice">
              <input type="radio" name="visitType" value="Quiet visit" required>
              <span>Quiet visit</span>
            </label>
            <label class="choice">
              <input type="radio" name="visitType" value="Guided visit" required>
              <span>Guided visit</span>
            </label>
          </div>
        </fieldset>

        <button class="primary" type="submit">
          Confirm request
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M3 9h11m-4.5-4.5L14 9l-4.5 4.5"
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>

      <section class="confirmation" id="confirmation" aria-labelledby="confirmation-title" hidden>
        <div class="confirmation-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <path d="m5 11 4 4 8-8" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2 id="confirmation-title" tabindex="-1" aria-describedby="confirmed-size confirmed-type">
          Request confirmed
        </h2>
        <dl class="summary">
          <div>
            <dt>Group size</dt>
            <dd id="confirmed-size"></dd>
          </div>
          <div>
            <dt>Visit type</dt>
            <dd id="confirmed-type"></dd>
          </div>
        </dl>
        <button class="secondary" id="edit-request" type="button">Edit request</button>
      </section>

      <noscript><p>Enable JavaScript to confirm your request on this page.</p></noscript>
    </div>
  </main>

  <script>
    const form = document.getElementById("visit-form");
    const contactName = document.getElementById("contact-name");
    const size = document.getElementById("group-size");
    const decrease = document.getElementById("decrease-size");
    const increase = document.getElementById("increase-size");
    const sizeStatus = document.getElementById("size-status");
    const confirmation = document.getElementById("confirmation");
    const confirmationTitle = document.getElementById("confirmation-title");
    const confirmedSize = document.getElementById("confirmed-size");
    const confirmedType = document.getElementById("confirmed-type");

    function formatGroupSize(count) {
      return `${count} ${count === 1 ? "person" : "people"}`;
    }

    function updateSizeButtons() {
      const count = size.valueAsNumber;
      decrease.setAttribute("aria-disabled", String(count <= Number(size.min)));
      increase.setAttribute("aria-disabled", String(count >= Number(size.max)));
    }

    function changeSize(button, direction) {
      if (button.getAttribute("aria-disabled") === "true") return;

      if (!Number.isFinite(size.valueAsNumber)) {
        size.value = size.min;
      } else if (direction > 0) {
        size.stepUp();
      } else {
        size.stepDown();
      }

      updateSizeButtons();
      sizeStatus.textContent = `Group size ${formatGroupSize(size.valueAsNumber)}`;
    }

    decrease.addEventListener("click", () => changeSize(decrease, -1));
    increase.addEventListener("click", () => changeSize(increase, 1));
    size.addEventListener("input", updateSizeButtons);
    window.addEventListener("pageshow", updateSizeButtons);
    updateSizeButtons();

    contactName.addEventListener("input", () => {
      const whitespaceOnly = contactName.value !== "" && contactName.value.trim() === "";
      contactName.setCustomValidity(whitespaceOnly ? "Enter a contact name." : "");
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      confirmedSize.textContent = formatGroupSize(size.valueAsNumber);
      confirmedType.textContent = form.elements.namedItem("visitType").value;
      form.hidden = true;
      confirmation.hidden = false;
      confirmationTitle.focus();
    });

    document.getElementById("edit-request").addEventListener("click", () => {
      confirmation.hidden = true;
      form.hidden = false;
      contactName.focus();
    });
  </script>
</body>
</html>
