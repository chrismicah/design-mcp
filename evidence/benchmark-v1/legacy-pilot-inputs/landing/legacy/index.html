<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Meet Alto Carmo from Cinder Supply, a small-batch coffee roaster. A 250 g bag with notes of cacao and plum.">
  <title>Alto Carmo | Cinder Supply</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baskervville&family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root {
      color-scheme: light;
      --oat: #f5efe3;
      --cacao: #281c20;
      --plum: #512638;
      --damson: #884459;
      --honey: #e8af61;
      --rose: #d7a9a6;
      --muted: color-mix(in srgb, var(--cacao) 72%, var(--oat));
      --rule: color-mix(in srgb, var(--cacao) 25%, var(--oat));
      --wash: color-mix(in srgb, var(--rose) 27%, var(--oat));
      --serif: "Baskervville", Georgia, serif;
      --sans: "Instrument Sans", "Segoe UI", sans-serif;
      --gutter: clamp(1.25rem, 5.55vw, 5rem);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html { scrollbar-gutter: stable; }

    body {
      margin: 0;
      background: var(--oat);
      color: var(--cacao);
      font: 400 1rem/1.45 var(--sans);
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }

    body:has(dialog[open]) { overflow: hidden; }

    button, a { -webkit-tap-highlight-color: transparent; }

    button {
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    :focus-visible {
      outline: 2px solid var(--damson);
      outline-offset: 4px;
    }

    .shell {
      width: min(80rem, calc(100% - var(--gutter) - var(--gutter)));
      margin-inline: auto;
    }

    .skip-link {
      position: absolute;
      z-index: 1;
      inset: .75rem auto auto var(--gutter);
      padding: .75rem 1rem;
      transform: translateY(-200%);
      background: var(--oat);
      color: var(--cacao);
    }

    .skip-link:focus { transform: none; }

    .masthead {
      min-height: 4.875rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid var(--rule);
    }

    .wordmark {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      color: var(--plum);
      font-size: 1.43rem;
      font-weight: 700;
      letter-spacing: -.055em;
      text-decoration: none;
    }

    .wordmark svg { flex: none; }

    .bag-trigger {
      min-height: 44px;
      padding: .375rem .65rem .375rem .75rem;
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      border: 1px solid var(--rule);
      border-radius: 2px;
      background: transparent;
      font-size: .9375rem;
      font-weight: 600;
    }

    .bag-trigger:hover, .icon-button:hover { background: var(--wash); }

    .bag-count {
      min-width: 1.5rem;
      padding: .12rem .34rem;
      background: var(--wash);
      color: var(--plum);
      text-align: center;
    }

    main.shell { padding-block: 1.875rem 3rem; }

    .product {
      display: grid;
      grid-template-columns: minmax(0, 1.62fr) minmax(0, 1fr);
      align-items: center;
      gap: clamp(2rem, 5.3vw, 4.75rem);
    }

    .artwork {
      margin: 0;
      overflow: hidden;
      isolation: isolate;
      background: var(--plum);
    }

    .artwork > svg {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 19 / 16;
    }

    .pack-display { font-family: var(--serif); }
    .pack-type { font-family: var(--sans); }

    .product-info { min-width: 0; }

    .category {
      margin: 0 0 .9rem;
      color: var(--plum);
      font-size: .9375rem;
      font-weight: 600;
    }

    h1 {
      margin: 0;
      font: 400 clamp(4.5rem, 7.9vw, 7.25rem)/.88 var(--serif);
      letter-spacing: -.057em;
    }

    h1 span { display: block; }

    .roast-details {
      display: grid;
      grid-template-columns: 1.13fr 1fr;
      margin: 1.875rem 0 0;
      padding-block: .95rem;
      border-block: 1px solid var(--rule);
    }

    .roast-details > div + div {
      padding-inline-start: clamp(.8rem, 1.6vw, 1.45rem);
      border-inline-start: 1px solid var(--rule);
    }

    .roast-details dt {
      color: var(--muted);
      font-size: .875rem;
    }

    .roast-details dd {
      margin: .17rem 0 0;
      font-size: clamp(1rem, 1.4vw, 1.25rem);
      font-weight: 600;
      letter-spacing: -.025em;
    }

    .offer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-block: 1.05rem .8rem;
    }

    .portion {
      margin: 0;
      font-weight: 600;
    }

    .portion > span {
      margin-inline-start: .65rem;
      padding-inline-start: .65rem;
      border-inline-start: 1px solid var(--rule);
      color: var(--muted);
      font-size: .9375rem;
      font-weight: 400;
      white-space: nowrap;
    }

    .price {
      font: 400 2.15rem/1.1 var(--serif);
      letter-spacing: -.045em;
    }

    .primary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      width: 100%;
      min-height: 3.5rem;
      padding: .8rem 1.15rem;
      border: 1px solid transparent;
      border-radius: 2px;
      background: var(--plum);
      color: var(--oat);
      font-weight: 600;
    }

    .primary:hover { background: color-mix(in srgb, var(--plum) 68%, var(--cacao)); }
    .primary:active { background: var(--cacao); }

    .bag-dialog {
      position: fixed;
      inset: 0 0 0 auto;
      width: min(100%, 28rem);
      max-width: none;
      height: 100%;
      height: 100dvh;
      max-height: none;
      margin: 0;
      padding: 0;
      overflow: auto;
      border: 0;
      background: var(--oat);
      color: var(--cacao);
      box-shadow: -12px 0 48px #281c2033;
    }

    .bag-dialog::backdrop { background: #281c2099; }

    .bag-dialog[open] {
      animation: show-bag 240ms cubic-bezier(.2, .75, .25, 1) both;
    }

    @keyframes show-bag {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    .drawer {
      display: flex;
      min-height: 100%;
      flex-direction: column;
      padding: clamp(1.25rem, 5vw, 2rem);
    }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--rule);
    }

    .drawer-head h2 {
      margin: 0;
      font: 400 2.65rem/1.08 var(--serif);
      letter-spacing: -.05em;
    }

    .icon-button {
      display: grid;
      width: 44px;
      height: 44px;
      flex: none;
      place-items: center;
      padding: 0;
      border: 1px solid var(--rule);
      border-radius: 2px;
      background: transparent;
    }

    .bag-notice { margin: 0; }

    .bag-notice:not(:empty) {
      margin-top: 1.1rem;
      padding: .7rem .85rem;
      border-inline-start: 2px solid var(--damson);
      background: var(--wash);
      color: var(--plum);
      font-size: .9375rem;
    }

    .empty-bag {
      margin: 1.35rem 0;
      color: var(--muted);
    }

    .bag-line {
      display: grid;
      grid-template-columns: 4.5rem minmax(0, 1fr) auto;
      gap: .9rem;
      align-items: start;
      padding-block: 1.4rem;
      border-bottom: 1px solid var(--rule);
    }

    .thumbnail {
      display: grid;
      padding: .35rem;
      place-items: center;
      aspect-ratio: 4 / 5;
      background: var(--plum);
    }

    .thumbnail svg { display: block; width: 100%; }

    .bag-line h3 {
      margin: 0;
      font: 400 1.48rem/1.15 var(--serif);
      letter-spacing: -.035em;
    }

    .bag-line p {
      margin: .2rem 0 .65rem;
      color: var(--muted);
      font-size: .875rem;
    }

    .unit-price { font-weight: 600; }

    .stepper {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--rule);
    }

    .stepper button {
      width: 44px;
      min-height: 44px;
      padding: 0;
      border: 0;
      background: transparent;
      font-size: 1.15rem;
    }

    .stepper button:hover:not([aria-disabled="true"]) { background: var(--wash); }
    .stepper button[aria-disabled="true"] { opacity: .45; cursor: default; }

    .stepper output {
      min-width: 1.55rem;
      text-align: center;
      font-size: .9375rem;
    }

    .remove-button {
      display: block;
      min-height: 44px;
      padding: 0 .25rem;
      border: 0;
      background: transparent;
      color: var(--plum);
      font-size: .875rem;
      text-decoration: underline;
      text-underline-offset: .22em;
    }

    .drawer-foot {
      margin-top: auto;
      padding-top: 1.5rem;
    }

    .subtotal {
      display: flex;
      justify-content: space-between;
      gap: .75rem;
      margin: 0 0 1rem;
      font-size: 1.0625rem;
    }

    .return-button { justify-content: center; }

    @media (max-width: 53.75rem) {
      .product { grid-template-columns: 1fr; gap: 1.375rem; }
      .masthead { min-height: 4rem; }
      main.shell { padding-block: 1rem 2rem; }
      .artwork > svg { aspect-ratio: 1.27; }
      .category { margin-bottom: .4rem; }

      h1 {
        font-size: clamp(2.45rem, 14vw, 5.25rem);
        line-height: 1;
      }

      h1 span { display: inline; }
      .roast-details { margin-top: 1.15rem; padding-block: .75rem; }
      .roast-details dd { font-size: 1.0625rem; }
      .offer { padding-block: .8rem .7rem; }
      .price { font-size: 1.9rem; }
      .primary { min-height: 3.25rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bag-dialog[open] { animation: none; }
    }
  </style>
</head>

          <data class="price" id="unit-price" value="19">$19</data>
        </div>

        <button class="primary" id="add-to-bag" type="button" aria-haspopup="dialog" aria-controls="shopping-bag">
          Add to bag
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </section>
    </article>
  </main>

  <dialog class="bag-dialog" id="shopping-bag" aria-labelledby="bag-title">
    <div class="drawer">
      <header class="drawer-head">
        <h2 id="bag-title">Your bag</h2>
        <button class="icon-button" type="button" data-close aria-label="Close bag" autofocus>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18"/>
          </svg>
        </button>
      </header>

      <p class="bag-notice" id="bag-notice" role="status"></p>
      <p class="empty-bag" id="bag-empty">Your bag is empty.</p>

      <div class="bag-line" id="bag-line" hidden>
        <div class="thumbnail" aria-hidden="true">
          <svg viewBox="0 0 350 515">
            <use href="#coffee-pouch" x="6" y="7"/>
          </svg>
        </div>
        <div>
          <h3>Alto Carmo</h3>
          <p>250 g per bag</p>
          <div class="stepper" role="group" aria-label="Alto Carmo quantity">
            <button type="button" id="decrease" aria-label="Decrease quantity" aria-disabled="true">−</button>
            <output id="quantity" aria-label="Quantity">1</output>
            <button type="button" id="increase" aria-label="Increase quantity">+</button>
          </div>
          <button class="remove-button" id="remove" type="button" aria-label="Remove Alto Carmo">Remove</button>
        </div>
        <span class="unit-price">$19</span>
      </div>

      <footer class="drawer-foot">
        <p class="subtotal" id="subtotal-row" hidden>
          <span>Subtotal</span>
          <strong id="subtotal">$19</strong>
        </p>
        <button class="primary return-button" id="return-to-coffee" type="button" data-close>Back to Alto Carmo</button>
      </footer>
    </div>
  </dialog>

  <script>
    const bag = document.getElementById("shopping-bag");
    const bagButton = document.getElementById("open-bag");
    const addButton = document.getElementById("add-to-bag");
    const count = document.getElementById("bag-count");
    const notice = document.getElementById("bag-notice");
    const empty = document.getElementById("bag-empty");
    const line = document.getElementById("bag-line");
    const quantityOutput = document.getElementById("quantity");
    const decrease = document.getElementById("decrease");
    const increase = document.getElementById("increase");
    const subtotalRow = document.getElementById("subtotal-row");
    const subtotal = document.getElementById("subtotal");
    const returnButton = document.getElementById("return-to-coffee");
    const price = Number(document.getElementById("unit-price").value);
    const maxQuantity = Math.floor(Number.MAX_SAFE_INTEGER / price);
    const storageKey = "cinder-supply.alto-carmo.quantity";
    const numberFormat = new Intl.NumberFormat("en-US");

    let quantity = 0;
    let opener;

    // The bag persists for the current tab session when browser storage is available.
    try {
      const saved = Number(sessionStorage.getItem(storageKey));
      if (Number.isSafeInteger(saved) && saved >= 0 && saved <= maxQuantity) {
        quantity = saved;
      }
    } catch {
      // The page can also hold the bag in memory.
    }

    function renderBag() {
      const hasCoffee = quantity > 0;
      count.textContent = quantity;
      bagButton.setAttribute("aria-label", `Bag, ${quantity} ${quantity === 1 ? "item" : "items"}`);
      empty.hidden = hasCoffee;
      line.hidden = !hasCoffee;
      subtotalRow.hidden = !hasCoffee;
      quantityOutput.value = quantity;
      decrease.setAttribute("aria-disabled", String(quantity <= 1));
      increase.setAttribute("aria-disabled", String(quantity >= maxQuantity));
      subtotal.textContent = `$${numberFormat.format(price * quantity)}`;
    }

    function setQuantity(nextQuantity) {
      quantity = nextQuantity;
      try {
        sessionStorage.setItem(storageKey, String(quantity));
      } catch {
        // The in-memory quantity is already current.
      }
      renderBag();
    }

    function openBag(trigger, message = "") {
      opener = trigger;
      notice.textContent = "";
      bag.showModal();
      notice.textContent = message;
    }

    bagButton.addEventListener("click", () => openBag(bagButton));

    addButton.addEventListener("click", () => {
      if (quantity >= maxQuantity) {
        openBag(addButton);
        return;
      }
      setQuantity(quantity + 1);
      openBag(addButton, "Alto Carmo added to your bag.");
    });

    decrease.addEventListener("click", () => {
      if (quantity <= 1) return;
      notice.textContent = "";
      setQuantity(quantity - 1);
    });

    increase.addEventListener("click", () => {
      if (quantity >= maxQuantity) return;
      notice.textContent = "";
      setQuantity(quantity + 1);
    });

    document.getElementById("remove").addEventListener("click", () => {
      setQuantity(0);
      notice.textContent = "Alto Carmo removed from your bag.";
      returnButton.focus();
    });

    bag.querySelectorAll("[data-close]").forEach((button) => {
      button.addEventListener("click", () => bag.close());
    });

    bag.addEventListener("click", (event) => {
      if (event.target === bag) bag.close();
    });

    bag.addEventListener("close", () => {
      opener?.focus({ preventScroll: true });
    });

    renderBag();
  </script>
</body>
</html>
