<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf2f2">
  <title>Linehaul | Load board</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --harbor: #15323b;
      --mist: #edf2f2;
      --paper: #fbfcfa;
      --teal: #165d63;
      --rust: #8d411b;
      --sand: #f6cfa7;
      --muted: color-mix(in srgb, var(--harbor) 75%, var(--paper));
      --rule: color-mix(in srgb, var(--harbor) 19%, var(--paper));
      --late-wash: color-mix(in srgb, var(--sand) 26%, var(--paper));
      --body-type: "Instrument Sans", sans-serif;
      --display-type: "Barlow Condensed", sans-serif;
      --gutter: clamp(16px, 5vw, 76px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--mist);
      color: var(--harbor);
      font: 400 1rem/1.45 var(--body-type);
    }

    button {
      color: inherit;
      font: inherit;
    }

    button:focus-visible,
    h2:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 3px;
    }

    .shell {
      width: min(1216px, calc(100% - var(--gutter) - var(--gutter)));
      margin-inline: auto;
    }

    .masthead {
      background: var(--paper);
      border-bottom: 1px solid var(--rule);
    }

    .masthead-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 64px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font: 700 1.75rem/1 var(--display-type);
      letter-spacing: -.015em;
    }

    .brand-mark {
      flex: none;
      color: var(--teal);
    }

    .shift {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0;
      color: var(--muted);
      font-size: .875rem;
      font-weight: 600;
    }

    .shift svg {
      flex: none;
      color: var(--teal);
    }

    main {
      padding-block: 29px 40px;
    }

    h1 {
      margin: 0 0 18px;
      font: 600 clamp(2.75rem, 4.25vw, 3.75rem)/1 var(--display-type);
      letter-spacing: -.018em;
    }

    .priority {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border-inline-start: 4px solid var(--sand);
      border-radius: 5px;
      background: var(--harbor);
      color: var(--paper);
    }

    .priority-copy {
      position: relative;
      z-index: 1;
      width: fit-content;
      padding: 25px 34px 28px;
    }

    .priority-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 4px;
      color: var(--sand);
      font-size: .9375rem;
      font-weight: 600;
    }

    .priority h2 {
      margin: 0 0 10px;
      font: 600 clamp(4rem, 6vw, 5.4rem)/.9 var(--display-type);
      letter-spacing: .006em;
      font-variant-numeric: tabular-nums;
    }

    .priority-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 13px;
      margin: 0;
      font-size: 1.0625rem;
    }

    .priority-meta strong {
      font-weight: 700;
    }

    .priority-bay {
      padding-inline-start: 13px;
      border-inline-start: 1px solid #80969b;
      color: #dce9e9;
    }

    .focus-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 136px;
      min-height: 44px;
      margin-top: 20px;
      padding: 7px 14px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: var(--sand);
      color: var(--harbor);
      font-size: .9375rem;
      font-weight: 700;
      cursor: pointer;
    }

    .focus-action:hover {
      background: color-mix(in srgb, var(--sand) 75%, var(--paper));
    }

    .focus-action:focus-visible {
      outline-color: var(--paper);
    }

    .dock-art {
      position: absolute;
      inset: 0 0 0 auto;
      width: min(67%, 800px);
      overflow: hidden;
      pointer-events: none;
    }

    .dock-art svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .queue {
      margin-top: 26px;
    }

    .queue-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-bottom: 11px;
    }

    .queue-toolbar h2 {
      margin: 0;
      font: 600 2rem/1 var(--display-type);
    }

    .filters {
      display: inline-flex;
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--rule);
      border-radius: 5px;
      background: var(--paper);
    }

    .filters button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 36px;
      padding: 4px 10px;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: var(--muted);
      font-size: .875rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .filters button:hover {
      background: var(--mist);
      color: var(--harbor);
    }

    .filters button[aria-pressed="true"] {
      background: var(--teal);
      color: var(--paper);
    }

    .filter-count {
      display: inline-grid;
      min-width: 19px;
      min-height: 19px;
      place-items: center;
      padding-inline: 3px;
      border-radius: 2px;
      background: color-mix(in srgb, currentColor 12%, transparent);
      font-size: .75rem;
      font-variant-numeric: tabular-nums;
    }

    .table-frame {
      overflow: hidden;
      border: 1px solid var(--rule);
      border-radius: 5px;
      background: var(--paper);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      text-align: start;
    }

    .load-column { width: 38%; }
    .bay-column { width: 24%; }

    th, td {
      padding-inline: 19px;
      text-align: start;
    }

    thead th {
      padding-block: 10px;
      border-bottom: 1px solid var(--rule);
      background: color-mix(in srgb, var(--mist) 63%, var(--paper));
      color: var(--muted);
      font-size: .8125rem;
      font-weight: 700;
    }

    tbody th, tbody td {
      height: 50px;
      padding-block: 8px;
      font-size: .9375rem;
    }

    tbody tr + tr > * {
      border-top: 1px solid var(--rule);
    }

    .load-id {
      font-size: 1.0625rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .late-row {
      background: var(--late-wash);
    }

    .late-row th {
      box-shadow: inset 3px 0 var(--rust);
    }

    .timing {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .timing svg {
      flex: none;
    }

    .timing-late { color: var(--rust); }
    .timing-due { color: var(--teal); }

    .unavailable {
      color: var(--muted);
      font-weight: 400;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      :root {
        --gutter: 16px;
      }

      .masthead-inner {
        min-height: 56px;
      }

      .brand {
        font-size: 1.625rem;
      }

      .brand-mark {
        width: 30px;
        height: 30px;
      }

      main {
        padding-block: 21px 30px;
      }

      h1 {
        margin-bottom: 13px;
        font-size: 2.6875rem;
      }

      .priority-copy {
        padding: 18px 16px 20px;
      }

      .priority h2 {
        margin-bottom: 8px;
        font-size: 3.875rem;
      }

      .priority-meta {
        gap: 9px;
        font-size: .9375rem;
      }

      .priority-bay {
        padding-inline-start: 9px;
      }

      .focus-action {
        margin-top: 16px;
      }

      .dock-art {
        width: 56%;
        mask-image: linear-gradient(to right, transparent, black 42%);
      }

      .dock-art svg {
        position: absolute;
        top: 50%;
        right: 0;
        width: 326px;
        height: auto;
        transform: translateY(-50%);
      }

      .queue {
        margin-top: 20px;
      }

      .queue-toolbar h2 {
        font-size: 1.6875rem;
      }

      .filters button {
        min-height: 37px;
        padding-inline: 8px;
        font-size: .8125rem;
      }

      .load-column { width: 37%; }
      .bay-column { width: 21%; }

      th, td {
        padding-inline: 11px;
      }

      tbody th, tbody td {
        height: 47px;
        font-size: .875rem;
      }

      .load-id {
        font-size: 1rem;
      }

      .timing {
        gap: 5px;
      }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="shell masthead-inner">
      <div class="brand">
        <svg class="brand-mark" width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
          <rect width="34" height="34" rx="5" fill="currentColor"/>
          <path d="M8 23h6l9-12h3M8 16h5l4-5m2 12h7" stroke="#fbfcfa" stroke-width="2" stroke-linecap="square"/>
        </svg>
        <span>Linehaul</span>
      </div>
      <p class="shift">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M3 14.5h14m-11.2 0a4.2 4.2 0 0 1 8.4 0M10 3.5v2.2M4 7.2l1.5 1.5m9 0L16 7.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Morning shift
      </p>
    </div>
  </header>

  <main class="shell">
    <h1>Load board</h1>

    <section class="priority" aria-labelledby="priority-load">
      <div class="priority-copy">
        <p class="priority-label">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 6.2v4.1m0 3.2h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          Delayed load
        </p>
        <h2 id="priority-load">LS-057</h2>
        <p class="priority-meta">
          <strong>19 minutes late</strong>
          <span class="priority-bay">Bay 4</span>
        </p>
        <button class="focus-action" id="focus-action" type="button" aria-controls="shift-loads" aria-label="Focus load LS-057">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="10" cy="10" r="2.4" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span id="focus-label">Focus load</span>
        </button>
      </div>

      <div class="dock-art" aria-hidden="true">
        <svg viewBox="0 0 740 252" fill="none" preserveAspectRatio="xMaxYMid slice">
          <defs>
            <pattern id="yard-grid" width="21" height="21" patternUnits="userSpaceOnUse">
              <path d="M21 0H0V21" stroke="#8eb1b3" stroke-opacity=".25"/>
            </pattern>
            <pattern id="dock-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
              <path d="M0 0v8" stroke="#8eb1b3" stroke-opacity=".23" stroke-width="2"/>
            </pattern>
            <linearGradient id="yard-gradient">
              <stop stop-color="#000"/>
              <stop offset=".58" stop-color="#fff"/>
            </linearGradient>
            <mask id="yard-fade" maskUnits="userSpaceOnUse" x="0" y="0" width="740" height="252">
              <rect width="740" height="252" fill="url(#yard-gradient)"/>
            </mask>
          </defs>

          <rect width="740" height="252" fill="url(#yard-grid)" mask="url(#yard-fade)"/>
          <g stroke="#87a9aa" stroke-opacity=".53">
            <path d="M118 67h510M118 185h510" stroke-dasharray="8 7"/>
            <path d="M164 126h457" stroke-dasharray="3 8"/>
            <path d="M180 59v8m0 118v8M264 59v8m0 118v8M348 59v8m0 118v8M432 59v8m0 118v8M516 59v8m0 118v8"/>
            <path d="M187 126h14m-7-7v14M229 126h14m-7-7v14"/>
          </g>

          <path d="M629 0h111v252H629v-67h-19V67h19Z" fill="#26464f" stroke="#62868a"/>
          <path d="M639 0v65m0 122v65M647 22h93m-93 208h93" stroke="#62868a" stroke-opacity=".69"/>
          <path d="M641 74h99v104h-99z" fill="url(#dock-hatch)"/>
          <path d="M613 83h11v86h-11z" fill="#1d3942" stroke="#66888a"/>
          <path d="M613 92v68" stroke="#f6cfa7" stroke-width="2"/>
          <path d="M426 76h174v12m-174 88h174v-12" stroke="#f6cfa7" stroke-opacity=".76" stroke-width="1.5"/>
          <path d="M619 67h10m-10 118h10" stroke="#f6cfa7" stroke-width="2"/>

          <g fill="#102831" stroke="#66888a">
            <rect x="284" y="91" width="24" height="10" rx="2"/>
            <rect x="284" y="151" width="24" height="10" rx="2"/>
            <rect x="519" y="84" width="22" height="11" rx="2"/>
            <rect x="547" y="84" width="22" height="11" rx="2"/>
            <rect x="519" y="157" width="22" height="11" rx="2"/>
            <rect x="547" y="157" width="22" height="11" rx="2"/>
          </g>

          <path d="M343 123h-15v6h15" stroke="#8eb1b3" stroke-width="2"/>
          <path d="M330 98h-32c-10 0-18 4-23 11l-8 11v12l8 11c5 7 13 11 23 11h32Z" fill="#31535b" stroke="#9ab6b6" stroke-width="1.5"/>
          <path d="M290 104h13l-5 10v24l5 10h-13l-12-14v-16Z" fill="#16343d" stroke="#799a9d"/>
          <path d="M309 107h13v38h-13zM266 124h-7m7 4h-7m49-31v-5m0 63v5" stroke="#799a9d"/>
          <rect x="342" y="89" width="250" height="74" rx="4" fill="#31535b" stroke="#9ab6b6" stroke-width="1.5"/>
          <rect x="349" y="96" width="236" height="60" rx="2" fill="#26464f" stroke="#688e92"/>
          <path d="M365 97v58m16-58v58m16-58v58m16-58v58m16-58v58m16-58v58m16-58v58m16-58v58m16-58v58m16-58v58m16-58v58m16-58v58m16-58v58" stroke="#799a9d" stroke-opacity=".45"/>
          <path d="M583 96v60m9-62v10m0 44v10" stroke="#f6cfa7" stroke-opacity=".8"/>

          <rect x="650" y="91" width="69" height="70" rx="3" fill="#1b373f" stroke="#cda984"/>
          <path d="M690 106l-23 30h31m-8-30v40" stroke="#f6cfa7" stroke-width="3.6" stroke-linecap="square" stroke-linejoin="round"/>
          <path d="M650 82v-5h9m60 5v-5h-9m-60 93v5h9m60-5v5h-9" stroke="#8aacae"/>
        </svg>
      </div>
    </section>

    <section class="queue" id="shift-loads" aria-labelledby="queue-heading">
      <div class="queue-toolbar">
        <h2 id="queue-heading" tabindex="-1">Shift loads</h2>
        <div class="filters" role="group" aria-label="Filter loads">
          <button id="all-loads" type="button" aria-pressed="true" aria-controls="load-rows">
            All loads <span class="filter-count">5</span>
          </button>
          <button id="delayed-loads" type="button" aria-pressed="false" aria-controls="load-rows">
            Delayed <span class="filter-count">1</span>
          </button>
        </div>
      </div>

      <div class="table-frame">
        <table aria-labelledby="queue-heading">
          <colgroup>
            <col class="load-column">
            <col class="bay-column">
            <col>
          </colgroup>
          <thead>
            <tr>
              <th scope="col">Load</th>
              <th scope="col">Bay</th>
              <th scope="col">Timing</th>
            </tr>
          </thead>
          <tbody id="load-rows">
            <tr class="late-row">
              <th class="load-id" scope="row">LS-057</th>
              <td>Bay 4</td>
              <td>
                <span class="timing timing-late">
                  <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M10 6.2v4.1m0 3.2h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                  </svg>
                  19 min late
                </span>
              </td>
            </tr>
            <tr>
              <th class="load-id" scope="row">LS-061</th>
              <td class="unavailable"><span aria-hidden="true">—</span><span class="visually-hidden">Unavailable</span></td>
              <td>
                <span class="timing timing-due">
                  <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M10 5.9v4.2l2.7 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  Due in 9 min
                </span>
              </td>
            </tr>
            <!-- The three remaining loads have unavailable identifiers, bays, and timing. -->
            <tr>
              <th class="unavailable" scope="row">ID unavailable</th>
              <td class="unavailable"><span aria-hidden="true">—</span><span class="visually-hidden">Unavailable</span></td>
              <td class="unavailable"><span aria-hidden="true">—</span><span class="visually-hidden">Unavailable</span></td>
            </tr>
            <tr>
              <th class="unavailable" scope="row">ID unavailable</th>
              <td class="unavailable"><span aria-hidden="true">—</span><span class="visually-hidden">Unavailable</span></td>
              <td class="unavailable"><span aria-hidden="true">—</span><span class="visually-hidden">Unavailable</span></td>
            </tr>
            <tr>
              <th class="unavailable" scope="row">ID unavailable</th>
              <td class="unavailable"><span aria-hidden="true">—</span><span class="visually-hidden">Unavailable</span></td>
              <td class="unavailable"><span aria-hidden="true">—</span><span class="visually-hidden">Unavailable</span></td>
            </tr>
          </tbody>
        </table>
      </div>
      <p class="visually-hidden" id="load-announcement" role="status"></p>
    </section>
  </main>

  <script>
    const focusAction = document.getElementById("focus-action");
    const focusLabel = document.getElementById("focus-label");
    const allLoads = document.getElementById("all-loads");
    const delayedLoads = document.getElementById("delayed-loads");
    const queue = document.getElementById("shift-loads");
    const queueHeading = document.getElementById("queue-heading");
    const otherRows = document.querySelectorAll("#load-rows tr:not(.late-row)");
    const announcement = document.getElementById("load-announcement");
    let delayFocused = false;

    function setDelayFocus(focused) {
      if (focused === delayFocused) return;

      delayFocused = focused;
      for (const row of otherRows) {
        row.hidden = focused;
      }

      allLoads.setAttribute("aria-pressed", String(!focused));
      delayedLoads.setAttribute("aria-pressed", String(focused));
      queueHeading.textContent = focused ? "Focused load" : "Shift loads";
      focusLabel.textContent = focused ? "Exit focus" : "Focus load";
      focusAction.setAttribute("aria-label", focused ? "Exit focus" : "Focus load LS-057");
      announcement.textContent = focused
        ? "Showing LS-057 at Bay 4, 19 minutes late."
        : "Showing all five loads.";
    }

    focusAction.addEventListener("click", () => {
      const enterFocus = !delayFocused;
      setDelayFocus(enterFocus);

      if (enterFocus) {
        queueHeading.focus({ preventScroll: true });
        queue.scrollIntoView({ block: "nearest" });
      }
    });

    allLoads.addEventListener("click", () => setDelayFocus(false));
    delayedLoads.addEventListener("click", () => setDelayFocus(true));
  </script>
</body>
</html>
