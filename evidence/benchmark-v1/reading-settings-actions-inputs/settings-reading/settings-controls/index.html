<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F2F5EB">
  <title>Reading preferences</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&amp;family=Hedvig+Letters+Serif&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --ink: #243C32;
      --juniper: #2C5744;
      --canvas: #F2F5EB;
      --leaf: #E5EEDC;
      --chalk: #FCFDF8;
      --rule: #B9C5B4;
      --serif: "Hedvig Letters Serif", Georgia, serif;
      --sans: "Atkinson Hyperlegible Next", sans-serif;

      background: var(--canvas);
      color: var(--ink);
      font-family: var(--sans);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    .page {
      display: grid;
      align-content: center;
      inline-size: min(69rem, calc(100% - 3rem));
      min-block-size: 100svh;
      margin-inline: auto;
      padding-block: 3rem 7rem;
    }

    h1 {
      margin: 0 0 1.75rem;
      font: 400 clamp(2.25rem, 4.2vw, 3.375rem) / 1.08 var(--serif);
      letter-spacing: -0.045em;
    }

    .folio {
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(20rem, 1fr);
      background: var(--chalk);
      border: 1px solid var(--rule);
      border-radius: 6px;
    }

    .settings {
      padding: 2.875rem clamp(1.5rem, 3.8vw, 3.25rem) 2.25rem;
    }

    fieldset {
      min-inline-size: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    fieldset + fieldset {
      margin-block-start: 1.75rem;
    }

    legend {
      margin-block-end: 0.625rem;
      padding: 0;
      font-size: 1.125rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .choice {
      position: relative;
      min-inline-size: 0;
      cursor: pointer;
    }

    .visually-hidden {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      margin: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .choice-face {
      display: grid;
      grid-template-columns: 2rem minmax(0, 1fr) 0.9375rem;
      align-items: center;
      gap: 0.625rem;
      min-block-size: 4.625rem;
      block-size: 100%;
      padding: 0.625rem 0.875rem;
      border: 1px solid var(--rule);
      border-radius: 4px;
    }

    .choice-name {
      font-weight: 600;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .choice-face::after {
      content: "";
      inline-size: 0.9375rem;
      block-size: 0.9375rem;
      border: 1px solid var(--juniper);
      border-radius: 50%;
    }

    .choice input:checked + .choice-face {
      background: var(--leaf);
      border-color: var(--juniper);
      box-shadow: inset 0 0 0 1px var(--juniper);
    }

    .choice input:checked + .choice-face::after {
      background: radial-gradient(circle, var(--juniper) 0 3.5px, transparent 4px);
    }

    .choice input:focus-visible + .choice-face,
    .reset:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }

    .type-mark {
      color: var(--juniper);
      font: 400 1.25rem / 1 var(--serif);
      letter-spacing: -0.065em;
    }

    .type-mark-large {
      font-size: 1.75rem;
    }

    .spacing-mark {
      display: grid;
      gap: 5px;
      inline-size: 1.5rem;
      color: var(--juniper);
    }

    .spacing-mark-compact {
      gap: 2px;
    }

    .spacing-mark span {
      block-size: 2px;
      border-block-start: 2px solid currentColor;
      border-radius: 1px;
    }

    .spacing-mark span:last-child {
      inline-size: 68%;
    }

    .settings-footer {
      margin-block-start: 1.75rem;
      padding-block-start: 0.875rem;
      border-block-start: 1px solid var(--rule);
    }

    .reset {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-block-size: 2.75rem;
      padding: 0.5rem 0.75rem;
      background: var(--chalk);
      color: var(--juniper);
      border: 1px solid var(--rule);
      border-radius: 4px;
      font: 700 0.9375rem / 1.2 var(--sans);
      text-align: start;
      cursor: pointer;
    }

    .reset svg {
      flex: none;
    }

    @media (hover: hover) {
      .choice:hover .choice-face {
        border-color: var(--juniper);
      }

      .reset:hover {
        background: var(--canvas);
        border-color: var(--juniper);
      }
    }

    .preview {
      --sample-size: 1.875rem;
      --sample-leading: 1.55;

      display: flex;
      min-inline-size: 0;
      flex-direction: column;
      padding: 2.875rem clamp(1.625rem, 3vw, 2.375rem) 1.375rem;
      background: var(--leaf);
      border-inline-start: 1px solid var(--rule);
      border-radius: 0 5px 5px 0;
    }

    .preview[data-text-size="Large"] {
      --sample-size: 2.4375rem;
    }

    .preview[data-line-spacing="Compact"] {
      --sample-leading: 1.16;
    }

    .preview h2 {
      margin: 0;
      padding-block-end: 0.75rem;
      border-block-end: 1px solid var(--rule);
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .sample-area {
      min-block-size: 9.25rem;
      padding-block-start: 1.125rem;
    }

    .sample {
      margin: 0;
      font-family: var(--serif);
      font-size: var(--sample-size);
      line-height: var(--sample-leading);
      letter-spacing: -0.025em;
      overflow-wrap: anywhere;
    }

    .dough-drawing {
      display: block;
      inline-size: min(100%, 20rem);
      block-size: auto;
      margin-block-start: auto;
      margin-inline: auto;
      color: var(--juniper);
    }

    @media (max-width: 65rem) {
      .choice-face {
        grid-template-columns: 1.75rem minmax(0, 1fr) 0.9375rem;
        gap: 0.4375rem;
        padding-inline: 0.625rem;
      }
    }

    @media (max-width: 49rem) {
      .page {
        display: block;
        inline-size: min(38rem, calc(100% - 2rem));
        min-block-size: auto;
        padding-block: 2rem;
      }

      h1 {
        margin-block-end: 1.25rem;
        font-size: clamp(2rem, 9.5vw, 2.625rem);
      }

      .folio {
        grid-template-columns: minmax(0, 1fr);
      }

      .settings {
        padding: 1.25rem 1.0625rem 1rem;
      }

      fieldset + fieldset {
        margin-block-start: 1.25rem;
      }

      .choices {
        gap: 0.625rem;
      }

      .settings-footer {
        margin-block-start: 1.125rem;
        padding-block-start: 0.75rem;
      }

      .preview {
        --sample-size: 1.75rem;

        padding: 1.125rem 1.125rem 0.625rem;
        border-inline-start: 0;
        border-block-start: 1px solid var(--rule);
        border-radius: 0 0 5px 5px;
      }

      .preview[data-text-size="Large"] {
        --sample-size: 2.25rem;
      }

      .sample-area {
        min-block-size: 8rem;
        padding-block-start: 1rem;
      }

      .dough-drawing {
        inline-size: min(100%, 14rem);
        margin-inline-end: 0;
      }
    }

    @media (max-width: 31rem) {
      .choice-face {
        grid-template-columns: minmax(0, 1fr) 0.9375rem;
        grid-template-rows: 1.625rem auto;
        gap: 0.25rem 0.625rem;
        min-block-size: 4.25rem;
        padding: 0.5rem 0.75rem 0.625rem;
      }

      .choice-name {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .choice-face::after {
        grid-column: 2;
        grid-row: 1;
      }
    }

    @media (forced-colors: active) {
      .choice input:checked + .choice-face {
        border-color: Highlight;
      }

      .choice input:checked + .choice-face::after {
        forced-color-adjust: none;
        border-color: Highlight;
        background: radial-gradient(circle, Highlight 0 3.5px, transparent 4px);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Reading preferences</h1>

    <div class="folio">
      <form id="reading-settings" class="settings">
        <fieldset>
          <legend>Text size</legend>
          <div class="choices">
            <label class="choice">
              <input class="visually-hidden" type="radio" name="textSize" value="Standard" checked>
              <span class="choice-face">
                <span class="type-mark" aria-hidden="true">Aa</span>
                <span class="choice-name">Standard</span>
              </span>
            </label>
            <label class="choice">
              <input class="visually-hidden" type="radio" name="textSize" value="Large">
              <span class="choice-face">
                <span class="type-mark type-mark-large" aria-hidden="true">Aa</span>
                <span class="choice-name">Large</span>
              </span>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Line spacing</legend>
          <div class="choices">
            <label class="choice">
              <input class="visually-hidden" type="radio" name="lineSpacing" value="Comfortable" checked>
              <span class="choice-face">
                <span class="spacing-mark" aria-hidden="true"><span></span><span></span><span></span></span>
                <span class="choice-name">Comfortable</span>
              </span>
            </label>
            <label class="choice">
              <input class="visually-hidden" type="radio" name="lineSpacing" value="Compact">
              <span class="choice-face">
                <span class="spacing-mark spacing-mark-compact" aria-hidden="true"><span></span><span></span><span></span></span>
                <span class="choice-name">Compact</span>
              </span>
            </label>
          </div>
        </fieldset>

        <div class="settings-footer">
          <button class="reset" type="reset">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false">
              <path d="M4 9a6.2 6.2 0 1 1 1.35 5.05M4 4.75V9h4.25" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Reset to defaults
          </button>
        </div>
      </form>

      <section class="preview" id="reading-preview" aria-labelledby="preview-title" data-text-size="Standard" data-line-spacing="Comfortable">
        <h2 id="preview-title">Live preview</h2>
        <div class="sample-area">
          <p class="sample" id="reading-sample">Rest dough for <br>20 minutes.</p>
        </div>

        <svg class="dough-drawing" viewBox="0 0 320 156" fill="none" aria-hidden="true" focusable="false">
          <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M32 129c18-4 38-13 57-12 18 1 37 7 62 8 32 1 58-9 86-15 15-3 38 2 50 10l-18 16c-4 4-9 4-16 3l-28-3c-18-2-34 1-53 6l-19 5c-9 2-17 2-26 0l-35-8c-17-4-34-3-55 4Z" fill="var(--canvas)" stroke-width="1.1" stroke-opacity=".64"/>
            <path d="M39 135c24-7 41-6 57-2l21 5m71-5c13-4 27-5 38-4l26 3c6 1 10 0 13-3m-8 4 12-12m-5 13 10-10m-29 8 7-6" stroke-width="1" stroke-opacity=".42"/>
            <ellipse cx="161" cy="137" rx="61" ry="6" fill="currentColor" opacity=".09" stroke="none"/>
            <ellipse cx="161" cy="74" rx="101" ry="25" fill="var(--canvas)" stroke-width="1.45"/>
            <path d="M69 72c12-11 45-18 91-18 44 0 79 7 92 18" stroke-width="1" stroke-opacity=".58"/>
            <path d="M91 78c3-13 13-17 22-26 13-14 23-25 47-26 16-1 30 5 43 12 17 9 24 22 30 40-14 10-40 15-72 15-34 0-58-6-70-15Z" fill="var(--chalk)" stroke-width="1.5"/>
            <path d="M113 64c11-3 21-7 29-15m-8-7c9-5 20-7 31-6m13 8c8 3 14 8 18 14m-16 17c8-8 18-13 30-13m-75 16c5-2 10-3 15-3" stroke-width="1.1" stroke-opacity=".62"/>
            <path d="M60 74c7 15 47 26 101 26 53 0 94-11 101-26-6 38-45 65-101 65-57 0-94-27-101-65Z" fill="var(--canvas)" stroke-width="1.5"/>
            <path d="M65 88c17 13 52 20 96 20 43 0 79-7 96-20" stroke-width="1.15"/>
            <path d="M103 121c15 8 33 12 55 13 25 0 50-5 69-16m-15 10 9-9m2 5 9-10m0 5 8-9" stroke-width="1" stroke-opacity=".56"/>
            <path d="M44 102l5-1m-7 8 2 1m232-18 4 1m-8 8 5 1m4 4 2-1" stroke-width="1" stroke-opacity=".54"/>
          </g>
        </svg>
      </section>
    </div>

    <div class="visually-hidden" id="reading-status" role="status" aria-atomic="true"></div>
  </main>

  <script>
    const settings = document.getElementById("reading-settings");
    const preview = document.getElementById("reading-preview");
    const sample = document.getElementById("reading-sample");
    const status = document.getElementById("reading-status");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    let inkAnimation;

    function updatePreview(message = "") {
      const textSize = settings.elements.textSize.value;
      const lineSpacing = settings.elements.lineSpacing.value;
      const changed = preview.dataset.textSize !== textSize ||
        preview.dataset.lineSpacing !== lineSpacing;

      preview.dataset.textSize = textSize;
      preview.dataset.lineSpacing = lineSpacing;

      if (changed && !reducedMotion.matches) {
        inkAnimation?.cancel();
        inkAnimation = sample.animate(
          [{ opacity: 0.58 }, { opacity: 1 }],
          { duration: 190, easing: "ease-out" }
        );
      }

      if (message) {
        status.textContent = `${message} Text size is ${textSize}. Line spacing is ${lineSpacing}.`;
      }
    }

    settings.addEventListener("change", () => updatePreview("Preview updated."));
    settings.addEventListener("reset", () => {
      requestAnimationFrame(() => updatePreview("Defaults restored."));
    });
    settings.addEventListener("submit", (event) => event.preventDefault());
    window.addEventListener("pageshow", () => updatePreview());

    updatePreview();
  </script>
</body>
</html>
