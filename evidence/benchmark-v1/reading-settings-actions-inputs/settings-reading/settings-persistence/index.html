<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading preferences</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Hedvig+Letters+Serif&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #f2f5eb;
      --ink: #243c32;
      --evergreen: #2c5744;
      --specimen: #e5eedc;
      --sage: #b9c5b4;
      --control-border: #748876;
      --display-font: "Hedvig Letters Serif", Georgia, serif;
      --interface-font: "Atkinson Hyperlegible Next", "Trebuchet MS", sans-serif;
      --gutter: clamp(1.25rem, 5vw, 3rem);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 1rem / 1.5 var(--interface-font);
    }

    .reading-page {
      inline-size: min(66rem, calc(100% - var(--gutter) - var(--gutter)));
      margin-inline: auto;
      padding-block: clamp(2.25rem, 8vw, 7.25rem) 3rem;
    }

    .page-header {
      margin-block-end: clamp(1.5rem, 3vw, 2.75rem);
      padding-block-end: clamp(1.25rem, 2.7vw, 2.25rem);
      border-block-end: 1px solid var(--sage);
    }

    h1 {
      margin: 0;
      font: 400 clamp(2.125rem, 4.3vw, 3.875rem) / 1.08 var(--display-font);
      letter-spacing: -0.038em;
    }

    .preferences {
      display: grid;
      align-items: start;
      gap: clamp(1.75rem, 4vw, 3.5rem);
    }

    fieldset {
      min-inline-size: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    fieldset + fieldset {
      margin-block-start: clamp(1.5rem, 2.2vw, 2rem);
    }

    legend {
      margin-block-end: 0.625rem;
      padding: 0;
      font-size: 1.125rem;
      font-weight: 700;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 9rem), 1fr));
      gap: 0.625rem;
    }

    .choice {
      position: relative;
      display: block;
    }

    .choice input {
      position: absolute;
      z-index: 1;
      inset: 0;
      inline-size: 100%;
      block-size: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .choice-face {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      min-block-size: 3.375rem;
      padding: 0.625rem 0.8125rem;
      border: 1px solid var(--control-border);
      border-radius: 0.375rem;
      font-size: 1.0625rem;
      line-height: 1.25;
    }

    .choice-face::before {
      content: "";
      flex: 0 0 auto;
      inline-size: 1.0625rem;
      block-size: 1.0625rem;
      border: 1px solid var(--control-border);
      border-radius: 50%;
    }

    .choice input:checked + .choice-face {
      border-color: var(--evergreen);
      background: var(--specimen);
      box-shadow: inset 0 0 0 1px var(--evergreen);
      font-weight: 700;
    }

    .choice input:checked + .choice-face::before {
      border-color: var(--evergreen);
      background: radial-gradient(circle, var(--evergreen) 0 3.5px, transparent 4px);
    }

    .choice input:focus-visible + .choice-face,
    .reset:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }

    .reset {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-block-size: 2.75rem;
      margin-block-start: 1.5rem;
      padding: 0.5rem 0.875rem;
      border: 1px solid var(--control-border);
      border-radius: 0.375rem;
      background: transparent;
      color: var(--evergreen);
      font: 700 1rem / 1.25 var(--interface-font);
      cursor: pointer;
    }

    .reset-mark {
      font-size: 1.25rem;
      line-height: 1;
    }

    @media (hover: hover) {
      .choice:hover .choice-face {
        border-color: var(--evergreen);
      }

      .reset:hover {
        border-color: var(--evergreen);
        background: var(--specimen);
      }
    }

    .preview {
      --preview-gutter: clamp(1.25rem, 2.25vw, 1.875rem);
      min-inline-size: 0;
      border: 1px solid var(--sage);
      border-radius: 0.1875rem;
      background: var(--specimen);
      box-shadow: 4px 4px 0 -1px var(--paper), 4px 4px 0 var(--sage);
    }

    .preview-title {
      margin: 0;
      padding: 0.9375rem var(--preview-gutter);
      border-block-end: 1px solid var(--sage);
      color: var(--evergreen);
      font-size: 1rem;
      font-weight: 700;
    }

    .preview-body {
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 0.875rem;
      min-block-size: 14.5rem;
      padding: 1.375rem var(--preview-gutter) 1rem;
    }

    .sample {
      align-self: start;
      max-inline-size: 8.45em;
      margin: 0;
      font: 400 clamp(1.75rem, 2.4vw, 1.9375rem) / 1.62 var(--display-font);
      letter-spacing: -0.025em;
      text-wrap: balance;
    }

    .sample[data-size="large"] {
      font-size: clamp(2.25rem, 3.5vw, 2.625rem);
    }

    .sample[data-spacing="compact"] {
      line-height: 1.17;
    }

    .dough-sketch {
      position: relative;
      justify-self: end;
      inline-size: 6.25rem;
      block-size: 3.25rem;
      color: var(--evergreen);
      opacity: 0.72;
    }

    .dough-sketch::before,
    .dough-sketch::after,
    .dough-sketch span {
      position: absolute;
      content: "";
    }

    .dough-sketch::before {
      inset: 4% 13% 45% 14%;
      border: 1px solid currentColor;
      border-block-end: 0;
      border-radius: 54% 49% 0 0 / 96% 94% 0 0;
      transform: rotate(-4deg);
    }

    .dough-sketch span {
      inset: 22% 31% 60% 36%;
      border-block-start: 1px solid currentColor;
      border-radius: 50%;
      transform: rotate(-12deg);
    }

    .dough-sketch::after {
      inset: 49% 0 5%;
      border: 1px solid currentColor;
      border-radius: 0 0 48% 48% / 0 0 94% 94%;
      background: var(--specimen);
    }

    .visually-hidden {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (min-width: 50rem) {
      .preferences {
        grid-template-columns: minmax(0, 1.5fr) minmax(19.25rem, 1fr);
        column-gap: clamp(2.5rem, 5.1vw, 5.25rem);
      }

      .choice-face {
        min-block-size: 3.875rem;
        padding-inline: 1.125rem;
      }

      .preview-body {
        min-block-size: 15.25rem;
      }
    }

    @media (forced-colors: active) {
      .choice input:checked + .choice-face {
        border-color: Highlight;
      }

      .choice input:checked + .choice-face::before {
        border: 0.3rem solid Highlight;
      }

      .choice input:focus-visible + .choice-face,
      .reset:focus-visible {
        outline-color: Highlight;
      }
    }
  </style>
</head>
<body>
  <main class="reading-page">
    <header class="page-header">
      <h1>Reading preferences</h1>
    </header>

    <div class="preferences">
      <form id="reading-settings" autocomplete="off">
        <fieldset>
          <legend>Text size</legend>
          <div class="choices">
            <label class="choice">
              <input type="radio" name="textSize" value="standard" checked>
              <span class="choice-face">Standard</span>
            </label>
            <label class="choice">
              <input type="radio" name="textSize" value="large">
              <span class="choice-face">Large</span>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Line spacing</legend>
          <div class="choices">
            <label class="choice">
              <input type="radio" name="lineSpacing" value="comfortable" checked>
              <span class="choice-face">Comfortable</span>
            </label>
            <label class="choice">
              <input type="radio" name="lineSpacing" value="compact">
              <span class="choice-face">Compact</span>
            </label>
          </div>
        </fieldset>

        <button class="reset" type="reset">
          <span class="reset-mark" aria-hidden="true">↺</span>
          Reset to defaults
        </button>
      </form>

      <section class="preview" aria-labelledby="preview-title">
        <h2 class="preview-title" id="preview-title">Recipe preview</h2>
        <div class="preview-body">
          <p class="sample" id="recipe-sample">Rest dough for 20 minutes.</p>
          <div class="dough-sketch" aria-hidden="true"><span></span></div>
        </div>
      </section>
    </div>

    <p class="visually-hidden" id="reading-status" role="status"></p>
  </main>

  <script>
    const form = document.getElementById("reading-settings");
    const textSize = form.elements.namedItem("textSize");
    const lineSpacing = form.elements.namedItem("lineSpacing");
    const sample = document.getElementById("recipe-sample");
    const status = document.getElementById("reading-status");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const storageKey = "cooking.reading-preferences";
    const defaults = { size: "standard", spacing: "comfortable" };
    let previewAnimation;

    function readPreferences() {
      try {
        const saved = JSON.parse(window.localStorage.getItem(storageKey));
        return {
          size: saved?.size === "large" ? "large" : defaults.size,
          spacing: saved?.spacing === "compact" ? "compact" : defaults.spacing
        };
      } catch {
        return defaults;
      }
    }

    function renderPreferences({ size, spacing }) {
      textSize.value = size;
      lineSpacing.value = spacing;
      sample.dataset.size = size;
      sample.dataset.spacing = spacing;
    }

    function updatePreferences(preferences, message) {
      renderPreferences(preferences);

      try {
        window.localStorage.setItem(storageKey, JSON.stringify(preferences));
      } catch {
        // The controls and preview still work when local storage is unavailable.
      }

      status.textContent = message;
      previewAnimation?.cancel();

      if (!reducedMotion.matches) {
        previewAnimation = sample.animate(
          [{ opacity: 0.72 }, { opacity: 1 }],
          { duration: 180, easing: "ease-out" }
        );
      }
    }

    renderPreferences(readPreferences());

    form.addEventListener("change", () => {
      const size = textSize.value;
      const spacing = lineSpacing.value;
      const sizeLabel = size === "large" ? "Large" : "Standard";
      updatePreferences({ size, spacing }, `${sizeLabel} text, ${spacing} line spacing.`);
    });

    form.addEventListener("reset", (event) => {
      event.preventDefault();
      updatePreferences(defaults, "Standard text and comfortable line spacing restored.");
    });
  </script>
</body>
</html>
