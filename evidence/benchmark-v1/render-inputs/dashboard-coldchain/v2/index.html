<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Cold-chain monitoring</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Sans+Condensed:wght@600&amp;display=swap">
  <style>
    :root {
      color-scheme: dark;
      --paper: #14181b;
      --ink: #eef0ec;
      --muted: #b0bfc4;
      --line: #344045;
      --ice: #bddce2;
      --alert: #ffaa72;
      --display: "IBM Plex Sans Condensed", "Arial Narrow", "IBM Plex Sans", sans-serif;
      --body: "IBM Plex Sans", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse 760px 350px at 78% 0%, #202a2d, transparent), var(--paper);
      color: var(--ink);
      font: 400 15px/1.45 var(--body);
    }

    h1, h2, p, dl, dd { margin: 0; }

    h1, h2 {
      font-family: var(--display);
      font-weight: 600;
      letter-spacing: -.025em;
      line-height: 1;
    }

    .definitions { position: absolute; }

    .icon {
      display: block;
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none;
    }

    .board {
      width: min(1168px, calc(100% - 64px));
      margin-inline: auto;
      padding-block: 48px 64px;
    }

    .board-header {
      display: flex;
      align-items: center;
      gap: 15px;
      padding-bottom: 23px;
      border-bottom: 1px solid var(--line);
    }

    .board-header h1 { font-size: clamp(36px, 3.6vw, 50px); }

    .snowflake {
      display: grid;
      place-items: center;
      width: 47px;
      height: 47px;
      flex: none;
      border: 1px solid #41575e;
      border-radius: 8px;
      background: #203036;
      color: var(--ice);
    }

    .snowflake .icon { width: 26px; height: 26px; }

    .excursion {
      display: grid;
      grid-template-columns: minmax(0, 4fr) minmax(0, 6fr);
      min-height: 252px;
      margin-top: 24px;
      border: 1px solid #524139;
      border-inline-start: 4px solid var(--alert);
      border-radius: 6px;
      background: linear-gradient(110deg, #2a211e, #222020 52%, #1a262a);
    }

    .excursion-intro {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 36px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--alert);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .eyebrow .icon { width: 19px; height: 19px; }

    .excursion h2 {
      margin-top: 10px;
      font-size: clamp(58px, 5.6vw, 76px);
    }

    .deviation {
      margin-top: 14px;
      color: #dfcebf;
      font-size: 17px;
    }

    .deviation strong {
      margin-right: 4px;
      color: var(--alert);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .gauge {
      display: grid;
      align-items: center;
      padding: 24px clamp(24px, 4.2vw, 62px);
      border-inline-start: 1px solid #433a36;
    }

    .scale {
      /* Position both temperatures on the same linear 0–12°C scale. */
      --limit: 41.6667%;
      --current: 75%;
      --track-bottom: 27px;
      position: relative;
      height: 152px;
    }

    .measurement {
      position: absolute;
      bottom: calc(var(--track-bottom) + 23px);
      left: var(--limit);
      transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
    }

    .measurement.current { left: var(--current); }

    .measurement dt {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .09em;
      line-height: 1.15;
      text-transform: uppercase;
    }

    .measurement dd {
      color: var(--ice);
      font: 600 40px/.92 var(--display);
      letter-spacing: -.035em;
      font-variant-numeric: tabular-nums;
    }

    .measurement.current dd { color: var(--alert); font-size: 80px; }
    .measurement dd span { margin-inline-start: .08em; font-size: .53em; }

    .track {
      position: absolute;
      inset-inline: 0;
      bottom: var(--track-bottom);
      height: 6px;
      border-radius: 3px;
      background: #47555b;
    }

    .track::after {
      position: absolute;
      inset: 13px 0 auto;
      height: 5px;
      border-inline-end: 1px solid #6a7b81;
      background: repeating-linear-gradient(90deg, #6a7b81 0 1px, transparent 1px calc(100% / 12));
      content: "";
    }

    .over-limit {
      position: absolute;
      inset-block: 0;
      left: var(--limit);
      width: calc(var(--current) - var(--limit));
      background: linear-gradient(90deg, #cc805a, var(--alert));
    }

    .limit-mark, .current-mark {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .limit-mark {
      left: var(--limit);
      height: 28px;
      border-inline-start: 1px dashed var(--ice);
    }

    .current-mark {
      left: var(--current);
      width: 15px;
      height: 15px;
      border: 3px solid #242728;
      border-radius: 50%;
      outline: 1px solid var(--alert);
      background: var(--alert);
    }

    .fleet { margin-top: 38px; }

    .fleet-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .fleet h2 { font-size: 36px; }

    .filters {
      display: inline-flex;
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #101518;
    }

    .filter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 12px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      font: 600 14px/1 var(--body);
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 160ms ease-out, color 160ms ease-out;
    }

    .filter:hover { background: #29353a; color: var(--ink); }
    .filter[aria-pressed="true"] { background: #dae9eb; color: #172226; }

    .filter:focus-visible {
      position: relative;
      z-index: 1;
      outline: 2px solid var(--ice);
      outline-offset: 2px;
    }

    .count {
      min-width: 20px;
      padding: 4px 5px;
      border-radius: 3px;
      background: #263238;
      color: #c3d4d8;
      font-size: 11px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .filter[aria-pressed="true"] .count { background: #bed1d5; color: #203036; }

    table {
      width: 100%;
      border-collapse: collapse;
      border-block: 1px solid var(--line);
      table-layout: fixed;
      text-align: left;
    }

    .truck-column { width: 44%; }
    .temperature-column { width: 27%; }
    .status-column { width: 29%; }

    thead { background: #20282c; }

    thead th {
      padding: 11px 22px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    tbody tr {
      border-top: 1px solid var(--line);
      background: #191f22;
    }

    tbody th, tbody td {
      height: 66px;
      padding: 10px 22px;
    }

    tbody th { font-weight: 600; }

    .truck {
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }

    .truck-icon {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: none;
      border: 1px solid #3b484e;
      border-radius: 5px;
      background: #242e33;
      color: #bfced2;
    }

    .temperature {
      font: 600 27px/1 var(--display);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .temperature span { margin-inline-start: .08em; font-size: .65em; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border: 1px solid transparent;
      border-radius: 4px;
      color: #b9ccce;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.2;
      white-space: nowrap;
    }

    .status .icon { width: 15px; height: 15px; color: #91bdb7; }

    tr[data-excursion] { background: #2a221f; }
    tr[data-excursion] th { box-shadow: inset 3px 0 var(--alert); }
    tr[data-excursion] .temperature { color: var(--alert); }
    tr[data-excursion] .truck-icon { border-color: #604638; background: #372921; color: var(--alert); }
    tr[data-excursion] .status { border-color: #644737; background: #3a2b23; color: #ffc298; }
    tr[data-excursion] .status .icon { color: var(--alert); }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      .board {
        width: calc(100% - 36px);
        padding-block: 23px 34px;
      }

      .board-header { gap: 11px; padding-bottom: 17px; }
      .board-header h1 { font-size: clamp(26px, 7.6vw, 34px); }
      .snowflake { width: 36px; height: 36px; border-radius: 6px; }
      .snowflake .icon { width: 21px; height: 21px; }

      .excursion {
        grid-template-columns: minmax(0, 1fr);
        min-height: 0;
        margin-top: 18px;
      }

      .excursion-intro { padding: 19px 19px 17px; }
      .excursion h2 { margin-top: 7px; font-size: 52px; }
      .deviation { margin-top: 9px; font-size: 15px; }

      .gauge {
        padding: 10px 19px 9px;
        border-inline-start: 0;
        border-top: 1px solid #433a36;
      }

      .scale { --track-bottom: 18px; height: 113px; }
      .measurement { bottom: calc(var(--track-bottom) + 20px); }
      .measurement dt { margin-bottom: 4px; font-size: 11px; }
      .measurement dd { font-size: 33px; }
      .measurement.current dd { font-size: 59px; }

      .fleet { margin-top: 26px; }
      .fleet-header { margin-bottom: 11px; }
      .fleet h2 { font-size: 30px; }
      .filter { gap: 6px; padding-inline: 9px; font-size: 13px; }

      .truck-column { width: 35%; }
      .temperature-column { width: 30%; }
      .status-column { width: 35%; }
      thead th { font-size: 10.5px; letter-spacing: .055em; }
      thead th, tbody th, tbody td { padding-inline: 9px; }
      tbody th, tbody td { height: 61px; padding-block: 8px; }

      .truck { gap: 7px; font-size: 14px; }
      .truck-icon { width: 27px; height: 27px; }
      .truck-icon .icon { width: 17px; height: 17px; }
      .temperature { font-size: 25px; }
      .status { gap: 5px; padding-inline: 5px; font-size: 12.5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .filter { transition: none; }
    }
  </style>
</head>
<body>
  <svg class="definitions" width="0" height="0" aria-hidden="true" focusable="false">
    <symbol id="warning-icon" viewBox="0 0 24 24">
      <path d="M10.6 4.9a1.6 1.6 0 0 1 2.8 0l7.3 12.8a1.6 1.6 0 0 1-1.4 2.4H4.7a1.6 1.6 0 0 1-1.4-2.4z"/>
      <path d="M12 9v4.4m0 3.3v.1"/>
    </symbol>
    <symbol id="truck-icon" viewBox="0 0 24 24">
      <path d="M5 16H3V6h11v10H9m5-7h4l3 3v4h-2m-4 0h-1"/>
      <circle cx="7" cy="16" r="2"/>
      <circle cx="17" cy="16" r="2"/>
    </symbol>
    <symbol id="check-icon" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5"/>
      <path d="m8.6 12 2.2 2.2 4.6-4.6"/>
    </symbol>
  </svg>

  <main class="board">
    <header class="board-header">
      <span class="snowflake" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24" focusable="false">
          <path d="M12 2.5v19M9 5.3l3 2.8 3-2.8M9 18.7l3-2.8 3 2.8"/>
          <path d="M12 2.5v19M9 5.3l3 2.8 3-2.8M9 18.7l3-2.8 3 2.8" transform="rotate(60 12 12)"/>
          <path d="M12 2.5v19M9 5.3l3 2.8 3-2.8M9 18.7l3-2.8 3 2.8" transform="rotate(120 12 12)"/>
        </svg>
      </span>
      <h1>Cold-chain monitoring</h1>
    </header>

    <section class="excursion" aria-labelledby="excursion-label excursion-truck">
      <div class="excursion-intro">
        <p class="eyebrow" id="excursion-label">
          <svg class="icon" aria-hidden="true"><use href="#warning-icon"/></svg>
          Temperature excursion
        </p>
        <h2 id="excursion-truck">Truck 14</h2>
        <p class="deviation"><strong>4°C</strong> above limit</p>
      </div>
      <div class="gauge">
        <div class="scale">
          <dl>
            <div class="measurement">
              <dt>Limit</dt>
              <dd>5<span>°C</span></dd>
            </div>
            <div class="measurement current">
              <dt>Current</dt>
              <dd>9<span>°C</span></dd>
            </div>
          </dl>
          <div class="track" aria-hidden="true">
            <span class="over-limit"></span>
            <span class="limit-mark"></span>
            <span class="current-mark"></span>
          </div>
        </div>
      </div>
    </section>

    <section class="fleet" aria-labelledby="fleet-heading">
      <div class="fleet-header">
        <h2 id="fleet-heading">Trucks</h2>
        <div class="filters" role="group" aria-label="Filter trucks">
          <button class="filter" type="button" data-filter="all" aria-controls="truck-rows" aria-pressed="true">
            All trucks <span class="count" aria-hidden="true">3</span>
          </button>
          <button class="filter" type="button" data-filter="excursions" aria-controls="truck-rows" aria-pressed="false">
            Excursions <span class="count" aria-hidden="true">1</span>
          </button>
        </div>
      </div>
      <p class="visually-hidden" id="filter-status" role="status"></p>

      <table aria-label="Truck temperatures">
        <colgroup>
          <col class="truck-column">
          <col class="temperature-column">
          <col class="status-column">
        </colgroup>
        <thead>
          <tr>
            <th scope="col">Truck</th>
            <th scope="col">Temperature</th>
            <th scope="col">Status</th>
          </tr>
        </thead>
        <tbody id="truck-rows">
          <tr data-excursion>
            <th scope="row">
              <span class="truck">
                <span class="truck-icon" aria-hidden="true"><svg class="icon"><use href="#truck-icon"/></svg></span>
                Truck 14
              </span>
            </th>
            <td class="temperature">9<span>°C</span></td>
            <td>
              <span class="status">
                <svg class="icon" aria-hidden="true"><use href="#warning-icon"/></svg>
                Excursion
              </span>
            </td>
          </tr>
          <tr>
            <th scope="row">
              <span class="truck">
                <span class="truck-icon" aria-hidden="true"><svg class="icon"><use href="#truck-icon"/></svg></span>
                Truck 8
              </span>
            </th>
            <td class="temperature">3<span>°C</span></td>
            <td>
              <span class="status">
                <svg class="icon" aria-hidden="true"><use href="#check-icon"/></svg>
                Within limit
              </span>
            </td>
          </tr>
          <tr>
            <th scope="row">
              <span class="truck">
                <span class="truck-icon" aria-hidden="true"><svg class="icon"><use href="#truck-icon"/></svg></span>
                Truck 11
              </span>
            </th>
            <td class="temperature">4<span>°C</span></td>
            <td>
              <span class="status">
                <svg class="icon" aria-hidden="true"><use href="#check-icon"/></svg>
                Within limit
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script>
    const filterButtons = document.querySelectorAll(".filter");
    const truckRows = document.querySelectorAll("#truck-rows > tr");
    const filterStatus = document.getElementById("filter-status");

    for (const button of filterButtons) {
      button.addEventListener("click", () => {
        if (button.getAttribute("aria-pressed") === "true") return;

        const excursionsOnly = button.dataset.filter === "excursions";
        let visibleCount = 0;

        for (const row of truckRows) {
          row.hidden = excursionsOnly && !row.hasAttribute("data-excursion");
          if (!row.hidden) visibleCount += 1;
        }

        for (const filter of filterButtons) {
          filter.setAttribute("aria-pressed", String(filter === button));
        }

        filterStatus.textContent = `Showing ${visibleCount} of ${truckRows.length} trucks.`;
      });
    }
  </script>
</body>
</html>
