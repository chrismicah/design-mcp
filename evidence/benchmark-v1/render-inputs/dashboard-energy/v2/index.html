<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14181B">
  <title>Electricity use</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Sans+Condensed:wght@600&amp;display=swap">
  <style>
    :root {
      color-scheme: dark;
      --graphite: #14181b;
      --slate: #1d2529;
      --rule: #3a474c;
      --mist: #a8b7b8;
      --porcelain: #eef0ec;
      --copper: #ffaa72;
      --display: "IBM Plex Sans Condensed", sans-serif;
      --body: "IBM Plex Sans", sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(ellipse at 48% 0%, var(--slate), var(--graphite) 70%);
      color: var(--porcelain);
      font-family: var(--body);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .dashboard {
      width: min(73rem, calc(100% - 6rem));
      margin-inline: auto;
      padding-block: clamp(3rem, 10vh, 6.75rem) 3rem;
    }

    .masthead {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 2rem;
      margin-block-end: 2.125rem;
    }

    .meter-mark {
      display: block;
      width: 2.75rem;
      height: 2.75rem;
      margin-block-end: 0.875rem;
      color: var(--mist);
    }

    h1 {
      margin: 0;
      font: 600 clamp(3.5rem, 5.8vw, 5.25rem)/1 var(--display);
      letter-spacing: -0.04em;
    }

    .day-switch {
      min-inline-size: 0;
      margin: 0 0 0.1875rem;
      padding: 0.25rem;
      border: 1px solid var(--rule);
      border-radius: 0.375rem;
      background: var(--graphite);
    }

    .day-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.25rem;
    }

    .day-option {
      position: relative;
      display: block;
      cursor: pointer;
    }

    .day-option span {
      display: grid;
      min-inline-size: 6.5rem;
      min-block-size: 2.75rem;
      padding: 0.5rem 0.75rem;
      place-items: center;
      border-radius: 0.1875rem;
      color: var(--mist);
      font-size: 0.9375rem;
      font-weight: 600;
    }

    .day-option:hover span {
      color: var(--porcelain);
    }

    .day-option input:checked + span {
      background: var(--copper);
      color: var(--graphite);
    }

    .day-option input:focus-visible + span {
      outline: 2px solid var(--porcelain);
      outline-offset: 2px;
    }

    .meter {
      --equipment-column: clamp(8.75rem, 15vw, 12.5rem);
      --value-column: 8.5rem;
      --column-gap: clamp(1rem, 2.25vw, 2rem);
      margin: 0;
      padding: 1rem clamp(1.5rem, 2.75vw, 2.5rem) 1.375rem;
      border: 1px solid var(--rule);
      border-top-color: color-mix(in srgb, var(--rule), var(--mist) 28%);
      border-radius: 0.5rem;
      background: var(--slate);
    }

    .readings {
      position: relative;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .readings::before {
      position: absolute;
      inset-block: 0;
      inset-inline-start: calc(var(--equipment-column) + var(--column-gap));
      inset-inline-end: calc(var(--value-column) + var(--column-gap));
      border-inline-end: 1px solid var(--rule);
      background: linear-gradient(to right, var(--rule) 1px, transparent 1px)
        0 0 / 25% 100% repeat-x;
      content: "";
      pointer-events: none;
    }

    .reading-row,
    .ruler {
      display: grid;
      grid-template-columns: var(--equipment-column) minmax(0, 1fr) var(--value-column);
      column-gap: var(--column-gap);
    }

    .reading-row {
      --trace: var(--mist);
      position: relative;
      min-block-size: 6.75rem;
      grid-template-areas: "equipment plot value";
      align-items: center;
    }

    .reading-row + .reading-row {
      border-block-start: 1px solid color-mix(in srgb, var(--rule) 68%, transparent);
    }

    .boiler {
      --trace: var(--copper);
    }

    .equipment {
      display: flex;
      grid-area: equipment;
      align-items: center;
      gap: 0.875rem;
      font-size: 1.125rem;
      font-weight: 500;
    }

    .equipment-icon {
      display: grid;
      flex: none;
      width: 2.75rem;
      height: 2.75rem;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--rule), var(--trace) 16%);
      border-radius: 0.25rem;
      background: var(--graphite);
      color: var(--trace);
    }

    .equipment-icon svg {
      width: 1.375rem;
      height: 1.375rem;
    }

    .reading {
      display: flex;
      grid-area: value;
      align-items: baseline;
      justify-self: end;
      gap: 0.4375rem;
      margin: 0;
      white-space: nowrap;
    }

    .number {
      font: 600 3.125rem/1 var(--display);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.025em;
    }

    .boiler .number {
      color: var(--copper);
      font-size: 3.625rem;
    }

    .unit {
      color: var(--mist);
      font-size: 0.875rem;
      font-weight: 500;
    }

    .lane {
      position: relative;
      grid-area: plot;
      height: 1.5rem;
      background-color: color-mix(in srgb, var(--graphite) 54%, transparent);
    }

    .bar {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--share);
      background: color-mix(in srgb, var(--trace) 90%, var(--slate));
      transition: width 260ms cubic-bezier(0.2, 0.65, 0.3, 1);
    }

    .bar::after {
      position: absolute;
      inset-block: -2px;
      inset-inline-end: 0;
      width: 2px;
      background: var(--trace);
      content: "";
    }

    .ticks {
      position: relative;
      grid-column: 2;
      height: 1.875rem;
      border-block-start: 1px solid var(--rule);
      color: var(--mist);
      font-size: 0.8125rem;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    .ticks::before {
      position: absolute;
      inset: 0 0 auto;
      height: 3px;
      background: linear-gradient(to right, var(--rule) 1px, transparent 1px)
        0 0 / calc(100% / 24) 100% repeat-x;
      content: "";
    }

    .tick {
      position: absolute;
      top: 0;
      left: var(--position);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3125rem;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    .tick::before {
      width: 1px;
      height: 0.375rem;
      background: var(--rule);
      content: "";
    }

    .tick:first-child {
      align-items: flex-start;
      transform: none;
    }

    .tick:last-child {
      align-items: flex-end;
      transform: translateX(-100%);
    }

    @media (max-width: 47rem) {
      .dashboard {
        width: min(32rem, calc(100% - 2.5rem));
        padding-block-start: 2rem;
      }

      .masthead {
        flex-direction: column;
        align-items: stretch;
        gap: 1.375rem;
        margin-block-end: 1.25rem;
      }

      .meter-mark {
        width: 2.25rem;
        height: 2.25rem;
        margin-block-end: 0.625rem;
      }

      h1 {
        font-size: clamp(2.5rem, 13vw, 4rem);
      }

      .day-switch {
        margin: 0;
      }

      .day-option span {
        min-inline-size: 0;
      }

      .meter {
        padding: 0 1rem 0.875rem;
      }

      .readings::before {
        display: none;
      }

      .reading-row {
        min-block-size: 0;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas: "equipment value" "plot plot";
        row-gap: 0.8125rem;
        padding-block: 1rem;
      }

      .equipment {
        gap: 0.625rem;
        font-size: 1rem;
      }

      .equipment-icon {
        width: 2.125rem;
        height: 2.125rem;
      }

      .equipment-icon svg {
        width: 1.125rem;
        height: 1.125rem;
      }

      .number {
        font-size: 2.25rem;
      }

      .boiler .number {
        font-size: 2.5rem;
      }

      .lane {
        height: 1.125rem;
        background-image: linear-gradient(to right, var(--rule) 1px, transparent 1px);
        background-size: 25% 100%;
        box-shadow: inset -1px 0 var(--rule);
      }

      .ruler {
        display: block;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bar {
        transition: none;
      }
    }

    @media (forced-colors: active) {
      .day-option input:checked + span {
        forced-color-adjust: none;
        background: Highlight;
        color: HighlightText;
      }

      .lane {
        outline: 1px solid CanvasText;
      }

      .bar {
        forced-color-adjust: none;
        background: CanvasText;
      }
    }
  </style>
</head>
<body>
  <main class="dashboard">
    <header class="masthead">
      <div>
        <svg class="meter-mark" viewBox="0 0 44 44" fill="none" aria-hidden="true">
          <path d="M1 10V1h9m24 0h9v9m0 24v9h-9m-24 0H1v-9" stroke="var(--rule)"/>
          <rect x="8.5" y="7.5" width="27" height="29" rx="3" stroke="currentColor"/>
          <path d="M14.5 23a7.5 7.5 0 0 1 15 0M17 30.5h10" stroke="currentColor" stroke-linecap="round"/>
          <path d="m22 23 4-4.5" stroke="var(--copper)" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="22" cy="23" r="1.5" fill="var(--copper)"/>
        </svg>
        <h1>Electricity use</h1>
      </div>

      <fieldset class="day-switch">
        <legend class="sr-only">Day</legend>
        <div class="day-options">
          <label class="day-option">
            <input class="sr-only" type="radio" name="day" value="yesterday" checked>
            <span>Yesterday</span>
          </label>
          <label class="day-option">
            <input class="sr-only" type="radio" name="day" value="today">
            <span>Today</span>
          </label>
        </div>
      </fieldset>
    </header>

    <figure class="meter" aria-labelledby="meter-caption">
      <figcaption id="meter-caption" class="sr-only">Yesterday’s electricity use by equipment</figcaption>

      <ul class="readings" role="list">
        <li class="reading-row boiler" data-yesterday="120" data-today="103">
          <div class="equipment">
            <span class="equipment-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="2.75" width="14" height="15.25" rx="2.25"/>
                <circle cx="12" cy="8.5" r="2.25"/>
                <path d="m12 8.5 1-1m-4.5 7h7M8.5 18v3.25m7-3.25v3.25"/>
              </svg>
            </span>
            <span class="equipment-name">Boiler</span>
          </div>
          <p class="reading"><span class="number">120</span> <span class="unit">kWh</span></p>
          <div class="lane" aria-hidden="true"><span class="bar" style="--share: 100%"></span></div>
        </li>

        <li class="reading-row" data-yesterday="66" data-today="58">
          <div class="equipment">
            <span class="equipment-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 17v-1c0-1.1-.5-1.8-1.2-2.5a6 6 0 1 1 8.4 0c-.7.7-1.2 1.4-1.2 2.5v1H9Z"/>
                <path d="M9.5 20h5M11 22h2"/>
              </svg>
            </span>
            <span class="equipment-name">Lighting</span>
          </div>
          <p class="reading"><span class="number">66</span> <span class="unit">kWh</span></p>
          <div class="lane" aria-hidden="true"><span class="bar" style="--share: 55%"></span></div>
        </li>

        <li class="reading-row" data-yesterday="21" data-today="16">
          <div class="equipment">
            <span class="equipment-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="7" width="14" height="14" rx="1.25"/>
                <path d="M12 7v14M10 4l2-2 2 2M2.5 21h19"/>
              </svg>
            </span>
            <span class="equipment-name">Lift</span>
          </div>
          <p class="reading"><span class="number">21</span> <span class="unit">kWh</span></p>
          <div class="lane" aria-hidden="true"><span class="bar" style="--share: 17.5%"></span></div>
        </li>
      </ul>

      <div class="ruler" aria-hidden="true">
        <div class="ticks">
          <span class="tick" style="--position: 0%">0</span>
          <span class="tick" style="--position: 25%">30</span>
          <span class="tick" style="--position: 50%">60</span>
          <span class="tick" style="--position: 75%">90</span>
          <span class="tick" style="--position: 100%">120 kWh</span>
        </div>
      </div>
    </figure>

    <p id="day-status" class="sr-only" role="status" aria-atomic="true"></p>
  </main>

  <script>
    const daySwitch = document.querySelector(".day-switch");
    const rows = document.querySelectorAll(".reading-row");
    const caption = document.getElementById("meter-caption");
    const status = document.getElementById("day-status");
    // Both days use the largest supplied reading as the scale maximum.
    const scaleMaximum = 120;

    function renderDay(selection, announce = false) {
      const day = selection.value;
      const dayName = selection.labels[0].textContent.trim();
      const summary = [];

      for (const row of rows) {
        const value = Number(row.dataset[day]);
        const equipment = row.querySelector(".equipment-name").textContent;
        row.querySelector(".number").textContent = value;
        row.querySelector(".bar").style.setProperty("--share", `${value / scaleMaximum * 100}%`);
        summary.push(`${equipment} ${value} kilowatt-hours`);
      }

      caption.textContent = `${dayName}’s electricity use by equipment`;

      if (announce) {
        status.textContent = `${dayName}. ${summary.join(", ")}.`;
      }
    }

    daySwitch.addEventListener("change", (event) => renderDay(event.target, true));
    renderDay(daySwitch.querySelector("input:checked"));
  </script>
</body>
</html>
