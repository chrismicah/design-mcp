<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morning greenhouse board</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400..700&amp;family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --ink: #203b2e;
      --paper: #eff0e7;
      --surface: #fcfcf7;
      --line: #d8e0d3;
      --sage: #548168;
      --marker: #2e503d;
      --threshold: 75%;
      --alert-ink: #793a29;
      --alert-fill: #a64e35;
      --alert-line: #e7cbbb;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(ellipse at 25% 0%, #f8f5ea, transparent 65%), var(--paper);
      font-family: "DM Sans", system-ui, sans-serif;
    }

    .page {
      width: min(74rem, calc(100% - 4rem));
      margin-inline: auto;
      padding-block: clamp(2.5rem, 4vw, 3.25rem) 3rem;
    }

    .hero {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 17rem;
      padding: 2.5rem clamp(2rem, 4vw, 3.5rem);
      overflow: hidden;
      border: 1px solid #315744;
      border-radius: 1.5rem;
      background: radial-gradient(ellipse at 86% 110%, #355a41, transparent 67%), #18382b;
      color: #faf5e7;
    }

    .hero h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font: 500 clamp(3rem, 5.5vw, 5rem) / .92 "Newsreader", Georgia, serif;
      letter-spacing: -.045em;
    }

    .hero h1 em {
      display: block;
      color: #deebcc;
    }

    .hero-art {
      position: absolute;
      right: 1rem;
      bottom: -.625rem;
      width: min(49%, 35.625rem);
      height: auto;
      pointer-events: none;
      mask-image: linear-gradient(to right, transparent, #000 17%);
    }

    .board {
      margin-top: 2rem;
    }

    .board-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: .625rem 1rem;
      margin-bottom: .875rem;
    }

    .board-heading h2 {
      margin: 0;
      font-size: clamp(1.25rem, 2vw, 1.5rem);
      font-weight: 700;
      letter-spacing: -.035em;
    }

    .threshold {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .4375rem .6875rem;
      border: 1px solid #d9e1d4;
      border-radius: .5625rem;
      background: #e8ede2;
      color: #385644;
      font-size: .8125rem;
      white-space: nowrap;
    }

    .threshold strong {
      font-weight: 700;
    }

    .threshold-mark {
      flex: none;
    }

    .bays {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr);
      grid-auto-rows: 1fr;
      gap: 1rem;
    }

    .bay {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
      padding: 1.375rem 1.625rem;
      border: 1px solid var(--line);
      border-radius: 1.125rem;
      background: var(--surface);
      box-shadow: 0 2px 4px rgb(35 61 43 / 4%);
    }

    .bay--alert {
      grid-row: span 2;
      padding: 1.625rem 1.875rem;
      border-color: var(--alert-line);
      background: #fff7ee;
    }

    .bay-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
    }

    .bay-heading h3 {
      margin: 0;
      font-size: 1.1875rem;
      font-weight: 700;
      letter-spacing: -.025em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: .375rem;
      padding: .375rem .625rem;
      border-radius: 2rem;
      background: #e7eee2;
      color: #315844;
      font-size: .8125rem;
      font-weight: 600;
      line-height: 1.25;
    }

    .badge--ok::before {
      width: .375rem;
      height: .375rem;
      border-radius: 50%;
      background: #568065;
      content: "";
    }

    .badge--alert {
      background: #f8e4d7;
      color: var(--alert-ink);
    }

    .bay-metric {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      align-items: center;
      gap: clamp(1rem, 2vw, 1.625rem);
      margin-top: .9375rem;
    }

    .bay--alert .bay-metric {
      grid-template-columns: minmax(0, 1fr);
      gap: 1rem;
      margin-block: 1.25rem 1.4375rem;
    }

    .reading {
      margin: 0;
      font-size: 3rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: .98;
      letter-spacing: -.07em;
      white-space: nowrap;
    }

    .bay--alert .reading {
      color: var(--alert-ink);
      font-size: clamp(4.5rem, 6.2vw, 6rem);
    }

    .unit {
      margin-inline-start: .12em;
      font-size: .55em;
      letter-spacing: -.04em;
    }

    .meter {
      position: relative;
      height: .5rem;
      border-radius: 1rem;
      background: #e5e9df;
    }

    .meter::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--reading);
      border-radius: inherit;
      background: var(--sage);
      content: "";
    }

    .meter::after {
      position: absolute;
      top: 50%;
      left: var(--threshold);
      width: 2px;
      height: 1rem;
      border-radius: 1px;
      background: var(--marker);
      box-shadow: 0 0 0 1px var(--surface);
      transform: translate(-50%, -50%);
      content: "";
    }

    .bay--alert .meter {
      height: .625rem;
      background: #efdfd2;
    }

    .bay--alert .meter::before {
      background: var(--alert-fill);
    }

    .bay--alert .meter::after {
      box-shadow: 0 0 0 1px #fff7ee;
    }

    .alert-actions {
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid var(--alert-line);
    }

    .acknowledge {
      display: inline-flex;
      min-height: 2.875rem;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      padding: .625rem 1rem;
      border: 1px solid transparent;
      border-radius: .625rem;
      background: #913f29;
      color: #fffaf4;
      font: inherit;
      font-size: .9375rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 150ms, border-color 150ms, color 150ms;
    }

    .acknowledge:not([aria-disabled="true"]):hover {
      background: #773321;
    }

    .acknowledge:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }

    .acknowledge[aria-disabled="true"] {
      border-color: #abc4ad;
      background: #e2eee1;
      color: #234a36;
      cursor: default;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 700px) {
      .page {
        width: calc(100% - 2rem);
        padding-block: 1rem 1.75rem;
      }

      .hero {
        min-height: 11.375rem;
        align-items: flex-end;
        padding: 1.375rem;
        border-radius: 1.125rem;
      }

      .hero h1 {
        font-size: clamp(1.8rem, 9.5vw, 3.7rem);
      }

      .hero-art {
        right: 0;
        bottom: 4.25rem;
        width: min(13.625rem, 69%);
      }

      .board {
        margin-top: 1.375rem;
      }

      .board-heading {
        margin-bottom: .75rem;
      }

      .bays {
        grid-template-columns: minmax(0, 1fr);
        grid-auto-rows: auto;
        gap: .75rem;
      }

      .bay {
        padding: 1.125rem;
      }

      .bay--alert {
        grid-row: auto;
        padding: 1.25rem 1.125rem;
      }

      .reading {
        font-size: 2.75rem;
      }

      .acknowledge {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .acknowledge {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>Morning <em>greenhouse board</em></h1>

      <svg class="hero-art" viewBox="0 0 560 292" aria-hidden="true" focusable="false">
        <defs>
          <pattern id="glasshouse-grid" width="22" height="22" patternUnits="userSpaceOnUse">
            <path d="M22 0H0V22" fill="none" stroke="#a4c29d" stroke-opacity=".17"/>
          </pattern>
        </defs>

        <rect width="560" height="292" fill="url(#glasshouse-grid)" opacity=".65"/>
        <g fill="none" stroke="#a8c6a1" opacity=".4">
          <path d="M60 247h437m-388 13h295m43 0h24M488 101v12m-6-6h12M77 149v8m-4-4h8"/>
          <circle cx="389" cy="86" r="61" stroke-dasharray="2 5"/>
        </g>
        <circle cx="389" cy="86" r="48" fill="#e8ba7b"/>

        <path d="M104 238V143l116-81 116 81v95Z" fill="#315943"/>
        <path d="M336 143l119-34v95l-119 34Z" fill="#284f3c"/>
        <path d="M220 62l119-34 116 81-119 34Z" fill="#537b5d" fill-opacity=".89"/>
        <path d="M190 238v-78h60v78Z" fill="#214635"/>
        <path d="M104 143l116-81 116 81Z" fill="#456d54" fill-opacity=".62"/>

        <g fill="#8dad7d">
          <path d="M160 222c-19-5-31-18-33-37 18 4 30 17 33 37Zm1-7c0-17 10-29 27-33-3 16-12 27-27 33Zm0-12c-12-7-17-18-14-32 12 7 17 18 14 32Z"/>
          <path d="M281 224c-15-3-26-14-28-29 16 2 26 12 28 29Zm1-7c1-15 11-26 27-29-2 15-12 26-27 29Zm-1-10c-9-6-12-16-8-27 9 7 12 16 8 27Z"/>
        </g>
        <g fill="#739768">
          <path d="M367 211c-10-4-16-12-16-23 11 3 17 11 16 23Zm1-6c2-12 9-20 20-24-2 12-9 21-20 24Z"/>
          <path d="M423 195c-10-3-15-10-16-20 10 2 16 9 16 20Zm1-5c2-11 9-18 19-21-2 11-9 18-19 21Z"/>
        </g>
        <path d="M160 231v-28m121 28v-23m86 12v-16m56 1v-18" fill="none" stroke="#a7c398"/>

        <g fill="none" stroke="#b5cfaa" stroke-linecap="round" stroke-linejoin="round">
          <path d="M104 238v-95l116-81 116 81v95Zm116-176 119-34 116 81v95l-119 34m-232-95h232l119-34" stroke-width="1.6"/>
          <path d="M143 116v122m154-122v122M181 89v54m39-81v81m39-54v54M104 190h86m60 0h86l119-34M260 51l116 81v95M299 39l116 81v95M278 102l119-34" opacity=".68"/>
          <path d="M190 238v-78h60v78m-30-78v78m-7-36v7m14-7v7"/>
          <path d="M117 159l15-11m-11 18 19-14m166 17 15-11m29-11 17-11m-13 18 19-13" opacity=".43"/>
        </g>
      </svg>
    </header>

    <section class="board" aria-labelledby="humidity-heading">
      <div class="board-heading">
        <h2 id="humidity-heading">Bay humidity</h2>
        <div class="threshold">
          <svg class="threshold-mark" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M1 8h14" stroke="#a5b5a5" stroke-width="2" stroke-linecap="round"/>
            <path d="M10 2v12" stroke="#2e503d" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span><strong>75%</strong> threshold</span>
        </div>
      </div>

      <div class="bays">
        <article class="bay bay--alert" aria-labelledby="bay-one">
          <div class="bay-heading">
            <h3 id="bay-one">Bay 1</h3>
            <span class="badge badge--alert">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M7.1 3.1a1 1 0 0 1 1.8 0l4.8 8.5a1 1 0 0 1-.9 1.5H3.2a1 1 0 0 1-.9-1.5l4.8-8.5Z" stroke="currentColor" stroke-width="1.3"/>
                <path d="M8 6v2.6m0 2.1h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              Needs venting
            </span>
          </div>

          <div class="bay-metric">
            <p class="reading">82<span class="unit">%</span><span class="sr-only"> humidity</span></p>
            <div class="meter" style="--reading: 82%" aria-hidden="true"></div>
          </div>

          <div class="alert-actions">
            <button class="acknowledge" id="acknowledge-alert" type="button">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.4"/>
                <path d="m6.7 10 2.2 2.2 4.4-4.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span id="acknowledge-label">Acknowledge alert</span>
            </button>
            <span class="sr-only" id="alert-announcement" role="status"></span>
          </div>
        </article>

        <article class="bay" aria-labelledby="bay-two">
          <div class="bay-heading">
            <h3 id="bay-two">Bay 2</h3>
            <span class="badge badge--ok">Within threshold</span>
          </div>
          <div class="bay-metric">
            <p class="reading">65<span class="unit">%</span><span class="sr-only"> humidity</span></p>
            <div class="meter" style="--reading: 65%" aria-hidden="true"></div>
          </div>
        </article>

        <article class="bay" aria-labelledby="bay-three">
          <div class="bay-heading">
            <h3 id="bay-three">Bay 3</h3>
            <span class="badge badge--ok">Within threshold</span>
          </div>
          <div class="bay-metric">
            <p class="reading">67<span class="unit">%</span><span class="sr-only"> humidity</span></p>
            <div class="meter" style="--reading: 67%" aria-hidden="true"></div>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script>
    const acknowledgeButton = document.getElementById("acknowledge-alert");
    const acknowledgeLabel = document.getElementById("acknowledge-label");
    const announcement = document.getElementById("alert-announcement");

    acknowledgeButton.addEventListener("click", () => {
      acknowledgeButton.setAttribute("aria-disabled", "true");
      acknowledgeLabel.textContent = "Alert acknowledged";
      announcement.textContent = "Bay 1 alert acknowledged.";
    }, { once: true });
  </script>
</body>
</html>
