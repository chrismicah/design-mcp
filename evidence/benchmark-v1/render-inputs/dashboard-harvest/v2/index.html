<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morning greenhouse board</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
  <style>
    :root {
      color-scheme: dark;
      --paper: #14181b;
      --ink: #eef0ec;
      --muted: #aeb9b3;
      --line: #35403e;
      --sage: #a0b7a3;
      --accent: #ffaa72;
      --threshold: 75%;
      --display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
      --body: "IBM Plex Sans", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 1rem/1.5 var(--body);
    }

    h1, h2, p { margin: 0; }

    .board {
      width: min(1160px, calc(100% - 64px));
      margin: clamp(2rem, 5.2vw, 4.75rem) auto 3rem;
    }

    .masthead {
      display: grid;
      grid-template-areas: "mark title threshold";
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 20px;
      margin-bottom: 34px;
    }

    .board-mark {
      grid-area: mark;
      width: 48px;
      height: 48px;
    }

    h1 {
      grid-area: title;
      font: 600 clamp(2.5rem, 4.7vw, 4.25rem)/.99 var(--display);
      letter-spacing: -.035em;
    }

    .threshold {
      grid-area: threshold;
      display: flex;
      align-items: center;
      gap: 12px;
      padding-left: 17px;
      border-left: 1px solid var(--line);
    }

    .threshold-label, .reading-label, thead th {
      color: var(--muted);
      font-size: .6875rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .threshold-value {
      font: 600 1.875rem/1.05 var(--display);
      font-variant-numeric: tabular-nums;
    }

    .threshold-value span { font-size: .72em; }

    .alert {
      display: grid;
      grid-template-areas:
        "topic reading drawing"
        "action reading drawing";
      grid-template-columns: minmax(230px, 1.04fr) minmax(168px, .72fr) minmax(215px, 1fr);
      gap: 24px clamp(16px, 3vw, 42px);
      min-height: 258px;
      padding: 36px clamp(24px, 3.4vw, 46px);
      border: 1px solid #474941;
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      background: linear-gradient(110deg, #292521, #202824);
    }

    .alert-copy {
      grid-area: topic;
      align-self: end;
    }

    .alert-bay {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--accent);
      font-size: .8125rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .alert-title {
      font: 600 clamp(2.125rem, 3.6vw, 3.25rem)/1 var(--display);
      letter-spacing: -.022em;
    }

    .alert-reading {
      grid-area: reading;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 9px;
      padding-left: clamp(18px, 3vw, 42px);
      border-left: 1px solid #4a4e46;
    }

    .alert-value {
      color: var(--accent);
      font: 600 clamp(4.25rem, 7vw, 6.375rem)/.9 var(--display);
      font-variant-numeric: tabular-nums;
      letter-spacing: -.04em;
      white-space: nowrap;
    }

    .alert-value span {
      margin-left: .06em;
      font-size: .43em;
      letter-spacing: 0;
    }

    .acknowledge {
      grid-area: action;
      align-self: start;
      justify-self: start;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      min-width: 196px;
      min-height: 48px;
      padding: 9px 16px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: var(--accent);
      color: #211811;
      font: 600 .9375rem/1.3 var(--body);
      cursor: pointer;
      transition: background-color 160ms ease-out, border-color 160ms ease-out, color 160ms ease-out;
    }

    .acknowledge:not([aria-disabled="true"]):hover { background: #ffc39c; }
    .acknowledge:not([aria-disabled="true"]):active { background: #f39459; }

    .acknowledge:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px var(--paper);
    }

    .acknowledge[aria-disabled="true"] {
      border-color: #526859;
      background: #2d3a32;
      color: #c4dbc6;
      cursor: default;
    }

    .greenhouse-drawing {
      grid-area: drawing;
      align-self: center;
      display: block;
      width: 100%;
      max-height: 212px;
    }

    .readings { margin-top: 42px; }

    .readings h2 {
      margin-bottom: 14px;
      font: 600 2rem/1.1 var(--display);
      letter-spacing: -.018em;
    }

    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      text-align: left;
    }

    .bay-column { width: 17%; }
    .status-column { width: 22%; }

    th, td { padding-inline: 18px; }

    thead {
      border-block: 1px solid var(--line);
      background: #1b2222;
    }

    thead th { height: 41px; }

    tbody tr { border-bottom: 1px solid var(--line); }
    tbody th, tbody td { height: 64px; }

    tbody th {
      font: 500 1.3125rem/1.15 var(--display);
    }

    .above-threshold {
      --bar-color: var(--accent);
      background: #231f1d;
    }

    .humidity {
      display: grid;
      grid-template-columns: 3.125rem minmax(0, 1fr);
      align-items: center;
      gap: 18px;
    }

    .humidity-value {
      font: 600 1.375rem/1 var(--display);
      font-variant-numeric: tabular-nums;
    }

    .above-threshold .humidity-value { color: var(--accent); }

    .track {
      position: relative;
      display: block;
      height: 6px;
      border-radius: 2px;
      background: #343e3d;
    }

    .track::before, .track::after {
      position: absolute;
      content: "";
    }

    .track::before {
      inset: 0 auto 0 0;
      width: var(--humidity);
      border-radius: inherit;
      background: var(--bar-color, var(--sage));
    }

    .track::after {
      top: -5px;
      bottom: -5px;
      left: var(--threshold);
      width: 1px;
      background: #f2bc9a;
    }

    .status-cell { padding-left: 38px; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: .875rem;
      font-weight: 500;
      line-height: 1.2;
    }

    .status::before {
      flex: 0 0 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--sage);
      content: "";
    }

    .above-threshold .status { color: var(--accent); }
    .above-threshold .status::before { background: var(--accent); }

    .above-threshold .status[data-acknowledged="true"] { color: #c4dbc6; }
    .above-threshold .status[data-acknowledged="true"]::before { background: var(--sage); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 820px) {
      .alert {
        grid-template-areas:
          "topic reading"
          "action action";
        grid-template-columns: minmax(0, 1fr) auto;
        min-height: 0;
      }

      .alert-reading {
        padding: 0;
        border: 0;
        text-align: right;
      }

      .greenhouse-drawing { display: none; }
      .status-column { width: 142px; }
      .status-cell { padding-left: 18px; }
    }

    @media (max-width: 600px) {
      .board {
        width: calc(100% - 36px);
        margin-top: 22px;
      }

      .masthead {
        grid-template-areas:
          "mark threshold"
          "title title";
        grid-template-columns: auto minmax(0, 1fr);
        gap: 17px 12px;
        margin-bottom: 24px;
      }

      .board-mark {
        width: 42px;
        height: 42px;
      }

      h1 { font-size: clamp(2.125rem, 10.75vw, 2.875rem); }
      h1 span { display: block; }

      .threshold {
        justify-self: end;
        gap: 9px;
        padding-left: 12px;
      }

      .threshold-value { font-size: 1.625rem; }

      .alert {
        padding: 20px 18px 18px;
        gap: 20px 12px;
      }

      .alert-copy { align-self: center; }
      .alert-bay { margin-bottom: 8px; }
      .alert-title { font-size: clamp(1.75rem, 8vw, 2.125rem); }
      .alert-reading { gap: 7px; }
      .alert-value { font-size: 3.875rem; }
      .reading-label { font-size: .625rem; }
      .acknowledge { width: 100%; }

      .readings { margin-top: 31px; }

      .readings h2 {
        margin-bottom: 12px;
        font-size: 1.75rem;
      }

      .bay-column { width: 61px; }
      .status-column { width: 118px; }
      thead th { height: 36px; }
      tbody th, tbody td { height: 58px; }
      th, td { padding-inline: 9px; }
      tbody th { font-size: 1.125rem; }

      .humidity {
        grid-template-columns: 2rem minmax(0, 1fr);
        gap: 9px;
      }

      .humidity-value { font-size: 1.125rem; }
      .status-cell { padding-inline: 9px 4px; }
      .status { gap: 6px; font-size: .75rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .acknowledge { transition: none; }
    }
  </style>
</head>
<body>
  <main class="board">
    <header class="masthead">
      <svg class="board-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect x=".5" y=".5" width="47" height="47" rx="8" fill="#242e29" stroke="#425248"/>
        <path d="M11 34V22l13-9 13 9v12H11Zm0-12h26m-13-9v9m-3.5 12v-7h7v7"
              stroke="#bdd0b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Morning <span>greenhouse board</span></h1>
      <div class="threshold">
        <svg width="18" height="24" viewBox="0 0 18 24" fill="none" aria-hidden="true">
          <path d="M2 12h14" stroke="#82908a" stroke-linecap="round"/>
          <path d="M12 4v16" stroke="#ffaa72" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <div>
          <p class="threshold-label">Humidity threshold</p>
          <p class="threshold-value">75<span>%</span></p>
        </div>
      </div>
    </header>

    <section class="alert" aria-labelledby="alert-bay alert-title">
      <div class="alert-copy">
        <p class="alert-bay" id="alert-bay">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M10 2.8 18 16.5H2L10 2.8Z" stroke="currentColor" stroke-width="1.45" stroke-linejoin="round"/>
            <path d="M10 7.5v4.2" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/>
            <circle cx="10" cy="14" r=".8" fill="currentColor"/>
          </svg>
          Bay 1
        </p>
        <h2 class="alert-title" id="alert-title">Needs venting</h2>
      </div>

      <div class="alert-reading">
        <p class="reading-label">Humidity</p>
        <p class="alert-value">82<span>%</span></p>
      </div>

      <button class="acknowledge" id="acknowledge" type="button">
        <svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="m4.5 10.2 3.6 3.6 7.4-7.6" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Acknowledge alert</span>
      </button>

      <svg class="greenhouse-drawing" viewBox="0 0 364 196" fill="none" aria-hidden="true">
        <defs>
          <pattern id="greenhouse-grid" width="16" height="16" patternUnits="userSpaceOnUse">
            <path d="M16 0H0v16" stroke="#9cb1a1" stroke-opacity=".19"/>
          </pattern>
          <radialGradient id="greenhouse-fade">
            <stop offset=".46" stop-color="white"/>
            <stop offset="1" stop-color="white" stop-opacity="0"/>
          </radialGradient>
          <mask id="greenhouse-grid-mask">
            <rect width="364" height="196" fill="url(#greenhouse-fade)"/>
          </mask>
        </defs>
        <rect width="364" height="196" fill="url(#greenhouse-grid)" mask="url(#greenhouse-grid-mask)"/>
        <path d="M20 169h142l174-28M33 181h129l174-28" stroke="#596d60" stroke-dasharray="2 5"/>
        <path d="M37 153V91l62-43 63 43v62H37Z" fill="#819982" fill-opacity=".07"/>
        <path d="m99 48 155-25 63 43-155 25-63-43Z" fill="#a6b9a3" fill-opacity=".11"/>
        <path d="m162 91 155-25v62l-155 25V91Z" fill="#819982" fill-opacity=".12"/>
        <g stroke="#8fa493" stroke-linecap="round" stroke-linejoin="round">
          <path d="M37 153V91l62-43 63 43v62H37Zm125 0 155-25V66l-63-43L99 48m63 43 155-25"
                stroke-width="1.35"/>
          <path d="M37 91h125m-63-43v43m-19 62v-46h38v46m-19-46v46m63-32 155-25m-187-27 155-25"
                opacity=".66"/>
          <path d="m137.75 41.75 63 43v62m-24.25-111.25 63 43v62m-24.25-111.25 63 43v62"
                opacity=".62"/>
          <path d="m37 91 155-25 62-43m-62 43v62" opacity=".37" stroke-dasharray="3 4"/>
          <path d="M57 145v-20m0 10c-7 0-12-5-12-10 7 0 12 4 12 10Zm0 5c7 0 12-5 12-10-7 0-12 4-12 10Zm85 5v-19m0 10c-7 0-12-5-12-10 7 0 12 4 12 10Zm0 4c7 0 12-5 12-10-7 0-12 4-12 10Z"
                opacity=".56"/>
        </g>
        <g fill="#a8bca7">
          <circle cx="99" cy="48" r="2.2"/>
          <circle cx="254" cy="23" r="2.2"/>
          <circle cx="162" cy="91" r="2.2"/>
          <circle cx="317" cy="66" r="2.2"/>
        </g>
      </svg>

      <p class="sr-only" id="acknowledgement" role="status"></p>
    </section>

    <section class="readings" aria-labelledby="readings-title">
      <h2 id="readings-title">Bay readings</h2>
      <table aria-labelledby="readings-title">
        <colgroup>
          <col class="bay-column">
          <col>
          <col class="status-column">
        </colgroup>
        <thead>
          <tr>
            <th scope="col">Bay</th>
            <th scope="col">Humidity</th>
            <th scope="col" class="status-cell">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr class="above-threshold">
            <th scope="row">Bay 1</th>
            <td>
              <div class="humidity">
                <span class="humidity-value">82%</span>
                <span class="track" style="--humidity: 82%" aria-hidden="true"></span>
              </div>
            </td>
            <td class="status-cell"><span class="status" id="bay-one-status">Needs venting</span></td>
          </tr>
          <tr>
            <th scope="row">Bay 2</th>
            <td>
              <div class="humidity">
                <span class="humidity-value">65%</span>
                <span class="track" style="--humidity: 65%" aria-hidden="true"></span>
              </div>
            </td>
            <td class="status-cell"><span class="status">Below threshold</span></td>
          </tr>
          <tr>
            <th scope="row">Bay 3</th>
            <td>
              <div class="humidity">
                <span class="humidity-value">67%</span>
                <span class="track" style="--humidity: 67%" aria-hidden="true"></span>
              </div>
            </td>
            <td class="status-cell"><span class="status">Below threshold</span></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script>
    const acknowledgeButton = document.getElementById("acknowledge");
    const bayOneStatus = document.getElementById("bay-one-status");
    const announcement = document.getElementById("acknowledgement");

    acknowledgeButton.addEventListener("click", () => {
      if (acknowledgeButton.getAttribute("aria-disabled") === "true") return;

      acknowledgeButton.setAttribute("aria-disabled", "true");
      acknowledgeButton.querySelector("span").textContent = "Acknowledged";
      bayOneStatus.textContent = "Acknowledged";
      bayOneStatus.dataset.acknowledged = "true";
      announcement.textContent = "Bay 1 alert acknowledged.";
    });
  </script>
</body>
</html>
