<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3eb">
  <title>Today’s Hold Pickups</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --canvas: #f5f3eb;
      --paper: #fffdf7;
      --ink: #26332a;
      --muted: #596456;
      --line: #e4e2d6;
      --green: #284637;
      --gold: #f5ce8e;
      --serif: "Newsreader", Georgia, serif;
      --sans: "DM Sans", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font: 400 16px/1.45 var(--sans);
    }

    .wrap {
      width: min(1120px, calc(100% - 64px));
      margin-inline: auto;
    }

    .masthead {
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }

    .masthead-inner {
      display: flex;
      min-height: 67px;
      align-items: center;
      justify-content: space-between;
    }

    .identity, .day {
      display: flex;
      align-items: center;
    }

    .identity {
      gap: 10px;
      font-weight: 700;
      letter-spacing: -.025em;
    }

    .book-mark {
      position: relative;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--green);
    }

    .book-mark::before, .book-mark::after {
      position: absolute;
      top: 10px;
      width: 9px;
      height: 13px;
      border: 1px solid #fff5db;
      content: "";
    }

    .book-mark::before {
      left: 8px;
      border-radius: 2px 4px 1px 2px;
      transform: skewY(9deg);
    }

    .book-mark::after {
      right: 8px;
      border-radius: 4px 2px 2px 1px;
      transform: skewY(-9deg);
    }

    .day {
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .calendar {
      position: relative;
      width: 15px;
      height: 14px;
      border: 1.5px solid currentColor;
      border-radius: 3px;
    }

    .calendar::before, .calendar::after {
      position: absolute;
      background: currentColor;
      content: "";
    }

    .calendar::before { inset: 3px 0 auto; height: 1px; }

    .calendar::after {
      top: -3px;
      left: 3px;
      width: 1.5px;
      height: 4px;
      border-radius: 1px;
      box-shadow: 5px 0 currentColor;
    }

    main { padding-block: 38px 60px; }

    .overview {
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      min-height: 261px;
      overflow: hidden;
      padding: 34px 44px;
      border: 1px solid #2e4939;
      border-radius: 18px;
      background:
        radial-gradient(ellipse at 81% 40%, #395541 0%, transparent 53%),
        linear-gradient(110deg, #1d352b, #263e32);
      color: #fff8e8;
    }

    .overview-content { position: relative; z-index: 1; }

    h1, h2 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
    }

    h1 {
      font-size: clamp(54px, 6vw, 79px);
      line-height: .97;
      letter-spacing: -.05em;
    }

    .scope {
      margin: 7px 0 0;
      color: #d2ddcd;
      font-size: 14px;
    }

    .totals {
      display: flex;
      align-items: stretch;
      gap: 25px;
      margin: 23px 0 0;
    }

    .metric {
      display: flex;
      flex-direction: column;
    }

    .metric + .metric {
      padding-inline-start: 25px;
      border-inline-start: 1px solid #758879;
    }

    .metric dt {
      order: 1;
      margin-top: 5px;
      color: #e2e9da;
      font-size: 13px;
      font-weight: 500;
    }

    .metric dd {
      margin: 0;
      font-size: 35px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -.055em;
    }

    .metric-due dd { color: var(--gold); }

    .illustration {
      position: absolute;
      top: 50%;
      right: clamp(25px, 6vw, 88px);
      width: 330px;
      height: 224px;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .orbit {
      position: absolute;
      top: 11px;
      left: 64px;
      width: 203px;
      height: 203px;
      border: 1px solid #a7bc963b;
      border-radius: 50%;
      background: repeating-linear-gradient(135deg, #b7c9a012 0 1px, transparent 1px 7px);
    }

    .orbit::after {
      position: absolute;
      inset: -11px;
      border: 1px solid #a7bc962b;
      border-radius: inherit;
      content: "";
    }

    .cover {
      position: absolute;
      top: 36px;
      left: 81px;
      width: 128px;
      height: 150px;
      transform: rotate(-17deg);
      border: 1px solid #edc782;
      border-radius: 6px 8px 5px 4px;
      background: linear-gradient(126deg, #e4b976, #b97e45);
      box-shadow: 0 3px #9b653a, 0 7px #e9d5ac, 0 9px #926037, 0 17px 28px #0e201a73;
    }

    .cover::before, .cover::after {
      position: absolute;
      content: "";
    }

    .cover::before {
      inset: 0 auto 0 11px;
      width: 1px;
      background: #86572e80;
      box-shadow: 2px 0 #f8d89a69;
    }

    .cover::after {
      inset: 13px 12px 13px 22px;
      border: 1px solid #fae0a5a6;
      border-radius: 2px;
      background: linear-gradient(#fae0a5a6, #fae0a5a6) 12px 17px / 30px 1px no-repeat;
    }

    .slip {
      position: absolute;
      top: 32px;
      left: 154px;
      width: 110px;
      height: 153px;
      transform: rotate(13deg);
      border: 1px solid #fff3d6;
      border-radius: 4px;
      background: linear-gradient(155deg, #fff3d8, #e9d7b5);
      box-shadow: 0 8px 22px #15251d59;
    }

    .slip::before {
      position: absolute;
      top: 18px;
      left: 15px;
      width: 35px;
      height: 4px;
      border-radius: 3px;
      background: #5d7258;
      box-shadow: 0 9px 0 -1px #b19a73;
      content: "";
    }

    .slip-rules {
      position: absolute;
      inset: 46px 14px 24px;
      background:
        linear-gradient(90deg, transparent 72%, #bda782 72% 73%, transparent 73%),
        repeating-linear-gradient(#bda782 0 1px, transparent 1px 15px);
    }

    .stamp {
      position: absolute;
      right: 11px;
      bottom: 12px;
      display: grid;
      width: 33px;
      height: 33px;
      place-items: center;
      border: 1px solid #6b8063;
      border-radius: 50%;
      background: #e6e9d2;
      box-shadow: inset 0 0 0 3px #e6e9d2, inset 0 0 0 4px #a3af95;
    }

    .stamp::after {
      width: 11px;
      height: 6px;
      transform: translateY(-1px) rotate(-45deg);
      border-bottom: 2px solid #43624a;
      border-left: 2px solid #43624a;
      content: "";
    }

    .spark {
      position: absolute;
      width: 14px;
      height: 14px;
      background:
        linear-gradient(#d6c59a, #d6c59a) center / 1px 100% no-repeat,
        linear-gradient(#d6c59a, #d6c59a) center / 100% 1px no-repeat;
    }

    .spark-top { top: 42px; left: 43px; }

    .spark-bottom {
      right: 31px;
      bottom: 43px;
      width: 9px;
      height: 9px;
      opacity: .7;
    }

    .branch-panel {
      margin-top: 28px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      box-shadow: 0 3px 9px #40382208;
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 21px 26px 19px;
    }

    h2 {
      font-size: 34px;
      line-height: 1.05;
      letter-spacing: -.04em;
    }

    .result-count {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .filters {
      display: flex;
      flex-shrink: 0;
      gap: 3px;
      padding: 4px;
      border: 1px solid #e4e5da;
      border-radius: 11px;
      background: #f0f1e9;
    }

    .filter {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 5px 12px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font: 700 13px/1.2 var(--sans);
      white-space: nowrap;
      transition: background-color 150ms, color 150ms;
    }

    .filter:hover { background: #e5e9df; }

    .filter[aria-pressed="true"] {
      background: var(--green);
      color: #fffdf2;
    }

    .filter:focus-visible {
      z-index: 1;
      outline: 2px solid #397053;
      outline-offset: 2px;
    }

    .filter-count {
      display: inline-grid;
      min-width: 21px;
      height: 21px;
      place-items: center;
      border-radius: 50px;
      background: #e2e6dc;
      color: #465445;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .filter[aria-pressed="true"] .filter-count {
      background: #486656;
      color: #fffdf2;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-variant-numeric: tabular-nums;
    }

    .branch-column { width: 54%; }
    .number-column { width: 23%; }

    thead {
      border-block: 1px solid var(--line);
      background: #f3f3eb;
      color: #515e51;
      font-size: 11px;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    th, td { padding-inline: 26px; }

    thead th {
      height: 42px;
      padding-block: 8px;
      font-weight: 700;
    }

    th:first-child { text-align: left; }
    th:not(:first-child), td { text-align: right; }

    tbody th, tbody td {
      height: 63px;
      padding-block: 10px;
    }

    tbody tr + tr { border-top: 1px solid var(--line); }
    tbody tr:hover { background: #f9f8f0; }

    .branch-name {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-size: 15px;
      font-weight: 700;
    }

    .pin {
      position: relative;
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: #edf0e6;
      color: #4c6956;
    }

    .pin::before, .pin::after {
      position: absolute;
      content: "";
    }

    .pin::before {
      top: 8px;
      left: 10px;
      width: 10px;
      height: 10px;
      transform: rotate(-45deg);
      border: 1.5px solid currentColor;
      border-radius: 55% 55% 55% 0;
    }

    .pin::after {
      top: 11.5px;
      left: 13.5px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: currentColor;
    }

    .waiting { font-size: 17px; font-weight: 700; }

    .expiry {
      display: inline-grid;
      min-width: 38px;
      min-height: 28px;
      place-items: center;
      border-radius: 50px;
      background: #eef0e9;
      color: #536052;
      font-size: 14px;
      font-weight: 700;
    }

    .expiry-due {
      background: #f7e6c7;
      color: #744918;
    }

    @media (max-width: 760px) {
      .wrap { width: calc(100% - 40px); }
      .overview { padding-inline: 30px; }
      .illustration {
        right: 12px;
        transform: translateY(-50%) scale(.8);
        transform-origin: right center;
      }
    }

    @media (max-width: 560px) {
      .wrap { width: calc(100% - 36px); }
      .masthead-inner { min-height: 57px; }
      main { padding-block: 20px 36px; }

      .overview {
        min-height: 203px;
        padding: 24px 22px;
        border-radius: 15px;
      }

      h1 { font-size: clamp(43px, 13vw, 58px); }
      .scope { margin-top: 5px; font-size: 13px; }
      .totals { gap: 15px; margin-top: 19px; }
      .metric + .metric { padding-inline-start: 15px; }
      .metric dt { font-size: 12px; }
      .metric dd { font-size: 30px; }

      .illustration {
        top: auto;
        right: -7px;
        bottom: -3px;
        transform: scale(.48);
        transform-origin: right bottom;
      }

      .branch-panel { margin-top: 19px; border-radius: 14px; }

      .panel-heading {
        align-items: stretch;
        flex-direction: column;
        gap: 13px;
        padding: 17px 16px 15px;
      }

      h2 { font-size: 30px; }
      .result-count { margin-top: 3px; font-size: 13px; }
      .filter { flex: 1; gap: 6px; padding-inline: 8px; }

      .branch-column { width: 40%; }
      .number-column { width: 30%; }
      th, td { padding-inline: 9px; }
      th:first-child { padding-inline-start: 16px; }
      th:last-child, td:last-child { padding-inline-end: 16px; }

      thead {
        font-size: 11px;
        letter-spacing: .015em;
        text-transform: none;
      }

      tbody th, tbody td { height: 57px; }
      .branch-name { gap: 8px; font-size: 14px; }
      .waiting { font-size: 16px; }
      .expiry { min-width: 34px; }
    }

    @media (max-width: 360px) {
      .illustration, .pin { display: none; }
      .filter { font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .filter { transition: none; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <span class="identity"><span class="book-mark" aria-hidden="true"></span>Library desk</span>
      <span class="day"><span class="calendar" aria-hidden="true"></span>Today</span>
    </div>
  </header>

  <main class="wrap">
    <section class="overview" aria-labelledby="page-title">
      <div class="overview-content">
        <h1 id="page-title">Hold pickups</h1>
        <p class="scope">Across all branches</p>
        <dl class="totals">
          <div class="metric">
            <dt>Holds waiting</dt>
            <dd>36</dd>
          </div>
          <div class="metric metric-due">
            <dt>Expire today</dt>
            <dd>6</dd>
          </div>
        </dl>
      </div>
      <div class="illustration" aria-hidden="true">
        <span class="orbit"></span>
        <span class="spark spark-top"></span>
        <span class="spark spark-bottom"></span>
        <span class="cover"></span>
        <span class="slip">
          <span class="slip-rules"></span>
          <span class="stamp"></span>
        </span>
      </div>
    </section>

    <section class="branch-panel" aria-labelledby="branch-heading">
      <div class="panel-heading">
        <div>
          <h2 id="branch-heading">Pickup by branch</h2>
          <p class="result-count" id="branch-count" role="status" aria-atomic="true">Showing 3 of 3 branches</p>
        </div>
        <div class="filters" role="group" aria-label="Filter branches">
          <button class="filter" type="button" data-filter="all" aria-pressed="true" aria-controls="branch-table">
            All branches <span class="filter-count" aria-hidden="true">3</span>
          </button>
          <button class="filter" type="button" data-filter="expiring" aria-pressed="false" aria-controls="branch-table">
            Expiring today <span class="filter-count" aria-hidden="true">2</span>
          </button>
        </div>
      </div>

      <table id="branch-table" aria-labelledby="branch-heading">
        <colgroup>
          <col class="branch-column">
          <col class="number-column">
          <col class="number-column">
        </colgroup>
        <thead>
          <tr>
            <th scope="col">Branch</th>
            <th scope="col">Holds waiting</th>
            <th scope="col">Expire today</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row"><span class="branch-name"><span class="pin" aria-hidden="true"></span>Downtown</span></th>
            <td class="waiting">18</td>
            <td><data class="expiry expiry-due" value="4">4</data></td>
          </tr>
          <tr>
            <th scope="row"><span class="branch-name"><span class="pin" aria-hidden="true"></span>North</span></th>
            <td class="waiting">11</td>
            <td><data class="expiry expiry-due" value="2">2</data></td>
          </tr>
          <tr>
            <th scope="row"><span class="branch-name"><span class="pin" aria-hidden="true"></span>River</span></th>
            <td class="waiting">7</td>
            <td><data class="expiry" value="0">0</data></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script>
    const filters = document.querySelectorAll(".filter");
    const rows = document.querySelectorAll("#branch-table tbody tr");
    const branchCount = document.getElementById("branch-count");

    function applyFilter(selected) {
      if (selected.getAttribute("aria-pressed") === "true") return;

      for (const filter of filters) {
        filter.setAttribute("aria-pressed", String(filter === selected));
      }

      const expiringOnly = selected.dataset.filter === "expiring";
      let shown = 0;

      for (const row of rows) {
        const expiresToday = Number(row.querySelector(".expiry").value);
        row.hidden = expiringOnly && expiresToday === 0;
        if (!row.hidden) shown += 1;
      }

      branchCount.textContent = `Showing ${shown} of ${rows.length} branches`;
    }

    for (const filter of filters) {
      filter.addEventListener("click", () => applyFilter(filter));
    }
  </script>
</body>
</html>
