<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today’s hold pickups</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Sans+Condensed:wght@600&amp;display=swap">
  <style>
    :root {
      --ink: #14181b;
      --slate: #253035;
      --paper: #eef0ec;
      --muted: #52615f;
      --stamp: #ffaa72;
      --rule: color-mix(in srgb, var(--muted) 34%, var(--paper));
      --tint: color-mix(in srgb, var(--muted) 9%, var(--paper));
      --body: "IBM Plex Sans", sans-serif;
      --display: "IBM Plex Sans Condensed", "Liberation Sans Narrow", sans-serif;
      --gutter: clamp(20px, 5vw, 72px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 1rem/1.45 var(--body);
    }

    h1, h2, p {
      margin: 0;
    }

    h1, h2 {
      font-family: var(--display);
      font-weight: 600;
    }

    .frame {
      width: min(1100px, calc(100% - 2 * var(--gutter)));
      margin-inline: auto;
    }

    .overview {
      padding-block: 54px 38px;
      background: var(--ink);
      color: var(--paper);
    }

    h1 {
      font-size: clamp(3.5rem, 5.75vw, 5.25rem);
      line-height: .99;
      letter-spacing: -.035em;
    }

    .summary {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(240px, 1fr);
      margin-top: 30px;
      background: var(--slate);
    }

    .metric {
      display: flex;
      align-items: center;
      gap: clamp(14px, 2vw, 28px);
      min-block-size: 150px;
      padding: 22px clamp(20px, 3vw, 42px);
    }

    .metric--due {
      --art-width: clamp(130px, 16vw, 198px);
      position: relative;
      overflow: hidden;
      padding-inline-end: calc(var(--art-width) + 16px);
      background: var(--stamp);
      color: var(--ink);
    }

    .metric-number {
      flex: none;
      font: 600 clamp(3.5rem, 5.3vw, 4.875rem)/.9 var(--display);
      font-variant-numeric: tabular-nums;
      letter-spacing: -.035em;
    }

    .metric--due .metric-number {
      font-size: clamp(4.5rem, 6.8vw, 6.125rem);
    }

    .metric-label {
      display: block;
      font-size: clamp(1.125rem, 1.9vw, 1.625rem);
      font-weight: 600;
      line-height: 1.16;
    }

    .metric-detail {
      display: block;
      margin-top: 6px;
      font-size: .9375rem;
    }

    .metric--waiting .metric-detail {
      color: color-mix(in srgb, var(--paper) 76%, var(--slate));
    }

    .slip-art {
      --slip-line: color-mix(in srgb, var(--ink) 57%, var(--stamp));
      position: absolute;
      inset: 0 0 0 auto;
      inline-size: var(--art-width);
      border-inline-start: 1px dashed var(--slip-line);
      pointer-events: none;
    }

    .slip-art::before,
    .slip-art::after {
      position: absolute;
      z-index: 1;
      inset-inline-start: -6px;
      inline-size: 11px;
      block-size: 11px;
      border-radius: 50%;
      background: var(--ink);
      content: "";
    }

    .slip-art::before {
      inset-block-start: -5.5px;
    }

    .slip-art::after {
      inset-block-end: -5.5px;
    }

    .slip {
      position: absolute;
      inset-inline-start: 28%;
      inset-block-end: 12%;
      inline-size: 45%;
      block-size: 76%;
      border: 1px solid var(--slip-line);
      border-radius: 2px;
    }

    .slip--back {
      background: color-mix(in srgb, var(--stamp) 87%, var(--ink));
      transform: translate(12%, -4%) rotate(13deg);
    }

    .slip--front {
      background: color-mix(in srgb, var(--stamp) 62%, var(--paper));
      color: var(--slip-line);
      transform: rotate(-12deg);
    }

    .slip--front::before {
      position: absolute;
      inset: 13% 12% auto;
      block-size: 14%;
      border-block: 1px solid currentColor;
      background: linear-gradient(currentColor, currentColor) left center / 46% 1px no-repeat;
      content: "";
    }

    .slip--front::after {
      position: absolute;
      inset: 38% 12% 11%;
      border-block-end: 1px solid currentColor;
      background:
        linear-gradient(currentColor, currentColor) 64% 0 / 1px 100% no-repeat,
        repeating-linear-gradient(to bottom, currentColor 0 1px, transparent 1px 25%);
      opacity: .72;
      content: "";
    }

    .ledger {
      padding-block: 38px 54px;
    }

    .ledger-toolbar,
    .ledger-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
    }

    .ledger-toolbar {
      justify-content: space-between;
      gap: 14px 24px;
      margin-bottom: 16px;
    }

    .ledger-heading {
      align-items: baseline;
      gap: 4px 18px;
    }

    h2 {
      font-size: 2.375rem;
      line-height: 1.04;
      letter-spacing: -.025em;
    }

    #branch-count {
      color: var(--muted);
      font-size: .9375rem;
      font-variant-numeric: tabular-nums;
    }

    .branch-filter {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: var(--tint);
    }

    .branch-filter button {
      min-block-size: 44px;
      padding: 6px 16px;
      border: 1px solid transparent;
      border-radius: 2px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font: 600 .9375rem/1.25 var(--body);
    }

    .branch-filter button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--paper);
    }

    .branch-filter button:focus-visible {
      position: relative;
      z-index: 1;
      outline: 2px solid var(--ink);
      outline-offset: 2px;
      box-shadow: 0 0 0 2px var(--paper);
    }

    @media (hover: hover) {
      .branch-filter button[aria-pressed="false"]:hover {
        background: var(--paper);
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .branch-filter button {
        transition: background-color 130ms ease-out, color 130ms ease-out;
      }
    }

    @media (forced-colors: active) {
      .branch-filter button[aria-pressed="true"] {
        border-color: ButtonText;
        text-decoration: underline;
      }
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      border-block: 1px solid var(--muted);
    }

    .branch-column {
      width: 54%;
    }

    th, td {
      padding-inline: 20px;
      text-align: center;
    }

    th:first-child {
      text-align: left;
    }

    thead th {
      padding-block: 11px;
      border-bottom: 1px solid var(--rule);
      background: var(--tint);
      color: var(--muted);
      font-size: .9375rem;
      font-weight: 600;
    }

    tbody tr {
      border-bottom: 1px solid var(--rule);
    }

    tbody th, tbody td {
      height: 64px;
      padding-block: 8px;
    }

    tbody th {
      font-size: 1.125rem;
      font-weight: 600;
    }

    tbody td {
      font: 600 1.5rem/1 var(--display);
      font-variant-numeric: tabular-nums;
    }

    .expiry-count {
      display: inline-grid;
      min-inline-size: 36px;
      min-block-size: 32px;
      padding: 3px 6px;
      place-items: center;
      color: var(--muted);
    }

    .expiry-count--due {
      background: color-mix(in srgb, var(--stamp) 45%, var(--paper));
      box-shadow: inset 0 -2px var(--stamp);
      color: var(--ink);
    }

    @media (max-width: 720px) {
      .overview {
        padding-block: 30px 22px;
      }

      h1 {
        font-size: clamp(3.125rem, 14.8vw, 4rem);
      }

      .title-subject {
        display: block;
      }

      .summary {
        grid-template-columns: minmax(0, 1fr);
        margin-top: 23px;
      }

      .metric {
        gap: 14px;
        padding: 12px 16px;
      }

      .metric--due {
        --art-width: clamp(86px, 26vw, 158px);
        min-block-size: 104px;
        padding-inline-end: calc(var(--art-width) + 10px);
      }

      .metric--due .metric-number {
        font-size: 4.125rem;
      }

      .metric-label {
        font-size: 1.125rem;
      }

      .metric-detail {
        margin-top: 4px;
        font-size: .875rem;
      }

      .metric--waiting {
        min-block-size: 60px;
      }

      .metric--waiting .metric-number {
        font-size: 2.375rem;
      }

      .metric--waiting .metric-copy {
        display: flex;
        flex: 1;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 2px 8px;
      }

      .metric--waiting .metric-detail {
        margin-top: 0;
      }

      .slip {
        inset-inline-start: 24%;
        inline-size: 52%;
        block-size: 70%;
      }

      .ledger {
        padding-block: 26px 34px;
      }

      .ledger-toolbar {
        display: grid;
        gap: 12px;
        margin-bottom: 14px;
      }

      .ledger-heading {
        justify-content: space-between;
      }

      h2 {
        font-size: 2rem;
      }

      #branch-count {
        font-size: .875rem;
      }

      .branch-column {
        width: 42%;
      }

      .expiry-column {
        width: 32%;
      }

      th, td {
        padding-inline: 10px;
      }

      thead th {
        font-size: .875rem;
      }

      tbody th, tbody td {
        height: 56px;
      }

      tbody th {
        font-size: 1.0625rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="overview">
      <div class="frame">
        <h1>Today’s <span class="title-subject">hold pickups</span></h1>

        <!-- These totals cover all three branches. -->
        <div class="summary" role="group" aria-label="Totals across all branches">
          <div class="metric metric--due">
            <strong class="metric-number">6</strong>
            <p class="metric-copy">
              <span class="metric-label">Holds expire today</span>
              <span class="metric-detail">Across 2 branches</span>
            </p>
            <div class="slip-art" aria-hidden="true">
              <span class="slip slip--back"></span>
              <span class="slip slip--front"></span>
            </div>
          </div>

          <div class="metric metric--waiting">
            <strong class="metric-number">36</strong>
            <p class="metric-copy">
              <span class="metric-label">Holds waiting</span>
              <span class="metric-detail">Across all branches</span>
            </p>
          </div>
        </div>
      </div>
    </header>

    <section class="ledger frame" aria-labelledby="branch-heading">
      <div class="ledger-toolbar">
        <div class="ledger-heading">
          <h2 id="branch-heading">By branch</h2>
          <p id="branch-count" role="status" aria-atomic="true">Showing 3 of 3 branches</p>
        </div>

        <div class="branch-filter" role="group" aria-label="Filter branches">
          <button type="button" data-filter="all" aria-controls="pickup-table" aria-pressed="true">All branches</button>
          <button type="button" data-filter="expiring" aria-controls="pickup-table" aria-pressed="false">Expiring today</button>
        </div>
      </div>

      <table id="pickup-table" aria-labelledby="branch-heading">
        <colgroup>
          <col class="branch-column">
          <col>
          <col class="expiry-column">
        </colgroup>
        <thead>
          <tr>
            <th scope="col">Branch</th>
            <th scope="col">Waiting</th>
            <th scope="col">Expire today</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">Downtown</th>
            <td>18</td>
            <td><span class="expiry-count expiry-count--due">4</span></td>
          </tr>
          <tr>
            <th scope="row">North</th>
            <td>11</td>
            <td><span class="expiry-count expiry-count--due">2</span></td>
          </tr>
          <tr>
            <th scope="row">River</th>
            <td>7</td>
            <td><span class="expiry-count">0</span></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script>
    const filterButtons = document.querySelectorAll(".branch-filter button");
    const count = document.getElementById("branch-count");
    const branches = Array.from(document.querySelectorAll("#pickup-table tbody tr"), row => ({
      row,
      expiring: Number(row.querySelector(".expiry-count").textContent)
    }));

    for (const button of filterButtons) {
      button.addEventListener("click", () => {
        if (button.getAttribute("aria-pressed") === "true") return;

        const expiringOnly = button.dataset.filter === "expiring";
        let visibleCount = 0;

        for (const branch of branches) {
          const show = !expiringOnly || branch.expiring > 0;
          branch.row.hidden = !show;
          if (show) visibleCount++;
        }

        for (const filterButton of filterButtons) {
          filterButton.setAttribute("aria-pressed", String(filterButton === button));
        }

        count.textContent = `Showing ${visibleCount} of ${branches.length} branches`;
      });
    }
  </script>
</body>
</html>
