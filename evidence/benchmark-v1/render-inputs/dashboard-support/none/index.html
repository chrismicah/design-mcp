<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Queue summary</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
  <style>
    :root {
      color-scheme: light;
      --ink: #241d36;
      --muted: #625b72;
      --line: #e7e3ee;
      --surface: #fff;
      --accent: #503689;
      --sorted-heading: #eee8fb;
      --sorted-cell: #f8f5fe;
      --sorted-line: #e5dcf6;
      --past-sla: #873b2b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(ellipse at 72% 0%, #efeafa, transparent 58%) #f7f7fb;
      color: var(--ink);
      font-family: Manrope, system-ui, sans-serif;
      line-height: 1.5;
    }

    .layout {
      width: min(1040px, calc(100% - 64px));
      margin-inline: auto;
    }

    .masthead {
      padding-block: 15px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .masthead .layout {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: .9375rem;
      font-weight: 800;
    }

    .queue-mark {
      display: flex;
      width: 32px;
      height: 32px;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 3px;
      padding-inline: 8px;
      border-radius: 9px;
      background: #352352;
    }

    .queue-mark span {
      width: 100%;
      height: 2px;
      border-radius: 2px;
      background: #fff;
    }

    .queue-mark span:nth-child(2) { width: 75%; }
    .queue-mark span:nth-child(3) { width: 50%; }

    main {
      padding-block: 50px 64px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.125rem, 4vw, 3.25rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -.055em;
    }

    .overview {
      margin: 10px 0 0;
      color: var(--muted);
    }

    .overview strong {
      color: var(--ink);
      font-weight: 800;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin: 28px 0 0;
    }

    .metric {
      position: relative;
      min-width: 0;
      padding: 21px 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 3px 8px rgb(36 29 54 / 4%);
    }

    .metric--past-sla {
      border-color: #efd9d2;
      background: #fff4f0;
      color: var(--past-sla);
    }

    .metric dt {
      padding-inline-end: 46px;
      color: var(--muted);
      font-size: .875rem;
      font-weight: 800;
    }

    .metric--past-sla dt {
      color: var(--past-sla);
    }

    .metric dd {
      margin: 7px 0 0;
      font-size: 2.875rem;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -.05em;
    }

    .metric-icon {
      position: absolute;
      inset-block-start: 20px;
      inset-inline-end: 22px;
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 11px;
      background: #eee8fa;
      color: var(--accent);
    }

    .metric--past-sla .metric-icon {
      background: #fbe4dc;
      color: var(--past-sla);
    }

    .ticket, .clock {
      position: relative;
      border: 1.5px solid currentColor;
    }

    .ticket {
      width: 18px;
      height: 13px;
      border-radius: 3px;
    }

    .ticket::after {
      position: absolute;
      inset-block: 2px;
      inset-inline-end: 4px;
      border-inline-start: 1px dashed currentColor;
      content: "";
    }

    .clock {
      width: 17px;
      height: 17px;
      border-radius: 50%;
    }

    .clock::after {
      position: absolute;
      top: 3px;
      left: 6px;
      width: 4px;
      height: 5px;
      border-bottom: 1.5px solid currentColor;
      border-left: 1.5px solid currentColor;
      content: "";
    }

    .queue-card {
      --cell-padding: 24px;
      overflow: hidden;
      margin-top: 26px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgb(36 29 54 / 5%);
    }

    .queue-card h2 {
      margin: 0;
      padding: 17px var(--cell-padding);
      border-bottom: 1px solid var(--line);
      font-size: 1.125rem;
      font-weight: 800;
      letter-spacing: -.025em;
    }

    table {
      width: 100%;
      border-spacing: 0;
      table-layout: fixed;
      text-align: left;
    }

    .queue-width { width: 46%; }
    .open-width { width: 23%; }
    .sla-width { width: 31%; }

    thead {
      background: #f7f6fa;
      color: var(--muted);
      font-size: .8125rem;
      font-weight: 800;
    }

    thead th {
      padding: 12px var(--cell-padding);
      border-bottom: 1px solid var(--line);
    }

    .number {
      text-align: right;
    }

    .metric dd, .number {
      font-variant-numeric: tabular-nums;
    }

    .sort-heading {
      padding: 0;
      border-inline-start: 1px solid var(--sorted-line);
      background: var(--sorted-heading);
    }

    .sort-button {
      display: flex;
      width: 100%;
      min-height: 61px;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 9px var(--cell-padding);
      border: 0;
      background: transparent;
      color: var(--accent);
      font: inherit;
      text-align: right;
      cursor: pointer;
    }

    .sort-button:hover {
      background: #e7ddf8;
    }

    .sort-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -4px;
      border-radius: 5px;
    }

    .sort-copy {
      display: grid;
      gap: 2px;
      line-height: 1.22;
      white-space: nowrap;
    }

    .sort-direction {
      font-size: .75rem;
      font-weight: 600;
    }

    .sort-icon {
      display: grid;
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      place-items: center;
      border-radius: 8px;
      background: var(--accent);
      color: white;
    }

    .sort-arrow {
      position: relative;
      width: 14px;
      height: 14px;
    }

    .sort-arrow::before, .sort-arrow::after {
      position: absolute;
      content: "";
    }

    .sort-arrow::before {
      top: 1px;
      left: 6px;
      width: 2px;
      height: 11px;
      border-radius: 1px;
      background: currentColor;
    }

    .sort-arrow::after {
      top: 5px;
      left: 3.5px;
      width: 7px;
      height: 7px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg);
    }

    [aria-sort="ascending"] .sort-arrow {
      transform: rotate(180deg);
    }

    tbody th, tbody td {
      padding: 16px var(--cell-padding);
      font-size: .9375rem;
      font-weight: 700;
    }

    tbody tr + tr > * {
      border-top: 1px solid var(--line);
    }

    .sla-cell {
      border-inline-start: 1px solid var(--sorted-line);
      background: var(--sorted-cell);
    }

    .sla-count {
      display: inline-grid;
      min-width: 32px;
      min-height: 28px;
      place-items: center;
      border-radius: 8px;
      color: var(--muted);
      font-weight: 800;
    }

    .sla-count--overdue {
      background: #fbe5df;
      color: var(--past-sla);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .layout { width: calc(100% - 36px); }
      .masthead { padding-block: 12px; }
      .queue-mark { width: 29px; height: 29px; }
      main { padding-block: 32px 40px; }
      .overview { font-size: .9375rem; }

      .metrics {
        gap: 10px;
        margin-top: 22px;
      }

      .metric {
        padding: 15px 13px;
        border-radius: 14px;
      }

      .metric dt {
        padding-inline-end: 32px;
        font-size: .8125rem;
      }

      .metric dd { font-size: 2.375rem; }

      .metric-icon {
        inset-block-start: 13px;
        inset-inline-end: 12px;
        width: 30px;
        height: 30px;
        border-radius: 8px;
      }

      .queue-card {
        --cell-padding: 14px;
        margin-top: 20px;
        border-radius: 15px;
      }

      .queue-card h2 { padding-block: 14px; }
      .queue-width { width: 35%; }
      .open-width { width: 22%; }
      .sla-width { width: 43%; }
      .sort-button { min-height: 56px; }
      tbody th, tbody td { padding-block: 13px; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="layout">
      <span class="queue-mark" aria-hidden="true"><span></span><span></span><span></span></span>
      <span>Support</span>
    </div>
  </header>

  <main class="layout">
    <h1>Queue summary</h1>
    <p class="overview"><strong>2 of 3 queues</strong> have tickets past SLA.</p>

    <dl class="metrics" aria-label="Totals across all queues">
      <div class="metric">
        <dt>
          Open tickets
          <span class="metric-icon" aria-hidden="true"><span class="ticket"></span></span>
        </dt>
        <dd>31</dd>
      </div>
      <div class="metric metric--past-sla">
        <dt>
          Past SLA
          <span class="metric-icon" aria-hidden="true"><span class="clock"></span></span>
        </dt>
        <dd>5</dd>
      </div>
    </dl>

    <section class="queue-card" aria-labelledby="queue-heading">
      <h2 id="queue-heading">By queue</h2>
      <table aria-labelledby="queue-heading">
        <colgroup>
          <col class="queue-width">
          <col class="open-width">
          <col class="sla-width">
        </colgroup>
        <thead>
          <tr>
            <th scope="col">Queue</th>
            <th scope="col" class="number">Open</th>
            <th scope="col" class="sort-heading" id="sla-heading" aria-sort="descending">
              <button class="sort-button" id="sla-sort" type="button">
                <span class="sort-copy">
                  <span><span class="visually-hidden">Sort by </span>Past SLA</span>
                  <span class="sort-direction" id="sort-direction">High to low</span>
                </span>
                <span class="sort-icon" aria-hidden="true"><span class="sort-arrow"></span></span>
              </button>
            </th>
          </tr>
        </thead>
        <tbody id="queue-rows">
          <tr>
            <th scope="row">East</th>
            <td class="number">14</td>
            <td class="number sla-cell"><span class="sla-count sla-count--overdue">3</span></td>
          </tr>
          <tr>
            <th scope="row">West</th>
            <td class="number">11</td>
            <td class="number sla-cell"><span class="sla-count sla-count--overdue">2</span></td>
          </tr>
          <tr>
            <th scope="row">Central</th>
            <td class="number">6</td>
            <td class="number sla-cell"><span class="sla-count">0</span></td>
          </tr>
        </tbody>
      </table>
      <div class="visually-hidden" id="sort-status" role="status"></div>
    </section>
  </main>

  <script>
    const queueRows = document.getElementById("queue-rows");
    const slaHeading = document.getElementById("sla-heading");
    const sortButton = document.getElementById("sla-sort");
    const sortDirection = document.getElementById("sort-direction");
    const sortStatus = document.getElementById("sort-status");

    sortButton.addEventListener("click", () => {
      const ascending = slaHeading.getAttribute("aria-sort") === "descending";
      const direction = ascending ? "Low to high" : "High to low";
      const multiplier = ascending ? 1 : -1;

      const sortedRows = Array.from(queueRows.rows).sort((first, second) => {
        const firstCount = Number(first.cells[2].textContent);
        const secondCount = Number(second.cells[2].textContent);
        return multiplier * (firstCount - secondCount);
      });

      queueRows.append(...sortedRows);
      slaHeading.setAttribute("aria-sort", ascending ? "ascending" : "descending");
      sortDirection.textContent = direction;
      sortStatus.textContent = `Sorted by past SLA, ${direction.toLowerCase()}.`;
    });
  </script>
</body>
</html>
