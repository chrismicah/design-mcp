<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Queue summary</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Sans+Condensed:wght@600&amp;display=swap">
  <style>
    :root {
      color-scheme: dark;
      --paper: #14181b;
      --ink: #eef0ec;
      --muted: #b1babc;
      --line: #343d41;
      --accent: #ffaa72;
      --accent-ink: #211813;
      --warm-line: #594234;
      --display-font: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(ellipse at top, #1c2326, transparent 65%), var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
    }

    main {
      --gutter: clamp(18px, 5vw, 56px);
      width: calc(100% - var(--gutter) - var(--gutter));
      max-width: 984px;
      margin-inline: auto;
      padding-block: clamp(44px, 7vw, 100px) 48px;
    }

    h1 {
      margin: 0 0 clamp(24px, 3vw, 36px);
      font: 600 clamp(2.75rem, 5vw, 4.5rem) / 1 var(--display-font);
      letter-spacing: -0.025em;
    }

    .exception {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-block-end: clamp(24px, 3.5vw, 40px);
      padding: 21px 24px;
      border: 1px solid var(--warm-line);
      border-inline-start: 3px solid var(--accent);
      background: linear-gradient(108deg, #30251f, #241f1d 66%, #30251f);
    }

    .exception h2 {
      margin: 0 0 5px;
      color: #ebbe9e;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .exception-queue {
      margin: 0;
      font: 600 clamp(1.75rem, 3vw, 2.375rem) / 1.05 var(--display-font);
      letter-spacing: -0.02em;
    }

    .exception-count {
      display: grid;
      flex: none;
      place-items: center;
      inline-size: clamp(56px, 6vw, 76px);
      aspect-ratio: 1;
      margin: 0;
      background: var(--accent);
      color: var(--accent-ink);
      font: 600 clamp(2.375rem, 4vw, 3.25rem) / 1 var(--display-font);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      border: 1px solid var(--line);
    }

    .queue-column { width: 48%; }
    .open-column { width: 19%; }
    .sla-column { width: 33%; }

    th,
    td {
      padding: 0 24px;
      text-align: start;
    }

    thead th {
      height: 62px;
      background: #1c2225;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 600;
    }

    tbody tr {
      border-top: 1px solid var(--line);
    }

    tbody th,
    tbody td {
      height: 57px;
      background: #181d20;
      font-size: 1rem;
    }

    tbody th {
      font-weight: 600;
    }

    .open {
      text-align: end;
    }

    td.open {
      color: #c6cecd;
    }

    .sort-header,
    .past-sla {
      border-inline-start: 1px solid var(--warm-line);
    }

    .sort-header {
      padding: 0;
      background: #352920;
    }

    .sort-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      min-height: 62px;
      padding: 10px 20px;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      text-align: start;
    }

    @media (hover: hover) {
      .sort-button:hover {
        background: #473326;
      }
    }

    .sort-button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: -4px;
      box-shadow: inset 0 0 0 6px var(--paper);
    }

    .sort-state {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-inline-size: 5.75rem;
      padding: 4px 7px;
      border-radius: 2px;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .sort-arrow {
      flex: none;
      width: 10px;
      height: 12px;
      background: currentColor;
      clip-path: polygon(42% 0, 58% 0, 58% 73%, 88% 48%, 100% 60%, 50% 100%, 0 60%, 12% 48%, 42% 73%);
      transition: transform 160ms ease-out;
    }

    [aria-sort="ascending"] .sort-arrow {
      transform: rotate(180deg);
    }

    .past-sla {
      padding-inline: 20px;
      background: #251f1c;
      font-weight: 600;
    }

    .past-value {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .count-marks {
      width: calc(var(--count) * 8px);
      height: 9px;
      background: repeating-linear-gradient(
        90deg,
        #d68c60 0 4px,
        transparent 4px 8px
      );
    }

    .zero {
      color: var(--muted);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 620px) {
      .exception {
        padding: 15px 16px;
      }

      .queue-column { width: 39%; }
      .open-column { width: 21%; }
      .sla-column { width: 40%; }

      th,
      td,
      .past-sla {
        padding-inline: 14px;
      }

      .sort-button {
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 5px;
        min-height: 68px;
        padding: 8px 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sort-arrow {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Queue summary</h1>

    <section class="exception" aria-labelledby="exception-heading">
      <div>
        <h2 id="exception-heading">Most cases past SLA</h2>
        <p class="exception-queue">East queue</p>
      </div>
      <p class="exception-count">3<span class="sr-only"> cases past SLA</span></p>
    </section>

    <table id="queues">
      <caption class="sr-only">Open and past SLA counts by queue</caption>
      <colgroup>
        <col class="queue-column">
        <col class="open-column">
        <col class="sla-column">
      </colgroup>
      <thead>
        <tr>
          <th scope="col">Queue</th>
          <th scope="col" class="open">Open</th>
          <th scope="col" id="sla-header" class="sort-header" aria-sort="descending">
            <button type="button" class="sort-button"
                    aria-label="Past SLA, high to low. Sort low to high.">
              <span>Past SLA</span>
              <span class="sort-state">
                <span class="sort-arrow" aria-hidden="true"></span>
                <span id="sort-direction">High to low</span>
              </span>
            </button>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">East</th>
          <td class="open">14</td>
          <td class="past-sla">
            <div class="past-value">
              <span>3</span>
              <span class="count-marks" style="--count: 3" aria-hidden="true"></span>
            </div>
          </td>
        </tr>
        <tr>
          <th scope="row">West</th>
          <td class="open">11</td>
          <td class="past-sla">
            <div class="past-value">
              <span>2</span>
              <span class="count-marks" style="--count: 2" aria-hidden="true"></span>
            </div>
          </td>
        </tr>
        <tr>
          <th scope="row">Central</th>
          <td class="open">6</td>
          <td class="past-sla zero">0</td>
        </tr>
      </tbody>
    </table>

    <p class="sr-only" id="sort-status" role="status"></p>
  </main>

  <script>
    const queueBody = document.getElementById("queues").tBodies[0];
    const queueRows = Array.from(queueBody.rows);
    const sortHeader = document.getElementById("sla-header");
    const sortButton = sortHeader.querySelector("button");
    const sortDirection = document.getElementById("sort-direction");
    const sortStatus = document.getElementById("sort-status");

    sortButton.addEventListener("click", () => {
      const ascending = sortHeader.getAttribute("aria-sort") === "descending";
      const sortedRows = queueRows.slice().sort((first, second) => {
        const difference = Number(first.cells[2].textContent) - Number(second.cells[2].textContent);
        return ascending ? difference : -difference;
      });

      const order = ascending ? "Low to high" : "High to low";
      const nextOrder = ascending ? "high to low" : "low to high";

      queueBody.append(...sortedRows);
      sortHeader.setAttribute("aria-sort", ascending ? "ascending" : "descending");
      sortDirection.textContent = order;
      sortButton.setAttribute("aria-label", `Past SLA, ${order.toLowerCase()}. Sort ${nextOrder}.`);
      sortStatus.textContent = `Queues sorted by past SLA, ${order.toLowerCase()}.`;
    });
  </script>
</body>
</html>
