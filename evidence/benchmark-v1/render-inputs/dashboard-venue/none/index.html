<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rehearsal rooms</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f2eb;
      --ink: #2d2024;
      --rule: #e5dbd0;
      --plum: #39242e;
      --display: "Instrument Serif", Georgia, serif;
      --text: "DM Sans", system-ui, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: radial-gradient(ellipse at 45% 0%, #fffbf4, transparent 72%), var(--paper);
      font-family: var(--text);
    }

    .shell {
      width: min(1104px, calc(100% - 64px));
      margin-inline: auto;
    }

    .masthead {
      border-bottom: 1px solid var(--rule);
    }

    .masthead-inner {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 66px;
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .masthead-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 8px;
      color: #f3d3a8;
      background: var(--plum);
    }

    .workspace {
      padding-block: 40px 66px;
    }

    .hero {
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      min-height: 300px;
      overflow: hidden;
      border: 1px solid #4e323b;
      border-radius: 18px;
      background: radial-gradient(ellipse at 76% 64%, #593933, #36222a 49%, #271a23 83%);
      box-shadow: 0 12px 28px #36201b17;
    }

    .hero h1 {
      position: relative;
      z-index: 2;
      margin: 0;
      padding: 36px clamp(28px, 4.3vw, 62px);
      color: #fff5e8;
      font-family: var(--display);
      font-size: clamp(4rem, 6.3vw, 5.625rem);
      font-weight: 400;
      line-height: 0.89;
      letter-spacing: -0.025em;
    }

    .hero h1 em {
      display: block;
      margin-top: 0.045em;
      color: #efc59b;
      font-weight: inherit;
    }

    .hero-art {
      position: absolute;
      inset: 0 0 0 auto;
      width: min(66%, 714px);
      height: 100%;
      mask-image: linear-gradient(90deg, transparent, black 15%);
      pointer-events: none;
    }

    .rooms {
      margin-top: 29px;
    }

    .filters {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--rule);
      border-radius: 12px;
      background: #eee7df;
    }

    .filter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 44px;
      padding: 0 14px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #57464b;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 150ms ease, color 150ms ease;
    }

    .filter[aria-pressed="true"] {
      background: var(--plum);
      color: #fff7ee;
      box-shadow: 0 1px 3px #36201b25;
    }

    .filter:focus-visible {
      outline: 2px solid #844957;
      outline-offset: 3px;
    }

    .filter-count {
      display: grid;
      min-width: 22px;
      height: 22px;
      place-items: center;
      border-radius: 6px;
      background: #dfd3ca;
      color: #503e40;
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
    }

    .filter[data-filter="delayed"] .filter-count {
      background: #eed8c9;
      color: #773c27;
    }

    .filter[aria-pressed="true"] .filter-count {
      background: #5c424d;
      color: #fff4e7;
    }

    .room-list {
      display: grid;
      gap: 10px;
      padding: 0;
      margin: 15px 0 0;
      list-style: none;
    }

    .room {
      --state-ink: #2e5846;
      --state-fill: #e7efe5;
      --symbol-fill: #eef3ec;
      --symbol-rule: #dde8db;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      min-height: 96px;
      padding: 16px 24px;
      border: 1px solid var(--rule);
      border-radius: 13px;
      background: #fffdf9;
      box-shadow: 0 2px 4px #49312a08;
    }

    .room[data-status="delayed"] {
      --state-ink: #833c25;
      --state-fill: #f5e0d3;
      --symbol-fill: #f8e8dd;
      --symbol-rule: #efd6c7;
      border-color: #e9ccbc;
      background: linear-gradient(103deg, #fcf0e7, #fffaf5 72%);
    }

    .room[hidden] {
      display: none;
    }

    .room-name {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .room-name h2 {
      margin: 0;
      font-family: var(--display);
      font-size: 2.375rem;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.015em;
    }

    .room-symbol {
      display: grid;
      flex: 0 0 auto;
      width: 46px;
      height: 46px;
      place-items: center;
      border: 1px solid var(--symbol-rule);
      border-radius: 10px;
      background: var(--symbol-fill);
      color: var(--state-ink);
    }

    .room-status {
      flex: 0 0 auto;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--state-fill);
      color: var(--state-ink);
      font-size: 0.875rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (hover: hover) {
      .filter[aria-pressed="false"]:hover {
        background: #e5dbd2;
        color: var(--ink);
      }
    }

    @media (max-width: 680px) {
      .shell {
        width: calc(100% - 36px);
      }

      .masthead-inner {
        min-height: 58px;
      }

      .workspace {
        padding-block: 21px 40px;
      }

      .hero {
        min-height: 212px;
        border-radius: 15px;
      }

      .hero h1 {
        padding-inline: 24px;
        font-size: clamp(3rem, 14vw, 4.5rem);
      }

      .hero-art {
        width: 79%;
      }

      .hero::after {
        position: absolute;
        z-index: 1;
        inset: 0;
        background: linear-gradient(90deg, #26182175, #2618214d 44%, transparent 80%);
        pointer-events: none;
        content: "";
      }

      .rooms {
        margin-top: 22px;
      }

      .filters {
        display: grid;
      }

      .room-list {
        margin-top: 12px;
      }

      .room {
        min-height: 82px;
        padding: 13px 14px;
      }

      .room-name {
        gap: 11px;
      }

      .room-name h2 {
        font-size: 2rem;
      }

      .room-symbol {
        width: 36px;
        height: 36px;
        border-radius: 8px;
      }

      .room-symbol svg {
        width: 19px;
        height: 19px;
      }

      .room-status {
        padding-inline: 10px;
        font-size: 0.8125rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .filter {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="shell masthead-inner">
      <span class="masthead-mark" aria-hidden="true">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round">
          <path d="M4.5 19.5v-7a7.5 7.5 0 0 1 15 0v7M8 19.5v-7a4 4 0 0 1 8 0v7M3 19.5h18"/>
        </svg>
      </span>
      <span>Stage management</span>
    </div>
  </header>

  <main class="shell workspace">
    <div class="hero">
      <h1>Rehearsal <em>rooms</em></h1>

      <svg class="hero-art" viewBox="0 0 750 332" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
        <defs>
          <radialGradient id="stage-haze">
            <stop stop-color="#d89666" stop-opacity=".36"/>
            <stop offset=".65" stop-color="#a26955" stop-opacity=".15"/>
            <stop offset="1" stop-color="#a26955" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="arch-metal" x2="100%" y2="75%">
            <stop stop-color="#996255"/>
            <stop offset=".48" stop-color="#edbd88"/>
            <stop offset="1" stop-color="#8b5855"/>
          </linearGradient>
          <linearGradient id="stage-depth" x2="0%" y2="100%">
            <stop stop-color="#21141c"/>
            <stop offset="1" stop-color="#44272b"/>
          </linearGradient>
          <linearGradient id="velvet" x2="100%" y2="65%">
            <stop stop-color="#381e2a"/>
            <stop offset=".56" stop-color="#733743"/>
            <stop offset="1" stop-color="#48232f"/>
          </linearGradient>
          <linearGradient id="beam" x2="0%" y2="100%">
            <stop stop-color="#ffdc9e" stop-opacity=".53"/>
            <stop offset=".64" stop-color="#f5bb7a" stop-opacity=".14"/>
            <stop offset="1" stop-color="#ffc788" stop-opacity=".31"/>
          </linearGradient>
          <radialGradient id="light-pool">
            <stop stop-color="#ffcf91" stop-opacity=".74"/>
            <stop offset="1" stop-color="#ffcf91" stop-opacity="0"/>
          </radialGradient>
          <clipPath id="stage-opening">
            <path d="M184 261V158C184 102 272 49 394 49S604 102 604 158V261Z"/>
          </clipPath>
        </defs>

        <g transform="translate(17 18)">
          <ellipse cx="394" cy="158" rx="292" ry="155" fill="url(#stage-haze)"/>

          <g fill="none" stroke="url(#arch-metal)">
            <path d="M141 261V153C141 79 239 15 394 15S647 79 647 153V261" opacity=".52"/>
            <path d="M151 261V154C151 84 245 25 394 25S637 84 637 154V261" opacity=".21"/>
            <path d="M164 261V157C164 92 255 36 394 36S624 92 624 157V261" stroke-width="1.4" opacity=".66"/>
            <path d="M173 261V158C173 99 263 42 394 42S615 99 615 158V261" opacity=".3"/>
            <path d="M141 158h32m442 0h32M141 248h32m442 0h32M136 255h43m430 0h43" opacity=".46"/>
          </g>

          <g clip-path="url(#stage-opening)">
            <rect x="184" y="48" width="420" height="213" fill="url(#stage-depth)"/>
            <path d="M399 65h8l87 183q-92 35-195 0Z" fill="url(#beam)"/>
            <path d="M401 65h4l60 184q-65 23-135 0Z" fill="url(#beam)" opacity=".45"/>
            <ellipse cx="397" cy="248" rx="111" ry="14" fill="url(#light-pool)"/>
            <ellipse cx="397" cy="250" rx="76" ry="7" fill="none" stroke="#ffcd91" opacity=".26"/>
            <path d="M396 64h14" stroke="#f5cb9c" stroke-width="1.5" stroke-linecap="round"/>

            <g fill="#f4ca98" opacity=".48">
              <circle cx="402" cy="104" r="1"/>
              <circle cx="387" cy="145" r="1.05"/>
              <circle cx="417" cy="160" r=".8"/>
              <circle cx="365" cy="201" r=".95"/>
              <circle cx="439" cy="209" r="1.05"/>
            </g>

            <g id="left-curtain">
              <path d="M177 43H334C323 99 292 153 246 176C252 198 261 229 271 261H177Z" fill="url(#velvet)"/>
              <path d="M179 43H280C271 104 253 151 226 178C234 204 236 235 248 261H179Z" fill="#2e1925" opacity=".34"/>
              <g fill="none" stroke="#d88b7e" opacity=".34">
                <path d="M215 63C217 114 221 147 234 176C231 202 234 230 241 261"/>
                <path d="M245 57C242 116 241 148 236 176C242 204 247 233 253 261"/>
                <path d="M276 51C271 111 257 151 242 176C250 203 256 232 263 261"/>
                <path d="M308 48C299 111 275 149 247 173"/>
                <path d="M194 98C196 137 207 158 225 179C219 205 217 233 219 261"/>
              </g>
              <path d="M183 177Q212 188 246 176q8 12 8 22v9" fill="none" stroke="#d5a474" stroke-width="1.1" opacity=".71"/>
            </g>
            <use href="#left-curtain" transform="translate(788 0) scale(-1 1)"/>
          </g>

          <path d="M184 261V158C184 102 272 49 394 49S604 102 604 158V261" fill="none" stroke="url(#arch-metal)" stroke-width="1.2" opacity=".74"/>
          <path d="M141 261h506l30 16H111Z" fill="#573737" stroke="#ad7c66" stroke-opacity=".46"/>
          <path d="M111 277h566l-9 8H120Z" fill="#2d1d25" stroke="#ad7c66" stroke-opacity=".36"/>
          <path d="M120 291h548" stroke="#c89372" opacity=".2"/>
        </g>
      </svg>
    </div>

    <section class="rooms" aria-label="Rehearsal room status">
      <div class="filters" role="group" aria-label="Filter rehearsal rooms">
        <button class="filter" type="button" data-filter="all" aria-controls="room-list" aria-pressed="true">
          All rooms <span class="filter-count" aria-hidden="true">2</span>
        </button>
        <button class="filter" type="button" data-filter="delayed" aria-controls="room-list" aria-pressed="false">
          Delayed <span class="filter-count" aria-hidden="true">1</span>
        </button>
      </div>

      <p class="visually-hidden" id="filter-announcement" role="status"></p>

      <ul class="room-list" id="room-list">
        <li class="room" data-status="delayed">
          <div class="room-name">
            <span class="room-symbol" aria-hidden="true">
              <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="8.5"/>
                <path d="M12 7.5V12l3 1.9"/>
              </svg>
            </span>
            <h2>Studio B</h2>
          </div>
          <span class="room-status"><time datetime="PT6M">6 min</time> late</span>
        </li>

        <li class="room" data-status="ready">
          <div class="room-name">
            <span class="room-symbol" aria-hidden="true">
              <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="8.5"/>
                <path d="m8.4 12.2 2.4 2.4 4.8-5.2"/>
              </svg>
            </span>
            <h2>Hall A</h2>
          </div>
          <span class="room-status">Ready</span>
        </li>
      </ul>
    </section>
  </main>

  <script>
    const roomList = document.getElementById("room-list");
    const filterButtons = document.querySelectorAll("[data-filter]");
    const announcement = document.getElementById("filter-announcement");

    function filterRooms(filter) {
      const showAll = filter === "all";

      for (const room of roomList.children) {
        room.hidden = !showAll && room.dataset.status !== filter;
      }

      for (const button of filterButtons) {
        button.setAttribute("aria-pressed", String(button.dataset.filter === filter));
      }

      announcement.textContent = showAll ? "Showing all rooms." : "Showing delayed rooms.";
    }

    for (const button of filterButtons) {
      button.addEventListener("click", () => filterRooms(button.dataset.filter));
    }
  </script>
</body>
</html>
