<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14181B">
  <title>Exhibit shortlist | Museum trip</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Sans+Condensed:wght@600&amp;display=swap">

  <style>
    :root {
      color-scheme: dark;
      --graphite: #14181B;
      --slate: #1D2327;
      --chalk: #EEF0EC;
      --mist: #B3BDBF;
      --rule: #3C494E;
      --apricot: #FFAA72;
      --body-font: "IBM Plex Sans", sans-serif;
      --display-font: "IBM Plex Sans Condensed", var(--body-font);
      --gutter: clamp(1.25rem, 4vw, 3rem);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--graphite);
      color: var(--chalk);
      font: 400 1rem/1.5 var(--body-font);
    }

    .page-width {
      width: min(calc(100% - var(--gutter) - var(--gutter)), 64rem);
      margin-inline: auto;
    }

    .masthead {
      border-block-end: 1px solid var(--rule);
    }

    .masthead-inner {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-block-size: 4rem;
      font-weight: 500;
    }

    .bookmark {
      inline-size: 0.75rem;
      block-size: 1rem;
      background: var(--apricot);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%);
    }

    main {
      padding-block: clamp(2rem, 5vw, 4.5rem) 4rem;
    }

    h1, h2 {
      font-family: var(--display-font);
      font-weight: 600;
    }

    h1 {
      margin: 0 0 clamp(1.375rem, 3vw, 2.25rem);
      font-size: clamp(3.125rem, 7vw, 5.25rem);
      letter-spacing: -0.035em;
      line-height: 1;
    }

    .shortlist {
      display: grid;
      grid-template-columns: clamp(5.5rem, 14vw, 10rem) minmax(0, 1fr);
      min-block-size: 9.25rem;
      background: var(--slate);
      border: 1px solid var(--rule);
      border-inline-start: 3px solid var(--apricot);
    }

    .tally {
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 0.3rem;
      padding: 0.625rem;
      border-inline-end: 1px solid var(--rule);
      color: var(--mist);
      font-size: 0.9375rem;
    }

    .tally-value {
      color: var(--apricot);
      font-family: var(--display-font);
      font-size: clamp(3rem, 5vw, 4.375rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 0.95;
    }

    .shortlist-content {
      align-self: center;
      padding: 0.875rem clamp(0.875rem, 3vw, 2.125rem);
    }

    .empty-heading {
      margin: 0 0 0.375rem;
      font-size: clamp(1.375rem, 2.15vw, 1.75rem);
      line-height: 1.1;
    }

    .empty-copy {
      margin: 0;
      max-inline-size: 46ch;
      color: var(--mist);
    }

    .suggestions {
      margin-block-start: clamp(2rem, 4vw, 3.25rem);
    }

    .suggestions h2 {
      margin: 0 0 0.875rem;
      font-size: clamp(1.625rem, 2.5vw, 2rem);
      line-height: 1.1;
      letter-spacing: -0.015em;
    }

    .exhibit-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .suggestion-list {
      border-block-start: 1px solid var(--rule);
    }

    .suggestion-row, .shortlist-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.75rem;
    }

    .suggestion-row {
      min-block-size: 4.75rem;
      padding-block: 0.75rem;
      border-block-end: 1px solid var(--rule);
    }

    .suggestion-row h3 {
      margin: 0;
      font-size: clamp(1.1875rem, 1.8vw, 1.375rem);
      font-weight: 500;
      line-height: 1.2;
    }

    .shortlist-row {
      min-block-size: 3.25rem;
      font-weight: 500;
    }

    .shortlist-row + .shortlist-row {
      border-block-start: 1px solid var(--rule);
    }

    button {
      min-block-size: 2.75rem;
      font: 600 0.9375rem/1.2 var(--body-font);
      cursor: pointer;
    }

    button:focus-visible {
      outline: 2px solid var(--chalk);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px var(--graphite);
    }

    .add-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-inline-size: 6.5rem;
      padding: 0.625rem 0.875rem;
      border: 1px solid var(--apricot);
      border-radius: 4px;
      background: var(--apricot);
      color: var(--graphite);
    }

    .add-symbol {
      inline-size: 0.875rem;
      font-size: 1.125rem;
      line-height: 1;
      text-align: center;
    }

    .add-button[aria-disabled="true"] {
      border-color: var(--rule);
      background: transparent;
      color: var(--mist);
      cursor: default;
    }

    .remove-button {
      padding: 0.375rem 0.25rem;
      border: 0;
      background: transparent;
      color: var(--mist);
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 0.2em;
    }

    @media (hover: hover) {
      .add-button:not([aria-disabled="true"]):hover {
        border-color: var(--chalk);
        background: var(--chalk);
      }

      .remove-button:hover {
        color: var(--chalk);
      }
    }

    @media (max-width: 36rem) {
      .masthead-inner {
        min-block-size: 3.5rem;
      }

      .shortlist {
        min-block-size: 8.5rem;
      }

      .empty-copy {
        font-size: 0.9375rem;
      }

      .shortlist-row {
        gap: 0.5rem;
      }

      .suggestion-row {
        min-block-size: 4.375rem;
      }
    }

    .visually-hidden {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="page-width masthead-inner">
      <span class="bookmark" aria-hidden="true"></span>
      <span>Museum trip</span>
    </div>
  </header>

  <main class="page-width">
    <h1>Exhibit shortlist</h1>

    <section class="shortlist" aria-label="Your shortlist">
      <div class="tally">
        <span class="tally-value" id="exhibit-count">0</span>
        <span id="exhibit-unit">exhibits</span>
      </div>
      <div class="shortlist-content">
        <div id="empty-shortlist">
          <h2 class="empty-heading">No exhibits yet</h2>
          <p class="empty-copy">Add an exhibit from the suggestions below.</p>
        </div>
        <ul class="exhibit-list" id="shortlist-items" aria-label="Selected exhibits" hidden></ul>
      </div>
    </section>

    <section class="suggestions" aria-labelledby="suggestions-heading">
      <h2 id="suggestions-heading">Suggested exhibits</h2>
      <ul class="exhibit-list suggestion-list">
        <li class="suggestion-row">
          <h3 id="light-studies">Light Studies</h3>
          <button class="add-button" type="button" aria-labelledby="add-light light-studies">
            <span class="add-symbol" aria-hidden="true">+</span>
            <span class="button-label" id="add-light">Add</span>
          </button>
        </li>
        <li class="suggestion-row">
          <h3 id="objects-in-transit">Objects in Transit</h3>
          <button class="add-button" type="button" aria-labelledby="add-objects objects-in-transit">
            <span class="add-symbol" aria-hidden="true">+</span>
            <span class="button-label" id="add-objects">Add</span>
          </button>
        </li>
      </ul>
    </section>

    <p class="visually-hidden" id="shortlist-update" role="status"></p>
  </main>

  <script>
    // The shortlist starts empty on each page load.
    const shortlist = document.getElementById("shortlist-items");
    const emptyShortlist = document.getElementById("empty-shortlist");
    const exhibitCount = document.getElementById("exhibit-count");
    const exhibitUnit = document.getElementById("exhibit-unit");
    const announcement = document.getElementById("shortlist-update");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    function updateShortlist(message) {
      const total = shortlist.childElementCount;

      exhibitCount.textContent = total;
      exhibitUnit.textContent = total === 1 ? "exhibit" : "exhibits";
      emptyShortlist.hidden = total > 0;
      shortlist.hidden = total === 0;
      announcement.textContent = message;

      if (!reducedMotion.matches) {
        exhibitCount.animate(
          [{ opacity: 0.55, transform: "translateY(2px)" }, { opacity: 1, transform: "translateY(0)" }],
          { duration: 200, easing: "ease-out" }
        );
      }
    }

    for (const addButton of document.querySelectorAll(".add-button")) {
      const name = addButton.closest(".suggestion-row").querySelector("h3").textContent;
      const label = addButton.querySelector(".button-label");
      const symbol = addButton.querySelector(".add-symbol");

      function setAdded(added) {
        addButton.setAttribute("aria-disabled", String(added));
        label.textContent = added ? "Added" : "Add";
        symbol.textContent = added ? "✓" : "+";
      }

      addButton.addEventListener("click", () => {
        if (addButton.getAttribute("aria-disabled") === "true") return;

        const item = document.createElement("li");
        item.className = "shortlist-row";

        const title = document.createElement("span");
        title.textContent = name;

        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.className = "remove-button";
        removeButton.textContent = "Remove";
        removeButton.setAttribute("aria-label", `Remove ${name} from the shortlist`);
        removeButton.addEventListener("click", () => {
          item.remove();
          setAdded(false);
          updateShortlist(`${name} removed from the shortlist.`);
          const nextControl = shortlist.querySelector("button") ?? addButton;
          nextControl.focus();
        });

        item.append(title, removeButton);
        shortlist.append(item);
        setAdded(true);
        updateShortlist(`${name} added to the shortlist.`);
      });
    }
  </script>
</body>
</html>
