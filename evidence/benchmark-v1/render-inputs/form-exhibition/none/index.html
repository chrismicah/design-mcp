<!doctype html>
<!--
  Museum group organizers need a calm, straightforward way to confirm their
  visit choices. The page centers on four fields and an on-page confirmation.
  Cool paper #F4F6F8, ink #182548, cobalt #2846A4, slate #4E5D75,
  daylight #E5EEA9, and error red #962E32 form the palette.
  Instrument Serif sets the headings. Instrument Sans sets the controls.
  An arched gallery frames a ceramic sculpture beside the form. On phones,
  the composition stacks into a single column.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="form-action 'none'; connect-src 'none'; base-uri 'none'">
  <title>Museum group visit request</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;display=swap">

  <style>
    :root {
      color-scheme: light;
      --paper: #f4f6f8;
      --ink: #182548;
      --cobalt: #2846a4;
      --slate: #4e5d75;
      --daylight: #e5eea9;
      --error: #962e32;
      --rule: color-mix(in srgb, var(--slate) 25%, var(--paper));
      --control-border: color-mix(in srgb, var(--slate) 75%, white);
      --selected: color-mix(in srgb, var(--cobalt) 8%, white);
      --display-font: "Instrument Serif", Georgia, serif;
      --ui-font: "Instrument Sans", "Helvetica Neue", sans-serif;
      --control-height: 50px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 1rem/1.5 var(--ui-font);
    }

    button, input {
      color: inherit;
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    :where(button, input):focus-visible {
      outline: 2px solid var(--cobalt);
      outline-offset: 3px;
    }

    [hidden] {
      display: none !important;
    }

    .page {
      width: min(calc(100% - 96px), 1160px);
      margin-inline: auto;
    }

    .masthead {
      display: flex;
      min-height: 77px;
      align-items: center;
      gap: 11px;
      border-bottom: 1px solid var(--rule);
      font-weight: 650;
    }

    .museum-mark {
      display: block;
      flex: none;
      color: var(--cobalt);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr);
      gap: clamp(38px, 6vw, 88px);
      padding-block: 50px 60px;
    }

    .intro h1 {
      margin: 0;
      font: 400 clamp(4.125rem, 7.2vw, 6.5rem)/.88 var(--display-font);
      letter-spacing: -.024em;
    }

    .intro h1 span {
      display: block;
    }

    .gallery-print {
      position: relative;
      aspect-ratio: 640 / 392;
      overflow: hidden;
      margin: 29px 0 0;
      background: var(--cobalt);
    }

    .gallery-print svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .request {
      min-width: 0;
      padding-inline-start: clamp(26px, 4vw, 58px);
      border-inline-start: 1px solid var(--rule);
    }

    .section-title {
      margin: 0;
      font: 400 2.375rem/1 var(--display-font);
      letter-spacing: -.012em;
    }

    .form-fields {
      display: grid;
      gap: 17px;
      margin-block-start: 23px;
    }

    .field {
      min-inline-size: 0;
    }

    .field-label {
      display: block;
      padding: 0;
      font-size: .9375rem;
      font-weight: 650;
      line-height: 1.3;
    }

    .text-input, .stepper, .visit-option {
      border: 1px solid var(--control-border);
      border-radius: 4px;
      background: white;
    }

    .text-input {
      width: 100%;
      height: var(--control-height);
      margin-block-start: 7px;
      padding-inline: 13px;
    }

    .size-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 13px;
      margin-block-start: 7px;
    }

    .stepper {
      display: grid;
      width: 160px;
      max-width: 100%;
      height: var(--control-height);
      grid-template-columns: 46px minmax(0, 1fr) 46px;
    }

    .stepper button, .stepper input {
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 3px;
      background: transparent;
    }

    .stepper button {
      display: grid;
      place-items: center;
      color: var(--cobalt);
    }

    .stepper button:disabled {
      color: var(--slate);
      opacity: .45;
      cursor: default;
    }

    .stepper input {
      width: 100%;
      border-inline: 1px solid var(--rule);
      border-radius: 0;
      appearance: textfield;
      text-align: center;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .stepper input::-webkit-inner-spin-button,
    .stepper input::-webkit-outer-spin-button {
      margin: 0;
      appearance: none;
    }

    .stepper :focus-visible {
      outline-offset: -3px;
    }

    .size-hint, .privacy-note {
      color: var(--slate);
      font-size: .875rem;
    }

    fieldset.field {
      margin: 0;
      padding: 0;
      border: 0;
    }

    .visit-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-block-start: 7px;
    }

    .visit-option {
      display: flex;
      min-height: 52px;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: .9375rem;
      font-weight: 600;
      line-height: 1.25;
    }

    .visit-option input {
      width: 17px;
      height: 17px;
      flex: none;
      margin: 0;
      accent-color: var(--cobalt);
      cursor: inherit;
    }

    .visit-option:has(input:checked) {
      border-color: var(--cobalt);
      background: var(--selected);
      box-shadow: inset 0 0 0 1px var(--cobalt);
    }

    .visit-option:has(input:focus-visible) {
      outline: 2px solid var(--cobalt);
      outline-offset: 3px;
    }

    .visit-option input:focus-visible {
      outline: none;
    }

    .text-input[aria-invalid="true"],
    .stepper:has(input[aria-invalid="true"]),
    fieldset[aria-invalid="true"] .visit-option {
      border-color: var(--error);
    }

    .field-error {
      margin: 6px 0 0;
      color: var(--error);
      font-size: .875rem;
    }

    .primary, .secondary {
      display: block;
      width: 100%;
      min-height: 53px;
      margin-block-start: 23px;
      padding: 10px 16px;
      border: 1px solid var(--cobalt);
      border-radius: 4px;
      font-weight: 650;
    }

    .primary {
      background: var(--cobalt);
      color: white;
    }

    .secondary {
      background: white;
      color: var(--cobalt);
    }

    .privacy-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin: 13px 0 0;
      text-align: center;
    }

    .privacy-note svg {
      flex: none;
    }

    .confirmation-mark {
      display: grid;
      width: 51px;
      height: 51px;
      place-items: center;
      margin-block-end: 17px;
      border-radius: 50%;
      background: var(--daylight);
    }

    .confirmation .section-title {
      font-size: clamp(2.375rem, 4vw, 3.5rem);
    }

    .section-title[tabindex="-1"]:focus {
      outline: none;
    }

    .summary {
      margin: 25px 0 0;
      border-top: 1px solid var(--rule);
    }

    .summary div {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 4px 16px;
      padding-block: 14px;
      border-bottom: 1px solid var(--rule);
    }

    .summary dt {
      color: var(--slate);
    }

    .summary dd {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 650;
    }

    @media (hover: hover) {
      .primary:hover {
        background: color-mix(in srgb, var(--cobalt) 76%, var(--ink));
      }

      .secondary:hover,
      .stepper button:enabled:hover {
        background: var(--selected);
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .confirmation:not([hidden]) .confirmation-mark path {
        stroke-dasharray: 1;
        animation: draw-check 320ms ease-out both;
      }

      @keyframes draw-check {
        from { stroke-dashoffset: 1; }
        to { stroke-dashoffset: 0; }
      }
    }

    @media (max-width: 980px) {
      .page {
        width: calc(100% - 64px);
      }

      .layout {
        gap: 38px;
      }
    }

    @media (max-width: 820px) {
      :root {
        --control-height: 46px;
      }

      .page {
        width: min(calc(100% - 44px), 35rem);
      }

      .masthead {
        min-height: 62px;
      }

      .layout {
        grid-template-columns: minmax(0, 1fr);
        gap: 24px;
        padding-block: 24px 38px;
      }

      .intro h1 {
        font-size: clamp(3rem, 14.25vw, 4.75rem);
      }

      .gallery-print {
        aspect-ratio: 2.88;
        margin-block-start: 18px;
      }

      .gallery-print svg {
        position: absolute;
        inset-block-start: 50%;
        transform: translateY(-56%);
      }

      .request {
        padding: 17px 0 0;
        border-inline-start: 0;
        border-block-start: 1px solid var(--rule);
      }

      .section-title {
        font-size: 1.875rem;
      }

      .form-fields {
        gap: 14px;
        margin-block-start: 15px;
      }

      .field-label {
        font-size: .875rem;
      }

      .text-input, .size-row, .visit-options {
        margin-block-start: 6px;
      }

      .visit-option {
        min-height: 48px;
      }

      .primary, .secondary {
        min-height: 50px;
        margin-block-start: 19px;
      }
    }

    @media (max-width: 340px) {
      .page {
        width: calc(100% - 34px);
      }

      .visit-option {
        gap: 7px;
        padding-inline: 9px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <svg class="museum-mark" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="3" fill="currentColor"/>
        <path d="M7.5 24V15a8.5 8.5 0 0 1 17 0v9M11.5 24v-9a4.5 4.5 0 0 1 9 0v9M6.5 24h19"
          fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <span>Museum visits</span>
    </header>

    <main class="layout">
      <div class="intro">
        <h1>Request a <span>group visit</span></h1>

        <figure class="gallery-print">
          <svg viewBox="0 0 640 392" role="img" aria-labelledby="gallery-title">
            <title id="gallery-title">An illustration of a sculpture in a blue, arched gallery</title>
            <defs>
              <linearGradient id="wall" x2="100%" y2="100%">
                <stop stop-color="#5372c6"/>
                <stop offset="1" stop-color="#263d91"/>
              </linearGradient>
              <linearGradient id="arch" x2="84%" y2="100%">
                <stop stop-color="#c5d3f4"/>
                <stop offset=".48" stop-color="#8ba4e4"/>
                <stop offset="1" stop-color="#617dc8"/>
              </linearGradient>
              <linearGradient id="interior" x1="84%" y1="0%" x2="14%" y2="100%">
                <stop stop-color="#a2b8ed"/>
                <stop offset=".55" stop-color="#5677c7"/>
                <stop offset="1" stop-color="#2c4a9b"/>
              </linearGradient>
              <linearGradient id="floor" x2="12%" y2="100%">
                <stop stop-color="#5e7bc7"/>
                <stop offset="1" stop-color="#2b458f"/>
              </linearGradient>
              <linearGradient id="side-wall" x2="100%" y2="35%">
                <stop stop-color="#21397f"/>
                <stop offset="1" stop-color="#3957a9"/>
              </linearGradient>
              <linearGradient id="floor-light" x2="24%" y2="100%">
                <stop stop-color="#d8e4ec" stop-opacity=".58"/>
                <stop offset="1" stop-color="#92a8df" stop-opacity=".12"/>
              </linearGradient>
              <linearGradient id="pedestal" x2="22%" y2="100%">
                <stop stop-color="#d3dff5"/>
                <stop offset="1" stop-color="#9dafdf"/>
              </linearGradient>
              <linearGradient id="glaze" x2="100%" y2="78%">
                <stop stop-color="#ffffdc"/>
                <stop offset=".48" stop-color="#e5eea9"/>
                <stop offset="1" stop-color="#94a35f"/>
              </linearGradient>
              <clipPath id="gallery-opening">
                <path d="M290 284V163a109 109 0 0 1 218 0v121Z"/>
              </clipPath>
              <path id="ceramic-form" fill-rule="evenodd"
                d="M402 259C389 244 379 226 379 208c0-26 14-49 37-61
                   13-7 27-7 34 1 10 11 3 28-10 45-16 20-22 42-13 66Z
                   M405 210c7-14 20-26 27-37 6-9 6-17 1-18-7-2-19 6-26 17
                   -9 12-11 27-2 38Z"/>
              <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
                <feTurbulence type="fractalNoise" baseFrequency=".74" numOctaves="3" stitchTiles="stitch"/>
                <feColorMatrix type="saturate" values="0"/>
              </filter>
            </defs>

            <rect width="640" height="392" fill="url(#wall)"/>
            <path d="M181 58h459M181 122h459M181 187h459M181 248h459
                     M219 0v58m-22 0v64m34 0v65m-23 0v61m30 0v36
                     M581 0v58m26 0v64m-42 0v65m25 0v61m-40 0v36"
              fill="none" stroke="#c5d3f4" stroke-opacity=".2"/>

            <path d="M250 284V155a143 143 0 0 1 286 0v129Z" fill="url(#arch)"/>
            <path d="M268 284V155a125 125 0 0 1 250 0v129Z" fill="#233b82"/>
            <path d="M290 284V163a109 109 0 0 1 218 0v121Z" fill="url(#interior)"/>
            <path d="M278 279 434 49 519 91 401 284H278Z"
              clip-path="url(#gallery-opening)" fill="#e0e9f6" opacity=".26"/>
            <path d="M322 284V173a83 83 0 0 1 166 0v111
                     M344 284V181a65 65 0 0 1 130 0v103"
              fill="none" stroke="#d8e4f6" stroke-opacity=".43"/>
            <path d="M393 12v18m-101 24 13 13m-48 44 18 5m-25 39h18m-18 64h18
                     m250-64h18m-18 64h18m-6-108-18 5m-18-62-13 13"
              fill="none" stroke="#e5edff" stroke-opacity=".5"/>

            <path d="M0 284h640v108H0Z" fill="url(#floor)"/>
            <path d="M323 284h166l142 108H164Z" fill="url(#floor-light)"/>
            <path d="M0 299h640M0 320h640M0 350h640
                     M97 392l250-108m-113 108 143-108m-43 108 69-108
                     m48 108-22-108m149 108-121-108"
              fill="none" stroke="#dbe5ff" stroke-opacity=".26"/>

            <path d="M0 0h182v284L0 353Z" fill="url(#side-wall)"/>
            <path d="M165 0h17v284l-17 7Z" fill="#253d88"/>
            <path d="M0 73c59-11 119 34 119 95v140L0 353Z" fill="#6784d0"/>
            <path d="M0 84c54-9 105 31 105 87v142L0 353Z" fill="#1d3379"/>
            <path d="M0 98c47-8 90 29 90 80v141L0 353Z" fill="#314c98"/>
            <path d="m0 227 90-25m-90 76 90-32m29-16 46-16m-46 61 46-17
                     M182 0v284"
              fill="none" stroke="#a8bdf4" stroke-opacity=".28"/>

            <path d="m369 310 93 9 111 41-52 12-134-48Z" fill="#1a306c" opacity=".46"/>
            <path d="m369 252 75 0 18 12h-75Z" fill="#e2eafa"/>
            <path d="M387 264h75v60h-75Z" fill="url(#pedestal)"/>
            <path d="m369 252 18 12v60l-18-12Z" fill="#7792ce"/>
            <path d="M387 264h75" fill="none" stroke="#f1f5ff" stroke-opacity=".85"/>
            <ellipse cx="416" cy="259" rx="21" ry="3.1" fill="#52669b" opacity=".38"/>
            <use href="#ceramic-form" transform="translate(2 1)" fill="#738650"/>
            <use href="#ceramic-form" fill="url(#glaze)"/>
            <path d="M386 210c-1-24 14-47 37-59"
              fill="none" stroke="#ffffe9" stroke-opacity=".75" stroke-width="1.3" stroke-linecap="round"/>

            <rect width="640" height="392" filter="url(#paper-grain)"
              opacity=".22" style="mix-blend-mode: soft-light"/>
          </svg>
        </figure>
      </div>

      <section class="request" aria-label="Group visit request">
        <form id="visit-form" aria-labelledby="form-title">
          <h2 class="section-title" id="form-title" tabindex="-1">Visit details</h2>

          <div class="form-fields">
            <div class="field">
              <label class="field-label" for="contact-name">Contact name</label>
              <input class="text-input" id="contact-name" name="contactName" type="text"
                autocomplete="name" aria-describedby="contact-name-error" required>
              <p class="field-error" id="contact-name-error" hidden></p>
            </div>

            <div class="field">
              <label class="field-label" for="email">Email address</label>
              <input class="text-input" id="email" name="email" type="email"
                autocomplete="email" autocapitalize="none" spellcheck="false"
                aria-describedby="email-error" required>
              <p class="field-error" id="email-error" hidden></p>
            </div>

            <div class="field">
              <label class="field-label" for="group-size">Group size</label>
              <div class="size-row">
                <div class="stepper">
                  <button type="button" id="decrease-size" aria-label="Decrease group size" disabled>
                    <svg width="17" height="17" viewBox="0 0 18 18" aria-hidden="true">
                      <path d="M4 9h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                  </button>
                  <input id="group-size" name="groupSize" type="number" inputmode="numeric"
                    min="1" max="25" step="1" value="1" aria-describedby="size-hint group-size-error" required>
                  <button type="button" id="increase-size" aria-label="Increase group size">
                    <svg width="17" height="17" viewBox="0 0 18 18" aria-hidden="true">
                      <path d="M4 9h10M9 4v10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                  </button>
                </div>
                <span class="size-hint" id="size-hint">1–25 people</span>
              </div>
              <p class="field-error" id="group-size-error" hidden></p>
            </div>

            <fieldset class="field" id="visit-type">
              <legend class="field-label">Visit type</legend>
              <div class="visit-options">
                <label class="visit-option">
                  <input type="radio" name="visitType" value="Quiet visit"
                    aria-describedby="visit-type-error" required>
                  <span>Quiet visit</span>
                </label>
                <label class="visit-option">
                  <input type="radio" name="visitType" value="Guided visit"
                    aria-describedby="visit-type-error" required>
                  <span>Guided visit</span>
                </label>
              </div>
              <p class="field-error" id="visit-type-error" hidden></p>
            </fieldset>
          </div>

          <button class="primary" type="submit">Confirm request</button>
        </form>

        <section class="confirmation" id="confirmation" aria-labelledby="confirmation-title" hidden>
          <div class="confirmation-mark" aria-hidden="true">
            <svg width="29" height="29" viewBox="0 0 29 29">
              <path d="m7 14.5 5 5L22 9.5" pathLength="1" fill="none"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h2 class="section-title" id="confirmation-title" tabindex="-1">Request confirmed</h2>
          <dl class="summary">
            <div>
              <dt>Group size</dt>
              <dd id="confirmed-size"></dd>
            </div>
            <div>
              <dt>Visit type</dt>
              <dd id="confirmed-type"></dd>
            </div>
          </dl>
          <button class="secondary" id="edit-request" type="button">Edit details</button>
        </section>

        <p class="privacy-note">
          <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="3.5" y="7" width="9" height="7" rx="1.2" fill="none" stroke="currentColor"/>
            <path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor"/>
          </svg>
          Your details stay on this page.
        </p>

        <noscript>
          <p class="field-error">Enable JavaScript to confirm your request on this page.</p>
        </noscript>
      </section>
    </main>
  </div>

  <script>
    const form = document.getElementById("visit-form");
    const contactName = document.getElementById("contact-name");
    const email = document.getElementById("email");
    const groupSize = document.getElementById("group-size");
    const visitType = document.getElementById("visit-type");
    const visitOptions = form.elements.namedItem("visitType");
    const decrease = document.getElementById("decrease-size");
    const increase = document.getElementById("increase-size");
    const confirmation = document.getElementById("confirmation");
    const confirmationTitle = document.getElementById("confirmation-title");

    const checks = [
      {
        field: contactName,
        getError: () => contactName.value.trim() ? "" : "Enter the contact name."
      },
      {
        field: email,
        getError: () => email.validity.valid ? "" : "Enter a valid email address."
      },
      {
        field: groupSize,
        getError: () => groupSize.validity.valid ? "" : "Enter a whole number from 1 to 25."
      },
      {
        field: visitType,
        focusTarget: visitOptions[0],
        getError: () => visitOptions.value ? "" : "Choose Quiet visit or Guided visit."
      }
    ];

    function showError(field, message) {
      const error = document.getElementById(`${field.id}-error`);
      error.textContent = message;
      error.hidden = !message;

      if (message) {
        field.setAttribute("aria-invalid", "true");
      } else {
        field.removeAttribute("aria-invalid");
      }
    }

    function updateStepper() {
      const size = groupSize.valueAsNumber;
      decrease.disabled = size <= Number(groupSize.min);
      increase.disabled = size >= Number(groupSize.max);
    }

    for (const { field, getError } of checks) {
      field.addEventListener("input", () => {
        if (field.hasAttribute("aria-invalid")) {
          showError(field, getError());
        }
      });
    }

    groupSize.addEventListener("input", updateStepper);
    decrease.addEventListener("click", () => {
      groupSize.stepDown();
      groupSize.dispatchEvent(new Event("input", { bubbles: true }));
    });
    increase.addEventListener("click", () => {
      groupSize.stepUp();
      groupSize.dispatchEvent(new Event("input", { bubbles: true }));
    });
    updateStepper();

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      let firstInvalid;

      for (const { field, getError, focusTarget = field } of checks) {
        const message = getError();
        showError(field, message);
        if (message && !firstInvalid) {
          firstInvalid = focusTarget;
        }
      }

      if (firstInvalid) {
        firstInvalid.focus();
        return;
      }

      const size = groupSize.valueAsNumber;
      document.getElementById("confirmed-size").textContent =
        size === 1 ? "1 person" : `${size} people`;
      document.getElementById("confirmed-type").textContent = visitOptions.value;

      form.hidden = true;
      confirmation.hidden = false;
      confirmationTitle.focus();
    });

    document.getElementById("edit-request").addEventListener("click", () => {
      confirmation.hidden = true;
      form.hidden = false;
      document.getElementById("form-title").focus();
    });

    form.noValidate = true;
  </script>
</body>
</html>
