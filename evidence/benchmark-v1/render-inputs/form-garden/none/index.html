<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Volunteer at the community garden</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400..700&amp;family=Fraunces:opsz,wght@9..144,600..700&amp;display=swap">
  <style>
    :root {
      --sage: #eff3e7;
      --paper: #fffef8;
      --pine: #173b2d;
      --leaf: #397249;
      --sky: #bfdadb;
      --marigold: #f3d477;
      --muted: #486357;
      --line: #c7d4c3;
      --field-line: #7e9385;
      --focus: #28527d;
      --error: #963326;
      --display: "Fraunces", Georgia, serif;
      --body: "DM Sans", "Trebuchet MS", sans-serif;
      --gutter: clamp(1rem, 4.2vw, 3rem);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--sage);
      color: var(--pine);
      font: 400 1rem/1.45 var(--body);
    }

    h1, h2, p { margin: 0; }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .shell {
      width: min(71rem, calc(100% - 2 * var(--gutter)));
      margin-inline: auto;
    }

    .masthead {
      display: flex;
      min-height: 5rem;
      align-items: center;
      gap: .7rem;
      border-bottom: 1px solid var(--line);
      font-size: 1.0625rem;
      font-weight: 700;
      letter-spacing: -.025em;
    }

    .masthead svg { flex: none; }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr);
      align-items: start;
      gap: clamp(2rem, 4.8vw, 4.5rem);
      padding-block: clamp(2.5rem, 7vh, 4.5rem) 3.5rem;
    }

    h1, h2 {
      font-family: var(--display);
      font-optical-sizing: auto;
    }

    h1 {
      font-size: clamp(3.4rem, 5.75vw, 5.25rem);
      font-weight: 650;
      letter-spacing: -.052em;
      line-height: .98;
    }

    h2 {
      font-size: clamp(1.85rem, 3vw, 2.5rem);
      font-weight: 600;
      letter-spacing: -.04em;
      line-height: 1.08;
    }

    .garden-print {
      overflow: hidden;
      aspect-ratio: 30 / 17;
      margin-top: clamp(1.1rem, 2vw, 1.8rem);
      border: 1px solid #a6c0af;
      border-radius: .9rem;
      background: var(--sky);
    }

    .garden-print svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .sheet {
      min-width: 0;
      padding: clamp(1.25rem, 2.5vw, 2.25rem);
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--paper);
      box-shadow: 0 4px 0 -1px #dce5d5;
    }

    .form-stack {
      display: grid;
      gap: 1.2rem;
      margin-top: 1.5rem;
    }

    .field > label, legend {
      display: block;
      margin-bottom: .4rem;
      font-weight: 700;
      font-size: .9375rem;
    }

    .optional {
      margin-inline-start: .25rem;
      color: var(--muted);
      font-size: .875rem;
      font-weight: 400;
    }

    input[type="text"], textarea {
      display: block;
      width: 100%;
      min-height: 3rem;
      padding: .67rem .8rem;
      border: 1px solid var(--field-line);
      border-radius: .5rem;
      background: var(--paper);
      color: var(--pine);
      font: inherit;
    }

    textarea { resize: vertical; }
    textarea::placeholder { color: var(--muted); }

    fieldset {
      min-inline-size: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend { padding: 0; }

    .shift-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .65rem;
    }

    .shift {
      display: flex;
      min-height: 4.15rem;
      align-items: center;
      gap: .6rem;
      padding: .6rem .7rem;
      border: 1px solid var(--field-line);
      border-radius: .5rem;
      cursor: pointer;
    }

    .shift input {
      flex: none;
      width: 1.12rem;
      height: 1.12rem;
      margin: 0;
      accent-color: var(--leaf);
      cursor: pointer;
    }

    .shift:has(input:checked) {
      border-color: var(--leaf);
      background: var(--sage);
      box-shadow: inset 0 0 0 1px var(--leaf);
    }

    .shift:has(input:focus-visible) {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .shift input:focus-visible { outline: none; }

    .shift-day {
      display: block;
      font-size: .9375rem;
      font-weight: 700;
    }

    .shift time {
      display: block;
      color: var(--muted);
      font-size: .875rem;
    }

    input[type="text"][aria-invalid="true"],
    .shift:has(input[aria-invalid="true"]) {
      border-color: var(--error);
    }

    .field-error {
      color: var(--error);
      font-size: .875rem;
    }

    .field-error:not(:empty) { margin-top: .4rem; }

    .button {
      display: inline-flex;
      min-height: 3.125rem;
      align-items: center;
      justify-content: center;
      padding: .6rem 1rem;
      border: 1px solid var(--pine);
      border-radius: .5rem;
      font: 700 1rem/1.25 var(--body);
      cursor: pointer;
    }

    .primary {
      background: var(--pine);
      color: var(--paper);
    }

    .secondary {
      align-self: flex-start;
      background: var(--paper);
      color: var(--pine);
    }

    @media (hover: hover) {
      .shift:hover { border-color: var(--pine); }
      .primary:hover { background: #24523d; }
      .secondary:hover { background: var(--sage); }
    }

    .confirmation {
      display: flex;
      min-height: 26rem;
      flex-direction: column;
      justify-content: center;
      gap: 1rem;
      overflow-wrap: anywhere;
    }

    .success-mark {
      display: grid;
      width: 3.2rem;
      height: 3.2rem;
      place-items: center;
      border-radius: 50%;
      background: var(--marigold);
      color: var(--pine);
    }

    h2[tabindex="-1"] { scroll-margin-top: 1.25rem; }
    h2[tabindex="-1"]:focus-visible { outline: none; }

    .shift-summary {
      padding: .85rem 1rem;
      border-inline-start: 3px solid var(--leaf);
      border-radius: 0 .5rem .5rem 0;
      background: var(--sage);
    }

    .summary-label {
      color: var(--muted);
      font-size: .875rem;
      font-weight: 600;
    }

    .confirmed-shift {
      margin-top: .12rem;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .confirmed-note {
      margin-top: .2rem;
      white-space: pre-wrap;
    }

    @media (prefers-reduced-motion: no-preference) {
      .confirmation:not([hidden]) .success-mark {
        animation: mark-in 220ms ease-out both;
      }

      @keyframes mark-in {
        from { opacity: 0; transform: translateY(4px) scale(.92); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
    }

    @media (max-width: 52rem) {
      .shell { width: min(35rem, calc(100% - 2 * var(--gutter))); }
      .masthead { min-height: 3.85rem; }
      .layout {
        grid-template-columns: minmax(0, 1fr);
        gap: 1.35rem;
        padding-block: 1.5rem 2rem;
      }
      h1 { font-size: clamp(2.3rem, 11.7vw, 4.55rem); }
      .form-stack { gap: 1rem; margin-top: 1.2rem; }
      .confirmation { min-height: 0; }
    }

    @media (max-width: 32rem) {
      .garden-print { aspect-ratio: 2.4; }
    }

    @media (max-width: 22rem) {
      .shift-grid { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <header class="masthead shell">
    <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true" focusable="false">
      <rect width="36" height="36" rx="9" fill="var(--pine)"/>
      <path d="M18 26v-7m0 2c-4.6.1-7.6-2.4-8.1-6.9 4.7-.2 7.6 2.2 8.1 6.9Zm0-2c.2-4.9 3.2-7.8 8.1-8.1-.4 4.8-3.2 7.8-8.1 8.1Z"
        fill="none" stroke="var(--paper)" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M13.5 27h9" stroke="var(--marigold)" stroke-width="1.55" stroke-linecap="round"/>
    </svg>
    <span>Community garden</span>
  </header>

  <main class="layout shell">
    <div>
      <h1>Lend a hand<br>in the garden.</h1>

      <div class="garden-print" aria-hidden="true">
        <svg viewBox="0 0 600 340" preserveAspectRatio="xMidYMid slice" focusable="false">
          <defs>
            <pattern id="ink-flecks" width="29" height="23" patternUnits="userSpaceOnUse" fill="var(--pine)">
              <circle cx="3" cy="4" r=".65"/>
              <circle cx="17" cy="13" r=".48"/>
              <circle cx="26" cy="6" r=".5"/>
              <circle cx="7" cy="19" r=".44"/>
            </pattern>
            <g id="seedling" stroke="var(--pine)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M0 0C1-19 3-35 4-49" fill="none"/>
              <path d="M2-24C-12-24-23-33-27-46c15-1 27 7 29 22Z" fill="#b9d384"/>
              <path d="M3-31c2-15 11-23 25-24-2 14-11 24-25 24Z" fill="#639758"/>
              <path d="M1-12c-12 1-22-5-26-16 12-1 23 5 26 16Z" fill="#84ae68"/>
              <path d="M2-17c6-10 15-14 26-11-5 10-14 14-26 11Z" fill="#b9d384"/>
              <path d="m-19-40 14 11m26-20L9-37" fill="none" opacity=".65"/>
            </g>
            <g id="broadleaf" stroke="var(--pine)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M0 0c2-13 3-25 0-40" fill="none"/>
              <path d="M1-21c-14-6-20-19-11-33 12 6 18 18 11 33Z" fill="#98be70"/>
              <path d="M2-13C6-28 17-33 29-31 27-18 15-11 2-13Z" fill="#6ca15d"/>
              <path d="M0-9c-12 1-23-5-27-16 13-2 24 4 27 16Z" fill="#b9d384"/>
              <path d="m-8-46 6 19m22 1L8-17" fill="none" opacity=".65"/>
            </g>
          </defs>

          <rect width="600" height="340" fill="var(--sky)"/>
          <circle cx="476" cy="103" r="47" fill="var(--marigold)"/>
          <path d="M42 109c6-9 14-13 25-12 7-13 26-16 39-5 12-6 28-2 34 8 10-1 17 3 22 9Z"
            fill="var(--paper)" opacity=".68"/>
          <path d="M332 92q7-7 14 0 7-7 14 0m15-13q5-5 10 0 5-5 10 0"
            fill="none" stroke="var(--pine)" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>
          <path d="M0 177c65-34 134-36 199-10 69 27 131 24 202-3 75-28 135-26 199 4v172H0Z"
            fill="#91b38a"/>
          <path d="M0 204c90-20 159-16 232 5 83 23 143 15 214-8 54-17 104-19 154-4v143H0Z"
            fill="#c9daaa"/>
          <g fill="none" stroke="#759b70" stroke-width="2" stroke-linecap="round" opacity=".7">
            <path d="M0 258q22-7 49-8m-23 14 17-3m513-82q17 2 33 7"/>
            <path d="M46 284q-3-8-11-13m11 13q2-9 8-14m519 6q-1-9-7-14m7 14q4-7 9-8"/>
            <path d="m63 297 17-2m285 5 20-4m164 7 13-2"/>
          </g>

          <path d="m66 229 165 50 176-79 26 23-196 94L55 245Z" fill="var(--pine)" opacity=".14"/>
          <g stroke="var(--pine)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="m76 207 155 62 168-82v28l-168 82-155-64Z" fill="#789969"/>
            <path d="m231 269 168-82v28l-168 82Z" fill="#577c54"/>
            <path d="m76 207 159-65 164 45-168 82Z" fill="#deca91"/>
            <path d="m98 207 139-54 140 37-147 66Z" fill="#45664e"/>
            <path d="m87 222 132 54m25 1 143-69" fill="none" stroke-width="1.4" opacity=".65"/>
            <path d="m112 204 116 43m-78-58 119 42m-81-55 119 39m-84-53 119 38"
              fill="none" stroke="#a5bc84" stroke-width="1.3" stroke-dasharray="7 5" opacity=".7"/>
          </g>

          <use href="#broadleaf" transform="translate(226 175) rotate(-8) scale(1.02)"/>
          <use href="#seedling" transform="translate(283 186) rotate(8) scale(.88)"/>
          <use href="#seedling" transform="translate(322 198) rotate(12) scale(1.06)"/>
          <use href="#seedling" transform="translate(140 212) rotate(-12) scale(.83)"/>
          <use href="#seedling" transform="translate(187 222) rotate(-6) scale(1.17)"/>
          <use href="#broadleaf" transform="translate(282 220) rotate(10) scale(.79)"/>
          <use href="#broadleaf" transform="translate(228 245) rotate(5) scale(.91)"/>

          <g stroke="var(--pine)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="m333 208 10-39" fill="none"/>
            <path d="m332 164 27 6-3 13-27-6Z" fill="var(--paper)"/>
            <path d="m337 172 13 3" fill="none" stroke-width="1.2"/>
          </g>

          <ellipse cx="506" cy="278" rx="72" ry="15" transform="rotate(-7 506 278)" fill="var(--pine)" opacity=".17"/>
          <g stroke="var(--pine)" stroke-linecap="round" stroke-linejoin="round">
            <path d="M526 221c19-39 49-27 46-3-1 16-15 29-30 34" fill="none" stroke-width="13"/>
            <path d="M526 221c19-39 49-27 46-3-1 16-15 29-30 34" fill="none" stroke="var(--marigold)" stroke-width="8"/>
            <path d="m451 245-42-27-10 14 45 45Z" fill="#e2b658" stroke-width="2.4"/>
            <path d="m414 215-14-12-20 21 16 11 13-9Z" fill="var(--marigold)" stroke-width="2.4"/>
            <path d="m398 211-10 12m15-8-10 12" fill="none" stroke-width="1.35"/>
            <path d="M447 219q45-23 90-7l10 53q1 15-47 22-44 7-60-10Z" fill="var(--marigold)" stroke-width="2.5"/>
            <ellipse cx="492" cy="215" rx="45" ry="12" transform="rotate(-5 492 215)" fill="#fae6a1" stroke-width="2.5"/>
            <ellipse cx="492" cy="214" rx="30" ry="5.5" transform="rotate(-5 492 214)" fill="#45664e" stroke-width="1.5"/>
            <path d="M453 270q26 11 77-4" fill="none" stroke="#aa7935" stroke-width="1.6"/>
            <path d="M493 262v-11m0 4c-6 0-10-3-11-9 6 0 10 3 11 9Zm0-3c0-6 4-10 10-11-1 6-4 10-10 11Z"
              fill="none" stroke-width="1.6"/>
          </g>

          <rect width="600" height="340" fill="url(#ink-flecks)" opacity=".21"/>
        </svg>
      </div>
    </div>

    <section class="sheet" aria-label="Garden registration">
      <div id="entry">
        <h2 id="form-title" tabindex="-1">Volunteer sign-up</h2>

        <form class="form-stack" id="signup" aria-labelledby="form-title" novalidate>
          <div class="field">
            <label for="first-name">First name</label>
            <input type="text" id="first-name" name="firstName" autocomplete="given-name"
              autocapitalize="words" aria-describedby="name-error" required>
            <p class="field-error" id="name-error" aria-live="polite"></p>
          </div>

          <fieldset id="shift-field">
            <legend>Choose a shift</legend>
            <div class="shift-grid">
              <label class="shift">
                <input type="radio" name="shift" value="wednesday" aria-describedby="shift-error" required>
                <span>
                  <span class="shift-day">Wednesday</span>
                  <time datetime="17:00">5 pm</time>
                </span>
              </label>
              <label class="shift">
                <input type="radio" name="shift" value="saturday" aria-describedby="shift-error" required>
                <span>
                  <span class="shift-day">Saturday</span>
                  <time datetime="09:00">9 am</time>
                </span>
              </label>
            </div>
            <p class="field-error" id="shift-error" aria-live="polite"></p>
          </fieldset>

          <div class="field">
            <label for="tools">Tool note <span class="optional">(optional)</span></label>
            <textarea id="tools" name="tools" rows="2" placeholder="Tools you can bring or need"></textarea>
          </div>

          <button class="button primary" type="submit">Sign up</button>
        </form>
      </div>

      <section class="confirmation" id="confirmation" aria-labelledby="confirmation-title" hidden>
        <div class="success-mark" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" focusable="false">
            <path d="m5 12 4.5 4.5L19 7" fill="none" stroke="currentColor"
              stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2 id="confirmation-title" tabindex="-1" aria-describedby="confirmed-shift">
          Thanks, <span id="confirmed-name"></span>!
        </h2>
        <div class="shift-summary">
          <p class="summary-label">Your volunteer shift</p>
          <p class="confirmed-shift" id="confirmed-shift"></p>
        </div>
        <div id="note-summary" hidden>
          <p class="summary-label">Tool note</p>
          <p class="confirmed-note" id="confirmed-note"></p>
        </div>
        <button class="button secondary" id="edit-signup" type="button">Edit sign-up</button>
      </section>
    </section>
  </main>

  <script>
    const form = document.getElementById("signup");
    const entry = document.getElementById("entry");
    const firstName = document.getElementById("first-name");
    const shiftField = document.getElementById("shift-field");
    const shifts = Array.from(shiftField.querySelectorAll("input"));
    const nameError = document.getElementById("name-error");
    const shiftError = document.getElementById("shift-error");
    const confirmation = document.getElementById("confirmation");

    function setError(messageElement, controls, message = "") {
      messageElement.textContent = message;
      for (const control of controls) {
        control.setAttribute("aria-invalid", String(Boolean(message)));
      }
    }

    firstName.addEventListener("input", () => {
      if (nameError.textContent && firstName.value.trim()) {
        setError(nameError, [firstName]);
      }
    });

    shiftField.addEventListener("change", () => {
      setError(shiftError, shifts);
    });

    // The current entry lives in this page and can be edited after confirmation.
    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const name = firstName.value.trim();
      const shift = shifts.find((option) => option.checked);

      setError(nameError, [firstName], name ? "" : "Enter your first name.");
      setError(shiftError, shifts, shift ? "" : "Choose Wednesday or Saturday.");

      if (!name || !shift) {
        const firstMissingField = name ? shifts[0] : firstName;
        firstMissingField.focus();
        return;
      }

      const shiftLabel = shift.closest("label");
      const day = shiftLabel.querySelector(".shift-day").textContent;
      const time = shiftLabel.querySelector("time").textContent;
      const note = document.getElementById("tools").value.trim();

      firstName.value = name;
      document.getElementById("confirmed-name").textContent = name;
      document.getElementById("confirmed-shift").textContent = `${day} at ${time}`;
      document.getElementById("confirmed-note").textContent = note;
      document.getElementById("note-summary").hidden = !note;

      entry.hidden = true;
      confirmation.hidden = false;
      document.getElementById("confirmation-title").focus();
    });

    document.getElementById("edit-signup").addEventListener("click", () => {
      confirmation.hidden = true;
      entry.hidden = false;
      document.getElementById("form-title").focus();
    });
  </script>
</body>
</html>
