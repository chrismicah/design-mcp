<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f1e6">
  <title>Oral History Archive | City of Red Bluff</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f1e6;
      --card: #fffbf3;
      --ink: #2c251f;
      --muted: #62564b;
      --brick: #923d2e;
      --rule: #d9c9b5;
      --serif: "Fraunces", Georgia, serif;
      --sans: "DM Sans", system-ui, sans-serif;
      --gutter: clamp(1.125rem, 5vw, 5.5rem);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      font: 1rem/1.5 var(--sans);
      background:
        radial-gradient(ellipse at 80% 5%, #efdccd80, transparent 36rem),
        radial-gradient(#74564421 .55px, transparent .75px) 0 0 / 6px 6px,
        var(--paper);
    }

    body:has(dialog[open]) { overflow: hidden; }
    a { color: inherit; }
    button { font: inherit; }

    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--brick);
      outline-offset: 4px;
    }

    .shell {
      width: min(75rem, calc(100% - var(--gutter) - var(--gutter)));
      margin-inline: auto;
    }

    .skip-link {
      position: fixed;
      z-index: 2;
      inset: .75rem auto auto .75rem;
      padding: .65rem 1rem;
      background: var(--card);
      transform: translateY(-200%);
    }

    .skip-link:focus { transform: none; }

    .masthead {
      min-height: 4.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid var(--rule);
    }

    .city {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      min-height: 44px;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .city svg { flex: none; }

    .archive-nav a {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      min-height: 44px;
      font-size: .875rem;
      font-weight: 700;
      text-decoration: none;
    }

    .archive-nav a:hover { color: var(--brick); }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, .98fr);
      align-items: center;
      gap: clamp(1.25rem, 4.8vw, 4.5rem);
      padding-block: 1.75rem 2rem;
    }

    h1 {
      margin: 0;
      font: 500 clamp(3.55rem, 7.4vw, 7.1rem)/.9 var(--serif);
      letter-spacing: -.065em;
    }

    h1 em {
      display: block;
      color: var(--brick);
      font-weight: inherit;
    }

    .hero p {
      margin: 1.3rem 0 0;
      color: var(--muted);
      font-size: 1.0625rem;
    }

    .hero-art {
      display: block;
      width: 100%;
      height: auto;
    }

    .interviews {
      padding-block: 1.15rem 3.75rem;
      border-top: 1px solid #c8b49c;
      scroll-margin-top: 1rem;
    }

    .interviews h2 {
      margin: 0 0 .9rem;
      font: 500 clamp(1.95rem, 3vw, 2.4rem)/1.08 var(--serif);
      letter-spacing: -.045em;
    }

    .interview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(1rem, 2.25vw, 2rem);
    }

    .interview {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--rule);
      border-radius: 5px;
      background: var(--card);
      box-shadow: 0 3px 8px #50321a09;
    }

    .plate {
      display: block;
      width: 100%;
      height: clamp(10rem, 14vw, 12.75rem);
      border-bottom: 1px solid var(--rule);
    }

    .interview-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 1.09rem clamp(1rem, 1.85vw, 1.6rem) 0;
    }

    .interview-heading {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: space-between;
      gap: .8rem;
      padding-bottom: .95rem;
    }

    .interview h3 {
      margin: 0;
      font: 500 clamp(1.8rem, 3.15vw, 2.65rem)/1.05 var(--serif);
      letter-spacing: -.05em;
    }

    .role {
      margin: .28rem 0 0;
      color: var(--muted);
      font-size: .9375rem;
    }

    .interview-date {
      flex: none;
      margin: 0;
      padding-inline-start: clamp(.65rem, 1.35vw, 1.2rem);
      border-inline-start: 1px solid var(--rule);
      color: var(--muted);
    }

    .interview-date span {
      display: block;
      font-size: .75rem;
    }

    .interview-date time {
      display: block;
      margin-top: .15rem;
      color: var(--ink);
      font: 500 1.55rem/1 var(--serif);
      font-variant-numeric: lining-nums;
    }

    .excerpt-button {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .75rem;
      width: 100%;
      min-height: 3.25rem;
      padding: .5rem 0;
      border: 0;
      border-top: 1px solid var(--rule);
      color: var(--brick);
      background: transparent;
      cursor: pointer;
      text-align: left;
      font-size: .9rem;
      font-weight: 700;
    }

    .excerpt-button:focus-visible { outline-offset: -2px; }

    .arrow-circle {
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      border: 1px solid #c9917f;
      border-radius: 50%;
      transition: background-color .18s ease, color .18s ease, border-color .18s ease;
    }

    .excerpt-button:hover .arrow-circle,
    .excerpt-button:focus-visible .arrow-circle {
      color: var(--card);
      background: var(--brick);
      border-color: var(--brick);
    }

    dialog {
      width: min(37rem, calc(100% - 2rem));
      max-height: calc(100% - 2rem);
      padding: 0;
      border: 1px solid var(--rule);
      border-radius: 5px;
      color: var(--ink);
      background: var(--card);
      box-shadow: 0 24px 80px #281c1940;
    }

    dialog::backdrop {
      background: #2c221fb0;
      backdrop-filter: blur(2px);
    }

    .excerpt-content {
      position: relative;
      padding: clamp(1.35rem, 4.5vw, 2.8rem);
      border-top: 5px solid var(--brick);
    }

    .excerpt-label {
      margin: 0 3rem .9rem 0;
      color: var(--brick);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    #excerpt-title {
      margin: 0;
      font: 500 clamp(2.25rem, 6vw, 3.5rem)/1.03 var(--serif);
      letter-spacing: -.055em;
    }

    #excerpt-meta {
      margin: .45rem 0 0;
      color: var(--muted);
      font-size: .9375rem;
    }

    #excerpt-text {
      margin: 1.55rem 0 0;
      padding: .15rem 0 .15rem 1rem;
      border-inline-start: 2px solid var(--brick);
      font: 400 clamp(1.25rem, 3.6vw, 1.7rem)/1.43 var(--serif);
    }

    .close-button {
      position: absolute;
      inset: .8rem .8rem auto auto;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid var(--rule);
      border-radius: 50%;
      color: var(--ink);
      background: var(--card);
      cursor: pointer;
    }

    .close-button:hover {
      border-color: var(--brick);
      color: var(--brick);
    }

    @media (max-width: 42rem) {
      .masthead { min-height: 3.75rem; }

      .hero {
        grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
        column-gap: .35rem;
        row-gap: .85rem;
        padding-block: 2rem 1.55rem;
      }

      .hero-copy { display: contents; }

      h1 {
        grid-column: 1 / -1;
        font-size: clamp(2.9rem, 16.25vw, 5.55rem);
      }

      .hero p {
        grid-column: 1;
        margin: 0;
        font-size: .96875rem;
        line-height: 1.45;
      }

      .hero-art {
        grid-column: 2;
        width: min(100%, 15rem);
        justify-self: end;
      }

      .interview-grid { grid-template-columns: minmax(0, 1fr); }
      .plate { height: clamp(9rem, 42vw, 13rem); }
      .interview h3 { font-size: clamp(1.85rem, 8.4vw, 2.4rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      .arrow-circle { transition: none; }
    }
  </style>
</head>

              Read excerpt
              <span class="arrow-circle" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 16 16">
                  <path d="M3 8h10m-4-4 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </button>
          </div>
        </article>
      </div>
    </section>
  </main>

  <dialog id="excerpt" aria-labelledby="excerpt-title" aria-describedby="excerpt-label">
    <div class="excerpt-content">
      <form method="dialog">
        <button class="close-button" type="submit" aria-label="Close excerpt" autofocus>
          <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true">
            <path d="m5 5 10 10m0-10L5 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </form>
      <p class="excerpt-label" id="excerpt-label">Illustrative sample excerpt</p>
      <h2 id="excerpt-title"></h2>
      <p id="excerpt-meta"></p>
      <blockquote id="excerpt-text"></blockquote>
    </div>
  </dialog>

  <script>
    const samples = {
      june: "“I’d paint a few letters, then put the brush down and step back. From across the room, I could see whether the spaces between the letters looked right.”",
      leon: "“I’d check the lights one at a time. Once they were all on, I could step back and see the line they made across the bridge.”"
    };

    const dialog = document.querySelector("#excerpt");
    const excerptTitle = document.querySelector("#excerpt-title");
    const excerptMeta = document.querySelector("#excerpt-meta");
    const excerptText = document.querySelector("#excerpt-text");
    let opener;

    for (const button of document.querySelectorAll(".excerpt-button")) {
      button.addEventListener("click", () => {
        const interview = button.closest(".interview");
        const role = interview.querySelector(".role").textContent;
        const year = interview.querySelector("time").textContent;

        opener = button;
        excerptTitle.textContent = interview.querySelector("h3").textContent;
        excerptMeta.textContent = `${role} · Interviewed in ${year}`;
        excerptText.textContent = samples[interview.dataset.interview];
        dialog.showModal();
      });
    }

    dialog.addEventListener("click", (event) => {
      if (event.target === dialog) dialog.close();
    });

    dialog.addEventListener("close", () => {
      opener?.focus({ preventScroll: true });
    });
  </script>
</body>
</html>
