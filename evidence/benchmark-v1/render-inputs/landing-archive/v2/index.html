<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oral History Archive | City of Red Bluff</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&amp;family=Source+Sans+3:wght@400..700&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #efe9dc;
      --ink: #1d2a2e;
      --rust: #9a3c22;
      --rust-dark: #7c2e1b;
      --muted: #575046;
      --rule: #bcb19f;
      --serif: "Newsreader", Georgia, serif;
      --sans: "Source Sans 3", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 24px;
    }

    html:has(dialog[open]) { overflow: hidden; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 1rem/1.45 var(--sans);
    }

    h1, h2, h3, p { margin: 0; }

    button, a { -webkit-tap-highlight-color: transparent; }

    :focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 4px;
    }

    ::selection { background: #e6c6ae; }

    .shell {
      width: min(1280px, calc(100% - clamp(44px, 11.11vw, 160px)));
      margin-inline: auto;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 76px;
      border-bottom: 1px solid var(--rule);
    }

    .city {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: .875rem;
      font-weight: 650;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .city svg { flex: none; }

    .masthead a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      color: inherit;
      font-weight: 600;
      text-decoration: none;
    }

    .masthead a:hover {
      color: var(--rust);
      text-decoration: underline;
      text-underline-offset: .25em;
    }

    main { padding-bottom: 32px; }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(170px, 18.4vw, 265px);
      align-items: end;
      gap: clamp(28px, 3vw, 44px);
      padding-block: clamp(48px, 5.2vw, 75px) clamp(34px, 4vw, 58px);
    }

    .intro h1 {
      font: 500 clamp(54px, 7.7vw, 112px)/.92 var(--serif);
      letter-spacing: -.05em;
    }

    .intro h1 em {
      color: var(--rust);
      font-weight: inherit;
    }

    .intro p {
      max-width: 14ch;
      padding-bottom: 4px;
      font: italic 400 clamp(24px, 2.2vw, 32px)/1.08 var(--serif);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      font-size: .8125rem;
      font-weight: 650;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .section-title::after {
      flex: 1;
      height: 1px;
      background: var(--rule);
      content: "";
    }

    .entries {
      display: grid;
      grid-template-columns: minmax(0, 2.32fr) minmax(0, 1fr);
      gap: clamp(20px, 2.2vw, 32px);
      padding-bottom: 36px;
      border-bottom: 1px solid var(--rule);
    }

    .entry { position: relative; }

    .secondary {
      padding-inline-start: clamp(20px, 2.2vw, 32px);
      border-inline-start: 1px solid var(--rule);
    }

    .plate {
      display: block;
      width: 100%;
      height: clamp(228px, 21.2vw, 305px);
      overflow: hidden;
    }

    .paint-plate { background: #a3533a; }
    .bridge-plate { background: #30494c; }

    .entry-info { padding-top: 21px; }

    .entry-title {
      font: 500 clamp(44px, 4.3vw, 62px)/.98 var(--serif);
      letter-spacing: -.04em;
    }

    .secondary .entry-title {
      font-size: clamp(36px, 3.5vw, 51px);
      line-height: 1.12;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      column-gap: 9px;
      margin-top: 5px;
      color: var(--muted);
      font-size: 1.0625rem;
      line-height: 1.3;
    }

    .when { white-space: nowrap; }

    .when::before {
      display: inline-block;
      width: 3px;
      height: 3px;
      margin-inline-end: 9px;
      border-radius: 50%;
      background: var(--rust);
      vertical-align: .2em;
      content: "";
    }

    .read {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      margin-top: 15px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--rust);
      font: 650 1rem/1.2 var(--sans);
      cursor: pointer;
    }

    /* Give the illustration and name the same action as the visible button. */
    .read::after {
      position: absolute;
      inset: 0;
      content: "";
    }

    .read svg {
      flex: none;
      transition: transform 200ms ease-out;
    }

    .primary .read {
      gap: 14px;
      padding-inline: 15px;
      border-radius: 2px;
      background: var(--rust);
      color: var(--paper);
    }

    .secondary .read span {
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: .25em;
    }

    @media (hover: hover) {
      .read:hover svg { transform: translateX(3px); }
      .primary .read:hover { background: var(--rust-dark); }
      .entry:has(.read:hover) .entry-title { color: var(--rust); }
    }

    dialog {
      width: min(640px, calc(100% - 36px));
      max-width: none;
      max-height: calc(100% - 36px);
      padding: 0;
      border: 1px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 16px 72px rgb(20 25 25 / .32);
    }

    dialog::backdrop { background: rgb(25 34 34 / .66); }
    dialog[open] { animation: open-reader 220ms ease-out; }

    .reader {
      position: relative;
      padding: 48px clamp(24px, 6vw, 52px) clamp(30px, 6vw, 50px);
      border-top: 5px solid var(--rust);
    }

    .reader form {
      position: absolute;
      top: 12px;
      right: 12px;
    }

    .close {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }

    .close:hover {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--paper);
    }

    .reader-label {
      max-width: calc(100% - 28px);
      margin-bottom: 12px;
      color: var(--rust);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .reader h2 {
      font: 500 clamp(42px, 8vw, 64px)/.98 var(--serif);
      letter-spacing: -.04em;
    }

    .reader-meta {
      margin-top: 5px;
      color: var(--muted);
    }

    .reader blockquote {
      margin: 25px 0 0;
      padding-top: 22px;
      border-top: 1px solid var(--rule);
      font: italic 400 clamp(26px, 5vw, 35px)/1.19 var(--serif);
    }

    @keyframes open-reader {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 960px) {
      .secondary .meta { display: grid; gap: 2px; }
      .secondary .when::before { display: none; }
    }

    @media (max-width: 740px) {
      .masthead { min-height: 62px; }
      .city { gap: 9px; font-size: .75rem; }
      .city svg { width: 30px; height: 30px; }

      .intro {
        display: block;
        padding-block: 40px 31px;
      }

      .intro h1 { font-size: clamp(52px, 16vw, 85px); }
      .intro h1 em { display: block; }
      .intro p { max-width: none; margin-top: 13px; padding: 0; }

      .section-title { margin-bottom: 13px; }

      .entries {
        grid-template-columns: minmax(0, 1fr);
        gap: 26px;
        padding-bottom: 26px;
      }

      .plate {
        height: auto;
        aspect-ratio: 1.66;
      }

      .entry-info { padding-top: 17px; }
      .entry-title { font-size: clamp(44px, 11vw, 58px); }
      .meta { font-size: .96875rem; }

      .secondary {
        display: grid;
        grid-template-columns: minmax(94px, .96fr) minmax(0, 1.6fr);
        align-items: center;
        gap: 16px;
        padding: 18px 0 0;
        border-inline-start: 0;
        border-top: 1px solid var(--rule);
      }

      .secondary .plate {
        height: clamp(128px, 34.5vw, 188px);
        aspect-ratio: auto;
      }

      .secondary .entry-info { padding-top: 0; }
      .secondary .entry-title { font-size: clamp(34px, 9vw, 49px); }
      .secondary .read { margin-top: 4px; font-size: .9375rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      dialog[open] { animation: none; }
      .read svg { transition: none; }
    }
  </style>
</head>

                <span id="leon-action">Read sample excerpt</span>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path d="M2 8h11m-4-4 4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <dialog id="excerpt" aria-labelledby="excerpt-name" aria-describedby="excerpt-label excerpt-meta excerpt-copy">
    <div class="reader">
      <form method="dialog">
        <button class="close" type="submit" aria-label="Close excerpt" autofocus>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="m4 4 10 10M14 4 4 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </form>
      <p class="reader-label" id="excerpt-label">Fictional sample excerpt</p>
      <h2 id="excerpt-name"></h2>
      <p class="reader-meta" id="excerpt-meta"></p>
      <blockquote><p id="excerpt-copy"></p></blockquote>
    </div>
  </dialog>

  <script>
    const samples = {
      june: "I look at the spaces between the letters as much as I look at the letters. That’s where the rhythm comes from.",
      leon: "I’d follow the wires along the bridge in my head. Little by little, I could see how the whole thing fit together."
    };

    const dialog = document.querySelector("#excerpt");
    const excerptName = document.querySelector("#excerpt-name");
    const excerptMeta = document.querySelector("#excerpt-meta");
    const excerptCopy = document.querySelector("#excerpt-copy");
    let opener;

    document.querySelectorAll("[data-interview]").forEach((button) => {
      button.addEventListener("click", () => {
        const entry = button.closest(".entry");
        const trade = entry.querySelector(".trade").textContent;
        const year = entry.querySelector(".when").textContent;

        excerptName.textContent = entry.querySelector(".entry-title").textContent;
        excerptMeta.textContent = `${trade} · ${year}`;
        excerptCopy.textContent = `“${samples[button.dataset.interview]}”`;
        opener = button;
        dialog.showModal();
      });
    });

    dialog.addEventListener("click", (event) => {
      if (event.target === dialog) dialog.close();
    });

    dialog.addEventListener("close", () => {
      opener?.focus({ preventScroll: true });
    });
  </script>
</body>
</html>
