<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f4ec">
  <title>Oat Glaze Bowl | Kiln &amp; Field</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f4ec;
      --ink: #30251e;
      --muted: #68574a;
      --line: #dfd4c4;
      --clay: #874632;
      --clay-dark: #693522;
      --serif: "Fraunces", Georgia, serif;
      --sans: "DM Sans", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 1rem/1.5 var(--sans);
    }

    h1, h2, p, figure { margin: 0; }

    button {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
    }

    button:focus-visible {
      outline: 2px solid var(--clay);
      outline-offset: 4px;
    }

    .wrap {
      width: min(1224px, calc(100% - 96px));
      margin-inline: auto;
    }

    .site-header { border-bottom: 1px solid var(--line); }

    .masthead {
      min-height: 79px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 11px;
      font: 600 28px/1 var(--serif);
      letter-spacing: -.048em;
    }

    .wordmark svg { flex: none; }

    .bag-trigger {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      padding: 0 0 0 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .bag-trigger:hover { color: var(--clay); }

    .bag-count {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ede3d4;
      color: #623e2f;
      font-size: 12px;
    }

    main { padding-block: 48px 56px; }

    .product {
      display: grid;
      grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr);
      align-items: center;
      gap: clamp(36px, 6.4vw, 92px);
    }

    .product-art {
      position: relative;
      overflow: hidden;
      aspect-ratio: 5 / 4;
      background: #eadac0;
      border-radius: 2px;
    }

    .product-art::after {
      position: absolute;
      inset: 14px;
      border: 1px solid #77563a36;
      content: "";
      pointer-events: none;
    }

    .product-art > svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .details { max-width: 410px; }

    .category {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--clay);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .category::before {
      width: 20px;
      height: 1px;
      background: currentColor;
      content: "";
    }

    h1 {
      margin-block: 16px 23px;
      font: 500 clamp(54px, 6.5vw, 94px)/.94 var(--serif);
      letter-spacing: -.062em;
    }

    h1 em {
      display: block;
      color: var(--clay);
      font-weight: inherit;
    }

    .price {
      font-size: 25px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -.035em;
    }

    .maker {
      margin-top: 11px;
      color: var(--muted);
    }

    .purchase { margin-top: 29px; }

    .add-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      min-height: 56px;
      padding: 12px 19px;
      border-radius: 3px;
      background: var(--clay);
      color: #fff9ed;
      font-weight: 700;
      text-align: left;
    }

    .add-button:hover { background: var(--clay-dark); }

    .purchase-notes {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px 12px;
      margin-top: 15px;
      font-size: 13px;
    }

    .shipping, .confirmation {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .shipping { color: var(--muted); }

    .confirmation {
      color: #40543f;
      font-weight: 700;
    }

    .confirmation:not(:empty)::before {
      width: 9px;
      height: 5px;
      border-bottom: 1.5px solid currentColor;
      border-left: 1.5px solid currentColor;
      transform: translateY(-2px) rotate(-45deg);
      content: "";
    }

    .bag-panel {
      position: fixed;
      inset: 0 0 0 auto;
      width: min(424px, calc(100% - 20px));
      max-width: none;
      height: 100%;
      height: 100dvh;
      max-height: none;
      margin: 0;
      padding: 24px;
      overflow-y: auto;
      border: 0;
      background: var(--paper);
      color: var(--ink);
      box-shadow: -12px 0 48px #30251e24;
    }

    .bag-panel::backdrop { background: #30251e66; }

    .bag-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .bag-heading h2 {
      font: 500 36px/1 var(--serif);
      letter-spacing: -.05em;
    }

    .close-bag {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
    }

    .close-bag:hover { background: #eee4d5; }

    .empty-bag {
      margin-top: 22px;
      color: var(--muted);
    }

    .bag-item {
      display: grid;
      grid-template-columns: 76px 1fr auto;
      align-items: start;
      gap: 13px;
      padding-block: 22px;
    }

    .bag-item > svg {
      width: 76px;
      height: 68px;
      border-radius: 2px;
      background: #eadac0;
    }

    .item-name { font-weight: 700; }
    .item-quantity { color: var(--muted); font-size: 13px; }

    .remove-item {
      min-height: 40px;
      padding: 0 4px;
      margin-left: -4px;
      color: var(--clay);
      font-size: 13px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .bag-subtotal {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
      font-weight: 700;
    }

    @media (max-width: 820px) {
      .wrap { width: calc(100% - 36px); }

      .masthead { min-height: 62px; }

      .wordmark {
        gap: 8px;
        font-size: 24px;
      }

      .wordmark svg { width: 28px; height: 28px; }

      .bag-trigger { gap: 7px; }
      .bag-trigger svg { width: 17px; height: 17px; }

      main { padding-block: 18px 34px; }

      .product {
        grid-template-columns: minmax(0, 1fr);
        gap: 25px;
      }

      .product-art {
        aspect-ratio: 1.075;
        max-height: 480px;
      }

      .product-art::after { inset: 9px; }

      .details { max-width: none; }

      .category { font-size: 10px; }

      h1 {
        margin-block: 10px 14px;
        font-size: clamp(37px, 12.05vw, 64px);
        line-height: 1;
        letter-spacing: -.055em;
      }

      h1 em { display: inline; }

      .price { font-size: 23px; }

      .maker {
        margin-top: 8px;
        font-size: 15px;
      }

      .purchase { margin-top: 22px; }
      .add-button { min-height: 53px; padding-inline: 15px; }
      .purchase-notes { margin-top: 13px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap masthead">
      <div class="wordmark">
        <svg width="34" height="34" viewBox="0 0 36 36" aria-hidden="true">
          <path d="M6 2.8 29 2c3-.1 4.5 1.2 4.6 4.2l.5 22.2c0 3-1.2 4.5-4.1 4.7l-23 .7c-3 0-4.5-1.4-4.6-4.5L2 7.3c0-2.9 1.2-4.3 4-4.5Z" fill="#874632"/>
          <g fill="none" stroke="#fbefdb" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">

            <path d="M17.8 16.9c.2-3.4 1.8-6.3 4.7-8.5m-4.1 6.3c-2.4-.3-4.1-1.6-4.8-3.6 2.3.1 4 .9 4.8 3.6Z"/>
          </g>
        </svg>
        <span>Kiln &amp; Field</span>
      </div>

      <button class="bag-trigger" id="open-bag" type="button" aria-haspopup="dialog" aria-controls="shopping-bag" aria-label="Bag, empty">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 8h14l1 13H4L5 8Z"/>
          <path d="M9 10V6a3 3 0 0 1 6 0v4"/>
        </svg>
        <span>Bag</span>
        <span class="bag-count" id="bag-count" aria-hidden="true">0</span>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section class="product" aria-labelledby="product-title">
      <figure class="product-art">
        <svg viewBox="0 0 720 576" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="art-title">

          <defs>

              <stop offset="1" stop-color="#dfc9aa"/>
            </radialGradient>
            <radialGradient id="cast-shadow">
              <stop stop-color="#5a3823" stop-opacity=".33"/>
              <stop offset=".55" stop-color="#795032" stop-opacity=".18"/>
              <stop offset="1" stop-color="#9a704a" stop-opacity="0"/>
            </radialGradient>
            <filter id="soft-shadow" x="-25%" y="-100%" width="150%" height="300%">
              <feGaussianBlur stdDeviation="5"/>
            </filter>
            <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
              <feTurbulence type="fractalNoise" baseFrequency=".73" numOctaves="3" seed="12" stitchTiles="stitch"/>
              <feColorMatrix type="matrix" values="0 0 0 0 .25
                                                    0 0 0 0 .15
                                                    0 0 0 0 .08
                                                    .9 0 0 0 -.30"/>
            </filter>
            <linearGradient id="foot-glaze" x1="0%" y1="0%" x2="100%" y2="70%">
              <stop stop-color="#caa780"/>

              <stop offset="1" stop-color="#81563b"/>
            </linearGradient>
            <linearGradient id="outer-glaze" x1="7%" y1="13%" x2="93%" y2="92%">
              <stop stop-color="#efe0c4"/>

              <stop offset="1" stop-color="#a97b54"/>
            </linearGradient>
            <linearGradient id="outer-shade" x1="12%" y1="12%" x2="63%" y2="99%">
              <stop offset=".34" stop-color="#845431" stop-opacity="0"/>
              <stop offset="1" stop-color="#845431" stop-opacity=".36"/>
            </linearGradient>
            <radialGradient id="outer-light" cx="27%" cy="21%" r="65%">

            <linearGradient id="inner-glaze" x1="69%" y1="0%" x2="36%" y2="100%">
              <stop stop-color="#9d7658"/>
              <stop offset=".24" stop-color="#bc9971"/>
              <stop offset=".62" stop-color="#e8d0a8"/>
              <stop offset=".85" stop-color="#e9d2ae"/>
              <stop offset="1" stop-color="#c7a078"/>
            </linearGradient>
            <radialGradient id="inner-light" cx="48%" cy="76%" r="56%">
              <stop stop-color="#f7e6c4" stop-opacity=".86"/>

            </radialGradient>

                <circle cx="65" cy="57" r=".63"/><circle cx="97" cy="54" r=".91"/>
              </g>
            </pattern>
            <path id="bowl-side" d="M105 224C112 269 223 304 358 305c136 1 248-34 256-83-1 24-8 47-20 72-28 59-74 98-133 119-32 11-66 16-102 16-37 1-74-5-104-17-62-22-112-69-134-132-8-23-13-42-16-56Z"/>
            <path id="bowl-rim" d="M105 224c-1-45 113-82 252-83 135-1 255 34 257 81 2 47-111 86-255 85-137 0-250-34-254-83Z"/>
            <path id="bowl-well" d="M116 223c-1-40 109-72 242-72 133-1 243 32 245 71 3 38-106 74-244 74-133 1-242-32-243-73Z"/>
            <clipPath id="side-clip"><use href="#bowl-side"/></clipPath>
            <clipPath id="well-clip"><use href="#bowl-well"/></clipPath>
          </defs>

          <g id="bowl-scene">
            <rect width="720" height="576" fill="url(#drawing-paper)"/>
            <rect width="720" height="576" filter="url(#paper-grain)" opacity=".43"/>

            <g transform="translate(-19 -15) scale(1.052)">
              <ellipse cx="396" cy="428" rx="248" ry="43" fill="url(#cast-shadow)" transform="rotate(-2 396 428)"/>
              <ellipse cx="367" cy="431" rx="119" ry="11" fill="#694127" opacity=".31" filter="url(#soft-shadow)"/>

                <path d="M231 453c12 1 35 2 50 1m228-3 27-3m-379-11 16 2" opacity=".63"/>
              </g>

              <path d="M276 407c30 11 133 13 168 0l-5 21c-8 9-42 15-80 15-39 0-73-6-80-15Z" fill="url(#foot-glaze)" stroke="#745038" stroke-width="1.35"/>

              <g clip-path="url(#side-clip)">
                <use href="#bowl-side" fill="url(#outer-shade)"/>

                  </g>

                    <path d="M244 397l8 3m-2-5 10 4m203 4 10-4m-3 1 12-5m-14 12 9-3"/>
                  </g>
                </g>
              </g>
              <use href="#bowl-side" fill="none" stroke="#765036" stroke-width="1.45" stroke-opacity=".85"/>

      </figure>

      <div class="details">
        <p class="category">Small-batch pottery</p>
        <h1 id="product-title">Oat Glaze <em>Bowl</em></h1>
        <p class="price">$46</p>
        <p class="maker">Thrown and glazed by the maker in Milwaukee.</p>

        <div class="purchase">
          <button class="add-button" id="add-bowl" type="button">
            <span id="purchase-label">Add to bag</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 12h15m-6-6 6 6-6 6"/>
            </svg>
          </button>
          <div class="purchase-notes">
            <p class="shipping">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m12 3 8.5 4.5v9L12 21l-8.5-4.5v-9L12 3Zm0 9 8.5-4.5M12 12 3.5 7.5M12 12v9m4.3-10.9L7.8 5.3"/>
              </svg>
              Ships in 5 days
            </p>
            <p class="confirmation" id="confirmation" role="status" aria-atomic="true"></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <dialog class="bag-panel" id="shopping-bag" aria-labelledby="bag-title">
    <div class="bag-heading">
      <h2 id="bag-title">Your bag</h2>
      <form method="dialog">
        <button class="close-bag" id="close-bag" type="submit" aria-label="Close bag" autofocus>
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18"/>
          </svg>
        </button>
      </form>
    </div>

    <p class="empty-bag" id="empty-bag">Your bag is empty.</p>
    <div id="bag-order" hidden>
      <div class="bag-item">
        <svg viewBox="70 32 580 516" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <use href="#bowl-scene"/>
        </svg>
        <div>
          <p class="item-name">Oat Glaze Bowl</p>
          <p class="item-quantity">Quantity 1</p>
          <button class="remove-item" id="remove-bowl" type="button" aria-label="Remove Oat Glaze Bowl">Remove</button>
        </div>
        <p>$46</p>
      </div>
      <p class="bag-subtotal"><span>Subtotal</span><span>$46</span></p>
    </div>
  </dialog>

  <script>
    const addButton = document.getElementById("add-bowl");
    const purchaseLabel = document.getElementById("purchase-label");
    const confirmation = document.getElementById("confirmation");
    const bagButton = document.getElementById("open-bag");
    const bagCount = document.getElementById("bag-count");
    const bag = document.getElementById("shopping-bag");
    const emptyBag = document.getElementById("empty-bag");
    const bagOrder = document.getElementById("bag-order");
    const closeButton = document.getElementById("close-bag");
    const removeButton = document.getElementById("remove-bowl");

    let bowlInBag = false;

    function setBowlInBag(isInBag) {
      bowlInBag = isInBag;
      bagCount.textContent = isInBag ? "1" : "0";
      bagButton.setAttribute("aria-label", isInBag ? "Bag, 1 item" : "Bag, empty");
      purchaseLabel.textContent = isInBag ? "View bag" : "Add to bag";
      emptyBag.hidden = isInBag;
      bagOrder.hidden = !isInBag;
      confirmation.textContent = isInBag ? "Added to bag" : "";
    }

    addButton.addEventListener("click", () => {
      if (bowlInBag) {
        bag.showModal();
        return;
      }

      setBowlInBag(true);
    });

    bagButton.addEventListener("click", () => bag.showModal());

    removeButton.addEventListener("click", () => {
      setBowlInBag(false);
      closeButton.focus();
    });

    bag.addEventListener("click", (event) => {
      if (event.target === bag && event.clientX < bag.getBoundingClientRect().left) {
        bag.close();
      }
    });
  </script>
</body>
</html>
