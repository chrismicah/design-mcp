<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4eee2">
  <title>Salt Marsh Film Weekend</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #f4eee2;
      --ink: #20372e;
      --green: #34594a;
      --muted: #4f5d50;
      --rule: #b9b6a5;
      --rust: #9b422d;
      --display: "Instrument Serif", "Times New Roman", serif;
      --mono: "IBM Plex Mono", "Courier New", monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, sans-serif;
    }

    .page {
      width: min(86.667%, 78rem);
      margin-inline: auto;
      padding-block: 1.9rem 2.75rem;
    }

    .masthead-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: .8rem;
      border-bottom: 1px solid var(--rule);
      font: 500 .75rem/1.3 var(--mono);
      letter-spacing: .095em;
      text-transform: uppercase;
    }

    .weekend-date {
      display: flex;
      align-items: center;
      gap: .65rem;
    }

    .tide-mark {
      display: block;
      width: 1.75rem;
      height: 1rem;
      color: var(--rust);
    }

    h1 {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: .16em;
      margin: 0;
      padding-block: 1.35rem 2.1rem;
      font: 400 clamp(3.5rem, 8.75vw, 8.1rem)/.94 var(--display);
      letter-spacing: -.034em;
    }

    h1 > * { white-space: nowrap; }
    h1 em { color: var(--green); }

    .program-heading {
      display: flex;
      align-items: center;
      gap: .95rem;
      margin: 0 0 .85rem;
      font: 500 .78rem/1.3 var(--mono);
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .program-heading::after {
      content: "";
      flex: 1;
      border-top: 1px solid var(--rule);
    }

    .screenings {
      min-inline-size: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .program-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.35rem;
    }

    .option {
      position: relative;
      display: flex;
      min-width: 0;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .film-card {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-width: 0;
      border: 1px solid #a7a797;
      background: #faf6ed;
      cursor: pointer;
      transition: background-color .18s ease, border-color .18s ease;
    }

    .film-card:hover { border-color: var(--green); }

    .screening-radio:checked + .film-card {
      border-color: var(--green);
      background: #e9eee2;
    }

    .screening-radio:focus-visible + .film-card {
      outline: 2px solid var(--rust);
      outline-offset: 3px;
    }

    .film-art {
      position: relative;
      display: block;
      flex: none;
      height: clamp(11rem, 20vw, 17.6rem);
      overflow: hidden;
      isolation: isolate;
    }

    .film-art svg {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .grain { mix-blend-mode: soft-light; }

    .film-caption {
      display: grid;
      flex: 1;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: 1fr auto;
      align-items: center;
      gap: .55rem 1rem;
      padding: .95rem 1.2rem 1rem;
    }

    .film-title {
      align-self: start;
      font: 400 clamp(2rem, 3.25vw, 3rem)/.98 var(--display);
      letter-spacing: -.018em;
    }

    .stay-together { white-space: nowrap; }

    .film-schedule {
      grid-row: 2;
      display: flex;
      align-items: center;
      gap: .65em;
      color: var(--muted);
      font: 500 .72rem/1.25 var(--mono);
      letter-spacing: .075em;
      text-transform: uppercase;
    }

    .film-schedule time {
      display: flex;
      align-items: center;
      gap: .65em;
    }

    .film-schedule time::before {
      content: "";
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: currentColor;
    }

    .radio-mark {
      grid-column: 2;
      grid-row: 1 / 3;
      display: grid;
      width: 1.5rem;
      height: 1.5rem;
      place-items: center;
      border: 1px solid #687568;
      border-radius: 50%;
    }

    .screening-radio:checked + .film-card .radio-mark {
      border-color: var(--green);
    }

    .screening-radio:checked + .film-card .radio-mark::after {
      content: "";
      width: 52%;
      height: 52%;
      border-radius: 50%;
      background: var(--green);
    }

    .selection {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.8fr);
      margin-top: 1.25rem;
      overflow: hidden;
      background: #233e33;
      color: #fcf5e7;
    }

    .selection-main {
      position: relative;
      padding: 1rem 1.35rem 1.1rem;
    }

    .selection-main::before,
    .selection-main::after {
      content: "";
      position: absolute;
      inset-inline-end: -.375rem;
      width: .75rem;
      height: .75rem;
      border-radius: 50%;
      background: var(--paper);
    }

    .selection-main::before { top: -.375rem; }
    .selection-main::after { bottom: -.375rem; }

    .selection-heading, .selection-facts dt {
      margin: 0;
      color: #d0d9c7;
      font: 400 .68rem/1.3 var(--mono);
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .selection-title {
      margin: .22rem 0 0;
      font: 400 2.3rem/1 var(--display);
    }

    .selection-facts {
      display: grid;
      grid-template-columns: 1.05fr 1.3fr .55fr;
      align-items: center;
      gap: .75rem;
      margin: 0;
      padding: .9rem 1.45rem;
      border-left: 1px dashed #8b9f8e;
    }

    .selection-facts dd {
      margin: .32rem 0 0;
      font-size: .94rem;
      line-height: 1.25;
    }

    #selected-time { font-variant-numeric: tabular-nums; }

    @media (max-width: 47rem) {
      .page {
        width: calc(100% - 2.25rem);
        padding-block: 1.25rem 1.8rem;
      }

      .masthead-meta {
        padding-bottom: .65rem;
        font-size: .67rem;
      }

      h1 {
        display: block;
        padding-block: 1.35rem 1.55rem;
        font-size: clamp(2.65rem, 16.35vw, 6.35rem);
        line-height: .88;
        letter-spacing: -.029em;
      }

      h1 > * { display: block; }
      h1 em { margin-top: .07em; }

      .program-heading {
        margin-bottom: .7rem;
        font-size: .72rem;
      }

      .program-grid { gap: .7rem; }

      .film-art {
        height: auto;
        aspect-ratio: 1 / 1.06;
      }

      .film-caption {
        gap: .55rem .4rem;
        padding: .65rem .65rem .75rem;
      }

      .film-title {
        grid-column: 1 / -1;
        font-size: clamp(1.65rem, 8.1vw, 2.4rem);
      }

      .film-schedule {
        font-size: clamp(.57rem, 2.65vw, .67rem);
        letter-spacing: .045em;
      }

      .radio-mark {
        grid-row: 2;
        width: 1.05rem;
        height: 1.05rem;
      }

      .selection {
        grid-template-columns: minmax(0, 1fr);
        margin-top: 1rem;
      }

      .selection-main { padding: .8rem .9rem .75rem; }

      .selection-main::before,
      .selection-main::after {
        top: auto;
        bottom: -.375rem;
      }

      .selection-main::before {
        right: auto;
        left: -.375rem;
      }

      .selection-title { font-size: 2rem; }

      .selection-facts {
        grid-template-columns: 1.05fr 1.32fr .53fr;
        align-items: start;
        gap: .5rem;
        padding: .7rem .9rem .85rem;
        border-left: 0;
        border-top: 1px dashed #8b9f8e;
      }

      .selection-facts dd { font-size: .81rem; }
    }

    @media (max-width: 22rem) {
      .program-grid { gap: .5rem; }
      .film-caption { padding-inline: .45rem; }
      .film-schedule, .film-schedule time { gap: .4em; }
    }

    @media (prefers-reduced-motion: reduce) {
      .film-card { transition: none; }
    }

    @media (forced-colors: active) {
      .screening-radio:checked + .film-card .radio-mark::after {
        forced-color-adjust: none;
        background: Highlight;
      }
    }
  </style>
</head>

                  stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>

                  <rect class="grain" width="640" height="300" filter="url(#night-grain)" opacity=".42"/>
                </svg>
              </span>
              <span class="film-caption">
                <span class="film-title">The Eel Road</span>
                <span class="film-schedule"><span class="screening-day">Friday</span><time datetime="18:30">18:30</time></span>
                <span class="radio-mark" aria-hidden="true"></span>

          </div>

          <div class="option">
            <input class="screening-radio visually-hidden" type="radio" name="screening"
                   id="first-light" value="first-light" data-date="June 14">
            <label class="film-card" for="first-light">
              <span class="film-art" aria-hidden="true">
                <svg viewBox="0 0 640 300" preserveAspectRatio="xMidYMid slice" focusable="false">
                  <defs>
                    <pattern id="dawn-sky" width="83" height="24" patternUnits="userSpaceOnUse">

                    <pattern id="dawn-marsh" width="66" height="17" patternUnits="userSpaceOnUse">

            </label>
          </div>
        </div>
      </fieldset>
    </section>

    <section class="selection" aria-labelledby="selection-heading" aria-live="polite" aria-atomic="true">
      <div class="selection-main">
        <h2 class="selection-heading" id="selection-heading">Selected screening</h2>
        <p class="selection-title" id="selected-title">The Eel Road</p>
      </div>
      <dl class="selection-facts">
        <div>
          <dt>Place</dt>
          <dd>Old Ferry Hall</dd>
        </div>
        <div>
          <dt>Date</dt>
          <dd><span id="selected-day">Friday</span>, <span class="stay-together" id="selected-date">June 13</span></dd>
        </div>
        <div>
          <dt>Time</dt>
          <dd><time id="selected-time" datetime="18:30">18:30</time></dd>
        </div>
      </dl>
    </section>
  </main>

  <script>
    const screenings = document.getElementById("screenings");
    const selectedTitle = document.getElementById("selected-title");
    const selectedDay = document.getElementById("selected-day");
    const selectedDate = document.getElementById("selected-date");
    const selectedTime = document.getElementById("selected-time");

    function showSelectedScreening() {
      const choice = screenings.querySelector(".screening-radio:checked");
      const card = choice.labels[0];
      const time = card.querySelector("time");

      selectedTitle.textContent = card.querySelector(".film-title").textContent;
      selectedDay.textContent = card.querySelector(".screening-day").textContent;
      selectedDate.textContent = choice.dataset.date;
      selectedTime.textContent = time.textContent;
      selectedTime.dateTime = time.dateTime;
    }

    screenings.addEventListener("change", showSelectedScreening);
    window.addEventListener("pageshow", showSelectedScreening);
  </script>
</body>
</html>
