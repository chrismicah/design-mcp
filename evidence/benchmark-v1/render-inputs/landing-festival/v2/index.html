<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3ebe0">
  <title>Salt Marsh Film Weekend</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
  <style>
    :root {
      --paper: #f3ebe0;
      --ticket: #faf1e6;
      --ink: #2a1610;
      --plum: #6b2148;
      --muted: #694b46;
      --rule: #ac8a84;
      --display: "Fraunces", Georgia, serif;
      --body: "Instrument Sans", Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 1rem/1.5 var(--body);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .page {
      width: min(1248px, 90%);
      margin-inline: auto;
      padding-block: 28px 60px;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 13px;
      border-bottom: 1px solid var(--rule);
    }

    .marsh-mark {
      display: block;
      flex: none;
      width: 43px;
      height: 32px;
      color: var(--plum);
    }

    .event-facts {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .dot {
      flex: none;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
    }

    h1 {
      display: flex;
      flex-wrap: wrap;
      column-gap: .24em;
      margin: 23px 0 32px;
      font: 600 clamp(3.3rem, 7.2vw, 6.5rem)/.99 var(--display);
      letter-spacing: -.057em;
    }

    h1 em {
      color: var(--plum);
      font-weight: inherit;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      align-items: start;
      gap: clamp(28px, 4.15vw, 60px);
    }

    .program-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 11px;
    }

    .program-heading h2 {
      margin: 0;
      font: 600 2.15rem/1.05 var(--display);
      letter-spacing: -.04em;
    }

    .program-heading p {
      margin: 0;
      color: var(--muted);
      font-size: .875rem;
      font-weight: 600;
    }

    .program-options {
      min-inline-size: 0;
      margin: 0;
      padding: 0;
      border: 1px solid var(--plum);
    }

    .screening {
      position: relative;
      isolation: isolate;
      display: grid;
      align-content: center;
      justify-items: start;
      gap: 13px;
      min-height: 235px;
      padding: 20px 28px 21px 44px;
      overflow: hidden;
      cursor: pointer;
    }

    .screening::before {
      position: absolute;
      inset: 14px auto 14px 13px;
      width: 5px;
      background: repeating-linear-gradient(
        to bottom, currentColor 0 5px, transparent 5px 16px
      );
      opacity: .42;
      content: "";
    }

    .screening--eel {
      background: var(--plum);
      color: #f9e9d9;
    }

    .screening--birds {
      border-top: 1px solid var(--paper);
      background: #e6b7bd;
      color: #421b2d;
    }

    .screening-art {
      position: absolute;
      inset: 0 0 0 auto;
      width: 54%;
      height: 100%;
      mask-image: linear-gradient(to right, transparent, #000 20%);
      pointer-events: none;
    }

    .screening-slot,
    .film-title,
    .selection {
      position: relative;
    }

    .screening-slot,
    .selection {
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .screening-slot {
      font-size: .77rem;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: .085em;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }

    .film-title {
      font: 600 clamp(2.4rem, 4.5vw, 4.3rem)/.91 var(--display);
      letter-spacing: -.055em;
    }

    .selection {
      font-size: .8rem;
      font-weight: 600;
      line-height: 1;
    }

    .selection-dot {
      display: grid;
      width: 17px;
      height: 17px;
      place-items: center;
      border: 1px solid currentColor;
      border-radius: 50%;
    }

    .selection-dot::after {
      width: 7px;
      height: 7px;
      border-radius: inherit;
      background: currentColor;
      content: "";
      transform: scale(0);
    }

    .screening-input:checked + .screening .selection-dot::after {
      transform: scale(1);
    }

    .screening-input:checked + .screening .selection-off,
    .screening-input:not(:checked) + .screening .selection-on {
      display: none;
    }

    .screening-input:focus-visible + .screening::after {
      position: absolute;
      z-index: 1;
      inset: 4px;
      border: 2px solid var(--paper);
      box-shadow: 0 0 0 2px var(--ink);
      pointer-events: none;
      content: "";
    }

    @media (hover: hover) and (prefers-reduced-motion: no-preference) {
      .screening-art,
      .selection-dot::after { transition: transform 180ms ease-out; }
      .screening:hover .screening-art { transform: translateX(-4px); }
    }

    .ticket {
      margin-top: 70px;
      border: 1px solid var(--rule);
      background: var(--ticket);
      box-shadow: 5px 5px 0 rgba(107, 33, 72, .1);
    }

    .ticket-heading {
      padding: 25px 27px 24px;
    }

    .ticket-heading h2 {
      margin: 0;
      color: var(--plum);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .ticket-title {
      margin: 12px 0 0;
      font: 600 clamp(2rem, 3.35vw, 3.1rem)/1 var(--display);
      letter-spacing: -.045em;
    }

    .ticket-facts {
      position: relative;
      margin: 0;
      padding: 9px 27px 15px;
      border-top: 1px dashed var(--rule);
    }

    .ticket-facts::before,
    .ticket-facts::after {
      position: absolute;
      top: -1px;
      width: 17px;
      height: 17px;
      border: 1px solid var(--rule);
      border-radius: 50%;
      background: var(--paper);
      content: "";
    }

    .ticket-facts::before {
      left: -1px;
      transform: translate(-50%, -50%);
      clip-path: inset(0 0 0 50%);
    }

    .ticket-facts::after {
      right: -1px;
      transform: translate(50%, -50%);
      clip-path: inset(0 50% 0 0);
    }

    .ticket-facts > div {
      display: grid;
      grid-template-columns: 4.5rem minmax(0, 1fr);
      align-items: baseline;
      gap: 12px;
      padding-block: 12px;
    }

    .ticket-facts > div + div {
      border-top: 1px solid rgba(107, 33, 72, .19);
    }

    .ticket-facts dt {
      color: var(--muted);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .ticket-facts dd {
      margin: 0;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 800px) {
      .page {
        width: min(560px, calc(100% - 36px));
        padding-block: 14px 34px;
      }

      .masthead { padding-bottom: 9px; }
      .marsh-mark { width: 37px; height: 28px; }

      .event-facts {
        gap: 10px;
        font-size: .69rem;
        letter-spacing: .085em;
      }

      h1 {
        flex-direction: column;
        margin: 20px 0 23px;
        font-size: clamp(2.35rem, 13vw, 4.55rem);
        line-height: .95;
      }

      .layout { grid-template-columns: minmax(0, 1fr); gap: 21px; }
      .program-heading { margin-bottom: 8px; }
      .program-heading h2 { font-size: 1.65rem; }
      .program-heading p { font-size: .8rem; }

      .screening {
        min-height: 154px;
        gap: 9px;
        padding: 13px 14px 13px 29px;
      }

      .screening::before {
        inset: 10px auto 10px 9px;
        width: 4px;
        background: repeating-linear-gradient(
          to bottom, currentColor 0 4px, transparent 4px 13px
        );
      }

      .screening-art {
        width: 53%;
        mask-image: linear-gradient(to right, transparent, #000 32%);
      }

      .screening-slot {
        gap: 7px;
        font-size: .675rem;
        letter-spacing: .065em;
      }

      .film-title { font-size: clamp(2rem, 9.7vw, 3.15rem); }
      .selection { gap: 7px; font-size: .74rem; }
      .selection-dot { width: 15px; height: 15px; }
      .selection-dot::after { width: 6px; height: 6px; }

      .ticket { margin-top: 0; }
      .ticket-heading { padding: 14px 18px 15px; }
      .ticket-heading h2 { font-size: .69rem; }
      .ticket-title { margin-top: 7px; font-size: clamp(1.85rem, 8vw, 2.4rem); }
      .ticket-facts { padding: 3px 18px 7px; }
      .ticket-facts > div { padding-block: 7px; }
      .ticket-facts dd { font-size: .9375rem; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="masthead">
        <svg class="marsh-mark" viewBox="0 0 43 32" fill="none" aria-hidden="true">
          <path d="M10 17a11.5 11.5 0 0 1 23 0M3 20c7 0 11-3 18.5-3S33 20 40 20M3 25c7 0 11-3 18.5-3S33 25 40 25M8 29c5-1 8-2 13.5-2S30 28 35 29" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          <path d="M21.5 1v2M7 7l1.5 1.5M36 7l-1.5 1.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
        </svg>
        <p class="event-facts">
          <span>June 13–14</span>
          <span class="dot" aria-hidden="true"></span>
          <span>Old Ferry Hall</span>
        </p>
      </div>
      <h1><span>Salt Marsh</span> <em>Film Weekend</em></h1>
    </header>

    <div class="layout">
      <section aria-labelledby="program-heading">
        <div class="program-heading">
          <h2 id="program-heading">Program</h2>
          <p>Choose a screening</p>
        </div>

        <fieldset class="program-options" id="program-options">
          <legend class="visually-hidden">Choose a screening</legend>

          <input class="screening-input visually-hidden" type="radio" name="screening"
            id="eel" aria-labelledby="eel-title" aria-describedby="eel-slot"
            aria-controls="screening-details" checked>
          <label class="screening screening--eel" for="eel">
            <svg class="screening-art" viewBox="0 0 420 236" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
              <defs>
                <pattern id="moon-ink" width="5" height="5" patternUnits="userSpaceOnUse">
                  <circle cx="1" cy="1" r=".7" fill="#692449"/>
                  <circle cx="3.5" cy="3.5" r=".45" fill="#692449"/>
                </pattern>
              </defs>
              <circle cx="240" cy="105" r="77" fill="#b77794"/>
              <circle cx="240" cy="105" r="77" fill="url(#moon-ink)" opacity=".58"/>
              <circle cx="240" cy="105" r="85" fill="none" stroke="#e6b1bb" stroke-width=".8" stroke-dasharray="1 3" opacity=".7"/>
              <g fill="none" stroke="#edb9bd" stroke-width=".85" opacity=".56">
                <path d="M-8 152c53 22 92 27 143 6s102-23 153-1 91 29 141 10"/>
                <path d="M-4 166c51 21 92 27 142 6s101-21 150-1 92 28 139 10"/>
                <path d="M-11 180c54 21 99 28 148 7s101-21 150-1 92 29 143 10"/>
                <path d="M-5 196c50 20 94 26 143 6s101-21 150-1 91 28 142 10"/>
                <path d="M19 218c42 12 77 9 124-8s100-17 148 2 90 25 140 8"/>
                <path d="M44 232c41 7 77-5 113-16s77-9 117 4 83 28 156 14"/>
              </g>
              <path d="M29 172c31 9 57-.4 76-24 21-26 27-65 54-87 23-19 58-21 78-3 21 19 14 42-7 61-12 11-25 19-31 29-5 8-1 12 10 12 18 0 46-13 65-33 22-23 23-42 10-54-5-5-12-7-15-11-3-4 1-9 7-10 9-1 20 4 28 13 21 22 15 53-10 80-22 24-56 43-84 43-25 0-42-11-40-31 2-18 17-31 35-46 18-15 22-27 11-37-12-11-34-7-48 5-24 19-36 52-60 73-24 22-53 26-79 20Z" fill="#f4c8c2"/>
              <path d="M83 166c31-10 48-46 63-68 16-24 44-42 67-33 23 9 19 30 1 46-15 14-34 28-33 46 1 17 21 24 41 20 38-7 80-39 87-74 3-17-3-30-12-38" fill="none" stroke="#8e4a69" stroke-width="1" stroke-dasharray="1 2.4" stroke-linecap="round"/>
              <path d="M275 59c3 2 6 3 10 3" fill="none" stroke="#6b2148" stroke-width="1" stroke-linecap="round"/>
              <circle cx="282.5" cy="56.7" r="1.65" fill="#54203e"/>
              <path d="M338 42h9m-4.5-4.5v9M373 78h6m-3-3v6M142 34h5m-2.5-2.5v5" fill="none" stroke="#f4c8c2" stroke-width=".95" opacity=".82"/>
            </svg>
            <span class="screening-slot" id="eel-slot">
              <time datetime="06-13">Friday, June 13</time>
              <span class="dot" aria-hidden="true"></span>
              <time datetime="18:30">18:30</time>
            </span>
            <span class="film-title" id="eel-title">The Eel <br>Road</span>
            <span class="selection" aria-hidden="true">
              <span class="selection-dot"></span>
              <span class="selection-off">Select</span>
              <span class="selection-on">Selected</span>
            </span>
          </label>

          <input class="screening-input visually-hidden" type="radio" name="screening"
            id="birds" aria-labelledby="birds-title" aria-describedby="birds-slot"
            aria-controls="screening-details">
          <label class="screening screening--birds" for="birds">
            <svg class="screening-art" viewBox="0 0 420 236" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
              <defs>
                <pattern id="sun-ink" width="4" height="4" patternUnits="userSpaceOnUse">
                  <circle cx="1" cy="1" r=".56" fill="#ab5f7a"/>
                </pattern>
              </defs>
              <circle cx="246" cy="107" r="77" fill="#f5dcbe"/>
              <circle cx="246" cy="107" r="77" fill="url(#sun-ink)" opacity=".62"/>
              <circle cx="246" cy="107" r="85" fill="none" stroke="#884264" stroke-width=".8" stroke-dasharray="1 3" opacity=".65"/>
              <path d="M-5 162c36-5 61 5 91 5 49 0 67-13 102-13 37 0 69 13 103 13s56-18 82-18c16 0 32 3 52 7v84H-5Z" fill="#cb8e9f" opacity=".63"/>
              <g fill="none" stroke="#843c5d" stroke-width=".85" opacity=".62">
                <path d="M-6 166c45-8 66 13 119 7 28-3 55-15 92-12 31 3 50 11 84 11 44 0 65-22 135-8"/>
                <path d="M-3 179c41-5 70 13 122 7 32-4 55-17 94-12 34 4 44 13 84 11 46-2 64-20 127-9"/>
                <path d="M-2 193c43-6 75 13 122 6 34-5 59-17 93-12 37 5 48 13 84 12 46-1 73-20 126-9"/>
                <path d="M13 207c38-6 58 13 108 6 43-6 58-14 96-10 29 3 49 12 80 11 53-2 77-24 130-11"/>
                <path d="M41 224c26 0 39 8 84 2 42-5 68-15 102-8 27 5 43 12 78 9 44-4 72-20 121-10"/>
              </g>
              <g fill="#6b2148">
                <path d="M131 86c28-6 52-3 76 12 13-26 38-46 79-52-25 12-42 31-56 54-5 9-13 17-25 14-7-2-11-7-16-10-17-11-37-16-58-18Z"/>
                <path d="M90 53c16-5 30-4 43 3 5-12 15-21 31-26-9 7-15 15-20 24-5 10-11 12-19 8-11-6-22-9-35-9Z"/>
                <path d="M274 119c19-6 36-5 53 5 9-16 23-25 45-30-15 9-23 18-30 28-7 10-14 12-23 8-14-7-27-10-45-11Z"/>
              </g>
              <g fill="none" stroke="#f5dcbe" stroke-width=".85" stroke-linecap="round" opacity=".76">
                <path d="M151 87c22 .5 37 5 55 16M217 102c11-19 27-35 49-46M289 119c14-1 26 2 38 8"/>
              </g>
              <g fill="none" stroke="#6b2148" stroke-width="1.1" stroke-linecap="round" opacity=".7">
                <path d="M380 237q-4-27-1-54m1 38q-9-16-16-21m15 13q6-15 13-21M398 237q-1-36 8-60m-8 44q-5-14-10-17m12 8q7-12 15-13M363 237q-2-16-7-26"/>
              </g>
            </svg>
            <span class="screening-slot" id="birds-slot">
              <time datetime="06-14">Saturday, June 14</time>
              <span class="dot" aria-hidden="true"></span>
              <time datetime="16:00">16:00</time>
            </span>
            <span class="film-title" id="birds-title">Birds at <br>First Light</span>
            <span class="selection" aria-hidden="true">
              <span class="selection-dot"></span>
              <span class="selection-off">Select</span>
              <span class="selection-on">Selected</span>
            </span>
          </label>
        </fieldset>
      </section>

      <aside class="ticket" id="screening-details" aria-labelledby="details-heading">
        <div class="ticket-heading">
          <h2 id="details-heading">Screening details</h2>
          <p class="ticket-title" id="detail-title">The Eel Road</p>
        </div>
        <dl class="ticket-facts">
          <div>
            <dt>Place</dt>
            <dd id="detail-place">Old Ferry Hall</dd>
          </div>
          <div>
            <dt>Date</dt>
            <dd><time id="detail-date" datetime="06-13">Friday, June 13</time></dd>
          </div>
          <div>
            <dt>Time</dt>
            <dd><time id="detail-time" datetime="18:30">18:30</time></dd>
          </div>
        </dl>
      </aside>
    </div>
    <div class="visually-hidden" id="screening-status" role="status" aria-atomic="true"></div>
  </main>

  <script>
    const program = document.getElementById("program-options");
    const detailTitle = document.getElementById("detail-title");
    const detailPlace = document.getElementById("detail-place");
    const detailDate = document.getElementById("detail-date");
    const detailTime = document.getElementById("detail-time");
    const status = document.getElementById("screening-status");

    function showScreening(announce = false) {
      const selection = program.querySelector("input:checked");
      const label = selection.labels[0];
      const title = label.querySelector(".film-title").textContent.trim().replace(/\s+/g, " ");
      const [date, time] = label.querySelectorAll("time");

      detailTitle.textContent = title;
      detailDate.textContent = date.textContent;
      detailDate.dateTime = date.dateTime;
      detailTime.textContent = time.textContent;
      detailTime.dateTime = time.dateTime;

      if (announce) {
        status.textContent = `${title}. ${detailPlace.textContent}. ${date.textContent} at ${time.textContent}.`;
      }
    }

    program.addEventListener("change", () => showScreening(true));
    window.addEventListener("pageshow", () => showScreening());
  </script>
</body>
</html>
