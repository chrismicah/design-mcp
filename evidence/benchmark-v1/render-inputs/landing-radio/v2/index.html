<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3ebe0">
  <title>Low Signal — Community Radio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='5' fill='%236b2148'/%3E%3Cpath d='M8 24h5l4-10 5 13 4-8h6' fill='none' stroke='%23f3ebe0' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #f3ebe0;
      --ink: #2a1610;
      --muted-ink: #644d43;
      --plum: #6b2148;
      --deep-plum: #501632;
      --rule: #b9a79a;
      --gutter: clamp(1.25rem, 5.5vw, 5.25rem);
      font-family: "Instrument Sans", Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
    }

    .frame {
      width: min(77.5rem, calc(100% - var(--gutter) - var(--gutter)));
      margin-inline: auto;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-block: 2.2rem 1.35rem;
      border-bottom: 1px solid var(--ink);
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: .65rem;
      font-size: 2rem;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -.065em;
      white-space: nowrap;
    }

    .station-mark {
      flex: none;
      width: 2.5rem;
      height: 2.5rem;
      color: var(--plum);
    }

    .station-description {
      margin: 0;
      color: var(--muted-ink);
      font-size: .75rem;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: .12em;
      text-align: right;
      text-transform: uppercase;
    }

    main {
      padding-block: clamp(2.25rem, 4.3vw, 4rem);
      border-bottom: 1px solid var(--rule);
    }

    .broadcast {
      display: grid;
      grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
      align-items: center;
      gap: clamp(2.25rem, 6vw, 5.5rem);
    }

    .artwork {
      overflow: hidden;
      border: 1px solid #9b6b73;
      background: #e6bdb9;
    }

    .artwork svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .program {
      min-width: 0;
      width: 100%;
      max-width: 25.25rem;
    }

    .on-air {
      display: flex;
      align-items: center;
      gap: .65rem;
      margin: 0;
      color: var(--plum);
      font-size: .76rem;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .on-air::before {
      content: "";
      width: .54rem;
      height: .54rem;
      margin-inline: .2rem .1rem;
      border-radius: 50%;
      background: #a03749;
      box-shadow: 0 0 0 3px var(--paper), 0 0 0 4px #a0374966;
    }

    h1 {
      margin: 1.15rem 0 0;
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(4.5rem, 8.2vw, 7.375rem);
      font-weight: 600;
      line-height: .87;
      letter-spacing: -.058em;
    }

    h1 em {
      display: block;
      font-weight: inherit;
    }

    .host {
      margin: 1.2rem 0 0;
      font-size: 1.25rem;
      line-height: 1.35;
    }

    .host strong {
      font-weight: 700;
    }

    .schedule {
      display: flex;
      justify-content: space-between;
      gap: .75rem;
      margin: 1.65rem 0 0;
      padding-top: .85rem;
      border-top: 1px solid var(--rule);
      font-size: 1rem;
      line-height: 1.4;
    }

    .schedule-day {
      color: var(--muted-ink);
    }

    .schedule-time {
      font-weight: 700;
      white-space: nowrap;
    }

    .listen-button {
      display: flex;
      align-items: center;
      gap: .8rem;
      width: 100%;
      min-height: 3.65rem;
      margin-top: 1.05rem;
      padding: .65rem 1.05rem;
      border: 1px solid var(--plum);
      border-radius: .3rem;
      background: var(--plum);
      color: var(--paper);
      font: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color 160ms ease-out, border-color 160ms ease-out, transform 160ms ease-out;
    }

    @media (hover: hover) {
      .listen-button:hover {
        border-color: var(--deep-plum);
        background: var(--deep-plum);
      }
    }

    .listen-button:active {
      transform: translateY(2px);
    }

    .listen-button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px var(--paper);
    }

    .player-icon {
      flex: none;
      width: 1.35rem;
      height: 1.35rem;
    }

    .stop-icon {
      display: none;
    }

    .meter {
      display: grid;
      place-items: center;
      margin-inline-start: auto;
      padding-inline-start: .9rem;
      border-inline-start: 1px solid #f3ebe058;
    }

    .meter svg {
      width: 1.35rem;
      height: 1.5rem;
      opacity: .68;
      transform: scaleY(.72);
      transition: transform 220ms ease-out, opacity 220ms ease-out;
    }

    .listener-status {
      display: flex;
      align-items: center;
      gap: .45rem;
      min-height: 1.25rem;
      margin: .65rem 0 0;
      color: var(--muted-ink);
      font-size: .9rem;
      line-height: 1.3;
    }

    [data-listening="true"] .listen-button {
      border-color: var(--deep-plum);
      background: var(--deep-plum);
    }

    [data-listening="true"] .play-icon {
      display: none;
    }

    [data-listening="true"] .stop-icon {
      display: inline;
    }

    [data-listening="true"] .meter svg {
      opacity: 1;
      transform: scaleY(1);
    }

    [data-listening="true"] .radio-light {
      fill: #fb8e67;
    }

    [data-listening="true"] .listener-status {
      color: var(--plum);
      font-weight: 700;
    }

    [data-listening="true"] .listener-status::before {
      content: "";
      width: .44rem;
      height: .44rem;
      border-radius: 50%;
      background: currentColor;
    }

    @media (max-width: 48em) {
      .frame {
        max-width: 36rem;
      }

      .masthead {
        padding-block: 1.1rem .85rem;
      }

      .wordmark {
        gap: .5rem;
        font-size: 1.6rem;
      }

      .station-mark {
        width: 2.1rem;
        height: 2.1rem;
      }

      .station-description {
        font-size: .66rem;
        letter-spacing: .095em;
      }

      .station-description span {
        display: block;
      }

      main {
        padding-block: 1.25rem 1.65rem;
        margin-bottom: 1.25rem;
      }

      .broadcast {
        grid-template-columns: minmax(0, 1fr);
        gap: 1.75rem;
      }

      .program {
        max-width: none;
      }

      h1 {
        margin-top: .8rem;
        font-size: clamp(2.75rem, 15vw, 5.5rem);
        line-height: .97;
      }

      h1 em {
        display: inline;
      }

      .host {
        margin-top: .65rem;
        font-size: 1.15rem;
      }

      .schedule {
        margin-top: 1.25rem;
      }

      .listen-button {
        margin-top: .9rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .listen-button,
      .meter svg {
        transition: none;
      }

      .listen-button:active {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header class="masthead">
      <div class="wordmark">
        <svg class="station-mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
          <rect width="40" height="40" rx="5" fill="currentColor"/>
          <path d="M8 24h5l4-10 5 13 4-8h6" fill="none" stroke="#f3ebe0"
                stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Low Signal
      </div>
      <p class="station-description"><span>Nonprofit</span> <span>community radio</span></p>
    </header>

    <main>
      <section class="broadcast" id="broadcast" aria-labelledby="show-title" data-listening="false">
        <div class="artwork" aria-hidden="true">

              <use href="#terrain-line" transform="translate(20 20)"/>

              <use href="#terrain-line" transform="translate(65 65)"/>
              <path d="M-16 499c121 12 142-60 216-59 77 2 113 59 202 53 116-8 172-91 307-66
                       M-16 519c127 11 151-63 223-64 72-1 114 59 199 55 118-6 173-86 303-62
                       M-16 539c131 11 158-62 224-65 74-3 121 58 204 54 113-5 176-83 297-57"/>
            </g>

            <circle cx="371" cy="274" r="200" fill="none" stroke="#86445b" stroke-width="1.4"/>
            <circle cx="365" cy="270" r="197" fill="#6b2148"/>
            <g clip-path="url(#ink-disc)" fill="none" stroke="#e9b7aa" stroke-width="1.15" opacity=".43">
              <use href="#terrain-line" transform="translate(-41 38)"/>
              <use href="#terrain-line" transform="translate(-19 58)"/>
              <use href="#terrain-line" transform="translate(4 80)"/>
              <use href="#terrain-line" transform="translate(26 101)"/>
              <use href="#terrain-line" transform="translate(48 123)"/>
              <use href="#terrain-line" transform="translate(70 145)"/>
            </g>

            <g fill="none" stroke="#7d3b55" stroke-width="1.7" stroke-linecap="round">
              <path d="M428 54a27 27 0 0 1 3 26"/>
              <path d="M444 44a46 46 0 0 1 6 44"/>
              <path d="M460 32a66 66 0 0 1 10 63"/>
            </g>

            <g transform="rotate(-9 350 322)" stroke="#38212a" stroke-linejoin="round">
              <path d="M120 411l368 7 87-51 39 14-100 74H155Z"
                    fill="url(#shadow-lines)" stroke="none" opacity=".72"/>
              <path d="M169 416h35v13q0 5-5 5h-25q-5 0-5-5Zm285 0h35v13q0 5-5 5h-25q-5 0-5-5Z"
                    fill="#38212a" stroke-width="2"/>

              <path d="M256 221v-13q0-19 19-19h124q19 0 19 19v13"
                    fill="none" stroke-width="12"/>
              <path d="M253 211v-4q0-20 20-20h128"
                    fill="none" stroke="#b78272" stroke-width="2" stroke-linecap="round"/>
              <path d="M283 189h105" stroke="#58313c" stroke-width="8" stroke-linecap="round"/>

              <g fill="none" stroke-linecap="round">
                <path d="M206 226 443 81" stroke-width="9"/>
                <path d="M208 225 308 164" stroke="#dda880" stroke-width="5.1"/>
                <path d="m308 164 70-43" stroke="#f5d5aa" stroke-width="3.7"/>
                <path d="m378 121 65-40" stroke="#f7dbb4" stroke-width="2"/>
                <path d="m439 83 7-4" stroke-width="8"/>
              </g>

              <path d="m152 258 43-33q10-8 23-8h323q20 0 20 19v126q0 15-11 23l-43 34H166q-20 0-20-20V275q0-10 6-17Z"

                    fill="none" stroke="#f3d4ad" stroke-width="1"/>

              <path d="M317 332h87m-87 5h87" stroke="#99675e" stroke-width="1"/>

              <circle cx="463" cy="369" r="32" fill="#6c404b" stroke-width="2"/>

              <circle cx="461" cy="366" r="24" fill="none" stroke="#6f4150"

              <path d="M163 271h6m-3-3v6m-3 128h6m-3-3v6m330-134h6m-3-3v6m-3 128h6m-3-3v6"

            <rect width="700" height="560" fill="url(#paper-flecks)" opacity=".7"/>
            <path d="M24 43V24h19m614 0h19v19M24 517v19h19m614 0h19v-19"
                  fill="none" stroke="#7f4357" stroke-width="1.25" opacity=".67"/>
          </svg>
        </div>

        <div class="program">
          <p class="on-air">On air</p>
          <h1 id="show-title">Field <em>Notes</em></h1>
          <p class="host">with <strong>Ana Reyes</strong></p>

          <p class="schedule">
            <span class="schedule-day">Weekdays</span>
            <span class="schedule-time"><time datetime="07:00">7</time>–<time datetime="09:00">9 am</time></span>
          </p>

          <button class="listen-button" id="listen" type="button">
            <svg class="player-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
              <path class="play-icon" d="M7 5.4a1 1 0 0 1 1.53-.85l10 6.6a1 1 0 0 1 0 1.7l-10 6.6A1 1 0 0 1 7 18.6Z"/>
              <rect class="stop-icon" x="6" y="6" width="12" height="12" rx="1.5"/>
            </svg>
            <span class="listen-label">Listen live</span>
            <span class="meter" aria-hidden="true">
              <svg viewBox="0 0 22 24" fill="none" focusable="false">
                <path d="M2 10v4m6-8v12m6-15v18m6-13v8" stroke="currentColor"
                      stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </span>
          </button>
          <p class="listener-status" id="listener-status" role="status" aria-atomic="true"></p>
        </div>
      </section>
    </main>
  </div>

  <script>
    const broadcast = document.getElementById("broadcast");
    const listenButton = document.getElementById("listen");
    const listenLabel = listenButton.querySelector(".listen-label");
    const listenerStatus = document.getElementById("listener-status");
    let listening = false;

    listenButton.addEventListener("click", () => {
      listening = !listening;
      broadcast.dataset.listening = String(listening);
      listenLabel.textContent = listening ? "Stop listening" : "Listen live";
      listenerStatus.textContent = listening ? "You're live" : "Listening stopped";
    });
  </script>
</body>
</html>
