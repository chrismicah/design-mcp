<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5eb">
  <title>Second Spin | Bike Repair</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f5eb;
      --section: #eeede2;
      --ink: #172a21;
      --forest: #1b392d;
      --muted: #4a5b50;
      --rule: #bfc6b9;
      --lime: #e1f77c;
      --display: "Barlow Condensed", Impact, "Arial Narrow", sans-serif;
      --body: "DM Sans", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --gutter: clamp(20px, 5.55vw, 80px);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 1rem/1.5 var(--body);
    }

    h1, h2, h3, p, figure, dl, dd { margin: 0; }
    a { color: inherit; }
    svg { display: block; }

    :focus-visible {
      outline: 2px solid #326348;
      outline-offset: 4px;
    }

    .wrap {
      width: min(1280px, calc(100% - var(--gutter) - var(--gutter)));
      margin-inline: auto;
    }

    .site-header { border-bottom: 1px solid var(--rule); }

    .header-inner {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font: 800 1.9rem/.95 var(--display);
      letter-spacing: .015em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .wordmark svg { flex: none; }

    .header-link, .primary-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 44px;
      border: 1px solid var(--ink);
      border-radius: 5px;
      padding-inline: 14px;
      text-decoration: none;
      font-size: .875rem;
      font-weight: 700;
      white-space: nowrap;
      transition: background-color .15s ease;
    }

    .header-link:hover { background: var(--section); }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr);
      align-items: center;
      gap: clamp(27px, 4.4vw, 64px);
      padding-block: 36px 40px;
    }

    .shop-details {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      color: var(--muted);
      font: 500 .75rem/1.3 var(--mono);
      letter-spacing: .055em;
      text-transform: uppercase;
    }

    .shop-address {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-left: 1px solid var(--rule);
      padding-left: 12px;
    }

    h1, h2 {
      font-family: var(--display);
      font-weight: 800;
      letter-spacing: -.023em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(4.5rem, 8.55vw, 7.65rem);
      line-height: .84;
    }

    h1 span { display: block; }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px 28px;
      margin-top: 30px;
    }

    .hero-price {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .hero-price strong { font: 800 3.15rem/.9 var(--display); }

    .hero-price span {
      color: var(--muted);
      font-size: .875rem;
      font-weight: 500;
    }

    .primary-link {
      min-height: 51px;
      gap: 16px;
      padding-inline: 17px;
      background: var(--lime);
      box-shadow: 0 3px 0 var(--ink);
      font-size: .9375rem;
    }

    .primary-link:hover { background: #eefba5; }

    .primary-link:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--ink);
    }

    .bike-art {
      overflow: hidden;
      border: 1px solid #1c3a2c;
      border-radius: 7px;
      background: #214332;
    }

    .bike-art > svg {
      width: 100%;
      height: auto;
    }

    .booking {
      border-block: 1px solid var(--rule);
      background: var(--section);
      scroll-margin-top: 12px;
    }

    .booking-inner {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 365px);
      align-items: center;
      gap: clamp(28px, 5vw, 76px);
      padding-block: 29px 34px;
    }

    h2 {
      font-size: clamp(2.8rem, 4.25vw, 3.8rem);
      line-height: .95;
    }

    .day-options {
      min-width: 0;
      margin: 22px 0 0;
      padding: 0;
      border: 0;
    }

    .day-options legend {
      margin-bottom: 10px;
      padding: 0;
      font-size: .9375rem;
      font-weight: 700;
    }

    .day-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 9px;
    }

    .day-option {
      position: relative;
      min-width: 0;
      cursor: pointer;
    }

    .day-option input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      border: 0;
    }

    .day-tile {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      min-height: 59px;
      border: 1px solid #9eac9f;
      border-radius: 5px;
      padding: 8px 13px;
      background: var(--paper);
      font-size: .9375rem;
      font-weight: 700;
      line-height: 1;
      transition: background-color .15s ease, border-color .15s ease;
    }

    .day-option:hover .day-tile { border-color: var(--ink); }

    .day-option input:focus-visible + .day-tile {
      outline: 2px solid #326348;
      outline-offset: 3px;
    }

    .day-option input:checked + .day-tile {
      border-color: var(--ink);
      background: var(--lime);
      box-shadow: inset 0 0 0 1px var(--ink);
    }

    .day-indicator {
      display: grid;
      flex: none;
      place-items: center;
      width: 15px;
      height: 15px;
      border: 1px solid #687e6e;
      border-radius: 50%;
    }

    .day-indicator::after {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ink);
      opacity: 0;
      content: "";
    }

    input:checked + .day-tile .day-indicator { border-color: var(--ink); }
    input:checked + .day-tile .day-indicator::after { opacity: 1; }

    .summary {
      border-radius: 6px;
      padding: 18px 22px 15px;
      background: var(--forest);
      color: var(--paper);
    }

    .summary-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 13px;
    }

    .summary h3 { font-size: 1.125rem; }

    .summary-heading svg, .summary-total strong, #selected-day[data-chosen] {
      color: var(--lime);
    }

    .summary-details {
      display: grid;
      gap: 5px;
      font-size: .875rem;
    }

    .summary-details div, .summary-total {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
    }

    .summary-details dt, .summary-total span, #selected-day {
      color: #ccd9ca;
    }

    .summary-details dd {
      text-align: right;
      font-weight: 600;
    }

    #selected-day { font-weight: 500; }
    #selected-day[data-chosen] { font-weight: 700; }

    .summary-total {
      margin-top: 12px;
      padding-top: 9px;
      border-top: 1px dashed #7b9583;
      font-size: .875rem;
      font-weight: 600;
    }

    .summary-total strong { font: 800 2.25rem/.95 var(--display); }

    @media (max-width: 860px) {
      .hero {
        grid-template-columns: 1fr;
        gap: 28px;
        padding-block: 29px 28px;
      }

      h1 { font-size: clamp(3.8rem, 19.4vw, 6.75rem); }

      .booking-inner {
        grid-template-columns: 1fr;
        gap: 23px;
        padding-block: 27px 30px;
      }
    }

    @media (max-width: 520px) {
      :root { --gutter: 20px; }

      .header-inner { min-height: 64px; }
      .wordmark { gap: 8px; font-size: 1.65rem; }
      .wordmark svg { width: 34px; height: 34px; }
      .header-link { gap: 8px; padding-inline: 11px; }
      .shop-details { margin-bottom: 17px; font-size: .6875rem; }
      .hero-actions { margin-top: 23px; }
      .hero-price { display: grid; gap: 4px; }
      .hero-price strong { font-size: 2.7rem; }
      .hero-price span { font-size: .8125rem; }

      .day-options { margin-top: 18px; }
      .day-grid { gap: 7px; }

      .day-tile {
        flex-direction: column-reverse;
        justify-content: center;
        gap: 7px;
        min-height: 61px;
        padding-inline: 2px;
        font-size: .875rem;
      }

      .summary { padding-inline: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .primary-link, .header-link, .day-tile { transition: none; }
    }
  </style>
</head>
<body>
  <header class="site-header" id="top">
    <div class="wrap header-inner">
      <a class="wordmark" href="#top">
        <svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true">
          <rect width="38" height="38" rx="5" fill="#172a21"/>
          <path d="M9.5 18a9.5 9.5 0 0 1 16-6.8l1.9 1.9m0-5.2v5.2h-5.2M28.5 20a9.5 9.5 0 0 1-16 6.8l-1.9-1.9m0 5.2v-5.2h5.2"
                fill="none" stroke="#e1f77c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="19" cy="19" r="2" fill="#e1f77c"/>
        </svg>
        Second Spin
      </a>
      <nav aria-label="Shop">
        <a class="header-link" href="#booking">
          Booking
          <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 2.8v10.4m-4-4 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </nav>
    </div>
  </header>

  <main>
    <section class="wrap hero" aria-labelledby="service-title">
      <div>
        <p class="shop-details">
          <span>Bike repair shop</span>
          <span class="shop-address">
            <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M12.4 6.5c0 3-4.4 6.9-4.4 6.9s-4.4-3.9-4.4-6.9a4.4 4.4 0 1 1 8.8 0Z" fill="none" stroke="currentColor" stroke-width="1.3"/>
              <circle cx="8" cy="6.4" r="1.35" fill="none" stroke="currentColor" stroke-width="1.2"/>
            </svg>
            41 Elm Street
          </span>
        </p>
        <h1 id="service-title">
          <span>48-hour</span>
          <span>tune-ups.</span>
        </h1>
        <div class="hero-actions">
          <p class="hero-price"><strong>$85</strong> <span>per tune-up</span></p>
          <a class="primary-link" href="#booking">
            Book a tune-up
            <svg width="17" height="17" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 2.8v10.4m-4-4 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>
      </div>

      <figure class="bike-art">
        <svg viewBox="0 0 704 430" role="img" aria-labelledby="bike-title">
          <title id="bike-title">Illustration of a lime-green bicycle on a dark green grid</title>
          <defs>
            <radialGradient id="art-background" cx="68%" cy="33%" r="85%">
              <stop stop-color="#396348"/>
              <stop offset="1" stop-color="#152e25"/>
            </radialGradient>
            <linearGradient id="frame-paint" x1="260" y1="140" x2="401" y2="315" gradientUnits="userSpaceOnUse">
              <stop stop-color="#f2ffad"/>
              <stop offset=".46" stop-color="#d9f478"/>
              <stop offset="1" stop-color="#aeca57"/>
            </linearGradient>
            <pattern id="art-grid" width="28" height="28" patternUnits="userSpaceOnUse">
              <path d="M28 0H0v28" fill="none" stroke="#c4d9b5" stroke-opacity=".16"/>
              <circle r="1.2" fill="#c4d9b5" fill-opacity=".27"/>
            </pattern>
            <g id="wheel">
              <circle r="102" fill="#19342a" fill-opacity=".68" stroke="#14291f" stroke-width="10"/>
              <circle r="107" fill="none" stroke="#bdcaae" stroke-opacity=".7"/>
              <circle r="99" fill="none" stroke="#849e85" stroke-width="1.4"/>
              <circle r="95" fill="none" stroke="#bccdac" stroke-width="1.3"/>
              <g fill="none" stroke="#bdcdb2" stroke-opacity=".61" stroke-width=".9">
                <path d="M-7 2 0-95M-3-7 56-77M5-5 90-29M7-2 90 29M7 ² 56 77M3 7 0 95M-5 5-56 77M-7 2-90 29M-7-2-90-29M-3-7-56-77"/>
                <path d="M2-7 29-90M7-3 77-56M7 2 95 0M5 5 77 56M-2 7 29 90M-7 3-29 90M-7-2-77 56M-5-5-95 0M2-7-77-56M7-3-29-90"/>
              </g>
              <circle r="9" fill="#233d31" stroke="#c2d1b8" stroke-width="1.3"/>
              <circle r="3" fill="#d3dec6"/>
            </g>
          </defs>

          <rect width="704" height="430" fill="url(#art-background)"/>
          <rect width="704" height="430" fill="url(#art-grid)"/>
          <g fill="none" stroke="#cce58c" stroke-opacity=".25">
            <circle cx="495" cy="189" r="166"/>
            <circle cx="495" cy="189" r="196"/>
            <circle cx="495" cy="189" r="224" stroke-dasharray="2 6"/>
            <path d="M24 45V24h21m614 0h21v21M24 385v21h21m614 0h21v-21" stroke-opacity=".63"/>
          </g>
          <ellipse cx="344" cy="385" rx="275" ry="10" fill="#101f18" opacity=".5"/>
          <path d="M171 397h346m-346-5v10m346-10v10" fill="none" stroke="#acbf9f" stroke-opacity=".55"/>

          <use href="#wheel" x="171" y="280"/>
          <use href="#wheel" x="517" y="280"/>

          <g fill="none" stroke="#bacab0">
            <circle cx="517" cy="280" r="18" stroke-width="2"/>
            <circle cx="517" cy="280" r="13" stroke-dasharray="2.2 3.2" stroke-width="2"/>
            <circle cx="171" cy="280" r="13" stroke-width="2"/>
            <path d="M172 267l143-4a27 27 0 1 1-3 54l-143-24a13 13 0 0 1 3-26Z" stroke="#a6b69c" stroke-width="3"/>
            <path d="M172 267l143-4a27 27 0 1 1-3 54l-143-24a13 13 0 0 1 3-26Z" stroke="#314e3d" stroke-width="1.6" stroke-dasharray="2 2.4"/>
          </g>

          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M171 280 272 166m-101 114 145 11M469 201c13 34 23 59 48 79"
                  stroke="#162c22" stroke-width="12"/>
            <path d="M171 280 272 166m-101 114 145 11M469 201c13 34 23 59 48 79"
                  stroke="url(#frame-paint)" stroke-width="8"/>
            <path d="M272 166c58-3 119-10 177-16l20 51-153 90-44-125Z"
                  stroke="#142d22" stroke-width="16"/>
            <path d="M272 166c58-3 119-10 177-16l20 51-153 90-44-125Z"
                  stroke="url(#frame-paint)" stroke-width="11"/>
            <path d="M278 164c55-3 113-10 165-16m22 49-141 83m-49-106 38 107"
                  stroke="#f4ffbd" stroke-opacity=".88" stroke-width="1.25"/>

            <path d="M272 163l-10-29m187 15-8-22 43-10"
                  stroke="#10271d" stroke-width="11"/>
            <path d="M272 163l-10-29m187 15-8-22 43-10"
                  stroke="#bdcbbb" stroke-width="5.5"/>
            <path d="M484 117c18-1 27 6 27 19s-9 21-22 21h-11"
                  stroke="#132a20" stroke-width="10"/>
            <path d="M484 117c18-1 27 6 27 19s-9 21-22 21h-11"
                  stroke="#dae3cf" stroke-width="4"/>
            <path d="M502 122c7 4 9 9 9 15 0 12-9 20-22 20h-11"
                  stroke="#192e25" stroke-width="7"/>
            <path d="M503 123c6 4 8 9 8 14 0 12-9 20-22 20h-11"
                  stroke="#849d87" stroke-width="1.3"/>
            <path d="M496 122c-16 15-63 0-75 17-8 12 11 24 34 27"
                  stroke="#152d23" stroke-width="1.7"/>

            <path d="M238 128c10-4 18 0 27 0l15 1c6-1 12-2 15 1 0 4-10 7-19 8l-23 1c-9 0-14-4-15-11Z"
                  fill="#173025" stroke="#c5d1b9" stroke-width="1.4"/>
            <path d="M244 131c13 0 24 4 39 .7" stroke="#879e86" stroke-width="1"/>
          </g>

          <g transform="translate(316 290)">
            <circle r="25" fill="#213e31" stroke="#bacbad" stroke-width="2" stroke-dasharray="2 1.8"/>
            <circle r="21" fill="none" stroke="#d4dfc4" stroke-width="1.3"/>
            <path d="m-17-8 34 16m-25 9 16-34" stroke="#a5ba9e" stroke-width="3.2" stroke-linecap="round"/>
            <circle r="5" fill="#d4dfc4"/>
            <path d="M0 0l32 31m-6 0h19" fill="none" stroke="#132b20" stroke-width="8" stroke-linecap="round"/>
            <path d="M0 0l32 31m-6 0h19" fill="none" stroke="#c8d7bd" stroke-width="3.4" stroke-linecap="round"/>
          </g>

          <circle cx="171" cy="280" r="3.5" fill="#d4dfc4"/>
          <circle cx="517" cy="280" r="3.5" fill="#d4dfc4"/>
        </svg>
      </figure>
    </section>

    <section class="booking" id="booking" aria-labelledby="booking-title" tabindex="-1">
      <div class="wrap booking-inner">
        <div>
          <h2 id="booking-title">Book a tune-up</h2>
          <fieldset class="day-options" id="day-options">
            <legend>Choose a day</legend>
            <div class="day-grid">
              <label class="day-option">
                <input type="radio" name="booking-day" value="Tuesday" aria-label="Tuesday">
                <span class="day-tile" aria-hidden="true">Tue <span class="day-indicator"></span></span>
              </label>
              <label class="day-option">
                <input type="radio" name="booking-day" value="Wednesday" aria-label="Wednesday">
                <span class="day-tile" aria-hidden="true">Wed <span class="day-indicator"></span></span>
              </label>
              <label class="day-option">
                <input type="radio" name="booking-day" value="Thursday" aria-label="Thursday">
                <span class="day-tile" aria-hidden="true">Thu <span class="day-indicator"></span></span>
              </label>
              <label class="day-option">
                <input type="radio" name="booking-day" value="Friday" aria-label="Friday">
                <span class="day-tile" aria-hidden="true">Fri <span class="day-indicator"></span></span>
              </label>
              <label class="day-option">
                <input type="radio" name="booking-day" value="Saturday" aria-label="Saturday">
                <span class="day-tile" aria-hidden="true">Sat <span class="day-indicator"></span></span>
              </label>
            </div>
          </fieldset>
        </div>

        <aside class="summary" aria-labelledby="summary-title">
          <div class="summary-heading">
            <h3 id="summary-title">Booking summary</h3>
            <svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true">
              <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3.5" y="5" width="17" height="15.5" rx="2"/>
                <path d="M7.5 3v4m9-4v4m-13 3h17m-11 5 1.6 1.6 3.3-3.3"/>
              </g>
            </svg>
          </div>
          <dl class="summary-details">
            <div><dt>Service</dt><dd>48-hour tune-up</dd></div>
            <div><dt>Day</dt><dd id="selected-day" aria-live="polite" aria-atomic="true">Choose a day</dd></div>
            <div><dt>Location</dt><dd>41 Elm Street</dd></div>
          </dl>
          <p class="summary-total"><span>Price</span><strong>$85</strong></p>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const dayOptions = document.getElementById("day-options");
    const selectedDay = document.getElementById("selected-day");

    function updateSummary() {
      const choice = dayOptions.querySelector("input:checked");
      const day = choice ? choice.value : "Choose a day";

      if (selectedDay.textContent !== day) {
        selectedDay.textContent = day;
      }
      selectedDay.toggleAttribute("data-chosen", Boolean(choice));
    }

    dayOptions.addEventListener("change", updateSummary);
    window.addEventListener("pageshow", updateSummary);
    updateSummary();
  </script>
</body>
</html>
