<!doctype html>
<!--
  A calm court notice for pickup players deciding where to play.
  Bricolage Grotesque gives the title, controls, and court names a clear hierarchy.
  A half-court drawing anchors the header above a filter and two status rows.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Court status</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --mist: #edf3f1;
      --chalk: #fcfdfb;
      --petrol: #173f42;
      --sage: #cbd8d3;
      --fern: #176147;
      --wine: #863f4d;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--mist);
      color: var(--petrol);
      font-family: "Bricolage Grotesque", "Avenir Next", sans-serif;
      line-height: 1.5;
    }

    .notice {
      --inset: clamp(20px, 5vw, 58px);
      inline-size: min(1100px, calc(100% - clamp(32px, 8vw, 128px)));
      margin: clamp(24px, 6vw, 88px) auto;
      overflow: hidden;
      border: 1px solid var(--sage);
      border-radius: 12px;
      background: var(--chalk);
    }

    .masthead {
      position: relative;
      display: grid;
      align-items: center;
      min-block-size: clamp(176px, 21vw, 260px);
      padding: 28px var(--inset);
      overflow: hidden;
      background: var(--petrol);
      color: var(--chalk);
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(3.75rem, 7vw, 6.25rem);
      font-weight: 680;
      line-height: 0.96;
      letter-spacing: -0.055em;
    }

    .court-plan {
      position: absolute;
      inset-block-start: 50%;
      inset-inline-end: clamp(12px, 3vw, 42px);
      inline-size: min(41%, 409px);
      block-size: auto;
      transform: translateY(-50%);
      opacity: 0.36;
      pointer-events: none;
    }

    .court-plan g > * {
      vector-effect: non-scaling-stroke;
    }

    .availability {
      padding: 28px var(--inset) 14px;
    }

    .filters {
      display: inline-flex;
      gap: 4px;
      margin-block-end: 24px;
      padding: 4px;
      border: 1px solid var(--sage);
      border-radius: 9px;
      background: var(--mist);
    }

    .filters button {
      min-block-size: 44px;
      padding: 8px 18px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: var(--petrol);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    .filters button[aria-pressed="true"] {
      background: var(--petrol);
      color: var(--chalk);
    }

    .filters button:focus-visible {
      outline: 2px solid var(--petrol);
      outline-offset: 2px;
    }

    @media (hover: hover) {
      .filters button[aria-pressed="false"]:hover {
        background: var(--sage);
      }
    }

    .courts {
      margin: 0;
      padding: 0;
      border-block-start: 1px solid var(--sage);
      list-style: none;
    }

    .court {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(14rem, 34%);
      align-items: center;
      gap: 9px 24px;
      min-block-size: 104px;
      padding-block: 22px;
    }

    .court[hidden] {
      display: none;
    }

    .court + .court {
      border-block-start: 1px solid var(--sage);
    }

    .court h2 {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      font-weight: 660;
      line-height: 1.08;
      letter-spacing: -0.045em;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-size: 1.0625rem;
      font-weight: 560;
    }

    .status--open {
      color: var(--fern);
    }

    .status--closed {
      color: var(--wine);
    }

    .status time {
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .status-icon {
      display: grid;
      flex: 0 0 24px;
      place-items: center;
      block-size: 24px;
      border: 1px solid currentColor;
      border-radius: 50%;
      background: color-mix(in srgb, currentColor 8%, var(--chalk));
    }

    .status-icon::after {
      content: "";
    }

    .status--open .status-icon::after {
      inline-size: 9px;
      block-size: 5px;
      border: solid currentColor;
      border-width: 0 0 2px 2px;
      transform: translateY(-1px) rotate(-45deg);
    }

    .status--closed .status-icon::after {
      inline-size: 8px;
      block-size: 2px;
      border-block-start: 2px solid currentColor;
    }

    .visually-hidden {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 680px) {
      h1 {
        max-inline-size: 7ch;
        font-size: clamp(2.75rem, 13vw, 3.75rem);
      }

      .court-plan {
        inset-inline-end: 8px;
        inline-size: min(52%, 270px);
      }

      .availability {
        padding-block: 20px 10px;
      }

      .filters {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-block-end: 20px;
      }

      .filters button {
        padding-inline: 8px;
      }

      .court {
        grid-template-columns: minmax(0, 1fr);
        padding-block: 19px;
      }

      .status {
        font-size: 1rem;
      }
    }

    @media (forced-colors: active) {
      .filters button[aria-pressed="true"] {
        border-color: ButtonText;
      }

      .filters button:focus-visible {
        outline-color: Highlight;
      }
    }
  </style>
</head>
<body>
  <main class="notice" aria-labelledby="page-title">
    <header class="masthead">
      <h1 id="page-title">Court status</h1>
      <svg class="court-plan" viewBox="0 0 375 240" fill="none" aria-hidden="true" focusable="false">
        <path d="M270 88H350V152H270Z" fill="currentColor" opacity=".22"/>
        <g stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="M35 12H350V228H35Z M35 89a31 31 0 0 1 0 62"/>
          <path d="M350 31h-34a89 89 0 0 0 0 178h34"/>
          <path d="M350 88h-80v64h80 M270 88a32 32 0 0 0 0 64"/>
          <path d="M342 108v24 M342 120h-5"/>
          <circle cx="331.5" cy="120" r="5.5"/>
        </g>
      </svg>
    </header>

    <div class="availability">
      <div class="filters" role="group" aria-label="Filter courts">
        <button type="button" aria-controls="courts" aria-pressed="true">All courts</button>
        <button type="button" aria-controls="courts" aria-pressed="false" data-open-only>Open courts</button>
      </div>

      <ul class="courts" id="courts" role="list" aria-label="Courts">
        <li class="court">
          <h2>Court 3</h2>
          <p class="status status--open">
            <span class="status-icon" aria-hidden="true"></span>
            <span>Open until <time datetime="21:30">21:30</time></span>
          </p>
        </li>
        <li class="court" id="court-5">
          <h2>Court 5</h2>
          <p class="status status--closed">
            <span class="status-icon" aria-hidden="true"></span>
            <span>Closed for resurfacing</span>
          </p>
        </li>
      </ul>

      <p class="visually-hidden" id="filter-result" role="status"></p>
    </div>
  </main>

  <script>
    const filterButtons = document.querySelectorAll(".filters button");
    const closedCourt = document.getElementById("court-5");
    const filterResult = document.getElementById("filter-result");

    for (const button of filterButtons) {
      button.addEventListener("click", () => {
        if (button.getAttribute("aria-pressed") === "true") return;

        const openOnly = button.hasAttribute("data-open-only");
        closedCourt.hidden = openOnly;

        for (const filter of filterButtons) {
          filter.setAttribute("aria-pressed", String(filter === button));
        }

        filterResult.textContent = openOnly
          ? "Showing 1 open court."
          : "Showing both courts.";
      });
    }
  </script>
</body>
</html>
