<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Court status</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Instrument+Sans:wght@400;600&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #f3ebe0;
      --ink: #2a1610;
      --plum: #6b2148;
      --chalk: #fff8ee;
      --muted: #694f46;
      --rule: #cfbcb2;
      --display: "Fraunces", Georgia, serif;
      --body: "Instrument Sans", sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 1rem/1.5 var(--body);
    }

    h1, h2, p {
      margin: 0;
    }

    .board {
      width: min(calc(100% - 2.5rem), 68rem);
      margin-inline: auto;
      padding-block: clamp(2.75rem, 8vw, 7.25rem) 3rem;
    }

    .board-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem 2rem;
      margin-block-end: 1.75rem;
    }

    h1 {
      font: 600 clamp(3.25rem, 6vw, 5.125rem)/1 var(--display);
      letter-spacing: -.045em;
    }

    .filters {
      display: inline-flex;
      gap: .1875rem;
      padding: .1875rem;
      border: 1px solid var(--rule);
      border-radius: .625rem;
    }

    .filter {
      min-height: 44px;
      padding: .625rem 1rem;
      border: 0;
      border-radius: .375rem;
      background: transparent;
      color: var(--ink);
      font: 600 .9375rem/1.25 var(--body);
      cursor: pointer;
    }

    .filter[aria-pressed="true"] {
      background: var(--ink);
      color: var(--chalk);
    }

    .filter[aria-pressed="false"]:hover {
      background: rgb(42 22 16 / 7%);
    }

    .filter:focus-visible {
      position: relative;
      z-index: 1;
      outline: 2px solid var(--ink);
      outline-offset: 2px;
      box-shadow: 0 0 0 2px var(--paper);
    }

    .courts {
      --inset: clamp(1.25rem, 4.2vw, 3rem);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .court {
      padding-inline: var(--inset);
    }

    .court--open {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 42%;
      align-items: center;
      gap: clamp(.5rem, 2.5vw, 2rem);
      min-height: 16rem;
      padding-block: 1.875rem;
      border-radius: 2px;
      background: var(--plum);
      color: var(--chalk);
    }

    .court--closed {
      padding-block: 1.375rem 1.5rem;
      border-bottom: 1px solid var(--rule);
    }

    .court-name {
      font: 600 clamp(2rem, 3.15vw, 2.75rem)/1.08 var(--display);
      letter-spacing: -.035em;
    }

    .open-status {
      margin-block-start: .875rem;
    }

    .status-label {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: 1.0625rem;
    }

    .status-label::before {
      content: "";
      flex: none;
      width: .4375rem;
      height: .4375rem;
      border: 1px solid currentColor;
      border-radius: 50%;
    }

    .open-status .status-label::before {
      background: currentColor;
    }

    .open-status time {
      display: block;
      margin-block-start: .375rem;
      font: 600 clamp(3.625rem, 6.25vw, 5.625rem)/.95 var(--display);
      font-variant-numeric: lining-nums tabular-nums;
      letter-spacing: -.045em;
    }

    .closed-status {
      margin-block-start: .375rem;
      color: var(--muted);
    }

    .court-diagram {
      position: relative;
      justify-self: end;
      width: 100%;
      max-width: 24rem;
      aspect-ratio: 1.7;
      border: 1px solid currentColor;
      opacity: .48;
    }

    .court-diagram::before {
      content: "";
      position: absolute;
      top: 50%;
      left: -1px;
      width: 12%;
      height: 38%;
      border: 1px solid currentColor;
      border-left: 0;
      border-radius: 0 100% 100% 0 / 0 50% 50% 0;
      transform: translateY(-50%);
    }

    .three-point-line {
      position: absolute;
      inset: 8% 0 8% 35%;
      border: 1px solid currentColor;
      border-right: 0;
      border-radius: 87% 0 0 87% / 50% 0 0 50%;
    }

    .paint {
      position: absolute;
      inset: 34% 0 34% 67%;
      border: 1px solid currentColor;
      border-right: 0;
      background: color-mix(in srgb, currentColor 14%, transparent);
    }

    .paint::before {
      content: "";
      position: absolute;
      top: -1px;
      right: 100%;
      height: calc(100% + 2px);
      aspect-ratio: 1 / 2;
      border: 1px solid currentColor;
      border-right: 0;
      border-radius: 100% 0 0 100% / 50% 0 0 50%;
    }

    .rim {
      position: absolute;
      top: 50%;
      right: 7%;
      width: clamp(.375rem, .8vw, .625rem);
      aspect-ratio: 1;
      border: 1px solid currentColor;
      border-radius: 50%;
      transform: translateY(-50%);
    }

    .rim::after {
      content: "";
      position: absolute;
      top: 50%;
      left: calc(100% + 2px);
      height: 160%;
      border-left: 1px solid currentColor;
      transform: translateY(-50%);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 40rem) {
      .board-header {
        flex-direction: column;
        align-items: flex-start;
        margin-block-end: 1.25rem;
      }

      .court--open {
        min-height: 12.75rem;
        padding-block: 1.5rem;
      }

      .open-status time {
        font-size: clamp(2.75rem, 15vw, 4rem);
      }

      .court-diagram {
        aspect-ratio: 1.22;
      }
    }

    @media (forced-colors: active) {
      .filter[aria-pressed="true"] {
        text-decoration: underline;
        text-underline-offset: .2em;
      }
    }
  </style>
</head>
<body>
  <main class="board">
    <header class="board-header">
      <h1>Court status</h1>
      <div class="filters" role="group" aria-label="Filter courts">
        <button type="button" class="filter" id="all-courts"
                aria-pressed="true" aria-controls="court-list">All courts</button>
        <button type="button" class="filter" id="open-courts"
                aria-pressed="false" aria-controls="court-list">Open courts</button>
      </div>
    </header>

    <ul class="courts" id="court-list" role="list" aria-label="Basketball courts">
      <li>
        <article class="court court--open" aria-labelledby="court-3-name">
          <div>
            <h2 class="court-name" id="court-3-name">Court 3</h2>
            <p class="open-status">
              <span class="status-label">Open until</span>
              <time datetime="21:30">21:30</time>
            </p>
          </div>
          <div class="court-diagram" aria-hidden="true">
            <span class="three-point-line"></span>
            <span class="paint"></span>
            <span class="rim"></span>
          </div>
        </article>
      </li>
      <li id="court-5">
        <article class="court court--closed" aria-labelledby="court-5-name">
          <h2 class="court-name" id="court-5-name">Court 5</h2>
          <p class="status-label closed-status">Closed for resurfacing</p>
        </article>
      </li>
    </ul>

    <p class="visually-hidden" id="filter-status" role="status"></p>
  </main>

  <script>
    const allCourts = document.getElementById("all-courts");
    const openCourts = document.getElementById("open-courts");
    const courtFive = document.getElementById("court-5");
    const filterStatus = document.getElementById("filter-status");

    function filterCourts(openOnly) {
      if (courtFive.hidden === openOnly) return;

      courtFive.hidden = openOnly;
      allCourts.setAttribute("aria-pressed", String(!openOnly));
      openCourts.setAttribute("aria-pressed", String(openOnly));
      filterStatus.textContent = openOnly
        ? "Showing Court 3 only."
        : "Showing both courts.";
    }

    allCourts.addEventListener("click", () => filterCourts(false));
    openCourts.addEventListener("click", () => filterCourts(true));
  </script>
</body>
</html>
