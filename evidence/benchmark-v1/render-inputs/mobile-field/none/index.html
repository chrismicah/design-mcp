<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf0e7">
  <title>Cliff Loop | Trail repair</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@700;800&amp;family=DM+Sans:wght@500;600;700&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --limestone: #edf0e7;
      --chalk: #fbfbf4;
      --lichen: #dce7d7;
      --ink: #182e25;
      --pine: #244a38;
      --gold: #f3ca53;
      --rule: color-mix(in srgb, var(--ink) 34%, transparent);
      --display: "Barlow Semi Condensed", sans-serif;
      --body: "DM Sans", sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      min-block-size: 100vh;
      min-block-size: 100svh;
      display: grid;
      align-items: center;
      margin: 0;
      padding-block: 40px 74px;
      background: var(--limestone);
      color: var(--ink);
      font: 500 1rem/1.45 var(--body);
    }

    .frame {
      inline-size: min(1140px, calc(100% - 88px));
      margin-inline: auto;
    }

    .masthead {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-block-end: 18px;
      font-size: 1.0625rem;
      font-weight: 700;
    }

    .masthead::after {
      content: "";
      flex: 1;
      block-size: 1px;
      margin-inline-start: 6px;
      background: var(--rule);
    }

    .trail-mark {
      display: grid;
      place-items: center;
      inline-size: 36px;
      block-size: 36px;
      border-radius: 3px;
      background: var(--pine);
      color: var(--chalk);
    }

    .sheet {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.04fr);
      border: 2px solid var(--ink);
      background: var(--chalk);
      box-shadow: 0 5px 0 color-mix(in srgb, var(--ink) 12%, transparent);
    }

    .details {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-block-size: 410px;
      padding: 42px clamp(34px, 4vw, 54px);
      overflow-wrap: anywhere;
    }

    h1 {
      margin: 0;
      font: 800 clamp(3.6rem, 7.15vw, 6.5rem) / .94 var(--display);
      letter-spacing: -.035em;
    }

    .location {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 15px 0 0;
      font-size: clamp(1.4rem, 2.25vw, 2rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -.033em;
    }

    .location svg {
      flex: none;
      inline-size: 1em;
      block-size: 1em;
      color: var(--pine);
    }

    .issue {
      margin: 35px 0 0;
      padding-block-start: 19px;
      border-block-start: 1px solid var(--rule);
    }

    .field-label {
      margin: 0;
      color: var(--pine);
      font-size: .9375rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .issue dd {
      margin: 4px 0 0;
      font: 700 clamp(2rem, 3.2vw, 2.8rem) / 1.06 var(--display);
      letter-spacing: -.025em;
    }

    .drawing {
      position: relative;
      overflow: hidden;
      border-inline-start: 1px solid var(--ink);
      background: var(--lichen);
    }

    .drawing > svg {
      position: absolute;
      inset: 0;
      display: block;
      inline-size: 100%;
      block-size: 100%;
    }

    .inspection {
      display: flex;
      grid-column: 1 / -1;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 22px clamp(34px, 4vw, 54px);
      border-block-start: 1px solid var(--ink);
    }

    .state {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .state-icon {
      display: grid;
      flex: none;
      place-items: center;
      inline-size: 49px;
      block-size: 49px;
      border: 1px solid var(--ink);
      border-radius: 3px;
      background: var(--gold);
    }

    .state-name {
      margin: 2px 0 0;
      font: 700 clamp(1.6rem, 2.35vw, 2rem) / 1.04 var(--display);
      letter-spacing: -.02em;
    }

    .action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-inline-size: 236px;
      min-block-size: 60px;
      padding: 12px 22px;
      border: 2px solid var(--pine);
      border-radius: 4px;
      background: var(--pine);
      color: var(--chalk);
      font: 700 1.0625rem/1.25 var(--body);
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color 140ms ease, border-color 140ms ease;
    }

    .action svg {
      flex: none;
    }

    .action:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 4px;
    }

    .inspected-only,
    [data-inspected="true"] .pending-only {
      display: none;
    }

    [data-inspected="true"] .inspected-only {
      display: block;
    }

    [data-inspected="true"] .state-icon {
      background: var(--lichen);
    }

    [data-inspected="true"] .action {
      border-color: var(--ink);
      background: var(--chalk);
      color: var(--ink);
    }

    @media (hover: hover) {
      .action:hover {
        border-color: var(--ink);
        background: var(--ink);
      }

      [data-inspected="true"] .action:hover {
        background: var(--lichen);
      }
    }

    @media (max-width: 900px) {
      body {
        display: block;
        padding-block: 22px 32px;
      }

      .frame {
        inline-size: min(660px, calc(100% - 32px));
      }

      .masthead {
        margin-block-end: 14px;
      }

      .sheet {
        grid-template-columns: minmax(0, 1fr);
      }

      .details {
        min-block-size: 0;
        padding: 24px 20px 23px;
      }

      h1 {
        font-size: clamp(3.4rem, 14vw, 5rem);
      }

      .location {
        margin-block-start: 10px;
      }

      .issue {
        margin-block-start: 22px;
        padding-block-start: 13px;
      }

      .drawing {
        min-block-size: clamp(150px, 43vw, 285px);
        border-inline-start: 0;
        border-block-start: 1px solid var(--ink);
      }

      .inspection {
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
        padding: 17px 20px 20px;
      }

      .action {
        min-inline-size: 0;
        min-block-size: 56px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .action {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header class="masthead">
      <span class="trail-mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M5 19h7.5a3.5 3.5 0 0 0 0-7H11a3.5 3.5 0 1 1 0-7h6.5M15 2.5 17.5 5 15 7.5"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      Trail repair
    </header>

    <main class="sheet" id="repair" data-inspected="false" aria-labelledby="trail-name">
      <div class="details">
        <h1 id="trail-name">Cliff Loop</h1>
        <p class="location">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 10c0 5-7 10-7 10S5 15 5 10a7 7 0 1 1 14 0Z"/>
            <circle cx="12" cy="10" r="2.15"/>
          </svg>
          East footbridge
        </p>

        <dl class="issue">
          <dt class="field-label">Reported issue</dt>
          <dd>Deck boards loose</dd>
        </dl>
      </div>

      <div class="drawing" aria-hidden="true">
        <svg viewBox="0 0 520 320" preserveAspectRatio="xMidYMid slice" fill="none">
          <defs>
            <pattern id="stone-hatch" width="6" height="6" patternUnits="userSpaceOnUse"
                     patternTransform="rotate(34)">
              <path d="M0 0v6" stroke="var(--pine)" stroke-opacity=".36" stroke-width="1.6"/>
            </pattern>
          </defs>

          <path d="M131-12C126 38 164 69 182 111c20 46 19 75 60 116 27 27 61 43 70 105h120c-11-61-50-89-82-115-42-34-60-57-69-96-11-52-22-73-48-97-14-14-13-24-12-36Z"
                fill="var(--chalk)" fill-opacity=".65" stroke="var(--pine)" stroke-opacity=".27"
                stroke-width="1.4"/>

          <g stroke="var(--pine)" stroke-width="1.15" stroke-linecap="round" opacity=".33">
            <path d="M-18 120c70 6 86-55 148-47 18 2 31 7 43 17M-15 100c60 2 81-53 139-46M-17 77c54-9 72-45 129-43"/>
            <path d="M283 39c28-19 53-5 78-14 15-5 25-15 36-28m-100 59c38-15 65 2 99-24 12-9 25-22 41-30m-121 68c42-16 65 5 102-24 31-24 59-25 107-19"/>
            <path d="M-14 270c54-15 75 1 102 11 52 20 104-26 156-17m-254 26c38-9 68 9 99 14 50 9 99-25 159-20"/>
            <path d="M389 183c42-22 86-9 138-22m-124 44c43-25 90-11 123-21m-109 41c43-25 73-9 109-17m-92 38c21-11 51-14 92-12m-74 34c27-12 55-10 76-7"/>
            <path d="M158-8c-2 46 39 70 54 115m-28-97c5 29 31 45 44 77m-19 109c20 29 47 45 68 62m-34-55c24 34 57 48 79 82m-32-82c14 19 39 33 53 51m-12 23c11 12 18 25 22 41m-2-68c23 18 40 44 47 75"/>
          </g>

          <g stroke="var(--pine)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m54 179 7-11 3 9 9-6m42-16 3-13 4 9 8-12m267 35 4-11 4 7 10-8m40-83 7-10 3 8 7-5"/>
            <path d="m102 256 5-9 4 7 9-9m66-5 4-9 4 6 5-6m268-91 4-9 3 6 9-7"/>
            <path d="m69 151 9-8 12 1 5 7-10 4Zm87 83 11-10 14 4 5 7-9 7-15-1Zm195-49 11-7 14 4 4 9-10 6-14-4Zm95-91 10-8 16 3 5 6-10 6-15-2Z"
                  fill="var(--lichen)"/>
          </g>

          <path d="m76 204 290-103 74 35-287 111Z" fill="var(--pine)" opacity=".17"/>

          <g fill="var(--lichen)" stroke="var(--pine)" stroke-width="1.65" stroke-linejoin="round">
            <path d="m64 212 22-26 22-4 27 16 15 27-18 17-31 3-19-11Z"/>
            <path d="m348 113 25-16 29 3 37-8 26 25-4 19-27 13-37-4-29 9-16-8Z"/>
            <path d="m64 212 28-7 17 13 23 24-31 3-19-11Zm333-67 16-22 30-8 22 2-4 19-27 13Z"
                  fill="url(#stone-hatch)"/>
            <path d="m92 205 16-23m305 41-14-17" transform="translate(0 -100)" opacity="0"/>
            <path d="m92 205 16-23m305 41-14-17" transform="translate(0 -100)" visibility="hidden"/>
            <path d="m92 205 16-23m305-59-14-17"/>
          </g>

          <g stroke="var(--ink)" stroke-width="2" stroke-linejoin="round">
            <path d="M92 181v-33l6-2v33Zm129-43v-33l6-2v33Zm132-44V61l6-2v33Z"
                  fill="var(--pine)"/>
            <path d="m86 148 275-92 7 4-275 92Z" fill="var(--chalk)"/>
            <path d="M93 152 368 60v5L93 157Z" fill="var(--pine)"/>

            <path d="m83 183 54 39 285-95v10l-285 95-54-39Z" fill="var(--pine)"/>
            <path d="M83 183 368 88l54 39-285 95Z" fill="var(--chalk)"/>
            <path d="m218 138 30-10 54 39-30 10Z" fill="var(--gold)" stroke="none"/>
            <path d="m272 177 30-10v9l-30 10Z" fill="var(--gold)" stroke-width="1.45"/>

            <path d="m98 178 54 39m-39-44 54 39m-39-44 54 39m-39-44 54 39m-39-44 54 39m-39-44 54 39m-39-44 54 39m-39-44 54 39m-39-44 54 39m-39-44 54 39m-39-44 54 39m-39-44 54 39m-39-44 54 39m-39-44 54 39m-39-44 54 39m-39-44 54 39m-39-44 54 39m-39-44 54 39"
                  stroke-width="1.35" opacity=".84"/>
            <path d="m233 128 15-5 54 39-15 5Z" fill="var(--gold)" stroke-width="1.5"/>
            <path d="m287 167 15-5v5l-15 5Z" fill="var(--gold)" stroke-width="1.5"/>
            <path d="M137 222v10m10-8 109-36m61-20 95-32"
                  stroke="var(--chalk)" stroke-opacity=".39" stroke-width="1.2"/>

            <path d="M146 220v-33l6-2v33Zm129-43v-33l6-2v33Zm132-44v-33l6-2v33Z"
                  fill="var(--pine)"/>
            <path d="m140 187 275-92 7 4-275 92Z" fill="var(--chalk)"/>
            <path d="M147 191 422 99v5l-275 92Z" fill="var(--pine)"/>
          </g>
        </svg>
      </div>

      <div class="inspection">
        <div class="state">
          <span class="state-icon" aria-hidden="true">
            <svg class="pending-only" width="25" height="25" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="8.5"/>
              <path d="M12 7.5V12l3 2"/>
            </svg>
            <svg class="inspected-only" width="25" height="25" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="8.5"/>
              <path d="m8.5 12 2.3 2.4 4.7-5"/>
            </svg>
          </span>
          <div>
            <p class="field-label">Inspection status</p>
            <p class="state-name" id="inspection-state" role="status" aria-atomic="true">Needs inspection</p>
          </div>
        </div>

        <button class="action" id="inspection-action" type="button">
          <svg class="pending-only" width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="m5 12 4 4L19 6"/>
          </svg>
          <svg class="inspected-only" width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="m8 5-4 4 4 4M4 9h10a5 5 0 0 1 0 10h-2"/>
          </svg>
          <span id="action-label">Mark as inspected</span>
        </button>
      </div>
    </main>
  </div>

  <script>
    const repair = document.getElementById("repair");
    const stateText = document.getElementById("inspection-state");
    const action = document.getElementById("inspection-action");
    const actionLabel = document.getElementById("action-label");
    const storageKey = "trail-repair.cliff-loop.east-footbridge.inspected";
    let inspected = false;

    try {
      inspected = localStorage.getItem(storageKey) === "true";
    } catch {
      // The page can keep the inspection state in memory.
    }

    function renderInspection() {
      repair.dataset.inspected = String(inspected);
      stateText.textContent = inspected ? "Inspected" : "Needs inspection";
      actionLabel.textContent = inspected ? "Undo inspection" : "Mark as inspected";
    }

    if (inspected) {
      renderInspection();
    }

    action.addEventListener("click", () => {
      inspected = !inspected;
      renderInspection();

      try {
        localStorage.setItem(storageKey, String(inspected));
      } catch {
        // The current page still reflects the selected state.
      }
    });
  </script>
</body>
</html>
