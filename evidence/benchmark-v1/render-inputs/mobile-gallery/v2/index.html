<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>River Wall · Room 4</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&amp;family=Source+Sans+3:wght@400;600&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --plaster: #efe9dc;
      --ink: #1d2a2e;
      --river: #244d49;
      --mist: #c5d1c9;
      --patina: #678c83;
      --rule: #aaafa3;
      --body-type: "Source Sans 3", sans-serif;
      --display-type: "Newsreader", Georgia, serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--plaster);
      color: var(--ink);
      font: 1rem / 1.5 var(--body-type);
    }

    .gallery {
      width: min(76rem, calc(100% - clamp(3rem, 14vw, 14rem)));
      margin-inline: auto;
      padding-block: clamp(2.5rem, 6vw, 5.75rem) 2.5rem;
    }

    .room {
      border-block-end: 1px solid var(--rule);
      padding-block-end: 1rem;
    }

    .room p {
      margin: 0;
      padding-inline-start: 0.75rem;
      border-inline-start: 3px solid var(--river);
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .display {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
      align-items: start;
      gap: clamp(2.5rem, 5.5vw, 5.25rem);
      padding-block: clamp(2.5rem, 4.7vw, 4.75rem);
      border-block-end: 1px solid var(--rule);
    }

    .label {
      padding-block-start: clamp(1.25rem, 3.8vw, 3.75rem);
    }

    h1 {
      margin: 0;
      font-family: var(--display-type);
      font-size: clamp(3.25rem, 2.5rem + 6.3vw, 8.25rem);
      font-weight: 500;
      line-height: 0.98;
      letter-spacing: -0.045em;
      overflow-wrap: anywhere;
    }

    .credit {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.4rem 1rem;
      margin: 0.75rem 0 0;
      font-size: clamp(1.25rem, 1rem + 0.6vw, 1.55rem);
      line-height: 1.3;
    }

    .artist {
      font-weight: 600;
    }

    .credit time {
      padding-inline-start: 1rem;
      border-inline-start: 1px solid var(--rule);
      color: var(--river);
      font-variant-numeric: lining-nums;
    }

    .materials {
      margin-block-start: clamp(2rem, 3vw, 2.75rem);
    }

    .note-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      width: min(100%, 13rem);
      min-height: 3rem;
      padding: 0.65rem 1rem;
      border: 1px solid transparent;
      border-radius: 2px;
      background: var(--river);
      color: var(--plaster);
      font: 600 1.0625rem / 1.25 var(--body-type);
      text-align: start;
      cursor: pointer;
    }

    @media (hover: hover) {
      .note-toggle:hover {
        background: var(--ink);
      }
    }

    .note-toggle:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 4px;
    }

    .toggle-icon {
      position: relative;
      flex: 0 0 0.875rem;
      height: 0.875rem;
    }

    .toggle-icon::before,
    .toggle-icon::after {
      position: absolute;
      inset: 50% 0 auto;
      border-block-start: 1.5px solid currentColor;
      content: "";
    }

    .toggle-icon::after {
      transform: rotate(90deg);
    }

    .note-toggle[aria-expanded="true"] .toggle-icon::after {
      visibility: hidden;
    }

    .material-note {
      margin: 1rem 0 0;
      padding: 0.25rem 0.875rem;
      border-inline-start: 2px solid var(--river);
      font-size: 1.1875rem;
    }

    @media (prefers-reduced-motion: no-preference) {
      .material-note:not([hidden]) {
        animation: reveal-note 180ms ease-out;
      }

      @keyframes reveal-note {
        from {
          opacity: 0;
          transform: translateY(-0.25rem);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    }

    .relief {
      position: relative;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      isolation: isolate;
      background: var(--mist);
    }

    .relief svg {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 50rem) {
      .display {
        grid-template-columns: minmax(0, 1fr);
        gap: 2.75rem;
        padding-block-end: 2rem;
      }

      .label {
        padding-block-start: 0;
      }

      .relief {
        aspect-ratio: 1.9;
      }
    }
  </style>
</head>
<body>
  <main class="gallery">
    <header class="room">
      <p>Room 4</p>
    </header>

    <article class="display" aria-labelledby="work-title">
      <div class="label">
        <h1 id="work-title">River Wall</h1>
        <p class="credit">
          <span class="artist">Maya Chen</span>
          <time datetime="1972">1972</time>
        </p>

        <div class="materials">
          <button class="note-toggle" id="note-toggle" type="button"
                  aria-expanded="false" aria-controls="material-note">
            <span id="toggle-label">Show material note</span>
            <span class="toggle-icon" aria-hidden="true"></span>
          </button>
          <p class="material-note" id="material-note" hidden>Pigment on plaster</p>
        </div>
      </div>

      <!-- An original ornamental study of pigment and plaster. -->
      <div class="relief" aria-hidden="true">
        <svg viewBox="0 0 480 328" preserveAspectRatio="xMidYMid slice" focusable="false">
          <defs>
            <linearGradient id="plaster-light" x2="1" y2="1">
              <stop stop-color="var(--plaster)"/>
              <stop offset=".62" stop-color="var(--mist)"/>
              <stop offset="1" stop-color="var(--patina)" stop-opacity=".46"/>
            </linearGradient>

            <filter id="plaster-grain" x="0" y="0" width="100%" height="100%">
              <feTurbulence type="fractalNoise" baseFrequency=".58"
                            numOctaves="3" seed="19" stitchTiles="stitch"/>
              <feColorMatrix type="saturate" values="0"/>
            </filter>

            <filter id="pigment-edge">
              <feTurbulence type="fractalNoise" baseFrequency=".11"
                            numOctaves="3" seed="7" result="roughness"/>
              <feDisplacementMap in="SourceGraphic" in2="roughness"
                                 scale="5" xChannelSelector="R" yChannelSelector="G"/>
            </filter>

            <path id="plaster-joints"
                  d="M0 96H480 M0 235H480 M188 0V96 M317 96V235 M112 235V328 M378 235V328"/>
          </defs>

          <rect width="480" height="328" fill="url(#plaster-light)"/>
          <path d="M188 0H480V96H188Z M0 96H317V235H0Z M112 235H378V328H112Z"
                fill="var(--plaster)" opacity=".3"/>
          <g fill="none" stroke-width="1">
            <use href="#plaster-joints" stroke="var(--river)" opacity=".27"/>
            <use href="#plaster-joints" stroke="var(--plaster)" opacity=".65"
                 transform="translate(1 1)"/>
          </g>

          <g fill="none" stroke="var(--river)" stroke-width="1.15" opacity=".35">
            <path d="M-16 192C39 195 72 166 108 146C150 122 188 124 230 141C272 158 312 183 344 157C382 126 388 88 451 70"/>
            <path d="M-25 266C48 269 92 228 140 201C174 182 195 185 230 201C281 225 322 244 375 201C425 161 426 128 504 120"/>
          </g>

          <g filter="url(#pigment-edge)">
            <path d="M-24 200C28 209 66 182 110 156C154 130 185 130 230 148C282 169 315 189 350 161C392 128 397 82 495 65L500 123C435 121 425 157 375 197C323 240 282 218 227 194C190 178 163 180 128 203C82 232 40 265-24 257Z"
                  fill="var(--patina)" opacity=".8"/>
            <path d="M-24 218C34 228 75 195 114 172C158 145 185 146 229 164C285 187 318 204 353 176C401 138 401 97 495 82L500 105C434 111 422 148 368 189C323 225 284 205 229 182C188 165 162 169 127 191C81 221 40 251-24 243Z"
                  fill="var(--river)"/>
            <path d="M-22 231C35 237 70 215 111 187C156 156 184 154 228 172C284 196 320 214 360 182C407 144 410 108 497 94"
                  fill="none" stroke="var(--mist)" stroke-width="1.35" opacity=".58"/>
          </g>

          <rect width="480" height="328" filter="url(#plaster-grain)"
                opacity=".3" style="mix-blend-mode: multiply"/>
        </svg>
      </div>
    </article>
  </main>

  <script>
    const toggle = document.getElementById("note-toggle");
    const label = document.getElementById("toggle-label");
    const note = document.getElementById("material-note");

    toggle.addEventListener("click", () => {
      const showNote = note.hidden;

      note.hidden = !showNote;
      toggle.setAttribute("aria-expanded", String(showNote));
      label.textContent = showNote ? "Hide material note" : "Show material note";
    });
  </script>
</body>
</html>
