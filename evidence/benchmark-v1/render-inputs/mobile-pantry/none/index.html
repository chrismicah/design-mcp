<!doctype html>
<!--
  Residents need to find their collection time and address at a glance.
  A calm, welcoming card pairs the title with a stitched tote and stacks
  above the appointment on phones. The copy focuses on the appointment
  and its Details action. DM Serif Text sets the title, and Atkinson
  Hyperlegible Next sets the appointment and controls.
  Frost #E7EFF0, paper #FBFCFA, pine #174743, ink #142F33,
  slate #4C6568, and gold #F2D477.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food pantry collection</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&amp;family=DM+Serif+Text&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --frost: #e7eff0;
      --paper: #fbfcfa;
      --pine: #174743;
      --ink: #142f33;
      --slate: #4c6568;
      --gold: #f2d477;
      --rule: color-mix(in srgb, var(--pine) 23%, var(--paper));
      --body-font: "Atkinson Hyperlegible Next", Verdana, sans-serif;
      --title-font: "DM Serif Text", Georgia, serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-block-size: 100vh;
      background: var(--frost);
      color: var(--ink);
      font-family: var(--body-font);
      line-height: 1.45;
    }

    h1, dl, dd, p {
      margin: 0;
    }

    .page {
      inline-size: min(67rem, calc(100% - 3rem));
      margin-inline: auto;
      padding-block: clamp(3rem, calc((100svh - 32rem) / 2), 13rem) 3rem;
    }

    .collection {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
      overflow: hidden;
      border: 1px solid var(--rule);
      border-radius: 1.25rem;
      background: var(--paper);
    }

    .cover {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-content: start;
      gap: 1.25rem;
      padding: clamp(2rem, 4vw, 3.5rem);
      background: var(--pine);
      color: var(--paper);
    }

    .cover h1 {
      font-family: var(--title-font);
      font-size: clamp(2.45rem, 4.2vw, 3.625rem);
      font-weight: 400;
      line-height: 1.02;
      letter-spacing: -0.025em;
    }

    .tote {
      display: block;
      justify-self: center;
      inline-size: min(100%, 14.5rem);
      block-size: auto;
    }

    .appointment {
      padding: clamp(2rem, 4.1vw, 3.75rem) clamp(2rem, 4.5vw, 4.125rem)
        clamp(2rem, 3.55vw, 3.25rem);
    }

    .visually-hidden {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .weekday {
      display: block;
      color: var(--pine);
      font-size: clamp(1.375rem, 2vw, 1.75rem);
      font-weight: 700;
      line-height: 1.2;
    }

    .schedule time {
      display: block;
      margin-block-start: 0.3rem;
      font-size: clamp(4.75rem, 8.45vw, 7.625rem);
      font-weight: 700;
      font-variant-numeric: lining-nums tabular-nums;
      line-height: 0.95;
      letter-spacing: -0.045em;
    }

    .address {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-block-start: 1.7rem;
      padding-block-start: 1.4rem;
      border-block-start: 1px solid var(--rule);
    }

    .address-icon {
      display: grid;
      flex: none;
      inline-size: 2.75rem;
      block-size: 2.75rem;
      place-items: center;
      border-radius: 50%;
      background: var(--frost);
      color: var(--pine);
    }

    .address dt {
      color: var(--slate);
      font-size: 0.9375rem;
      font-weight: 600;
    }

    .address dd {
      margin-block-start: 0.125rem;
      font-size: clamp(1.625rem, 2.55vw, 2.125rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.025em;
    }

    .details-button {
      display: flex;
      inline-size: 100%;
      min-block-size: 3.5rem;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-block-start: 1.8rem;
      padding: 0.75rem 1.125rem;
      border: 1px solid transparent;
      border-radius: 0.5rem;
      background: var(--pine);
      color: var(--paper);
      font: inherit;
      font-size: 1.125rem;
      font-weight: 700;
      cursor: pointer;
    }

    @media (hover: hover) {
      .details-button:hover {
        background: var(--ink);
      }
    }

    .details-button:focus-visible {
      outline: 3px solid var(--pine);
      outline-offset: 4px;
    }

    .details-button .vertical-stroke {
      transition: opacity 140ms ease;
    }

    .details-button[aria-expanded="true"] .vertical-stroke {
      opacity: 0;
    }

    .details-note {
      margin-block-start: 0.75rem;
      padding: 0.875rem 1rem;
      border-inline-start: 3px solid var(--pine);
      border-radius: 0 0.375rem 0.375rem 0;
      background: var(--frost);
      font-size: 1.0625rem;
    }

    @media (max-width: 47rem) {
      .page {
        inline-size: min(34rem, calc(100% - 2rem));
        padding-block: 1.25rem 2rem;
      }

      .collection {
        grid-template-columns: minmax(0, 1fr);
        border-radius: 1rem;
      }

      .cover {
        grid-template-columns: minmax(0, 1fr) clamp(3.75rem, 24vw, 7rem);
        align-items: center;
        gap: 0.5rem;
        padding: 1.25rem 1.25rem 1.25rem 1.375rem;
      }

      .cover h1 {
        font-size: clamp(1.625rem, 8.35vw, 2.75rem);
      }

      .tote {
        inline-size: 100%;
      }

      .appointment {
        padding: 1.625rem 1.375rem 1.375rem;
      }

      .schedule time {
        font-size: clamp(4.25rem, 22vw, 5.75rem);
      }

      .address {
        gap: 0.75rem;
        margin-block-start: 1.375rem;
        padding-block-start: 1.125rem;
      }

      .details-button {
        margin-block-start: 1.375rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .details-button .vertical-stroke {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <article class="collection" aria-labelledby="collection-title">
      <header class="cover">
        <h1 id="collection-title">Food pantry<br>collection</h1>

        <svg class="tote" viewBox="0 0 220 212" aria-hidden="true" focusable="false">
          <circle cx="110" cy="106" r="97" fill="var(--gold)"/>
          <ellipse cx="111" cy="180" rx="64" ry="9" fill="var(--pine)" opacity=".18"/>
          <g transform="rotate(-8 111 117)" stroke-linecap="round" stroke-linejoin="round">
            <path d="M100 101V68a24 24 0 0 1 48 0v33"
              fill="none" stroke="var(--pine)" stroke-width="8"/>
            <path d="M56 92h108l9 67c1.2 9-4.4 15-12 15H66c-7.5 0-12.4-4.7-13-12.1l-6-60c-.6-5.5 3.4-9.9 9-9.9Z"
              fill="var(--paper)" stroke="var(--ink)" stroke-width="2.6"/>
            <path d="M144 94h19l8.3 65c.9 7-3.7 13.5-10.3 13.5h-12Z"
              fill="var(--pine)" opacity=".16"/>
            <path d="m144 93 5 80M56 101h85"
              fill="none" stroke="var(--pine)" stroke-width="1.8" opacity=".45"/>
            <path d="M70 107V76a24 24 0 0 1 48 0v31"
              fill="none" stroke="var(--ink)" stroke-width="10"/>
            <path d="M70 107V76a24 24 0 0 1 48 0v31"
              fill="none" stroke="var(--paper)" stroke-width="5"/>
            <path d="M75 126h41v15a14 14 0 0 1-14 14H89a14 14 0 0 1-14-14z"
              fill="var(--frost)" stroke="var(--pine)" stroke-width="2"/>
            <path d="M81 132h29" fill="none" stroke="var(--pine)"
              stroke-width="1.5" stroke-dasharray="2 3.5" opacity=".55"/>
          </g>
        </svg>
      </header>

      <div class="appointment">
        <dl class="schedule">
          <dt class="visually-hidden">Collection time</dt>
          <dd>
            <span class="weekday">Friday</span>
            <time datetime="11:15">11:15</time>
          </dd>
        </dl>

        <div class="address">
          <span class="address-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"
              focusable="false">
              <path d="M19 10c0 4.4-7 10.25-7 10.25S5 14.4 5 10a7 7 0 1 1 14 0Z"/>
              <circle cx="12" cy="10" r="2.35"/>
            </svg>
          </span>
          <dl>
            <dt>Address</dt>
            <dd>18 Pine Avenue</dd>
          </dl>
        </div>

        <button class="details-button" id="details-button" type="button"
          aria-controls="collection-details" aria-expanded="false">
          Details
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            aria-hidden="true" focusable="false">
            <path d="M4 10h12"/>
            <path class="vertical-stroke" d="M10 4v12"/>
          </svg>
        </button>
        <p class="details-note" id="collection-details" hidden>
          Bring a bag and check in at the side door.
        </p>
      </div>
    </article>
  </main>

  <script>
    const detailsButton = document.getElementById("details-button");
    const collectionDetails = document.getElementById("collection-details");

    detailsButton.addEventListener("click", () => {
      const isOpening = collectionDetails.hidden;
      collectionDetails.hidden = !isOpening;
      detailsButton.setAttribute("aria-expanded", String(isOpening));
    });
  </script>
</body>
</html>
