<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food pantry collection</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@700&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --ink: #111111;
      --paper: #f7f5ef;
      --yellow: #ffcc00;
      --rule: #47443b;
      --note: #fff3c0;
      --display: "Archivo Narrow", sans-serif;
      --body: "Atkinson Hyperlegible", sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      min-height: 100svh;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 1.125rem / 1.5 var(--body);
    }

    .notice {
      --inset: clamp(1.25rem, 5.65vw, 2rem);
      width: min(34rem, calc(100% - 2.25rem));
      margin-inline: auto;
      padding-block: clamp(2.25rem, 7svh, 4.5rem) 2.5rem;
    }

    @media (min-width: 48rem) {
      .notice {
        padding-block-start: clamp(3.5rem, calc(50svh - 15rem), 18rem);
      }
    }

    h1 {
      margin: 0 0 clamp(0.875rem, 2vw, 1.25rem);
      font: 700 clamp(1.875rem, 4vw, 2.5rem) / 1.08 var(--display);
      letter-spacing: -0.02em;
    }

    .collection-sign {
      background: var(--ink);
      color: var(--paper);
    }

    .schedule {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: clamp(0.75rem, 4vw, 2rem);
      padding: clamp(1.5rem, 6vw, 2.25rem) var(--inset)
        clamp(1.25rem, 4vw, 1.75rem);
    }

    .when {
      margin: 0;
    }

    .day {
      display: block;
      font-size: clamp(1.5rem, 5.5vw, 1.875rem);
      font-weight: 700;
      line-height: 1.1;
    }

    .when time {
      display: block;
      margin-top: 0.25rem;
      font: 700 clamp(3.25rem, 24vw, 8.25rem) / 0.96 var(--display);
      letter-spacing: -0.035em;
      white-space: nowrap;
    }

    .grocery-bag {
      display: block;
      justify-self: end;
      width: min(100%, 8rem);
      height: auto;
      color: var(--yellow);
    }

    .location {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      margin: 0 var(--inset);
      padding-block: clamp(1rem, 4vw, 1.375rem);
      border-top: 1px solid var(--rule);
      font-size: clamp(1.375rem, 6vw, 1.7rem);
      font-weight: 700;
      line-height: 1.2;
    }

    .location svg {
      flex: none;
      color: var(--yellow);
    }

    .details {
      margin-top: 0.75rem;
    }

    .details-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      width: 100%;
      min-height: 3.75rem;
      padding: 0.875rem var(--inset);
      border: 0;
      border-radius: 0;
      background: var(--yellow);
      color: var(--ink);
      font: 700 1.25rem / 1.2 var(--body);
      text-align: left;
      cursor: pointer;
    }

    @media (hover: hover) {
      .details-button:hover {
        background: color-mix(in srgb, var(--yellow), var(--ink) 8%);
      }
    }

    .details-button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px var(--paper);
    }

    .details-button svg {
      flex: none;
    }

    .details-button[aria-expanded="true"] .plus-stroke {
      display: none;
    }

    .instructions {
      margin: 0;
      padding: 1rem var(--inset) 1.125rem;
      background: var(--note);
      text-wrap: pretty;
    }

    @media (prefers-reduced-motion: no-preference) {
      .instructions:not([hidden]) {
        animation: reveal 180ms ease-out both;
      }

      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(0.375rem);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    }

    @media (forced-colors: active) {
      .collection-sign,
      .details-button {
        border: 1px solid CanvasText;
      }
    }
  </style>
</head>
<body>
  <main class="notice">
    <h1>Food pantry collection</h1>

    <div class="collection-sign">
      <div class="schedule">
        <p class="when">
          <span class="day">Friday</span>
          <time datetime="11:15">11:15</time>
        </p>

        <svg class="grocery-bag" viewBox="0 0 128 128" width="128" height="128"
             aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-width="3.4"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="m36 54-5-21c-3-12 1-21 9-23s15 5 19 17l8 29"/>
            <path d="m38 24 12 6m-10 6 13 6"/>
            <path d="M74 55c3-13 9-25 18-33m-7 9c-2-8 2-14 8-19 2 8-2 14-8 19Zm0 2c7-5 14-6 21-2-6 5-13 6-21 2Z"/>
          </g>
          <path fill="currentColor" d="m17 47 65 8 28-9-6 63-21 11-58-7Z"/>
          <path d="m82 58 1 58m-51-12 51 8 15-8M28 62l43 5"
                fill="none" stroke="var(--ink)" stroke-width="2.3"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <p class="location">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"
             aria-hidden="true" focusable="false">
          <path d="M19 10c0 5-7 10-7 10S5 15 5 10a7 7 0 1 1 14 0Z"/>
          <circle cx="12" cy="10" r="2.25"/>
        </svg>
        <span>18 Pine Avenue</span>
      </p>
    </div>

    <div class="details">
      <button class="details-button" type="button" aria-expanded="false"
              aria-controls="pickup-instructions">
        Details
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             aria-hidden="true" focusable="false">
          <path d="M4 11h14"/>
          <path class="plus-stroke" d="M11 4v14"/>
        </svg>
      </button>
      <p class="instructions" id="pickup-instructions" hidden>
        Bring a bag and check in at the <strong>side door</strong>.
      </p>
    </div>
  </main>

  <script>
    const detailsButton = document.querySelector(".details-button");
    const instructions = document.getElementById("pickup-instructions");

    detailsButton.addEventListener("click", () => {
      const isOpening = instructions.hidden;
      instructions.hidden = !isOpening;
      detailsButton.setAttribute("aria-expanded", String(isOpening));
    });
  </script>
</body>
</html>
