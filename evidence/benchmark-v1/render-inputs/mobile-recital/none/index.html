<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f1">
  <title>Strings group recital</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400..700&amp;family=Instrument+Serif&amp;display=swap">

  <!--
    A calm recital program for a parent checking where to go and when.
    The copy stays with the supplied schedule. Instrument Serif sets the group
    and location, while DM Sans handles the controls and time. The details
    sit beside a violin crossing five staff lines and stack above it on phones.
    Paper #f7f6f1, ink #172946, slate #526079, mist #e5ebf2,
    Prussian blue #243f68, and brass #f5c873.
  -->
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f6f1;
      --ink: #172946;
      --slate: #526079;
      --mist: #e5ebf2;
      --blue: #243f68;
      --brass: #f5c873;
      --rule: rgb(23 41 70 / .19);
      --sans: "DM Sans", sans-serif;
      --serif: "Instrument Serif", Georgia, serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 1rem/1.5 var(--sans);
    }

    h1, h2, p { margin: 0; }

    .programme {
      width: min(1096px, calc(100% - 88px));
      margin-inline: auto;
      padding-block: 54px 64px;
    }

    .masthead {
      display: flex;
      align-items: center;
      gap: 11px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--rule);
      font-weight: 700;
    }

    .masthead svg {
      width: 30px;
      height: 30px;
      color: var(--blue);
    }

    .programme-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-block: 38px 27px;
    }

    h1 {
      font: 400 clamp(3.5rem, 6.1vw, 5.5rem)/.98 var(--serif);
      letter-spacing: -.026em;
    }

    .event-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      flex: 0 0 334px;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--rule);
      border-radius: 12px;
      background: rgb(23 41 70 / .045);
    }

    .event-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 8px 6px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      font: 700 .9375rem/1.2 var(--sans);
      cursor: pointer;
      transition: background-color 160ms ease, color 160ms ease;
    }

    .event-tab svg, .time-label svg {
      flex: none;
      width: 20px;
      height: 20px;
    }

    .event-tab[aria-selected="true"] {
      background: var(--ink);
      color: var(--paper);
    }

    @media (hover: hover) {
      .event-tab[aria-selected="false"]:hover {
        background: rgb(23 41 70 / .075);
      }
    }

    .event-tab:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }

    .recital-card {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      min-height: 410px;
      overflow: hidden;
      border-radius: 18px;
      background: var(--mist);
    }

    .event-details {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 30px;
      min-width: 0;
      padding: clamp(30px, 4vw, 55px);
    }

    .event-details[hidden] { display: none; }

    .event-details:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: -6px;
      border-radius: 10px;
    }

    .detail-label {
      color: var(--slate);
      font-size: .9375rem;
      font-weight: 700;
    }

    h2 {
      margin-top: 7px;
      font: 400 clamp(3.5rem, 6.7vw, 6rem)/.98 var(--serif);
      letter-spacing: -.035em;
    }

    .time-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 18px;
      border-top: 1px solid var(--rule);
    }

    .time-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    time {
      font-size: 2.625rem;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -.055em;
      font-variant-numeric: tabular-nums;
    }

    .art {
      position: relative;
      overflow: hidden;
      background: var(--blue);
    }

    .art > svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .spotlight {
      opacity: .75;
      transform-origin: 240px 203px;
      transition: transform 420ms ease, opacity 420ms ease;
    }

    .recital-card[data-view="performance"] .spotlight {
      opacity: 1;
      transform: scale(1.09);
    }

    @media (max-width: 700px) {
      .programme {
        width: calc(100% - 40px);
        padding-block: 22px 32px;
      }

      .masthead { padding-bottom: 12px; }

      .programme-heading {
        display: grid;
        gap: 17px;
        margin-block: 23px 16px;
      }

      h1 { font-size: clamp(3rem, 13.8vw, 4.75rem); }

      .recital-card {
        grid-template-columns: minmax(0, 1fr);
        min-height: 0;
        border-radius: 15px;
      }

      .event-details {
        gap: 22px;
        padding: 24px 25px 26px;
      }

      h2 { font-size: clamp(3.25rem, 16vw, 4.75rem); }

      .time-row { padding-top: 13px; }
      time { font-size: 2.25rem; }

      .art { min-height: 200px; }

      .art > svg {
        top: -7%;
        height: 114%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .event-tab, .spotlight { transition: none; }
    }

    @media (forced-colors: active) {
      .event-tab[aria-selected="true"] { border-color: Highlight; }
    }
  </style>
</head>
<body>
  <main class="programme">
    <header class="masthead">
      <svg viewBox="0 0 30 30" fill="none" stroke="currentColor"
           stroke-width="1.35" stroke-linecap="round" aria-hidden="true">
        <rect x="1" y="1" width="28" height="28" rx="7"/>
        <path d="M7.5 12.5c4.5 0 5-4 9.5-4h5.5M7.5 17c5.5 0 6-4 11-4h4M7.5 21.5c6.5 0 7-4 13-4h2"/>
      </svg>
      <span>Recital</span>
    </header>

    <div class="programme-heading">
      <h1>Strings group</h1>

      <div class="event-tabs" role="tablist" aria-label="Recital schedule">
        <button class="event-tab" type="button" role="tab" id="check-in-tab"
                aria-selected="true" aria-controls="check-in-panel" data-view="check-in">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18.5 10c0 4.5-6.5 10-6.5 10s-6.5-5.5-6.5-10a6.5 6.5 0 1 1 13 0Z"/>
            <circle cx="12" cy="10" r="2"/>
          </svg>
          Check-in
        </button>

        <button class="event-tab" type="button" role="tab" id="performance-tab"
                aria-selected="false" aria-controls="performance-panel"
                tabindex="-1" data-view="performance">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="5" width="16" height="14" rx="1"/>
            <path d="M10 5c0 4-2 7-6 8m10-8c0 4 2 7 6 8M4 16h16"/>
          </svg>
          Performance
        </button>
      </div>
    </div>

    <div class="recital-card" data-view="check-in">
      <section class="event-details" id="check-in-panel" role="tabpanel"
               aria-labelledby="check-in-tab" tabindex="0">
        <div>
          <p class="detail-label">Check-in location</p>
          <h2>Room 2</h2>
        </div>
        <div class="time-row">
          <span class="detail-label time-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5"/>
              <path d="M12 7.5V12l3 2"/>
            </svg>
            Time
          </span>
          <time datetime="16:40">16:40</time>
        </div>
      </section>

      <section class="event-details" id="performance-panel" role="tabpanel"
               aria-labelledby="performance-tab" tabindex="0" hidden>
        <div>
          <p class="detail-label">Performance location</p>
          <h2>Main Stage</h2>
        </div>
        <div class="time-row">
          <span class="detail-label time-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5"/>
              <path d="M12 7.5V12l3 2"/>
            </svg>
            Time
          </span>
          <time datetime="17:10">17:10</time>
        </div>
      </section>

      <div class="art" aria-hidden="true">
        <svg viewBox="0 0 480 410" fill="none" focusable="false">
          <defs>
            <path id="staff-line" d="M-150 285C12 367 75 111 244 194S440 265 630 44"/>
            <path id="violin-body" d="M0-42C23-42 49-39 53-19C56-5 41 3 40 19C39 32 48 37 56 44C69 56 75 74 71 93C65 121 36 138 0 138C-36 138-65 121-71 93C-75 74-69 56-56 44C-48 37-39 32-40 19C-41 3-56-5-53-19C-49-39-23-42 0-42Z"/>
            <path id="sound-hole" d="M-35 43c7 4 7 10 1 17s-8 14-2 19"/>
            <pattern id="ink-dots" width="5" height="5" patternUnits="userSpaceOnUse">
              <circle cx="1.4" cy="1.4" r=".55" fill="var(--ink)"/>
            </pattern>
            <linearGradient id="varnish" x1="-68" y1="-41" x2="70" y2="138" gradientUnits="userSpaceOnUse">
              <stop stop-color="var(--paper)" stop-opacity=".4"/>
              <stop offset=".55" stop-color="var(--paper)" stop-opacity="0"/>
              <stop offset="1" stop-color="var(--ink)" stop-opacity=".21"/>
            </linearGradient>
          </defs>

          <g class="spotlight">
            <circle cx="240" cy="203" r="166" stroke="var(--mist)" stroke-opacity=".26"/>
            <circle cx="240" cy="203" r="150" fill="var(--mist)" fill-opacity=".14"/>
            <circle cx="240" cy="203" r="150" fill="url(#ink-dots)" opacity=".54"/>
          </g>

          <g stroke="var(--mist)" stroke-opacity=".28">
            <use href="#staff-line" y="-18"/>
            <use href="#staff-line" y="-9"/>
            <use href="#staff-line"/>
            <use href="#staff-line" y="9"/>
            <use href="#staff-line" y="18"/>
          </g>

          <g transform="translate(239 208) rotate(31)">
            <g transform="translate(95 -2) rotate(-10)" stroke-linecap="round">
              <path d="M1-158C-11-88-10 34 0 144" stroke="var(--brass)" stroke-width="3"/>
              <path d="M2-151 8 132" stroke="var(--paper)" stroke-width="1.2" stroke-opacity=".86"/>
              <path d="M-3 119H8L9 136H-1Z" fill="var(--ink)" stroke="var(--brass)" stroke-width="1.2"/>
            </g>

            <use href="#violin-body" transform="translate(6 7)" fill="var(--ink)"/>
            <use href="#violin-body" fill="var(--brass)" stroke="var(--ink)" stroke-width="1.2"/>
            <use href="#violin-body" fill="url(#varnish)"/>
            <use href="#violin-body" fill="url(#ink-dots)" opacity=".20"/>
            <use href="#violin-body" transform="translate(0 3) scale(.89 .92)"
                 stroke="var(--ink)" stroke-opacity=".46" stroke-width="1.25"/>

            <path d="M-7-131-10-161C-11-173-4-178 3-176C10-174 13-166 8-161L7-131Z"
                  fill="var(--brass)" stroke="var(--ink)" stroke-width="1.5"/>
            <path d="M-5-134H5L13 34Q0 40-13 34Z" fill="var(--ink)"/>
            <path d="M-14-149H-4M5-155H14M-13-136H-4M5-141H13" stroke="var(--ink)"
                  stroke-width="4" stroke-linecap="round"/>
            <path d="M-4-166q0-5 5-4q4 1 3 5q-1 3-4 2" stroke="var(--ink)"
                  stroke-width="1.3" stroke-linecap="round"/>

            <g stroke="var(--ink)" stroke-width="2.7" stroke-linecap="round">
              <use href="#sound-hole"/>
              <use href="#sound-hole" transform="scale(-1 1)"/>
              <path d="M-38 60l8 3m68-3-8 3"/>
            </g>
            <path d="M-15 61Q0 56 15 61L12 66H-12Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
            <path d="M-9 95Q0 91 9 95L5 123H-5Z" fill="var(--ink)"/>
            <g stroke="var(--paper)" stroke-opacity=".8" stroke-width=".85">
              <path d="M-3.7-143-6 61-4.5 98M-1.3-143-2 61-1.5 98M1.3-143 2 61 1.5 98M3.7-143 6 61 4.5 98"/>
            </g>
          </g>
        </svg>
      </div>
    </div>
  </main>

  <script>
    const card = document.querySelector(".recital-card");
    const tabs = Array.from(document.querySelectorAll(".event-tab"));
    const panels = tabs.map(tab => document.getElementById(tab.getAttribute("aria-controls")));

    function selectEvent(selectedIndex) {
      tabs.forEach((tab, index) => {
        const selected = index === selectedIndex;
        tab.setAttribute("aria-selected", String(selected));
        tab.tabIndex = selected ? 0 : -1;
        panels[index].hidden = !selected;
      });

      card.dataset.view = tabs[selectedIndex].dataset.view;
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener("click", () => selectEvent(index));

      tab.addEventListener("keydown", event => {
        let nextIndex;

        switch (event.key) {
          case "ArrowLeft":
            nextIndex = (index - 1 + tabs.length) % tabs.length;
            break;
          case "ArrowRight":
            nextIndex = (index + 1) % tabs.length;
            break;
          case "Home":
            nextIndex = 0;
            break;
          case "End":
            nextIndex = tabs.length - 1;
            break;
          default:
            return;
        }

        event.preventDefault();
        selectEvent(nextIndex);
        tabs[nextIndex].focus();
      });
    });
  </script>
</body>
</html>
