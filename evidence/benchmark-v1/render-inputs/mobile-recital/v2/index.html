<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F7F5EF">
  <title>Strings group recital</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@700&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f5ef;
      --ink: #111111;
      --signal: #ffcc00;
      --muted: #59564d;
      --pale: #ded9cd;
      --display: "Archivo Narrow", "Arial Narrow", sans-serif;
      --body: "Atkinson Hyperlegible", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 1rem/1.35 var(--body);
    }

    .program {
      inline-size: min(57rem, calc(100% - 2.5rem));
      margin-inline: auto;
      padding-block: clamp(3rem, 12vh, 7rem) 2.5rem;
    }

    .masthead {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 1rem;
      border-block-start: 2px solid var(--ink);
      padding-block: 1rem 1.25rem;
      margin-block-end: 1rem;
    }

    .masthead p {
      margin: 0 0 .4rem;
      color: var(--muted);
      font-size: 1.125rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font: 700 clamp(3.25rem, 7.4vw, 6.125rem)/.96 var(--display);
      letter-spacing: -.027em;
    }

    .violin {
      display: block;
      inline-size: clamp(7rem, 15vw, 13rem);
      block-size: auto;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border: 1px solid var(--ink);
      border-block-end: 0;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: .65rem;
      min-block-size: 3.75rem;
      padding: .8rem clamp(1rem, 3vw, 2.25rem);
      border: 0;
      border-radius: 0;
      background: var(--paper);
      color: var(--ink);
      font: 700 1.125rem/1.2 var(--body);
      text-align: start;
      cursor: pointer;
    }

    .tab + .tab {
      border-inline-start: 1px solid var(--ink);
    }

    .tab::before {
      content: "";
      flex: none;
      inline-size: .68rem;
      block-size: .68rem;
      border: 1px solid var(--muted);
      border-radius: 50%;
    }

    .tab span {
      min-inline-size: 0;
      overflow-wrap: anywhere;
    }

    .tab[aria-selected="true"] {
      background: var(--ink);
      color: var(--paper);
    }

    .tab[aria-selected="true"]::before {
      border-color: var(--signal);
      background: var(--signal);
    }

    @media (hover: hover) {
      .tab[aria-selected="false"]:hover {
        background: var(--pale);
      }
    }

    .tab:focus-visible,
    .panel:focus-visible {
      position: relative;
      z-index: 1;
      outline: 2px solid var(--ink);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px var(--paper);
    }

    .facts {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.12fr);
      gap: 1.5rem;
      margin: 0;
      padding: clamp(1.5rem, 3vw, 2.25rem);
      background: var(--ink);
      color: var(--paper);
    }

    .fact {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-inline-size: 0;
    }

    .fact dt {
      display: flex;
      align-items: center;
      gap: .45rem;
      font-size: 1.0625rem;
      font-weight: 700;
    }

    .fact dd {
      margin: .4rem 0 0;
      font-family: var(--display);
      font-weight: 700;
      line-height: .95;
    }

    .time dt {
      color: var(--pale);
    }

    .time dd {
      font-size: clamp(4.75rem, 8.35vw, 7.5rem);
      font-variant-numeric: tabular-nums;
      letter-spacing: -.035em;
    }

    .location {
      min-block-size: 10.75rem;
      padding: 1.25rem 1.5rem;
      background: var(--signal);
      color: var(--ink);
    }

    .location dd {
      font-size: clamp(2.75rem, 5.4vw, 4.5rem);
      letter-spacing: -.026em;
    }

    .pin {
      flex: none;
      inline-size: 1.125rem;
      block-size: 1.125rem;
    }

    @media (max-width: 40rem) {
      .program {
        padding-block-start: clamp(1.75rem, 4.8vh, 2.625rem);
      }

      .masthead {
        gap: .55rem;
        padding-block: .9rem 1.05rem;
        margin-block-end: .75rem;
      }

      .masthead p {
        font-size: 1.0625rem;
      }

      h1 {
        font-size: clamp(2.125rem, 11.25vw, 3.7rem);
      }

      .violin {
        inline-size: clamp(4rem, 24vw, 6.5rem);
      }

      .tab {
        gap: .5rem;
        min-block-size: 3.5rem;
        padding-inline: clamp(.55rem, 3.5vw, 1.25rem);
        font-size: 1.0625rem;
      }

      .facts {
        grid-template-columns: minmax(0, 1fr);
        gap: 1.125rem;
        padding: 1.25rem;
      }

      .time dd {
        font-size: clamp(3.75rem, 20vw, 5.5rem);
      }

      .location {
        min-block-size: 7.25rem;
        padding: 1rem;
      }

      .location dd {
        font-size: clamp(2.125rem, 11.4vw, 3.3rem);
      }
    }

    @media (forced-colors: active) {
      .tab[aria-selected="true"] {
        text-decoration: underline;
        text-underline-offset: .2em;
      }

      .location {
        border: 1px solid CanvasText;
      }
    }
  </style>
</head>
<body>
  <main class="program">
    <header class="masthead">
      <div>
        <p>Recital</p>
        <h1>Strings group</h1>
      </div>

      <svg class="violin" viewBox="23 27 152 119" fill="none" aria-hidden="true" focusable="false">
        <g transform="translate(104 77) rotate(54)" stroke="var(--ink)" stroke-linecap="round" stroke-linejoin="round">
          <path fill="var(--signal)" stroke-width="1.75"
            d="M0-14C5-14 6-9 11-9C20-8 25-1 22 8C20 13 16 16 16 21C15 25 17 28 22 30L19 33C24 36 28 42 28 49C28 61 16 69 0 69C-16 69-28 61-28 49C-28 42-24 36-19 33L-22 30C-17 28-15 25-16 21C-16 16-20 13-22 8C-25-1-20-8-11-9C-6-9-5-14 0-14Z"/>
          <path stroke-width=".7"
            d="M-23 41C-29 54-17 66 0 66S29 54 23 41M-19 7C-21 1-18-5-11-6M19 7C21 1 18-5 11-6"/>
          <path fill="var(--paper)" stroke-width="1.6" d="M-4-12L-5-57Q-5-64 0-64T5-57L4-12Z"/>
          <path stroke-width="2.3" d="M-5-57H-9M5-51H9M-5-46H-9M5-41H9"/>
          <path fill="var(--ink)" d="M-3.5-43H3.5L6.5 16Q0 18.4-6.5 16Z"/>
          <path stroke-width="1.3"
            d="M-16 17C-19 18-18 21-17.2 22.6C-15.1 26.8-13.9 30.6-17.8 32.6M16 17C19 18 18 21 17.2 22.6C15.1 26.8 13.9 30.6 17.8 32.6M-19 25.5L-15 24.1M15 24.1L19 25.5"/>
          <path stroke-width="1.65" d="M-8 27Q0 23 8 27"/>
          <path fill="var(--ink)" d="M-5 44H5L7 57Q0 61-7 57Z"/>
          <path stroke="var(--paper)" stroke-width=".62"
            d="M-2.1-43L-2.9 17M-.7-43L-1 17M.7-43L1 17M2.1-43L2.9 17"/>
          <path stroke-width=".62"
            d="M-2.9 17L-3.35 44M-1 17L-1.15 44M1 17L1.15 44M2.9 17L3.35 44"/>
        </g>
        <g stroke="var(--ink)" stroke-linecap="round" stroke-linejoin="round">
          <path stroke="var(--paper)" stroke-width="3.4" d="M37 42L131 138"/>
          <path stroke-width=".85" d="M37 42L131 138"/>
          <path stroke-width="1.8" d="M36 42Q87 85 134 138"/>
          <path fill="var(--ink)" stroke-width=".7" d="M31 38L35 35L41 42L37 45Z M129 136L133 135L136 139L133 142Z"/>
        </g>
      </svg>
    </header>

    <div class="tabs" role="tablist" aria-label="Recital schedule">
      <button class="tab" type="button" role="tab" id="check-in-tab"
        aria-selected="true" aria-controls="check-in-panel" tabindex="0">
        <span>Check-in</span>
      </button>
      <button class="tab" type="button" role="tab" id="performance-tab"
        aria-selected="false" aria-controls="performance-panel" tabindex="-1">
        <span>Performance</span>
      </button>
    </div>

    <section class="panel" role="tabpanel" id="check-in-panel" aria-labelledby="check-in-tab" tabindex="0">
      <dl class="facts">
        <div class="fact time">
          <dt>Time</dt>
          <dd><time datetime="16:40">16:40</time></dd>
        </div>
        <div class="fact location">
          <dt>
            <svg class="pin" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
              <path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"
                stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <circle cx="12" cy="10" r="2.1" fill="currentColor"/>
            </svg>
            Location
          </dt>
          <dd>Room 2</dd>
        </div>
      </dl>
    </section>

    <section class="panel" role="tabpanel" id="performance-panel" aria-labelledby="performance-tab" tabindex="0" hidden>
      <dl class="facts">
        <div class="fact time">
          <dt>Time</dt>
          <dd><time datetime="17:10">17:10</time></dd>
        </div>
        <div class="fact location">
          <dt>
            <svg class="pin" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
              <path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"
                stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <circle cx="12" cy="10" r="2.1" fill="currentColor"/>
            </svg>
            Location
          </dt>
          <dd>Main Stage</dd>
        </div>
      </dl>
    </section>
  </main>

  <script>
    const tabList = document.querySelector('[role="tablist"]');
    const tabs = Array.from(tabList.querySelectorAll('[role="tab"]'));
    const panels = tabs.map(tab => document.getElementById(tab.getAttribute('aria-controls')));

    function selectTab(selectedIndex) {
      tabs.forEach((tab, index) => {
        const selected = index === selectedIndex;
        tab.setAttribute('aria-selected', String(selected));
        tab.tabIndex = selected ? 0 : -1;
        panels[index].hidden = !selected;
      });
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => selectTab(index));
    });

    tabList.addEventListener('keydown', event => {
      const currentIndex = tabs.indexOf(event.target);
      if (currentIndex < 0 || event.altKey || event.ctrlKey || event.metaKey) return;

      let nextIndex;
      switch (event.key) {
        case 'ArrowLeft':
          nextIndex = (currentIndex - 1 + tabs.length) % tabs.length;
          break;
        case 'ArrowRight':
          nextIndex = (currentIndex + 1) % tabs.length;
          break;
        case 'Home':
          nextIndex = 0;
          break;
        case 'End':
          nextIndex = tabs.length - 1;
          break;
        default:
          return;
      }

      event.preventDefault();
      selectTab(nextIndex);
      tabs[nextIndex].focus();
    });
  </script>
</body>
</html>
