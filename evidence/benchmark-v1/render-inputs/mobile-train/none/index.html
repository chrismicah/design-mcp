<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Train 487 to Milwaukee</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap">
  <!--
    A calm reading path for a passenger finding their train in a crowded station.
    The amber platform sign hangs from the departure board's divider. Barlow
    Condensed carries the destination and figures. Atkinson Hyperlegible Next
    handles labels and controls. The human-readable ticket opens in place.
  -->
  <style>
    :root {
      --night: #0f1c2b;
      --board: #1b3149;
      --steel: #49647b;
      --mist: #c8d5df;
      --frost: #f4f7f8;
      --amber: #ffd064;
      --text-font: "Atkinson Hyperlegible Next", "Trebuchet MS", sans-serif;
      --display-font: "Barlow Condensed", "Trebuchet MS", sans-serif;
      color-scheme: light;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      display: grid;
      justify-items: center;
      align-items: start;
      min-height: 100svh;
      margin: 0;
      padding: clamp(2rem, calc(50svh - 15rem), 12rem) 1.25rem 2.5rem;
      background: radial-gradient(ellipse at 50% 22%, var(--board), var(--night) 74%);
      color: var(--night);
      font: 1rem/1.45 var(--text-font);
    }

    .concourse {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      color: var(--steel);
      opacity: 0.4;
      pointer-events: none;
    }

    .screen {
      position: relative;
      width: min(100%, 28.5rem);
      padding: 1.25rem;
      border-radius: 1.25rem;
      background: var(--frost);
      box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 0.27);
    }

    .departure {
      position: relative;
      overflow: hidden;
      padding: 1.4rem 1.375rem 3.9rem;
      border-radius: 0.4rem;
      background: var(--board);
      color: var(--frost);
    }

    .train {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin: 0;
      color: var(--mist);
      font-weight: 700;
    }

    .train svg {
      flex: none;
    }

    h1 {
      margin: 0.35rem 0 0;
      font: 700 clamp(2.75rem, 16vw, 4.625rem)/1 var(--display-font);
      letter-spacing: -0.018em;
      overflow-wrap: anywhere;
    }

    .readout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(5rem, 35%);
      gap: 0.75rem;
      margin: 1.25rem 0 0;
      padding-top: 1rem;
      border-top: 1px solid var(--steel);
    }

    .readout > div {
      padding-block: 0.65rem 0.7rem;
    }

    .readout dt {
      font-weight: 700;
      line-height: 1.25;
    }

    .readout dd {
      margin: 0.25rem 0 0;
      font: 600 clamp(2.5rem, 17vw, 4.75rem)/0.92 var(--display-font);
      font-variant-numeric: lining-nums tabular-nums;
    }

    .departure-time dt {
      color: var(--mist);
    }

    .departure-time dd {
      white-space: nowrap;
    }

    .platform {
      position: relative;
      border-radius: 0.15rem;
      background: var(--amber);
      color: var(--night);
      text-align: center;
    }

    .platform::before {
      position: absolute;
      inset: -1rem 18% auto;
      height: 1rem;
      border-inline: 2px solid var(--steel);
      content: "";
    }

    .platform::after {
      position: absolute;
      inset: auto 0 0;
      height: 3px;
      background: rgb(15 28 43 / 0.13);
      content: "";
    }

    .board-tracks {
      position: absolute;
      inset: auto 0 0;
      width: 100%;
      height: 3.65rem;
      color: var(--steel);
      pointer-events: none;
    }

    .ticket-toggle {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      min-height: 3.75rem;
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      border: 1px solid var(--night);
      border-radius: 0.4rem;
      background: var(--night);
      color: var(--frost);
      font: 700 1.125rem/1.2 var(--text-font);
      text-align: left;
      cursor: pointer;
    }

    .ticket-icon {
      color: var(--amber);
    }

    .ticket-toggle:focus-visible {
      outline: 3px solid var(--steel);
      outline-offset: 4px;
    }

    .ticket-toggle:active {
      background: var(--board);
    }

    .ticket-toggle[aria-expanded="true"] .plus-stroke {
      visibility: hidden;
    }

    .ticket {
      overflow: hidden;
      margin-top: 0.75rem;
      border: 1px solid var(--mist);
      border-radius: 0.4rem;
      background: color-mix(in srgb, var(--frost) 72%, var(--mist));
    }

    .ticket[hidden] {
      display: none;
    }

    .ticket-stub,
    .ticket-fallback {
      padding: 0.85rem 1.1rem;
    }

    .ticket h2,
    .ticket h3 {
      margin: 0;
      color: var(--steel);
      font-size: 1rem;
      font-weight: 700;
    }

    .ticket-number {
      margin: 0.15rem 0 0;
      font: 600 2.65rem/1 var(--display-font);
      letter-spacing: 0.02em;
    }

    .ticket-fallback {
      position: relative;
      border-top: 1px dashed var(--steel);
    }

    .ticket-fallback::before,
    .ticket-fallback::after {
      position: absolute;
      top: -0.45rem;
      width: 0.875rem;
      height: 0.875rem;
      border: 1px solid var(--mist);
      border-radius: 50%;
      background: var(--frost);
      content: "";
    }

    .ticket-fallback::before {
      left: -0.4375rem;
    }

    .ticket-fallback::after {
      right: -0.4375rem;
    }

    .ticket-fallback p {
      margin: 0.25rem 0 0;
    }

    @media (hover: hover) {
      .ticket-toggle:hover {
        background: var(--board);
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .ticket:not([hidden]) {
        animation: reveal 160ms ease-out both;
      }

      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(-0.25rem);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    }

    @media (max-width: 32rem) {
      body {
        display: block;
        padding: 0;
        background: var(--frost);
      }

      .concourse {
        display: none;
      }

      .screen {
        width: 100%;
        padding: max(clamp(1.125rem, 5svh, 2.75rem), env(safe-area-inset-top))
          max(1.125rem, env(safe-area-inset-right))
          max(1.25rem, env(safe-area-inset-bottom))
          max(1.125rem, env(safe-area-inset-left));
        border-radius: 0;
        box-shadow: none;
      }
    }

    @media (max-width: 21rem) {
      .screen {
        padding-inline: 0.875rem;
      }

      .departure {
        padding-inline: 1rem;
      }
    }

    @media (max-width: 17rem) {
      .readout {
        grid-template-columns: 1fr;
      }

      .platform::before {
        display: none;
      }
    }

    @media (forced-colors: active) {
      .departure,
      .platform {
        outline: 1px solid currentColor;
        outline-offset: -1px;
      }

      .ticket-toggle:focus-visible {
        outline-color: Highlight;
      }
    }
  </style>
</head>
<body>
  <svg class="concourse" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice"
       aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M-60 715H183C315 715 367 662 459 570L987 42C1039-10 1085-22 1167-22H1500
             M-60 741H183C326 741 385 681 477 589L1005 61C1052 14 1095 4 1167 4H1500
             M-60 785H183C343 785 412 715 509 618L1035 92C1074 53 1109 48 1172 48H1500
             M-60 811H183C354 811 430 734 527 637L1053 111C1087 77 1119 74 1172 74H1500"/>
    <path d="M30 709V747M82 709V747M134 709V747M186 709V747
             M30 779V817M82 779V817M134 779V817M186 779V817
             M1190 42V80M1242 42V80M1294 42V80M1346 42V80M1398 42V80"/>
  </svg>

  <main class="screen">
    <section class="departure" aria-labelledby="destination">
      <p class="train">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true" focusable="false">
          <rect x="5" y="3" width="14" height="15" rx="3"/>
          <path d="M5 11h14M12 3v8M8 21l2-3m6 3-2-3M8.5 14.5h.1m6.8 0h.1"/>
        </svg>
        Train 487
      </p>

      <h1 id="destination">Milwaukee</h1>

      <dl class="readout">
        <div class="departure-time">
          <dt>Departs</dt>
          <dd><time datetime="17:42">17:42</time></dd>
        </div>
        <div class="platform">
          <dt>Platform</dt>
          <dd>6</dd>
        </div>
      </dl>

      <svg class="board-tracks" viewBox="0 0 420 82" preserveAspectRatio="none"
           aria-hidden="true" focusable="false" fill="none" stroke="currentColor">
        <path stroke-width="1.3" d="M-48 100 352 7M134 100 365 7"/>
        <path stroke-width="0.9" d="M42 77H200M90 66H227M133 56H252M172 47H274
                                  M206 39H294M234 33H306M260 27H321M282 22H333
                                  M304 17H345M322 13H354"/>
      </svg>
    </section>

    <button class="ticket-toggle" id="ticket-toggle" type="button"
            aria-expanded="false" aria-controls="ticket">
      <svg class="ticket-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M3 6h18v3.8a2.2 2.2 0 0 0 0 4.4V18H3v-3.8a2.2 2.2 0 0 0 0-4.4V6Z"/>
        <path d="M14.5 8.5v1m0 2v1m0 2v1"/>
      </svg>
      <span id="ticket-toggle-label">Show ticket</span>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"
           stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
           aria-hidden="true" focusable="false">
        <path d="M4 10h12"/>
        <path class="plus-stroke" d="M10 4v12"/>
      </svg>
    </button>

    <section class="ticket" id="ticket" aria-labelledby="ticket-heading" hidden>
      <div class="ticket-stub">
        <h2 id="ticket-heading">Ticket number</h2>
        <p class="ticket-number">T487-MK02</p>
      </div>
      <div class="ticket-fallback">
        <h3>Plain-text ticket</h3>
        <p>Ticket T487-MK02 for train 487 to Milwaukee. Departs at 17:42 from platform 6.</p>
      </div>
    </section>
  </main>

  <script>
    const ticketToggle = document.getElementById("ticket-toggle");
    const ticketToggleLabel = document.getElementById("ticket-toggle-label");
    const ticket = document.getElementById("ticket");

    ticketToggle.addEventListener("click", () => {
      const isOpening = ticket.hidden;
      ticket.hidden = !isOpening;
      ticketToggle.setAttribute("aria-expanded", String(isOpening));
      ticketToggleLabel.textContent = isOpening ? "Hide ticket" : "Show ticket";
    });
  </script>
</body>
</html>
