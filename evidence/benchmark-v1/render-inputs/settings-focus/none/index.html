<!doctype html>
<html lang="en">
<!--
A student can choose and apply a study schedule in a calm, focused setting.
Mist #edf1f7, Paper #ffffff, Ink #172742, Slate #526280, Lapis #233b91
and Amber #ffcc78 define the palette. Instrument Serif sets the title and
dial readout. DM Sans carries the controls. The schedule sits beside a
minute dial and stacks above it on phones. The amber arc marks the break.

The 25/5 schedule starts active. Applying either choice moves the active
label and updates the focus, break, and total minutes in the preview.
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus settings</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400..700&amp;family=Instrument+Serif&amp;display=swap">
  <style>
    :root {
      --mist: #edf1f7;
      --paper: #ffffff;
      --ink: #172742;
      --slate: #526280;
      --lapis: #233b91;
      --amber: #ffcc78;
      --line: color-mix(in srgb, var(--ink) 16%, transparent);
      --preview-label: color-mix(in srgb, var(--paper) 82%, var(--lapis));
      --serif: "Instrument Serif", Georgia, serif;
      --sans: "DM Sans", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--mist);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.45;
    }

    .page {
      width: min(68rem, calc(100% - 4rem));
      margin-inline: auto;
      padding-block: clamp(2.5rem, 5.3vw, 4.75rem) 2.5rem;
    }

    .page-header {
      margin-block-end: 1.875rem;
    }

    h1 {
      margin: 0;
      font: 400 clamp(3.25rem, 5.8vw, 5rem) / .96 var(--serif);
      letter-spacing: -.025em;
    }

    .page-header p {
      margin: .75rem 0 0;
      color: var(--slate);
      font-size: 1.0625rem;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 46fr) minmax(0, 54fr);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: .875rem;
      background: var(--paper);
    }

    .settings,
    .preview {
      padding: 2.25rem clamp(1.5rem, 3vw, 2.625rem) 1.875rem;
    }

    .settings {
      display: flex;
      flex-direction: column;
    }

    .pane-heading {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -.025em;
    }

    fieldset {
      min-inline-size: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    fieldset legend {
      margin-block-end: 1.125rem;
      padding: 0;
    }

    .options {
      display: grid;
      gap: .625rem;
    }

    .option {
      display: grid;
      grid-template-columns: 1.125rem minmax(0, 1fr) minmax(0, 1fr) 3.125rem;
      align-items: center;
      gap: clamp(.5rem, 1.3vw, 1rem);
      min-block-size: 5.625rem;
      padding: .625rem .875rem;
      border: 1px solid var(--line);
      border-radius: .5rem;
      cursor: pointer;
    }

    .option:hover {
      border-color: color-mix(in srgb, var(--lapis) 55%, var(--paper));
    }

    .option:has(input:checked) {
      border-color: color-mix(in srgb, var(--lapis) 64%, var(--paper));
      background: color-mix(in srgb, var(--lapis) 6%, var(--paper));
    }

    .option:has(input:focus-visible),
    .apply:focus-visible {
      outline: 2px solid var(--lapis);
      outline-offset: 3px;
    }

    .option input {
      width: 1.125rem;
      height: 1.125rem;
      margin: 0;
      accent-color: var(--lapis);
      cursor: inherit;
    }

    .option input:focus-visible {
      outline: none;
    }

    .time {
      display: grid;
      gap: .25rem;
    }

    .time-value {
      font-size: 1.625rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.045em;
      line-height: 1;
      white-space: nowrap;
    }

    .unit,
    .time-label {
      color: var(--slate);
      font-size: .8125rem;
      font-weight: 500;
      letter-spacing: 0;
    }

    .active-tag {
      justify-self: end;
      padding: .25rem .5rem;
      border-radius: .25rem;
      background: color-mix(in srgb, var(--lapis) 12%, var(--paper));
      color: var(--lapis);
      font-size: .75rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .form-actions {
      margin-block-start: auto;
      padding-block-start: 1.75rem;
    }

    .apply {
      width: 100%;
      min-block-size: 3.25rem;
      padding: .625rem 1rem;
      border: 1px solid transparent;
      border-radius: .5rem;
      background: var(--lapis);
      color: var(--paper);
      font: 650 .9375rem / 1.25 var(--sans);
      cursor: pointer;
    }

    .apply[aria-disabled="false"]:hover {
      background: color-mix(in srgb, var(--lapis) 78%, var(--ink));
    }

    .apply[aria-disabled="true"] {
      border-color: var(--line);
      background: var(--mist);
      color: var(--slate);
      cursor: default;
    }

    .feedback {
      min-block-size: 1.25rem;
      margin: .4375rem 0 0;
      color: var(--lapis);
      font-size: .8125rem;
      line-height: 1.25rem;
    }

    .preview {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 1.25rem;
      background:
        radial-gradient(ellipse at 52% 47%, rgb(255 255 255 / .07), transparent 70%),
        var(--lapis);
      color: var(--paper);
    }

    .dial-stage {
      display: grid;
      place-items: center;
    }

    .dial {
      --focus-angle: 300deg;
      --ring-inset: 1rem;
      --ring-width: .875rem;
      position: relative;
      display: grid;
      place-items: center;
      inline-size: min(15.75rem, 100%);
      aspect-ratio: 1;
      isolation: isolate;
    }

    .dial::before,
    .dial::after,
    .dial-arc {
      position: absolute;
      border-radius: 50%;
    }

    .dial::before {
      content: "";
      inset: 0;
      background:
        repeating-conic-gradient(from -.45deg, rgb(255 255 255 / .4) 0deg .9deg, transparent .9deg 30deg),
        repeating-conic-gradient(from -.35deg, rgb(255 255 255 / .22) 0deg .7deg, transparent .7deg 6deg);
      mask-image: radial-gradient(farthest-side, transparent calc(100% - 8px), black calc(100% - 7px));
    }

    .dial::after {
      content: "";
      inset: calc(var(--ring-inset) + var(--ring-width) + 7px);
      border: 1px solid rgb(255 255 255 / .17);
    }

    .dial-arc {
      inset: var(--ring-inset);
      background: conic-gradient(
        transparent 0deg 2deg,
        var(--mist) 2deg calc(var(--focus-angle) - 2deg),
        transparent calc(var(--focus-angle) - 2deg) calc(var(--focus-angle) + 2deg),
        var(--amber) calc(var(--focus-angle) + 2deg) 358deg,
        transparent 358deg 360deg
      );
      mask-image: radial-gradient(
        farthest-side,
        transparent calc(100% - var(--ring-width)),
        black calc(100% - var(--ring-width) + 1px)
      );
    }

    .dial-readout {
      z-index: 1;
      display: grid;
      justify-items: center;
      gap: .375rem;
    }

    .dial-number {
      font: 400 6.375rem / .85 var(--serif);
      letter-spacing: -.045em;
    }

    .dial-label {
      color: var(--preview-label);
      font-size: .875rem;
    }

    .preview-key {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin: 0;
      padding-block-start: 1rem;
      border-block-start: 1px solid rgb(255 255 255 / .25);
    }

    .key-item + .key-item {
      padding-inline-start: 1.125rem;
      border-inline-start: 1px solid rgb(255 255 255 / .25);
    }

    .key-item dt {
      display: flex;
      align-items: center;
      gap: .5rem;
      color: var(--preview-label);
      font-size: .8125rem;
      font-weight: 500;
    }

    .key-item dt::before {
      content: "";
      width: .6875rem;
      height: .25rem;
      border-radius: 2px;
      background: var(--mist);
    }

    .key-item--break dt::before {
      background: var(--amber);
    }

    .key-item dd {
      margin: .1875rem 0 0 1.1875rem;
      font-size: 1.5rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.035em;
      line-height: 1.1;
    }

    .key-item .unit {
      color: var(--preview-label);
    }

    @media (max-width: 48rem) {
      .page {
        width: min(32rem, calc(100% - 2.25rem));
        padding-block: 1.75rem 1.5rem;
      }

      .page-header {
        margin-block-end: 1.25rem;
      }

      .page-header p {
        margin-block-start: .5625rem;
        font-size: .975rem;
      }

      .workspace {
        grid-template-columns: minmax(0, 1fr);
      }

      .settings,
      .preview {
        padding: 1.1875rem 1.125rem;
      }

      .settings {
        padding-block-end: .75rem;
      }

      .pane-heading {
        font-size: 1.125rem;
      }

      fieldset legend {
        margin-block-end: .8125rem;
      }

      .options {
        gap: .5rem;
      }

      .option {
        min-block-size: 4.125rem;
        padding-inline: .6875rem;
      }

      .time-value {
        font-size: 1.375rem;
      }

      .form-actions {
        padding-block-start: 1.0625rem;
      }

      .apply {
        min-block-size: 2.875rem;
      }

      .feedback {
        margin-block-start: .3125rem;
        min-block-size: 1.125rem;
        line-height: 1.125rem;
      }

      .preview {
        gap: .8125rem;
      }

      .dial {
        --ring-inset: .8125rem;
        --ring-width: .6875rem;
        inline-size: min(11.25rem, 100%);
      }

      .dial-number {
        font-size: 4.75rem;
      }

      .dial-label {
        font-size: .75rem;
      }

      .preview-key {
        padding-block-start: .6875rem;
      }

      .key-item dd {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Focus settings</h1>
      <p>Set how long to study and how long to rest.</p>
    </header>

    <div class="workspace">
      <form class="settings" id="schedule-form" autocomplete="off">
        <fieldset>
          <legend class="pane-heading">Study schedule</legend>
          <div class="options">
            <label class="option">
              <input type="radio" name="schedule" value="25" data-break="5" checked>
              <span class="time">
                <span class="time-value">25 <span class="unit">min</span></span>
                <span class="time-label">Focus</span>
              </span>
              <span class="time">
                <span class="time-value">5 <span class="unit">min</span></span>
                <span class="time-label">Break</span>
              </span>
              <span class="active-tag">Active</span>
            </label>

            <label class="option">
              <input type="radio" name="schedule" value="50" data-break="10">
              <span class="time">
                <span class="time-value">50 <span class="unit">min</span></span>
                <span class="time-label">Focus</span>
              </span>
              <span class="time">
                <span class="time-value">10 <span class="unit">min</span></span>
                <span class="time-label">Break</span>
              </span>
              <span class="active-tag" hidden>Active</span>
            </label>
          </div>
        </fieldset>

        <div class="form-actions">
          <button class="apply" type="submit" aria-disabled="true">Apply schedule</button>
          <p class="feedback" id="feedback" role="status"></p>
        </div>
      </form>

      <section class="preview" aria-labelledby="preview-title">
        <h2 class="pane-heading" id="preview-title">Session preview</h2>
        <div class="dial-stage">
          <div class="dial" id="dial">
            <span class="dial-arc" aria-hidden="true"></span>
            <div class="dial-readout" id="dial-readout">
              <span class="dial-number" id="total-minutes">30</span>
              <span class="dial-label">min total</span>
            </div>
          </div>
        </div>

        <dl class="preview-key">
          <div class="key-item">
            <dt>Focus</dt>
            <dd><span id="focus-minutes">25</span> <span class="unit">min</span></dd>
          </div>
          <div class="key-item key-item--break">
            <dt>Break</dt>
            <dd><span id="break-minutes">5</span> <span class="unit">min</span></dd>
          </div>
        </dl>
      </section>
    </div>
  </main>

  <script>
    const form = document.getElementById("schedule-form");
    const apply = form.querySelector("button");
    const feedback = document.getElementById("feedback");
    const dial = document.getElementById("dial");
    const readout = document.getElementById("dial-readout");
    const totalMinutes = document.getElementById("total-minutes");
    const focusMinutes = document.getElementById("focus-minutes");
    const breakMinutes = document.getElementById("break-minutes");
    let active = form.querySelector("input[checked]");

    form.addEventListener("change", () => {
      const hasChange = form.elements.schedule.value !== active.value;
      apply.setAttribute("aria-disabled", String(!hasChange));
      feedback.textContent = "";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const selected = form.querySelector("input:checked");
      if (selected === active) return;

      active.closest(".option").querySelector(".active-tag").hidden = true;
      selected.closest(".option").querySelector(".active-tag").hidden = false;
      active = selected;

      const focus = Number(active.value);
      const rest = Number(active.dataset.break);
      const total = focus + rest;

      totalMinutes.textContent = total;
      focusMinutes.textContent = focus;
      breakMinutes.textContent = rest;
      dial.style.setProperty("--focus-angle", `${focus / total * 360}deg`);
      apply.setAttribute("aria-disabled", "true");
      feedback.textContent = `Applied ${focus} min focus and ${rest} min break.`;

      if (matchMedia("(prefers-reduced-motion: no-preference)").matches) {
        readout.animate(
          [
            { opacity: .6, transform: "translateY(3px)" },
            { opacity: 1, transform: "translateY(0)" }
          ],
          { duration: 200, easing: "ease-out" }
        );
      }
    });
  </script>
</body>
</html>
