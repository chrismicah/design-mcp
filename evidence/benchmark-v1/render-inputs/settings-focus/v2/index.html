<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14181B">
  <title>Study focus</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Sans+Condensed:wght@600&amp;display=swap">
  <style>
    :root {
      color-scheme: dark;
      --graphite: #14181b;
      --slate: #1d252b;
      --chalk: #eef0ec;
      --fog: #abb7ba;
      --apricot: #ffaa72;
      --blue-gray: #8ea9b0;
      --line: color-mix(in srgb, var(--fog) 23%, var(--slate));
      --display: "IBM Plex Sans Condensed", "Liberation Sans Narrow", sans-serif;
      --body: "IBM Plex Sans", sans-serif;
      --hatching: repeating-linear-gradient(
        135deg,
        transparent 0 4px,
        rgb(20 24 27 / 24%) 4px 5px
      );
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--graphite);
      color: var(--chalk);
      font: 400 1rem/1.5 var(--body);
    }

    .settings {
      width: min(1160px, calc(100% - 88px));
      margin-inline: auto;
      padding-block: clamp(58px, 9vh, 92px) 48px;
    }

    h1, h2, p, dl, dd { margin: 0; }

    h1 {
      margin-bottom: 34px;
      font: 600 clamp(3.25rem, 5.1vw, 4.75rem)/1 var(--display);
      letter-spacing: -.035em;
    }

    .active-schedule {
      display: grid;
      grid-template-columns: minmax(12rem, 1fr) minmax(0, 2fr);
      align-items: center;
      gap: 24px;
      padding: 26px 30px;
      border: 1px solid var(--line);
      border-inline-start: 3px solid var(--apricot);
      border-radius: 0 6px 6px 0;
      background: linear-gradient(
        108deg,
        color-mix(in srgb, var(--apricot) 8%, var(--slate)),
        var(--slate) 52%
      );
    }

    .active-heading {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 1.0625rem;
      font-weight: 600;
    }

    .active-heading svg {
      flex: none;
      width: 34px;
      height: 34px;
      color: var(--apricot);
    }

    .active-times {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .active-times > div {
      padding-inline-start: 26px;
      border-inline-start: 1px solid var(--line);
    }

    .active-times dt {
      color: var(--fog);
      font-size: .9375rem;
      font-weight: 500;
    }

    .active-times dd, .total {
      display: flex;
      align-items: baseline;
      gap: 8px;
      white-space: nowrap;
    }

    .active-times dd {
      margin-top: 5px;
      font: 600 4rem/.95 var(--display);
      letter-spacing: -.025em;
    }

    .active-times > div:first-child dd { color: var(--apricot); }

    .unit {
      color: var(--fog);
      font: 500 .9375rem/1.2 var(--body);
      letter-spacing: 0;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 6.5fr);
      gap: clamp(30px, 4vw, 56px);
      margin-top: 41px;
    }

    .section-title {
      margin: 0 0 17px;
      padding: 0;
      font: 600 1.875rem/1.1 var(--display);
      letter-spacing: -.02em;
    }

    fieldset {
      min-inline-size: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .option-columns, .schedule-option {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) minmax(0, 1fr) 60px;
      align-items: center;
      gap: 13px;
      padding-inline: 14px;
    }

    .option-columns {
      padding-block: 0 7px;
      color: var(--fog);
      font-size: .875rem;
      font-weight: 500;
    }

    .option-columns span:first-child { grid-column: 2; }
    .options { border-top: 1px solid var(--line); }

    .schedule-option {
      position: relative;
      min-height: 63px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }

    .schedule-option:has(input:checked) {
      background: color-mix(in srgb, var(--apricot) 8%, var(--graphite));
      box-shadow: inset 2px 0 var(--apricot);
    }

    .schedule-option input {
      appearance: none;
      width: 19px;
      height: 19px;
      margin: 0;
      border: 1.5px solid var(--fog);
      border-radius: 50%;
      cursor: inherit;
    }

    .schedule-option input:checked {
      border-color: var(--apricot);
      background: radial-gradient(circle, var(--apricot) 0 4px, transparent 4.6px);
    }

    .schedule-option input:focus-visible { outline: none; }

    .schedule-option:has(input:focus-visible), .apply:focus-visible {
      z-index: 1;
      outline: 2px solid var(--chalk);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px var(--graphite);
    }

    .option-time {
      color: var(--fog);
      font-size: .875rem;
      white-space: nowrap;
    }

    .option-time b {
      color: var(--chalk);
      font: 600 1.5rem/1 var(--display);
    }

    .active-tag {
      justify-self: end;
      padding: 2px 7px 3px;
      border-radius: 4px;
      background: color-mix(in srgb, var(--apricot) 15%, var(--slate));
      color: var(--apricot);
      font-size: .8125rem;
      font-weight: 600;
    }

    .apply {
      position: relative;
      min-width: 168px;
      min-height: 48px;
      margin-top: 21px;
      padding: 10px 19px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: var(--apricot);
      color: var(--graphite);
      font: 600 .9375rem/1.25 var(--body);
      cursor: pointer;
    }

    .apply[aria-disabled="true"] {
      border-color: var(--line);
      background: var(--slate);
      color: var(--fog);
      cursor: default;
    }

    @media (hover: hover) {
      .schedule-option:not(:has(input:checked)):hover { background: var(--slate); }

      .apply:not([aria-disabled="true"]):hover {
        background: color-mix(in srgb, var(--apricot) 82%, var(--chalk));
      }
    }

    .preview-panel {
      padding: 27px 28px 24px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--slate);
    }

    .preview-readout {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 29px;
    }

    .total {
      font: 600 4.125rem/.95 var(--display);
      letter-spacing: -.025em;
    }

    .interval-legend {
      display: grid;
      gap: 6px;
      color: var(--fog);
      font-size: .875rem;
    }

    .interval-legend > div {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 15px;
    }

    .interval-legend dt {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .interval-legend dd {
      color: var(--chalk);
      font-weight: 500;
      white-space: nowrap;
    }

    .swatch {
      width: 11px;
      height: 11px;
      border-radius: 1px;
    }

    .focus-fill { background: var(--apricot); }
    .break-fill { background: var(--hatching), var(--blue-gray); }

    .minute-track {
      --cycle-length: 50%;
      --focus-share: 83.333333%;
      --division: calc(100% / 12);
      position: relative;
      height: 42px;
      overflow: hidden;
      border-radius: 3px;
      outline: 1px solid var(--line);
      background: var(--graphite);
    }

    .minute-track::after {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to right,
        transparent 0 calc(var(--division) - 1px),
        rgb(171 183 186 / 24%) calc(var(--division) - 1px) var(--division)
      );
      pointer-events: none;
      content: "";
    }

    .minute-fill {
      display: flex;
      width: var(--cycle-length);
      height: 100%;
      transition: width 300ms cubic-bezier(.2, .75, .3, 1);
    }

    .minute-fill .focus-fill { width: var(--focus-share); }
    .minute-fill .break-fill { flex: 1; }

    .minute-ruler {
      margin-top: 5px;
      color: var(--fog);
      font-size: .8125rem;
    }

    .minute-ruler svg {
      display: block;
      width: 100%;
      height: 12px;
    }

    .minute-ruler path {
      fill: none;
      stroke: currentColor;
      stroke-opacity: .6;
      vector-effect: non-scaling-stroke;
    }

    .scale-labels {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-top: 3px;
    }

    .scale-labels span:nth-child(2) { text-align: center; }
    .scale-labels span:last-child { text-align: end; }

    .active-times, .option-time, .preview-panel {
      font-variant-numeric: tabular-nums;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 760px) {
      .settings {
        width: calc(100% - 40px);
        max-width: 520px;
        padding-block: 29px 30px;
      }

      h1 {
        margin-bottom: 22px;
        font-size: clamp(2.5rem, 12.3vw, 3.375rem);
      }

      .active-schedule {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 13px 16px 17px;
      }

      .active-heading { gap: 6px; font-size: .9375rem; }
      .active-heading svg { width: 24px; height: 24px; }

      .active-times > div { padding-inline-start: 17px; }
      .active-times > div:first-child {
        padding-inline-start: 0;
        border-inline-start: 0;
      }

      .active-times dt { font-size: .875rem; }
      .active-times dd { margin-top: 3px; font-size: 2.625rem; }

      .settings-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 29px;
        margin-top: 26px;
      }

      .section-title {
        margin-bottom: 12px;
        font-size: 1.625rem;
      }

      .option-columns, .schedule-option {
        gap: 10px;
        padding-inline: 11px;
      }

      .schedule-option { min-height: 54px; }
      .apply { width: 100%; margin-top: 15px; }
      .preview-panel { padding: 19px 17px 16px; }
      .preview-readout { margin-bottom: 22px; }
      .total { font-size: 3.125rem; }
      .interval-legend > div { gap: 10px; }
      .minute-track { height: 34px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .minute-fill { transition: none; }
    }

    @media (forced-colors: active) {
      .schedule-option input { appearance: auto; }
      .focus-fill, .break-fill { forced-color-adjust: none; }
      .apply[aria-disabled="true"] { color: GrayText; }
    }
  </style>
</head>
<body>
  <main class="settings">
    <h1>Study focus</h1>

    <section class="active-schedule" aria-labelledby="active-heading">
      <h2 class="active-heading" id="active-heading">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <circle cx="20" cy="22" r="12.5"></circle>
          <path d="M16 5h8m-4 0v4.5m9.3 3.9 2.5-2.5M20 15v7l4.5 2.5"></path>
        </svg>
        Active schedule
      </h2>
      <dl class="active-times">
        <div>
          <dt>Focus</dt>
          <dd><span id="active-focus">25</span> <span class="unit">min</span></dd>
        </div>
        <div>
          <dt>Break</dt>
          <dd><span id="active-break">5</span> <span class="unit">min</span></dd>
        </div>
      </dl>
    </section>

    <div class="settings-grid">
      <form id="schedule-form">
        <fieldset>
          <legend class="section-title">Schedule</legend>
          <div class="option-columns" aria-hidden="true">
            <span>Focus</span>
            <span>Break</span>
          </div>
          <div class="options">
            <label class="schedule-option">
              <input type="radio" name="schedule" value="25/5"
                     aria-labelledby="short-focus short-break"
                     aria-describedby="short-active" checked>
              <span class="option-time" id="short-focus">
                <b>25</b> min<span class="sr-only"> focus</span>
              </span>
              <span class="option-time" id="short-break">
                <b>5</b> min<span class="sr-only"> break</span>
              </span>
              <span class="active-tag" id="short-active">Active</span>
            </label>
            <label class="schedule-option">
              <input type="radio" name="schedule" value="50/10"
                     aria-labelledby="long-focus long-break">
              <span class="option-time" id="long-focus">
                <b>50</b> min<span class="sr-only"> focus</span>
              </span>
              <span class="option-time" id="long-break">
                <b>10</b> min<span class="sr-only"> break</span>
              </span>
              <span class="active-tag" id="long-active" hidden>Active</span>
            </label>
          </div>
        </fieldset>
        <button class="apply" type="submit" aria-disabled="true">Apply schedule</button>
      </form>

      <section aria-labelledby="preview-heading">
        <h2 class="section-title" id="preview-heading">Session preview</h2>
        <div class="preview-panel">
          <div class="preview-readout">
            <p class="total">
              <span id="preview-total">30</span> <span class="unit">min total</span>
            </p>
            <dl class="interval-legend">
              <div>
                <dt><span class="swatch focus-fill" aria-hidden="true"></span>Focus</dt>
                <dd><span id="preview-focus">25</span> min</dd>
              </div>
              <div>
                <dt><span class="swatch break-fill" aria-hidden="true"></span>Break</dt>
                <dd><span id="preview-break">5</span> min</dd>
              </div>
            </dl>
          </div>

          <div aria-hidden="true">
            <div class="minute-track" id="minute-track">
              <div class="minute-fill">
                <span class="focus-fill"></span>
                <span class="break-fill"></span>
              </div>
            </div>
            <div class="minute-ruler">
              <svg viewBox="0 0 600 12" preserveAspectRatio="none">
                <path d="M.5 0v11 M50 0v5 M100 0v5 M150 0v8 M200 0v5 M250 0v5
                         M300 0v11 M350 0v5 M400 0v5 M450 0v8 M500 0v5 M550 0v5
                         M599.5 0v11"></path>
              </svg>
              <div class="scale-labels"><span>0</span><span>30</span><span>60 min</span></div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <p class="sr-only" id="schedule-status" role="status"></p>
  </main>

  <script>
    const form = document.getElementById("schedule-form");
    const choices = Array.from(form.querySelectorAll('input[name="schedule"]'));
    const applyButton = form.querySelector("button");
    const track = document.getElementById("minute-track");
    const status = document.getElementById("schedule-status");
    const storageKey = "study-focus.active-schedule";
    let active = choices[0].value;

    // Keep the applied setting for the current tab session when storage is available.
    try {
      const saved = sessionStorage.getItem(storageKey);
      if (choices.some(choice => choice.value === saved)) active = saved;
    } catch {}

    choices.find(choice => choice.value === active).checked = true;

    function renderActiveSchedule() {
      const [focus, breakMinutes] = active.split("/").map(Number);
      document.getElementById("active-focus").textContent = focus;
      document.getElementById("active-break").textContent = breakMinutes;

      for (const choice of choices) {
        const tag = choice.closest("label").querySelector(".active-tag");
        tag.hidden = choice.value !== active;
        if (tag.hidden) {
          choice.removeAttribute("aria-describedby");
        } else {
          choice.setAttribute("aria-describedby", tag.id);
        }
      }
    }

    function renderPreview() {
      const selected = form.elements.schedule.value;
      const [focus, breakMinutes] = selected.split("/").map(Number);
      const total = focus + breakMinutes;

      document.getElementById("preview-focus").textContent = focus;
      document.getElementById("preview-break").textContent = breakMinutes;
      document.getElementById("preview-total").textContent = total;
      track.style.setProperty("--cycle-length", `${total / 60 * 100}%`);
      track.style.setProperty("--focus-share", `${focus / total * 100}%`);
      applyButton.setAttribute("aria-disabled", String(selected === active));
    }

    form.addEventListener("change", renderPreview);

    form.addEventListener("submit", event => {
      event.preventDefault();
      const selected = form.elements.schedule.value;
      if (selected === active) return;

      active = selected;
      try {
        sessionStorage.setItem(storageKey, active);
      } catch {}

      renderActiveSchedule();
      renderPreview();
      const [focus, breakMinutes] = active.split("/").map(Number);
      status.textContent = `Schedule applied. ${focus} minutes of focus and a ${breakMinutes}-minute break.`;
    });

    renderActiveSchedule();
    renderPreview();
  </script>
</body>
</html>
