<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading preferences</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2a2e;
      --paper: #f8f5ec;
      --oat: #efe9dc;
      --sage: #d8e3db;
      --evergreen: #294b40;
      --brick: #a3401f;
      --rule: rgb(29 42 46 / 24%);
      --serif: "Newsreader", Georgia, serif;
      --sans: "Source Sans 3", sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 1rem / 1.45 var(--sans);
    }

    .page {
      --gutter: clamp(1.25rem, 5vw, 4rem);
      --columns: minmax(0, 2.18fr) minmax(16rem, 1fr);
      --gap: clamp(1.75rem, 3.75vw, 3.5rem);
      --inset: clamp(1.25rem, 2.75vw, 2.5rem);
      inline-size: min(70rem, calc(100% - var(--gutter) - var(--gutter)));
      margin-inline: auto;
      padding-block: clamp(2rem, 6.3vw, 6rem) 2rem;
    }

    .page-header,
    .reading-layout {
      display: grid;
      grid-template-columns: var(--columns);
      column-gap: var(--gap);
    }

    .page-header {
      align-items: end;
      border-block-start: 1px solid var(--ink);
      padding-block: clamp(1.35rem, 2.5vw, 2.25rem) clamp(1.5rem, 3vw, 2.625rem);
    }

    h1 {
      margin: 0;
      font: 500 clamp(2.6rem, 5.85vw, 5.25rem) / 1 var(--serif);
      letter-spacing: -.044em;
    }

    .intro {
      max-inline-size: 32ch;
      margin: 0 0 .2rem;
      padding-inline-start: var(--inset);
      color: var(--evergreen);
      font-size: 1.125rem;
    }

    .reading-layout {
      align-items: start;
      border-block-end: 1px solid var(--rule);
      padding-block-end: clamp(1.5rem, 3vw, 2.625rem);
    }

    .preview {
      --sample-size: clamp(2.125rem, 3.15vw, 2.8125rem);
      --sample-leading: 1.48;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      margin: 0;
      padding: clamp(1.15rem, 2.4vw, 2.125rem);
      background: var(--sage);
    }

    .preview[data-size="large"] {
      --sample-size: clamp(2.75rem, 4vw, 3.5rem);
    }

    .preview[data-spacing="compact"] {
      --sample-leading: 1.13;
    }

    .preview figcaption {
      position: relative;
      z-index: 1;
      padding-block-end: .75rem;
      border-block-end: 1px solid var(--rule);
      color: var(--evergreen);
      font-size: 1.0625rem;
      font-weight: 700;
    }

    .preview-content {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      align-items: center;
      gap: 1rem;
      min-block-size: 18rem;
      padding-block-start: .5rem;
    }

    .sample {
      position: relative;
      z-index: 1;
      margin: 0;
      padding-inline-start: clamp(.8rem, 1.4vw, 1.25rem);
      border-inline-start: 1px solid var(--brick);
      font: 500 var(--sample-size) / var(--sample-leading) var(--serif);
      letter-spacing: -.032em;
      transition: font-size 180ms ease-out, line-height 180ms ease-out;
    }

    .sample span {
      display: block;
    }

    .sample::before,
    .sample::after {
      position: absolute;
      inset-inline-start: -1px;
      inline-size: .4rem;
      border-block-start: 1px solid var(--brick);
      content: "";
    }

    .sample::before {
      inset-block-start: 0;
    }

    .sample::after {
      inset-block-end: 0;
    }

    .illustration {
      display: block;
      inline-size: 100%;
      max-inline-size: 21rem;
      block-size: auto;
      justify-self: end;
    }

    .preferences {
      min-inline-size: 0;
      padding: .15rem 0 .15rem var(--inset);
      border-inline-start: 1px solid var(--rule);
    }

    fieldset {
      min-inline-size: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    fieldset + fieldset {
      margin-block-start: 1.65rem;
    }

    legend {
      margin-block-end: .55rem;
      padding: 0;
      font-size: 1.1875rem;
      font-weight: 700;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .2rem;
      padding: .2rem;
      border: 1px solid rgb(29 42 46 / 49%);
      border-radius: 4px;
      background: var(--oat);
    }

    .choice {
      position: relative;
      cursor: pointer;
    }

    .choice input {
      position: absolute;
      inset: 0;
      inline-size: 100%;
      block-size: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .option-label {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      column-gap: .3rem;
      min-block-size: 3rem;
      padding-inline: .45rem;
      border-radius: 2px;
      font-size: 1.0625rem;
      font-weight: 600;
    }

    .option-label::before {
      justify-self: center;
      inline-size: .6rem;
      block-size: .35rem;
      border-block-end: 2px solid currentColor;
      border-inline-start: 2px solid currentColor;
      visibility: hidden;
      transform: translateY(-1px) rotate(-45deg);
      content: "";
    }

    .option-label::after {
      content: "";
    }

    .choice input:checked + .option-label {
      color: var(--paper);
      background: var(--evergreen);
    }

    .choice input:checked + .option-label::before {
      visibility: visible;
    }

    @media (hover: hover) {
      .choice:hover input:not(:checked) + .option-label {
        background: var(--sage);
      }
    }

    .choice input:focus-visible + .option-label,
    .reset:focus-visible {
      z-index: 1;
      outline: 2px solid var(--ink);
      outline-offset: 2px;
      box-shadow: 0 0 0 2px var(--paper);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0 .85rem;
      margin-block-start: 1.85rem;
      padding-block-start: .65rem;
      border-block-start: 1px solid var(--rule);
    }

    .reset {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      min-block-size: 2.75rem;
      margin: 0;
      padding: 0 .25rem 0 0;
      border: 0;
      border-radius: 2px;
      color: var(--brick);
      background: transparent;
      font: 700 1rem / 1.25 var(--sans);
      cursor: pointer;
    }

    .reset-icon {
      font-size: 1.25rem;
      line-height: 1;
    }

    .reset-label {
      text-decoration: underline;
      text-underline-offset: .2em;
    }

    .status {
      margin: 0;
      color: var(--evergreen);
      font-size: .9375rem;
    }

    @media (max-width: 56rem) {
      .page-header,
      .reading-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .page-header {
        row-gap: .55rem;
      }

      .intro {
        max-inline-size: 38ch;
        padding-inline-start: 0;
      }

      .reading-layout {
        row-gap: 1.55rem;
      }

      .preferences {
        padding: 0;
        border: 0;
      }
    }

    @media (max-width: 36rem) {
      .page {
        padding-block-start: 1.75rem;
      }

      h1 {
        font-size: clamp(2.25rem, 10.8vw, 3.5rem);
      }

      .intro {
        font-size: 1rem;
      }

      .preview {
        --sample-size: clamp(1.8rem, 8.7vw, 2.35rem);
      }

      .preview[data-size="large"] {
        --sample-size: clamp(2.3rem, 11.3vw, 2.9rem);
      }

      .preview-content {
        display: block;
        min-block-size: 10.5rem;
        padding-block-start: 1.4rem;
      }

      .illustration {
        position: absolute;
        inset-inline-end: -1.75rem;
        inset-block-end: -1.5rem;
        inline-size: clamp(8.25rem, 39vw, 11rem);
      }

      fieldset + fieldset {
        margin-block-start: 1.2rem;
      }

      .actions {
        margin-block-start: 1.25rem;
      }
    }

    @media (max-width: 22.5rem) {
      .illustration {
        inset-inline-end: -2.5rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sample {
        transition: none;
      }
    }

    @media (forced-colors: active) {
      .choice input:checked + .option-label {
        forced-color-adjust: none;
        color: HighlightText;
        background: Highlight;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Reading preferences</h1>
      <p class="intro">See how your settings change the way recipes read.</p>
    </header>

    <div class="reading-layout">
      <figure class="preview" id="recipe-preview" data-size="standard" data-spacing="comfortable">
        <figcaption>Recipe preview</figcaption>
        <div class="preview-content">
          <p class="sample">Rest dough for <span>20 minutes.</span></p>

          <svg class="illustration" viewBox="0 0 356 308" aria-hidden="true" focusable="false">
            <defs>
              <pattern id="linen-lines" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(19)">
                <path d="M.5 0v7" stroke="var(--evergreen)" stroke-opacity=".24" stroke-width=".7"/>
              </pattern>
            </defs>

            <path d="m187 42 146 55-55 184-149-53Z" fill="var(--oat)"/>
            <path d="m187 42 146 55-55 184-149-53Z" fill="url(#linen-lines)" stroke="var(--evergreen)" stroke-opacity=".44"/>
            <g fill="none" stroke="var(--evergreen)" stroke-opacity=".48" stroke-linecap="round">
              <path d="m325 99-53 173-140-50m189-124-51 168-134-48"/>
              <path d="m276 280-2 6m-7-9-2 6m-7-9-2 6m-7-9-2 6m-7-9-2 6m-7-10-2 7m-7-10-2 6m-7-9-2 6m-7-9-2 6m-7-9-2 6m-7-10-2 6m-7-9-2 6m-7-9-2 6m-7-10-2 6m-7-9-2 6m-7-9-2 6"/>
            </g>

            <ellipse cx="161" cy="163" rx="119" ry="116" fill="var(--ink)" opacity=".1"/>
            <path d="M274 154c0 65-52 117-117 117-64 0-116-51-117-115C39 91 92 38 157 39c65 0 117 51 117 115Z" fill="var(--paper)" stroke="var(--evergreen)" stroke-width="1.55"/>
            <path d="M263 154c0 58-47 106-106 106S51 213 51 155 98 49 157 49s106 47 106 105Z" fill="var(--sage)" stroke="var(--evergreen)" stroke-opacity=".8" stroke-width="1.2"/>
            <path d="M59 143c5-49 45-88 95-89m102 111c-5 50-47 90-99 90m-93-67c9 28 29 49 56 59" fill="none" stroke="var(--evergreen)" stroke-opacity=".38" stroke-linecap="round"/>
            <path d="M244 128c10 32 1 68-24 91-35 32-89 31-123 0m-25-51c-6-29 5-60 27-81 27-25 64-31 94-18" fill="none" stroke="var(--evergreen)" stroke-opacity=".28" stroke-linecap="round"/>

            <g fill="var(--paper)">
              <circle cx="77" cy="130" r="2.2"/>
              <circle cx="73" cy="145" r="1.5"/>
              <circle cx="82" cy="142" r="1"/>
              <circle cx="105" cy="83" r="1.6"/>
              <circle cx="116" cy="81" r="1.2"/>
              <circle cx="223" cy="106" r="2.3"/>
              <circle cx="232" cy="119" r="1.6"/>
              <circle cx="229" cy="128" r="1"/>
              <circle cx="230" cy="189" r="2.1"/>
              <circle cx="225" cy="201" r="1.2"/>
              <circle cx="196" cy="225" r="1.9"/>
              <circle cx="186" cy="232" r="1.2"/>
              <circle cx="116" cy="222" r="2.1"/>
              <circle cx="102" cy="215" r="1.5"/>
              <circle cx="91" cy="203" r="1.1"/>
            </g>

            <path d="M226 157c1 19-7 37-22 50-14 12-33 19-53 17-20-2-36-9-49-22-12-12-17-29-16-47 1-17 9-36 23-47 14-11 29-14 47-14 19 0 37 6 49 18 12 11 20 27 21 45Z" fill="var(--evergreen)" opacity=".15"/>
            <path d="M222 153c1 19-7 37-21 50-14 12-33 19-53 17-20-2-36-9-49-22-12-12-17-29-16-47 1-17 9-36 23-47 14-11 29-14 47-14 19 0 37 6 49 18 12 11 19 27 20 45Z" fill="var(--oat)" stroke="var(--evergreen)" stroke-width="1.3"/>
            <path d="M93 149c3-16 12-31 25-40 16-10 36-12 53-7-23 0-38 11-50 24-11 12-19 19-28 23Z" fill="var(--paper)"/>
            <g fill="none" stroke="var(--evergreen)" stroke-opacity=".48" stroke-linecap="round">
              <path d="M122 143c11-10 24-14 38-12 14 3 22 2 30-6"/>
              <path d="M143 139c9-4 15-2 22-1m-64 48c9 13 23 22 39 25m-28-21c7 7 16 12 27 15m30 6c16-3 32-14 39-27m-23 16c8-4 15-10 19-17"/>
              <path d="m112 177 3 3m12 9 4 3m11-36 2 1m10 4 3 1m13-46 4 1m22 26 2 3m-14 30 3-2"/>
            </g>
          </svg>
        </div>
      </figure>

      <form class="preferences" id="preferences" aria-label="Reading preferences" autocomplete="off">
        <fieldset>
          <legend>Text size</legend>
          <div class="choices">
            <label class="choice">
              <input type="radio" name="text-size" value="standard" checked>
              <span class="option-label">Standard</span>
            </label>
            <label class="choice">
              <input type="radio" name="text-size" value="large">
              <span class="option-label">Large</span>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Line spacing</legend>
          <div class="choices">
            <label class="choice">
              <input type="radio" name="line-spacing" value="comfortable" checked>
              <span class="option-label">Comfortable</span>
            </label>
            <label class="choice">
              <input type="radio" name="line-spacing" value="compact">
              <span class="option-label">Compact</span>
            </label>
          </div>
        </fieldset>

        <div class="actions">
          <button class="reset" id="reset-preferences" type="button">
            <span class="reset-icon" aria-hidden="true">↺</span>
            <span class="reset-label">Reset to defaults</span>
          </button>
          <p class="status" id="reset-status" role="status"></p>
        </div>
      </form>
    </div>
  </main>

  <script>
    const preferences = document.querySelector("#preferences");
    const preview = document.querySelector("#recipe-preview");
    const status = document.querySelector("#reset-status");
    const sizeOptions = preferences.elements.namedItem("text-size");
    const spacingOptions = preferences.elements.namedItem("line-spacing");
    const storageKey = "recipe-reading-preferences";

    let saved = null;
    try {
      saved = JSON.parse(localStorage.getItem(storageKey));
    } catch {
      // Use the defaults if storage is unavailable or unreadable.
    }

    sizeOptions.value = saved?.size === "large" ? "large" : "standard";
    spacingOptions.value = saved?.spacing === "compact" ? "compact" : "comfortable";

    function applyPreferences(save = false) {
      const size = sizeOptions.value;
      const spacing = spacingOptions.value;

      preview.dataset.size = size;
      preview.dataset.spacing = spacing;

      if (save) {
        try {
          localStorage.setItem(storageKey, JSON.stringify({ size, spacing }));
        } catch {
          // The preview still updates when storage is unavailable.
        }
      }
    }

    applyPreferences();

    preferences.addEventListener("change", () => {
      status.textContent = "";
      applyPreferences(true);
    });

    preferences.addEventListener("submit", (event) => event.preventDefault());

    document.querySelector("#reset-preferences").addEventListener("click", () => {
      preferences.reset();
      applyPreferences(true);
      status.textContent = "Defaults restored.";
    });
  </script>
</body>
</html>
