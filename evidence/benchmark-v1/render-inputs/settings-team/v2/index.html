<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teammate roles | Northline Books</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Sans+Condensed:wght@600&amp;display=swap">
  <style>
    :root {
      color-scheme: dark;
      --ink: #14181B;
      --slate: #1E2427;
      --paper: #EEF0EC;
      --fog: #AAB7B5;
      --apricot: #FFAA72;
      --sea-glass: #83B5AA;
      --rule: rgb(238 240 236 / 17%);
      --control-border: rgb(238 240 236 / 35%);
      --body: "IBM Plex Sans", "Trebuchet MS", sans-serif;
      --display: "IBM Plex Sans Condensed", "Trebuchet MS", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--ink);
      color: var(--paper);
      font: 400 1rem/1.5 var(--body);
    }

    h1, h2, p {
      margin: 0;
    }

    button, input {
      font: inherit;
    }

    .shell {
      width: min(68rem, calc(100% - 3rem));
      margin-inline: auto;
    }

    .masthead {
      border-bottom: 1px solid var(--rule);
    }

    .masthead .shell {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 4.5rem;
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: .75rem;
      font: 600 1.5rem/1 var(--display);
      letter-spacing: -.02em;
    }

    .brand-mark {
      display: grid;
      flex: none;
      place-items: center;
      width: 2.125rem;
      height: 2.125rem;
      border: 1px solid var(--rule);
      border-radius: 3px;
      color: var(--apricot);
    }

    .context {
      color: var(--fog);
      font-size: .875rem;
    }

    main.shell {
      padding-block: 3.625rem 4rem;
    }

    .intro {
      margin-bottom: 2rem;
    }

    h1 {
      font: 600 clamp(2.875rem, 7vw, 5rem)/.98 var(--display);
      letter-spacing: -.035em;
    }

    .intro p {
      margin-top: .875rem;
      color: var(--fog);
    }

    .role-panel {
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
      overflow: hidden;
      border: 1px solid var(--rule);
      border-radius: 6px;
      background: var(--slate);
    }

    .identity {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.5rem;
      min-height: 17rem;
      overflow: hidden;
      padding: 2rem;
      background: var(--apricot);
      color: var(--ink);
    }

    .identity h2, .current {
      position: relative;
    }

    .identity h2 {
      font-size: 1.375rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .current-label {
      display: block;
      font-size: .875rem;
      font-weight: 500;
    }

    .current-value {
      display: block;
      width: fit-content;
      margin-top: .25rem;
      font: 600 clamp(2.75rem, 4.3vw, 3.75rem)/1 var(--display);
      letter-spacing: -.035em;
    }

    .bookplate {
      position: absolute;
      right: 1.25rem;
      bottom: 1rem;
      width: 46%;
      max-width: 13rem;
      height: auto;
      opacity: .82;
      pointer-events: none;
    }

    .role-controls {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      padding: 2rem 2.25rem;
    }

    fieldset {
      min-inline-size: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend {
      margin-bottom: .875rem;
      padding: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .75rem;
    }

    .option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      min-height: 3.5rem;
      padding: .75rem 1rem;
      border: 1px solid var(--control-border);
      border-radius: 4px;
      background: var(--ink);
      font-weight: 500;
      cursor: pointer;
    }

    .option:has(input:checked) {
      border-color: var(--apricot);
      background: rgb(255 170 114 / 10%);
    }

    .option input {
      flex: none;
      width: 1.125rem;
      height: 1.125rem;
      margin: 0;
      accent-color: var(--apricot);
      cursor: inherit;
    }

    .option:has(input:focus-visible), .save:focus-visible {
      outline: 2px solid var(--paper);
      outline-offset: 3px;
    }

    .option input:focus-visible {
      outline: none;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      margin-top: 1.5rem;
      padding-top: 1.125rem;
      border-top: 1px solid var(--rule);
    }

    .status {
      color: var(--fog);
      font-size: .875rem;
    }

    .status[data-state="saved"] {
      color: var(--sea-glass);
    }

    .save {
      flex: none;
      min-height: 2.875rem;
      padding: .625rem 1.125rem;
      border: 1px solid transparent;
      border-radius: 4px;
      background: var(--apricot);
      color: var(--ink);
      font-weight: 600;
      line-height: 1.25;
      cursor: pointer;
    }

    .save[aria-disabled="true"] {
      border-color: var(--rule);
      background: transparent;
      color: var(--fog);
      cursor: default;
    }

    @media (hover: hover) {
      .option:hover:not(:has(input:checked)) {
        border-color: var(--fog);
      }

      .save[aria-disabled="false"]:hover {
        background: color-mix(in srgb, var(--apricot) 76%, var(--paper));
      }
    }

    .teammate {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: .875rem;
      margin-top: 1.5rem;
      padding: .875rem 1.25rem;
      border-block: 1px solid var(--rule);
    }

    .initials {
      display: grid;
      place-items: center;
      width: 2.625rem;
      height: 2.625rem;
      border-radius: 4px;
      background: rgb(131 181 170 / 12%);
      color: var(--sea-glass);
      font-size: .875rem;
      font-weight: 600;
    }

    .teammate h2 {
      font-size: 1rem;
      font-weight: 600;
    }

    .teammate-role {
      padding: .25rem .75rem;
      border: 1px solid var(--rule);
      border-radius: 3px;
      color: var(--fog);
      font-size: .875rem;
      font-weight: 500;
    }

    @media (max-width: 44rem) {
      .shell {
        width: calc(100% - 2.5rem);
      }

      .masthead .shell {
        min-height: 3.75rem;
      }

      .wordmark {
        font-size: 1.375rem;
      }

      main.shell {
        padding-block: 2rem 2.5rem;
      }

      .intro {
        margin-bottom: 1.5rem;
      }

      .intro p {
        margin-top: .625rem;
      }

      .role-panel {
        grid-template-columns: minmax(0, 1fr);
      }

      .identity {
        min-height: 10.5rem;
        padding: 1.25rem;
      }

      .bookplate {
        right: .75rem;
        bottom: .625rem;
        width: 43%;
        max-width: 10rem;
      }

      .role-controls {
        padding: 1.25rem;
      }

      legend {
        margin-bottom: .75rem;
        font-size: 1.125rem;
      }

      .options {
        gap: .625rem;
      }

      .option {
        min-height: 3.125rem;
        padding: .625rem .75rem;
      }

      .actions {
        margin-top: 1rem;
        padding-top: 1rem;
      }

      .teammate {
        margin-top: 1rem;
        padding-inline: .25rem;
      }
    }

    @media (forced-colors: active) {
      .option:has(input:checked) {
        border-color: Highlight;
      }

      .save {
        border-color: ButtonText;
      }

      .save[aria-disabled="true"] {
        border-color: GrayText;
        color: GrayText;
      }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="shell">
      <span class="wordmark">
        <span class="brand-mark" aria-hidden="true">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"
               focusable="false">
            <path d="M2.5 20h19M4.5 20V8h4v12m2.5 0V4.5h4V20m1-10.2 3.1-.9 3 9.7-3.1 1z"/>
          </svg>
        </span>
        Northline Books
      </span>
      <span class="context">Settings</span>
    </div>
  </header>

  <main class="shell">
    <div class="intro">
      <h1>Teammate roles</h1>
      <p>Role changes take effect when you save.</p>
    </div>

    <section class="role-panel" aria-labelledby="ari-name">
      <div class="identity">
        <svg class="bookplate" viewBox="0 0 210 224" fill="none"
             aria-hidden="true" focusable="false">
          <path d="M12 200h190M29 207h166" stroke="currentColor" opacity=".55"/>
          <g stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
            <path d="M31 200V83h33v117M37 91h21m-21 6h21m-21 89h21m-21 6h21"/>
            <path d="m47.5 131 5 5-5 5-5-5z"/>
            <path d="M69 200V46h43v154z" fill="currentColor"/>
            <path d="m114 87 34-13 48 113-34 13z"/>
            <path d="m120 96 27-10m-24 17 27-10m6 90 27-10m-24 17 27-10"/>
            <path d="m145 131 5 12 9-4-5-12z"/>
          </g>
          <g stroke="var(--apricot)" stroke-width="1.25">
            <path d="M77 55h27m-27 6h27m-27 123h27m-27 6h27"/>
            <path d="m90.5 111 7 7-7 7-7-7zM90.5 134v20"/>
          </g>
        </svg>

        <h2 id="ari-name">Ari Bell</h2>
        <p class="current">
          <span class="current-label">Current role</span>
          <strong class="current-value" id="current-role">Viewer</strong>
        </p>
      </div>

      <div class="role-controls">
        <fieldset id="role-options">
          <legend>Change Ari’s role</legend>
          <div class="options">
            <label class="option">
              <span>Viewer</span>
              <input type="radio" name="ari-role" value="Viewer" checked>
            </label>
            <label class="option">
              <span>Editor</span>
              <input type="radio" name="ari-role" value="Editor">
            </label>
          </div>
        </fieldset>

        <div class="actions">
          <p class="status" id="save-status" role="status"></p>
          <button class="save" id="save-role" type="button" aria-disabled="true">
            Save role
          </button>
        </div>
      </div>
    </section>

    <section class="teammate" aria-labelledby="sam-name">
      <span class="initials" aria-hidden="true">SL</span>
      <h2 id="sam-name">Sam Lee</h2>
      <p class="teammate-role">Editor</p>
    </section>
  </main>

  <script>
    const roleOptions = document.getElementById("role-options");
    const radios = Array.from(roleOptions.querySelectorAll("input"));
    const currentRole = document.getElementById("current-role");
    const saveButton = document.getElementById("save-role");
    const status = document.getElementById("save-status");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const storageKey = "northline-books.ari-bell.role";

    let savedRole = "Viewer";

    try {
      const storedRole = localStorage.getItem(storageKey);
      if (radios.some((radio) => radio.value === storedRole)) {
        savedRole = storedRole;
      }
    } catch {
      // Use the initial role when browser storage is unavailable.
    }

    for (const radio of radios) {
      radio.checked = radio.value === savedRole;
    }
    currentRole.textContent = savedRole;

    function showStatus(message, state) {
      status.dataset.state = state;
      status.textContent = message;
    }

    roleOptions.addEventListener("change", (event) => {
      const hasChange = event.target.value !== savedRole;
      saveButton.setAttribute("aria-disabled", String(!hasChange));
      showStatus(hasChange ? "Unsaved change" : "", hasChange ? "pending" : "");
    });

    saveButton.addEventListener("click", () => {
      const selectedRole = radios.find((radio) => radio.checked)?.value;
      if (!selectedRole || selectedRole === savedRole) {
        return;
      }

      savedRole = selectedRole;
      try {
        localStorage.setItem(storageKey, savedRole);
      } catch {
        // Keep the saved role in memory for this page.
      }

      currentRole.textContent = savedRole;
      saveButton.setAttribute("aria-disabled", "true");
      showStatus(`Saved as ${savedRole}.`, "saved");

      if (!reducedMotion.matches) {
        currentRole.animate(
          [{ opacity: .35 }, { opacity: 1 }],
          { duration: 220, easing: "ease-out" }
        );
      }
    });
  </script>
</body>
</html>
