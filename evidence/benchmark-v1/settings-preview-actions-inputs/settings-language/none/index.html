<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Display settings | Visitor center</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --mist: #EDF2ED;
      --paper: #FAFCF8;
      --ink: #142F2A;
      --slate-green: #466058;
      --pine: #153D37;
      --sun: #F3DC9B;
      --line: color-mix(in srgb, var(--pine) 22%, var(--paper));
      --selected: color-mix(in srgb, var(--pine) 9%, var(--paper));
      --sign-text: color-mix(in srgb, var(--paper) 77%, var(--pine));
      --sign-line: color-mix(in srgb, var(--paper) 29%, var(--pine));
      --serif: "Instrument Serif", Georgia, serif;
      --sans: "Instrument Sans", system-ui, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--mist);
      color: var(--ink);
      font: 400 1rem / 1.5 var(--sans);
    }

    .wrap {
      width: min(70rem, calc(100% - 2.5rem));
      margin-inline: auto;
    }

    .masthead {
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      min-height: 4.5rem;
      align-items: center;
      gap: .75rem;
      font-weight: 700;
    }

    main {
      padding-block: clamp(2rem, 5vw, 4.25rem) 3rem;
    }

    .intro {
      margin-bottom: 2rem;
    }

    h1 {
      margin: 0;
      font: 400 clamp(3rem, 6vw, 5.25rem) / .99 var(--serif);
      letter-spacing: -.025em;
    }

    .intro p {
      max-width: 48ch;
      margin: .8rem 0 0;
      color: var(--slate-green);
      font-size: 1.0625rem;
    }

    .settings {
      display: grid;
      grid-template-columns: minmax(0, 1.14fr) minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--paper);
    }

    .preferences {
      display: grid;
      align-content: start;
      gap: 1.25rem;
      padding: 2rem clamp(1.25rem, 3vw, 2.375rem);
    }

    .preference + .preference,
    .reset-row {
      padding-top: 1.125rem;
      border-top: 1px solid var(--line);
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend {
      margin-bottom: .625rem;
      padding: 0;
      font-size: 1.125rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .625rem;
    }

    .choice {
      display: flex;
      min-height: 3.5rem;
      align-items: center;
      gap: .625rem;
      padding: .7rem .8rem;
      border: 1px solid var(--line);
      border-radius: .5rem;
      cursor: pointer;
      transition: background-color 150ms ease, border-color 150ms ease;
    }

    .date-choices .choice {
      min-height: 4.25rem;
    }

    .choice input {
      flex: 0 0 auto;
      width: 1.0625rem;
      height: 1.0625rem;
      margin: 0;
      accent-color: var(--pine);
      cursor: pointer;
    }

    .choice:has(input:checked) {
      border-color: var(--pine);
      background: var(--selected);
    }

    .choice:has(input:focus-visible),
    .reset:focus-visible {
      outline: 2px solid var(--pine);
      outline-offset: 3px;
    }

    .choice input:focus-visible {
      outline: none;
    }

    .choice-name,
    .choice-example {
      display: block;
      line-height: 1.3;
    }

    .choice-name {
      font-size: .9375rem;
      font-weight: 650;
    }

    .choice-example {
      margin-top: .19rem;
      color: var(--slate-green);
      font-size: .875rem;
    }

    .unit-mark {
      margin-inline-start: auto;
      color: var(--slate-green);
      font-weight: 600;
    }

    .reset {
      display: inline-flex;
      min-height: 2.75rem;
      align-items: center;
      gap: .5rem;
      padding: .45rem .75rem;
      border: 1px solid var(--line);
      border-radius: .5rem;
      background: transparent;
      color: var(--pine);
      font: 650 .9375rem / 1.25 var(--sans);
      cursor: pointer;
      transition: background-color 150ms ease;
    }

    @media (hover: hover) {
      .choice:hover {
        border-color: var(--slate-green);
      }

      .reset:hover {
        background: var(--selected);
      }
    }

    .preview {
      position: relative;
      min-width: 0;
      overflow: hidden;
      padding: 2rem clamp(1.25rem, 3vw, 2.375rem);
      background: var(--pine);
      color: var(--paper);
    }

    .preview-art {
      position: absolute;
      right: -.65rem;
      bottom: 0;
      width: min(106%, 34rem);
      height: auto;
      pointer-events: none;
    }

    .preview-content {
      position: relative;
    }

    .preview h2 {
      display: flex;
      align-items: center;
      gap: .9rem;
      margin: 0;
      font-size: 1rem;
      font-weight: 650;
    }

    .preview h2::after {
      height: 1px;
      flex: 1;
      background: var(--sign-line);
      content: "";
    }

    .readouts {
      margin: 1.9rem 0 0;
    }

    .readout dt {
      color: var(--sign-text);
      font-size: .875rem;
      font-weight: 600;
    }

    .readout dd {
      margin: .25rem 0 0;
      font: 400 clamp(2.25rem, 3.4vw, 3.125rem) / 1.04 var(--serif);
      letter-spacing: -.018em;
    }

    .temperature-readout {
      max-width: 20rem;
      margin-top: 1.4rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--sign-line);
    }

    .temperature-readout dd {
      color: var(--sun);
      font-size: clamp(3.25rem, 5.2vw, 4.5rem);
      line-height: 1;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 48rem) {
      .brand {
        min-height: 3.75rem;
      }

      main {
        padding-block: 1.875rem 2rem;
      }

      .intro {
        margin-bottom: 1.375rem;
      }

      .intro p {
        margin-top: .625rem;
        font-size: 1rem;
      }

      .settings {
        grid-template-columns: minmax(0, 1fr);
      }

      .preferences {
        gap: .875rem;
        padding: 1rem;
      }

      .preference + .preference,
      .reset-row {
        padding-top: .875rem;
      }

      legend {
        margin-bottom: .5rem;
        font-size: 1.0625rem;
      }

      .choices {
        gap: .5rem;
      }

      .choice {
        min-height: 3rem;
        gap: .4375rem;
        padding: .5rem;
      }

      .date-choices .choice {
        min-height: 3.75rem;
      }

      .choice input {
        width: .9375rem;
        height: .9375rem;
      }

      .choice-name {
        font-size: .875rem;
      }

      .choice-example {
        font-size: .8125rem;
      }

      .unit-mark {
        font-size: .875rem;
      }

      .preview {
        padding: 1.125rem 1.25rem 1.25rem;
      }

      .preview-art {
        width: min(100%, 27rem);
      }

      .readouts {
        margin-top: 1rem;
      }

      .temperature-readout {
        max-width: 63%;
        margin-top: .85rem;
        padding-top: .75rem;
      }
    }

    @media (max-width: 22rem) {
      .choices {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .choice,
      .reset {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="brand wrap">
      <svg width="34" height="34" viewBox="0 0 36 36" aria-hidden="true" focusable="false">
        <rect width="36" height="36" rx="9" fill="var(--pine)"/>
        <circle cx="18" cy="18" r="10.5" fill="none" stroke="var(--paper)" stroke-opacity=".55"/>
        <path d="M23.5 12.5 20.7 20.7 12.5 23.5l2.8-8.2z" fill="var(--sun)"/>
        <path d="M18 5v3m0 20v3M5 18h3m20 0h3" stroke="var(--paper)" stroke-opacity=".55"/>
      </svg>
      <span>Visitor center</span>
    </div>
  </header>

  <main class="wrap">
    <div class="intro">
      <h1>Display settings</h1>
      <p>Choose how dates and temperatures appear in your account.</p>
    </div>

    <div class="settings">
      <form class="preferences" id="preferences" aria-label="Display preferences" autocomplete="off">
        <div class="preference">
          <fieldset>
            <legend>Date format</legend>
            <div class="choices date-choices">
              <label class="choice">
                <input type="radio" name="date-format" value="month-first" checked>
                <span>
                  <span class="choice-name">Month first</span>
                  <span class="choice-example">November 21, 2026</span>
                </span>
              </label>
              <label class="choice">
                <input type="radio" name="date-format" value="day-first">
                <span>
                  <span class="choice-name">Day first</span>
                  <span class="choice-example">21 November 2026</span>
                </span>
              </label>
            </div>
          </fieldset>
        </div>

        <div class="preference">
          <fieldset>
            <legend>Temperature unit</legend>
            <div class="choices">
              <label class="choice">
                <input type="radio" name="temperature-unit" value="celsius">
                <span class="choice-name">Celsius</span>
                <span class="unit-mark" aria-hidden="true">°C</span>
              </label>
              <label class="choice">
                <input type="radio" name="temperature-unit" value="fahrenheit" checked>
                <span class="choice-name">Fahrenheit</span>
                <span class="unit-mark" aria-hidden="true">°F</span>
              </label>
            </div>
          </fieldset>
        </div>

        <div class="reset-row">
          <button class="reset" id="reset-preferences" type="button">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M4 11a8.2 8.2 0 1 1 1.7 6.1M4 5.5V11h5.5"/>
            </svg>
            Reset to defaults
          </button>
        </div>
      </form>

      <section class="preview" aria-labelledby="preview-title">
        <svg class="preview-art" viewBox="0 0 520 340" fill="none" aria-hidden="true" focusable="false">
          <g stroke="var(--paper)" stroke-opacity=".24">
            <path d="M75 366c7-48 37-85 85-100 36-11 57-24 76-61 25-49 57-86 125-110 64-22 131-1 177 40"/>
            <path d="M104 366c5-34 34-66 72-78 40-12 63-30 83-66 25-45 55-76 111-95 58-19 115-1 167 39"/>
            <path d="M136 366c10-26 26-42 58-53 44-15 65-36 85-68 24-40 54-68 103-86 53-19 108 1 153 39"/>
            <path d="M170 366c7-14 19-22 40-30 48-18 71-40 91-71 22-34 42-56 92-74 47-17 105 3 146 43"/>
            <path d="M204 366c51-18 85-43 117-79 26-30 44-51 78-62 44-15 93-3 133 33"/>
            <path d="M258 366c33-16 63-36 91-66 26-28 53-46 90-49 38-3 69 11 96 36"/>
            <path d="M308 367c27-15 52-37 73-55 22-20 39-31 66-33 33-2 62 7 90 35"/>
            <path d="M357 367c24-16 37-33 58-47 31-19 74-18 104 4"/>
          </g>
          <g transform="translate(420 198)" stroke="var(--sun)">
            <circle r="31" fill="var(--pine)" stroke-opacity=".68"/>
            <circle r="23" stroke-opacity=".25"/>
            <path d="M0-31v5m0 52v5M-31 0h5m52 0h5" stroke-opacity=".7"/>
            <g transform="rotate(33)">
              <path d="M0-17 5.5 0 0 17-5.5 0z" stroke-linejoin="round"/>
              <path d="M0-17 5.5 0h-11z" fill="var(--sun)" stroke-linejoin="round"/>
            </g>
          </g>
        </svg>

        <div class="preview-content">
          <h2 id="preview-title">Live preview</h2>
          <dl class="readouts">
            <div class="readout">
              <dt>Date</dt>
              <dd><time id="preview-date" datetime="2026-11-21">November 21, 2026</time></dd>
            </div>
            <div class="readout temperature-readout">
              <dt>Temperature</dt>
              <dd id="preview-temperature">68°F</dd>
            </div>
          </dl>
        </div>
      </section>
    </div>

    <p class="visually-hidden" id="preview-status" role="status"></p>
  </main>

  <script>
    const dateFormats = {
      "month-first": "November 21, 2026",
      "day-first": "21 November 2026"
    };

    const temperatures = {
      celsius: { display: "20°C", spoken: "20 degrees Celsius" },
      fahrenheit: { display: "68°F", spoken: "68 degrees Fahrenheit" }
    };

    const form = document.querySelector("#preferences");
    const dateOptions = form.elements.namedItem("date-format");
    const temperatureOptions = form.elements.namedItem("temperature-unit");
    const datePreview = document.querySelector("#preview-date");
    const temperaturePreview = document.querySelector("#preview-temperature");
    const status = document.querySelector("#preview-status");
    const resetButton = document.querySelector("#reset-preferences");

    function updatePreview() {
      const date = dateFormats[dateOptions.value];
      const temperature = temperatures[temperatureOptions.value];

      datePreview.textContent = date;
      temperaturePreview.textContent = temperature.display;

      return `${date} and ${temperature.spoken}`;
    }

    form.addEventListener("submit", (event) => event.preventDefault());

    form.addEventListener("change", () => {
      status.textContent = `Preview shows ${updatePreview()}.`;
    });

    resetButton.addEventListener("click", () => {
      form.reset();
      status.textContent = `Defaults restored. Preview shows ${updatePreview()}.`;
    });

    updatePreview();
  </script>
</body>
</html>
