<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Second Spin | Bike tune-ups</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
  <style>
    :root {
      --pine: #16493F;
      --paper: #F6F4EB;
      --ink: #172B27;
      --ivory: #FFFEF8;
      --mint: #DCEAE0;
      --gold: #F2CD63;
      --rule: rgb(22 73 63 / 24%);
      --display: "Barlow Condensed", "Liberation Sans Narrow", sans-serif;
      --body: "Instrument Sans", sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--body);
      line-height: 1.45;
    }

    h1, h2, h3, p, dl, dd {
      margin: 0;
    }

    svg {
      display: block;
    }

    .frame {
      width: min(80rem, calc(100% - 5rem));
      margin-inline: auto;
    }

    .site-header {
      border-bottom: 1px solid var(--rule);
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 84px;
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 10px;
      font: 800 2rem/1 var(--display);
    }

    .wordmark svg {
      flex: none;
      width: 40px;
      height: 40px;
    }

    .booking-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 44px;
      padding: 9px 15px;
      border-radius: 4px;
      background: var(--pine);
      color: var(--ivory);
      font-size: 0.9375rem;
      font-weight: 700;
      text-decoration: none;
    }

    .booking-link svg {
      flex: none;
      color: var(--gold);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.9fr);
      gap: 28px;
      padding-block: 36px 48px;
    }

    .poster {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 4px;
      background: var(--pine);
      color: var(--ivory);
    }

    .poster-print {
      position: relative;
      display: flex;
      flex: 1;
      min-height: 450px;
      overflow: hidden;
    }

    .poster-copy {
      position: relative;
      z-index: 1;
      padding: clamp(1.75rem, 3.6vw, 3.25rem);
    }

    .shop-type {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--mint);
      font-weight: 600;
    }

    .shop-type::before {
      width: 24px;
      height: 2px;
      background: var(--gold);
      content: "";
    }

    h1 {
      margin-top: 21px;
      font: 800 clamp(4.75rem, 8.3vw, 7.5rem)/0.84 var(--display);
      letter-spacing: -0.027em;
    }

    .wheel-art {
      position: absolute;
      right: -65px;
      bottom: -17px;
      width: min(62%, 480px);
      height: auto;
      pointer-events: none;
    }

    .shop-details {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 21px clamp(1.75rem, 3.6vw, 3.25rem);
      background: var(--gold);
      color: var(--ink);
    }

    .address {
      font: 700 clamp(1.875rem, 3vw, 2.5rem)/1 var(--display);
    }

    .booking-days {
      margin-top: 5px;
      font-size: 0.9375rem;
      font-weight: 500;
    }

    .offer-price {
      flex: none;
      padding-inline-start: 24px;
      border-inline-start: 1px solid rgb(23 43 39 / 34%);
      font: 800 clamp(3.5rem, 5.25vw, 4.625rem)/0.87 var(--display);
    }

    .booking {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      padding: clamp(1.75rem, 3.1vw, 2.75rem);
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: var(--ivory);
      scroll-margin-top: 1rem;
    }

    .booking h2 {
      font: 800 clamp(2.875rem, 4.2vw, 3.75rem)/0.97 var(--display);
      letter-spacing: -0.018em;
    }

    .day-picker {
      min-inline-size: 0;
      margin: 24px 0 0;
      padding: 0;
      border: 0;
    }

    .day-options {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .day {
      position: relative;
    }

    .day label {
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 6px;
      min-height: 62px;
      padding: 7px 3px;
      border: 1px solid rgb(22 73 63 / 60%);
      border-radius: 4px;
      font-size: 0.9375rem;
      font-weight: 700;
      cursor: pointer;
    }

    .day label::after {
      width: 12px;
      height: 12px;
      border: 1.5px solid var(--pine);
      border-radius: 50%;
      content: "";
    }

    .day input:checked + label {
      border-color: var(--pine);
      background: var(--pine);
      color: var(--ivory);
    }

    .day input:checked + label::after {
      border: 3px solid var(--gold);
      background: var(--pine);
    }

    .booking-link:focus-visible,
    .booking:focus-visible,
    .day input:focus-visible + label {
      outline: 3px solid var(--pine);
      outline-offset: 3px;
    }

    .ticket {
      --ticket-padding: 23px;
      margin-top: 31px;
      padding: 20px var(--ticket-padding) 14px;
      overflow: hidden;
      border-radius: 4px;
      background: var(--mint);
    }

    .ticket h3 {
      margin-bottom: 11px;
      font: 700 2rem/1 var(--display);
    }

    .ticket-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-block: 4px;
      font-size: 0.9375rem;
    }

    .ticket-row dd {
      font-weight: 700;
      text-align: right;
    }

    .ticket .price-row {
      position: relative;
      align-items: center;
      margin: 13px calc(-1 * var(--ticket-padding)) 0;
      padding: 10px var(--ticket-padding) 0;
      border-top: 1px dashed rgb(22 73 63 / 54%);
      font-weight: 700;
    }

    .price-row::before,
    .price-row::after {
      position: absolute;
      top: -7px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--ivory);
      content: "";
    }

    .price-row::before {
      left: -6px;
    }

    .price-row::after {
      right: -6px;
    }

    .price-row dd {
      font: 800 2.75rem/1 var(--display);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    @media (hover: hover) {
      .booking-link:hover {
        background: var(--ink);
      }

      .day input:not(:checked) + label:hover {
        background: var(--mint);
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      html {
        scroll-behavior: smooth;
      }

      .booking-link,
      .day label {
        transition: background-color 150ms ease, color 150ms ease;
      }
    }

    @media (forced-colors: active) {
      .day input:checked + label {
        border-color: Highlight;
      }

      .day input:checked + label::after {
        border-color: Highlight;
        forced-color-adjust: none;
      }
    }

    @media (max-width: 59rem) {
      .frame {
        width: min(41rem, calc(100% - 2rem));
      }

      .layout {
        grid-template-columns: minmax(0, 1fr);
        gap: 18px;
        padding-block: 22px 32px;
      }

      .poster-print {
        min-height: 340px;
      }

      .wheel-art {
        right: -44px;
      }
    }

    @media (max-width: 35rem) {
      .header-content {
        min-height: 68px;
      }

      .wordmark {
        gap: 8px;
        font-size: 1.6875rem;
      }

      .wordmark svg {
        width: 35px;
        height: 35px;
      }

      .booking-link {
        gap: 7px;
        padding-inline: 11px;
        font-size: 0.875rem;
      }

      .layout {
        gap: 15px;
        padding-top: 16px;
      }

      .poster-print {
        min-height: 231px;
      }

      .poster-copy {
        padding: 22px 20px;
      }

      .shop-type {
        font-size: 0.875rem;
      }

      h1 {
        margin-top: 17px;
        font-size: clamp(3.5rem, 16.7vw, 5rem);
      }

      .wheel-art {
        right: -55px;
        bottom: -12px;
        width: min(65%, 305px);
      }

      .shop-details {
        gap: 12px;
        padding: 14px 20px 15px;
      }

      .booking-days {
        font-size: 0.875rem;
      }

      .offer-price {
        padding-inline-start: 14px;
        font-size: 3.375rem;
      }

      .booking {
        padding: 20px 18px 18px;
      }

      .day-picker {
        margin-top: 17px;
      }

      .day-options {
        gap: 6px;
      }

      .day label {
        min-height: 53px;
      }

      .ticket {
        --ticket-padding: 16px;
        margin-top: 20px;
        padding-top: 15px;
      }

      .ticket h3 {
        font-size: 1.75rem;
      }

      .price-row dd {
        font-size: 2.375rem;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="frame header-content">
      <div class="wordmark">
        <svg viewBox="0 0 40 40" aria-hidden="true" focusable="false">
          <rect width="40" height="40" rx="4" fill="var(--pine)"/>
          <g fill="none" stroke="var(--ivory)" stroke-width="1.5">
            <circle cx="20" cy="20" r="12"/>
            <circle cx="20" cy="20" r="9"/>
            <path d="M20 11v5m9 4h-5m-4 9v-5m-9-4h5"/>
          </g>
          <circle cx="20" cy="20" r="2.8" fill="var(--gold)"/>
        </svg>
        <span>Second Spin</span>
      </div>

      <a class="booking-link" href="#booking">
        Book a tune-up
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M8 2.5v10m-4-4 4 4 4-4"/>
        </svg>
      </a>
    </div>
  </header>

  <main class="frame layout">
    <section class="poster" aria-labelledby="service-title">
      <div class="poster-print">
        <div class="poster-copy">
          <p class="shop-type">Bike repair</p>
          <h1 id="service-title">48-hour<br>tune-ups</h1>
        </div>

        <svg class="wheel-art" viewBox="0 0 456 412" fill="none"
             aria-hidden="true" focusable="false">
          <g transform="translate(266 209)">
            <g stroke="var(--mint)" stroke-opacity=".42">
              <circle r="176" stroke-dasharray="2 6"/>
              <path d="M-186 0h19m334 0h19M0-186v19m0 334v19"/>
            </g>

            <circle r="156" stroke="var(--mint)" stroke-opacity=".7" stroke-width="1.5"/>
            <circle r="151" stroke="var(--mint)" stroke-width="7"/>
            <circle r="151" stroke="var(--pine)" stroke-width="2.6" stroke-dasharray="2 5"/>
            <circle r="142" stroke="var(--mint)" stroke-width="2.4"/>
            <circle r="137" stroke="var(--mint)" stroke-opacity=".6"/>
            <path d="M-108-106a151 151 0 0 1 27-22"
                  stroke="var(--gold)" stroke-width="5" stroke-linecap="round"/>

            <g stroke="var(--mint)" stroke-opacity=".66" stroke-width="1.2">
              <path id="spoke-pair" d="M0-137 17-16M35.5-132.3-11-20"/>
              <use href="#spoke-pair" transform="rotate(30)"/>
              <use href="#spoke-pair" transform="rotate(60)"/>
              <use href="#spoke-pair" transform="rotate(90)"/>
              <use href="#spoke-pair" transform="rotate(120)"/>
              <use href="#spoke-pair" transform="rotate(150)"/>
              <use href="#spoke-pair" transform="rotate(180)"/>
              <use href="#spoke-pair" transform="rotate(210)"/>
              <use href="#spoke-pair" transform="rotate(240)"/>
              <use href="#spoke-pair" transform="rotate(270)"/>
              <use href="#spoke-pair" transform="rotate(300)"/>
              <use href="#spoke-pair" transform="rotate(330)"/>
            </g>

            <circle r="23" fill="var(--pine)" stroke="var(--mint)" stroke-width="2"/>
            <circle r="14" stroke="var(--gold)" stroke-width="2"/>
            <path d="M0-9 7.8-4.5v9L0 9l-7.8-4.5v-9Z" fill="var(--gold)"/>
            <circle r="3.5" fill="var(--pine)"/>
          </g>

          <g transform="translate(185 300) rotate(48)"
             stroke="var(--gold)" stroke-linecap="round" stroke-linejoin="round">
            <path d="M-11 76c0 7 5 13 11 13s11-6 11-13l-2-97
                     c9-4 15-13 15-23 0-7-4-14-10-18v16L0-38l-14-8v-16
                     c-6 4-10 11-10 18 0 10 6 19 15 23Z"
                  fill="var(--pine)" stroke-width="3"/>
            <path d="M0-12v72" stroke-opacity=".6" stroke-width="2"/>
            <circle cy="75" r="4.5" stroke-width="2"/>
          </g>
        </svg>
      </div>

      <div class="shop-details">
        <div>
          <p class="address">41 Elm Street</p>
          <p class="booking-days">Bookings Tuesday to Saturday</p>
        </div>
        <p class="offer-price">$85</p>
      </div>
    </section>

    <section class="booking" id="booking" tabindex="-1" aria-labelledby="booking-title">
      <h2 id="booking-title">Pick a day</h2>

      <fieldset class="day-picker" id="booking-days">
        <legend class="visually-hidden">Booking day</legend>
        <div class="day-options">
          <div class="day">
            <input class="visually-hidden" type="radio" name="day" id="tuesday" value="Tuesday">
            <label for="tuesday">
              <span aria-hidden="true">Tue</span>
              <span class="visually-hidden">Tuesday</span>
            </label>
          </div>
          <div class="day">
            <input class="visually-hidden" type="radio" name="day" id="wednesday" value="Wednesday">
            <label for="wednesday">
              <span aria-hidden="true">Wed</span>
              <span class="visually-hidden">Wednesday</span>
            </label>
          </div>
          <div class="day">
            <input class="visually-hidden" type="radio" name="day" id="thursday" value="Thursday">
            <label for="thursday">
              <span aria-hidden="true">Thu</span>
              <span class="visually-hidden">Thursday</span>
            </label>
          </div>
          <div class="day">
            <input class="visually-hidden" type="radio" name="day" id="friday" value="Friday">
            <label for="friday">
              <span aria-hidden="true">Fri</span>
              <span class="visually-hidden">Friday</span>
            </label>
          </div>
          <div class="day">
            <input class="visually-hidden" type="radio" name="day" id="saturday" value="Saturday">
            <label for="saturday">
              <span aria-hidden="true">Sat</span>
              <span class="visually-hidden">Saturday</span>
            </label>
          </div>
        </div>
      </fieldset>

      <section class="ticket" aria-labelledby="summary-title">
        <h3 id="summary-title">Booking summary</h3>
        <dl>
          <div class="ticket-row">
            <dt>Day</dt>
            <dd><span id="selected-day" role="status">Choose a day</span></dd>
          </div>
          <div class="ticket-row">
            <dt>Service</dt>
            <dd>48-hour tune-up</dd>
          </div>
          <div class="ticket-row">
            <dt>Location</dt>
            <dd>41 Elm Street</dd>
          </div>
          <div class="ticket-row price-row">
            <dt>Price</dt>
            <dd>$85</dd>
          </div>
        </dl>
      </section>
    </section>
  </main>

  <script>
    const dayPicker = document.getElementById("booking-days");
    const selectedDay = document.getElementById("selected-day");

    function updateBookingSummary() {
      const choice = dayPicker.querySelector("input:checked");
      selectedDay.textContent = choice ? choice.value : "Choose a day";
    }

    dayPicker.addEventListener("change", updateBookingSummary);
    window.addEventListener("pageshow", updateBookingSummary);
  </script>
</body>
</html>
