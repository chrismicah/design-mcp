<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinder Supply | Alto Carmo</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces%3Awght%40600&amp;family=Instrument+Sans&amp;display=swap"><style>:root{--ink:#2a1610;--paper:#f3ebe0;--accent:#6b2148;--display:'Fraunces',Georgia,serif;--body:'Instrument Sans',system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 var(--body)}main{width:min(1120px,92%);margin:auto;padding-bottom:48px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0;border-bottom:1px solid}header strong{font:600 26px var(--display)}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:var(--display);line-height:1.06}button,summary,a{font:inherit;color:inherit;cursor:pointer}button,summary{min-height:44px}button{border:0;background:var(--accent);color:var(--paper);padding:10px 18px;font-weight:650}a{text-underline-offset:5px}:focus-visible{outline:2px solid var(--ink);outline-offset:3px;box-shadow:0 0 0 3px var(--paper)}[hidden]{display:none!important}small{font-size:14px}dialog{width:min(480px,90vw);border:1px solid;color:var(--ink);background:var(--paper);padding:28px}dialog p{margin:18px 0}dialog::backdrop{background:#18191aca}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

header strong{letter-spacing:-.05em}.spread{display:grid;grid-template-columns:7fr 5fr;align-items:center;margin:64px 0 24px}.specimen{min-height:490px;margin-left:8%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(162deg,#dfcbb1 65%,#c7ad8c 65%)}.sack{width:58%;aspect-ratio:.77;transform:rotate(7deg) translateX(12%);background:linear-gradient(100deg,#b59974,#dbc5a3 20%,#d5bb95 82%,#b49b7e 83%);border-block:8px double #ad9477;display:grid;align-content:center;box-shadow:9px 13px 15px #47312230}.sack span{background:var(--accent);color:var(--paper);padding:18% 12%;font:italic 34px/.96 var(--display)}.facts{position:relative;padding-left:8%}h1{font-size:clamp(54px,6.2vw,78px);font-weight:600;letter-spacing:-.05em;margin:12px 0 24px -16%;background:var(--paper);width:fit-content;padding:4px 12px}.facts dl{margin:0}.facts dl div{display:flex;justify-content:space-between;border-top:1px solid #baaa98;padding:9px 0;gap:12px}.facts dd{margin:0;font-weight:600}.buy{width:fit-content;margin:-44px 4% 0 auto;position:relative;background:var(--paper);padding:12px;border-radius:32px}.buy button{border-radius:30px}.tick{animation:settle .24s ease-out}@keyframes settle{from{transform:translateY(-4px)}}#notice{display:block;text-align:right;margin-top:8px}
@media(max-width:690px){header{padding:14px 0}.spread{display:block;margin:16px 0}.specimen{margin:0;min-height:0;height:62svh;max-height:490px}.sack{width:min(54%,200px)}.facts{padding:20px 0 0}.facts h1{margin:4px 0 16px;padding:0}.buy{position:sticky;bottom:0;margin:0;padding:8px 0;width:100%;border-radius:0}.buy button{width:100%}}@media(max-width:690px){.buy{padding-bottom:max(12px,env(safe-area-inset-bottom));}}</style><body><main><header><strong>Cinder Supply</strong><span id="count">Bag · 0</span></header><article class="spread"><div class="specimen" aria-hidden="true"><div class="sack"><span>Cinder<br>Supply</span></div></div><section class="facts"><small>Small-batch coffee</small><h1>Alto Carmo</h1><dl><div><dt>Weight</dt><dd>250 g</dd></div><div><dt>Notes</dt><dd>Cacao and plum</dd></div><div><dt>Roasted</dt><dd>November 19</dd></div></dl></section></article><div class="buy"><button id="add">Add Alto Carmo, 250 g — $19</button></div><output id="notice" role="status"></output></main><script>let bags=0;
document.querySelector('#add').onclick=event=>{
 bags++;
 document.querySelector('#count').textContent='Bag · '+bags;
 document.querySelector('#notice').textContent='In your bag: '+bags+' × Alto Carmo · $'+bags*19;
 const button=event.currentTarget;
 button.classList.remove('tick');void button.offsetWidth;button.classList.add('tick');
};</script></body></html>
