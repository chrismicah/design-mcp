<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spur | Union departure</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow%3Awght%40700&amp;family=Atkinson+Hyperlegible&amp;display=swap"><style>:root{--ink:#111111;--paper:#f7f5ef;--accent:#ffcc00;--display:'Archivo Narrow',system-ui,sans-serif;--body:'Atkinson Hyperlegible',system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 var(--body)}main{width:min(1120px,92%);margin:auto;padding-bottom:48px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0;border-bottom:1px solid}header strong{font:600 26px var(--display)}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:var(--display);line-height:1.06}button,summary,a{font:inherit;color:inherit;cursor:pointer}button,summary{min-height:44px}button{border:0;background:var(--accent);color:var(--paper);padding:10px 18px;font-weight:650}a{text-underline-offset:5px}:focus-visible{outline:2px solid var(--ink);outline-offset:3px;box-shadow:0 0 0 3px var(--paper)}[hidden]{display:none!important}small{font-size:14px}dialog{width:min(480px,90vw);border:1px solid;color:var(--ink);background:var(--paper);padding:28px}dialog p{margin:18px 0}dialog::backdrop{background:#18191aca}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

main{width:min(100%,420px)}header{margin:0 16px}header strong{font-style:italic;font-size:30px}.sign{min-height:36svh;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;justify-content:space-between;padding:24px;margin-top:16px}.time{font:700 clamp(60px,17vw,82px)/1 var(--display);letter-spacing:-.035em}.destination{display:flex;align-items:end;justify-content:space-between}.destination h1{font-size:44px}.platform{background:var(--accent);color:var(--ink);padding:6px 12px;font-weight:700}.lower{padding:32px 16px}.lower button{width:100%;font-weight:bold;color:var(--ink);padding:16px}.credential{border:2px solid;padding:20px;margin-top:12px;text-align:center;animation:slide .28s ease-out}.credential b{display:block;font:700 34px var(--display)}@keyframes slide{from{opacity:0;transform:translateY(12px)}}details{border-bottom:1px solid;padding:8px 0}details:first-of-type{margin-top:24px}summary{padding:8px 0}</style><body><main><header><strong>Spur</strong><small>Commuter rail</small></header><section class="sign"><div><small>Departure</small><p class="time">08:42</p></div><div class="destination"><h1>Union</h1><span class="platform">Platform 3</span></div></section><div class="lower"><button aria-expanded="false" aria-controls="code">Show ticket TKT-0837</button><div><div class="credential" id="code" hidden><small>Spur commuter rail</small><b>TKT-0837</b><span>08:42 · Union</span></div></div><details><summary>Alternative departure</summary><p>08:58 · Union</p></details><details><summary>Weekly pass</summary><p>Commuter rail travel for the week.</p></details></div></main><script>const button=document.querySelector('button'),code=document.querySelector('#code');
