<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field Office | Mill Race</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif%3Awght%40400&amp;family=Archivo&amp;display=swap"><style>:root{--ink:#22261F;--paper:#E9EFF0;--accent:#465733;--display:'Instrument Serif',Georgia,serif;--body:'Archivo',system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 var(--body)}main{width:min(1120px,92%);margin:auto;padding-bottom:48px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0;border-bottom:1px solid}header strong{font:600 26px var(--display)}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:var(--display);line-height:1.06}button,summary,a{font:inherit;color:inherit;cursor:pointer}button,summary{min-height:44px}button{border:0;background:var(--accent);color:var(--paper);padding:10px 18px;font-weight:650}a{text-underline-offset:5px}:focus-visible{outline:2px solid var(--ink);outline-offset:3px;box-shadow:0 0 0 3px var(--paper)}[hidden]{display:none!important}small{font-size:14px}dialog{width:min(480px,90vw);border:1px solid;color:var(--ink);background:var(--paper);padding:28px}dialog p{margin:18px 0}dialog::backdrop{background:#18191aca}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

troke="#b7c9c5" stroke-width="98"/><path d="M-20 201Q123 251 253 169T542 89 827 -20" stroke="#414c3b" stroke-width="8" fill="none"/><path d="M-20 201Q123 251 253 169T542 89 827 -20" stroke="#e9eff0" stroke-width="6" fill="none"/></svg></div><section class="lead"><h1>Mill<br>Race</h1><div><p>Restored riverside park</p><p>2.4 acres · 2025</p><a href="#study">Open the Mill Race case study</a></div></section><section class="projects" aria-label="Other projects"><p>Rain Court</p><p>Slope Garden</p></section><footer>Contact · <a href="mailto:hello@fieldoffice.example">hello@fieldoffice.example</a></footer></main><dialog id="study"><h2>Mill Race</h2><p>A 2.4-acre riverside park restored by Field Office.</p><dl><dt>Project</dt><dd>Park restoration</dd><dt>Site</dt><dd>Riverside</dd><dt>Completed</dt><dd>2025</dd></dl><form method="dialog"><button>Close case study</button></form></dialog><script>document.querySelector('.lead a').onclick=event=>{event.preventDefault();document.querySelector('dialog').showModal()};</script></body></html>
