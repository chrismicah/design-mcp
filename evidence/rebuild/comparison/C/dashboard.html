<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Linehaul | Morning shift</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body),system-ui,sans-serif;font-variant-numeric:tabular-nums}h1,h2,p,dl,dd{margin:0}h1,h2{line-height:1.04}button{cursor:pointer;font:inherit;font-weight:650;min-height:48px;background:var(--accent);color:var(--on);border:0;padding:12px 20px}button:hover{filter:brightness(.94)}:focus-visible{outline:2px solid var(--ink);outline-offset:4px;box-shadow:0 0 0 4px var(--paper)}.cap{font-size:.75rem;letter-spacing:.1em;font-weight:700;text-transform:uppercase}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
body{--paper:#14181b;--ink:#eef0ec;--accent:#ffaa72;--on:#14181b;--body:"IBM Plex Sans"}header,main{width:min(1100px,92%);margin:auto}header{padding:22px 0;border-bottom:1px solid #545a5c}.logo{font-size:1.45rem;font-weight:700}main{padding:36px 0}h1,h2,.delta,.due{font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;letter-spacing:-.035em}h1{font-size:clamp(42px,5vw,68px);margin-bottom:28px}.alert{background:#302822;border-left:5px solid var(--accent);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}.delta{font-size:44px;color:var(--accent);line-height:1.1}.alert h2{font-size:27px;margin-top:6px}.layout{display:grid;grid-template-columns:2fr 1fr;gap:48px;margin-top:40px}table{border-collapse:collapse;width:100%;text-align:left}caption{text-align:left;font-weight:650;font-size:22px;padding-bottom:16px}td,th{border-bottom:1px solid #454b4d;padding:9px 5px}th{color:#c3c9c9;font-size:.8rem}.exception{color:#ffc69f}aside{border-left:1px solid #545a5c;padding-left:28px}.due{display:block;font-size:38px}output{display:block;margin-top:8px;color:#c3c9c9}@media(max-width:690px){main{padding:22px 0}.alert{flex-wrap:wrap;padding:16px}.alert button{width:100%}.layout{display:flex;flex-direction:column-reverse;gap:24px;margin-top:24px}aside{padding:0 0 14px;border-left:0;border-bottom:1px solid #545a5c}.due{display:inline;font-size:25px;margin-right:8px}}
</style></head><body><header class="between"><b class="logo">Linehaul</b><span class="cap">Dispatch</span></header><main><h1>Morning shift</h1><section class="alert"><div><span class="cap">Delay · 2 / 5</span><h2>LS-057 · Bay 4</h2></div><strong class="delta">+19 min</strong><button aria-controls="queue" aria-pressed="false">Focus LS-057 at Bay 4</button></section><div class="layout"><section><table id="queue"><caption>Load queue</caption><thead><tr><th>Load</th><th>Bay</th><th>Status</th></tr></thead><tbody><tr><td>LS-056</td><td>1</td><td>Ready</td></tr><tr class="exception"><td>LS-057</td><td>4</td><td>Delayed 19 min</td></tr><tr><td>LS-058</td><td>2</td><td>Loading</td></tr><tr><td>LS-060</td><td>3</td><td>Loading</td></tr><tr><td>LS-061</td><td>—</td><td>Due in 9 min</td></tr></tbody></table><output aria-live="polite"></output></section><aside><span class="cap">Due next</span><p><strong class="due">LS-061</strong> In 9 minutes</p></aside></div></main>
<script>
const toggle = document.querySelector('button');
toggle.onclick = () => {
  const focused = toggle.getAttribute('aria-pressed') === 'false';
  for (const row of document.querySelectorAll('tbody tr:not(.exception)')) row.hidden = focused;
  toggle.setAttribute('aria-pressed', String(focused));
  toggle.textContent = focused ? 'Show all loads' : 'Focus LS-057 at Bay 4';
  document.querySelector('output').textContent = focused ? 'Showing the delayed load.' : 'Showing all five loads.';
};
</script></body></html>
