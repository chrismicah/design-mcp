<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Alto Carmo | Cinder Supply</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body),system-ui,sans-serif;font-variant-numeric:tabular-nums}h1,h2,p,dl,dd{margin:0}h1,h2{line-height:1.04}button{cursor:pointer;font:inherit;font-weight:650;min-height:48px;background:var(--accent);color:var(--on);border:0;padding:12px 20px}button:hover{filter:brightness(.94)}:focus-visible{outline:2px solid var(--ink);outline-offset:4px;box-shadow:0 0 0 4px var(--paper)}.cap{font-size:.75rem;letter-spacing:.1em;font-weight:700;text-transform:uppercase}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
body{--paper:#f3ebe0;--ink:#2a1610;--accent:#6b2148;--on:#f3ebe0;--body:"Instrument Sans"}header,main{max-width:1256px;margin:auto;padding-inline:5vw}header{height:82px;border-bottom:1px solid #2a16103d}.wordmark,h1,.print{font-family:Fraunces,Georgia,serif}.wordmark{font-size:1.7rem;letter-spacing:-.06em}.count{border:1px solid;border-radius:50%;display:inline-grid;place-items:center;min-width:26px}main{display:grid;grid-template-columns:7fr 5fr;align-items:center;margin-block:60px}.object{position:relative;isolation:isolate;height:clamp(400px,60vh,640px);overflow:hidden;background:linear-gradient(118deg,#cba685,#e7c6a0 64%,#ad7855)}.panel{position:absolute;inset:10% -7% -8% 17%;transform:rotate(-12deg);padding:10%;background:repeating-linear-gradient(0deg,#915744 0 1px,#935947 1px 4px);box-shadow:-16px 18px 26px #50291f55}.label{height:100%;display:flex;flex-direction:column;justify-content:space-between;background:#efe0c0;border-top:12px solid var(--accent);padding:7%}.print{font-size:clamp(42px,6vw,90px);line-height:.86;letter-spacing:-.08em}.info{position:relative;padding:24px 0 24px 8%}h1{font-size:clamp(52px,6.3vw,88px);letter-spacing:-.055em;margin:12px 0 24px -14%;background:var(--paper);width:fit-content;padding-right:12px}.ledger div{padding:9px 0;border-bottom:1px solid #beafa1}.ledger dd{font-weight:650}.buy{margin-top:28px}.buy button{width:100%;border-radius:30px}.buy output{display:block;text-align:center;min-height:24px;font-size:.9rem}.settle{animation:settle 240ms ease-out}@keyframes settle{from{transform:translateY(-4px)}}@media(max-width:680px){header{height:58px}main{display:block;margin-block:16px;padding-bottom:112px}.object{height:62svh;max-height:460px}.info{padding:24px 0 0}h1{margin:4px 0 16px}.buy{position:fixed;bottom:0;left:0;right:0;padding:8px 5vw max(4px,env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid #beafa1}}@media(prefers-reduced-motion:reduce){.settle{animation:none}}
</style></head><body><header class="between"><b class="wordmark">Cinder Supply</b><span>Bag <b class="count">0</b></span></header><main><div class="object" aria-hidden="true"><div class="panel"><div class="label"><b class="cap">Cinder Supply</b><strong class="print">Alto<br>Carmo</strong><small>250 g · Small-batch coffee</small></div></div></div><section class="info"><span class="cap">Small-batch coffee</span><h1>Alto Carmo</h1><dl class="ledger"><div class="between"><dt>Bag size</dt><dd>250 g</dd></div><div class="between"><dt>Tasting notes</dt><dd>Cacao &amp; plum</dd></div><div class="between"><dt>Roasted</dt><dd>November 19</dd></div></dl><div class="buy"><button>Add Alto Carmo, 250 g — $19</button><output aria-live="polite"></output></div></section></main>
<script>
let bags = 0;
const add = document.querySelector('button');
add.onclick = () => {
  bags += 1;
  document.querySelector('.count').textContent = bags;
  document.querySelector('output').textContent = bags + (bags === 1 ? ' bag' : ' bags') + ' added · $' + 19 * bags;
  add.classList.add('settle');
};
add.onanimationend = () => add.classList.remove('settle');
</script></body></html>
