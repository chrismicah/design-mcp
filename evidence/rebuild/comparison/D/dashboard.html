<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linehaul | Morning shift</title><style>:root{--ink:#EEF0EC;--paper:#14181B;--accent:#FFAA72;--display:'IBM Plex Sans Condensed',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 var(--body)}main{width:min(1120px,92%);margin:auto;padding-bottom:48px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0;border-bottom:1px solid}header strong{font:600 26px var(--display)}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:var(--display);line-height:1.06}button,summary,a{font:inherit;color:inherit;cursor:pointer}button,summary{min-height:44px}button{border:0;background:var(--accent);color:var(--paper);padding:10px 18px;font-weight:650}a{text-underline-offset:5px}:focus-visible{outline:2px solid var(--ink);outline-offset:3px;box-shadow:0 0 0 3px var(--paper)}[hidden]{display:none!important}small{font-size:14px}dialog{width:min(480px,90vw);border:1px solid;color:var(--ink);background:var(--paper);padding:28px}dialog p{margin:18px 0}dialog::backdrop{background:#18191aca}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

main{font-variant-numeric:tabular-nums}header{border-color:#495051}header strong{font-stretch:condensed}.shift{margin:38px 0 20px;font-size:40px;letter-spacing:-.025em}.exception{border-left:5px solid var(--accent);background:#252c30;padding:24px;display:flex;align-items:center;gap:32px}.exception b{font:600 24px var(--display)}.value{color:var(--accent);font:600 40px/1.1 var(--display)}button{color:var(--paper)}.exception button{margin-left:auto}.workspace{margin:36px 0;display:grid;grid-template-columns:2fr 1fr;gap:40px}.queue{grid-column:1;grid-row:1}.rail{grid-column:2;border-left:1px solid #575e60;padding-left:24px}.rail strong{display:block;font-size:28px}.rail p{color:#d2d6cf}.workspace h2{font-size:20px;margin-bottom:12px}table{border-collapse:collapse;width:100%;text-align:left;font-size:16px}td,th{height:40px;border-block-end:1px solid #474d50;padding:4px}thead{color:#adb8b3}tbody tr:first-child td:last-child{color:var(--accent)}@media(max-width:700px){.exception{flex-wrap:wrap;gap:12px 20px;padding:16px}.exception button{width:100%;margin:0}.workspace{display:flex;flex-direction:column;gap:24px}.rail{padding-left:16px}.shift{margin-top:24px}}</style><body><main><header><strong>Linehaul</strong><small>Dispatch</small></header><h1 class="shift">Morning shift</h1><section class="exception" aria-label="Delayed load"><div><small>1 / 5</small><br><b>LS-057 · Bay 4</b></div><div class="value">+19 min</div><button id="toggle" aria-controls="loads" aria-pressed="false">Focus LS-057 at Bay 4</button></section><div class="workspace"><aside class="rail"><h2>Due next</h2><strong>LS-061</strong><p>In 9 minutes</p></aside><section class="queue"><h2 aria-live="polite" id="heading" tabindex="-1">Load queue · 5</h2><table id="loads"><thead><tr><th>Load</th><th>Bay</th><th>Status</th></tr></thead><tbody><tr><th scope="row">LS-057</th><td>4</td><td>Delayed 19 min</td></tr><tr><th scope="row">LS-061</th><td>2</td><td>Due in 9 min</td></tr><tr><th scope="row">LS-059</th><td>1</td><td>Loading</td></tr><tr><th scope="row">LS-062</th><td>3</td><td>Waiting</td></tr><tr><th scope="row">LS-064</th><td>5</td><td>Waiting</td></tr></tbody></table></section></div></main><script>const toggle=document.querySelector('#toggle'), heading=document.querySelector('#heading');
toggle.onclick=()=>{
 const focus=toggle.getAttribute('aria-pressed')==='false';
 toggle.setAttribute('aria-pressed',String(focus));
 document.querySelectorAll('tbody tr:not(:first-child)').forEach(row=>row.hidden=focus);
 toggle.textContent=focus?'Show all loads':'Focus LS-057 at Bay 4';
 heading.textContent=focus?'Focused load · LS-057':'Load queue · 5';
 heading.focus();
};</script></body></html>
