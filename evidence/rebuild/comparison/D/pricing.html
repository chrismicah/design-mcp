<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relay Notes | Pricing</title><style>:root{--ink:#15171c;--paper:#fbfaf7;--accent:#1f6f5c;--display:'Bricolage Grotesque',system-ui,sans-serif;--body:'Atkinson Hyperlegible',system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 var(--body)}main{width:min(1120px,92%);margin:auto;padding-bottom:48px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0;border-bottom:1px solid}header strong{font:600 26px var(--display)}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:var(--display);line-height:1.06}button,summary,a{font:inherit;color:inherit;cursor:pointer}button,summary{min-height:44px}button{border:0;background:var(--accent);color:var(--paper);padding:10px 18px;font-weight:650}a{text-underline-offset:5px}:focus-visible{outline:2px solid var(--ink);outline-offset:3px;box-shadow:0 0 0 3px var(--paper)}[hidden]{display:none!important}small{font-size:14px}dialog{width:min(480px,90vw);border:1px solid;color:var(--ink);background:var(--paper);padding:28px}dialog p{margin:18px 0}dialog::backdrop{background:#18191aca}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

main{max-width:1000px}h1{font-size:clamp(45px,6vw,72px);letter-spacing:-.03em;margin:54px 0 8px}fieldset{padding:0;border:0;margin:106px 9% 0 2%;min-width:0;position:relative;height:142px;--fill:33.333%}.axis{position:absolute;inset:0 0 auto;height:6px;background:#d3d7cd}.axis:before{content:'';display:block;height:100%;width:var(--fill);background:var(--accent);transition:width .3s ease-out}.stop{position:absolute;left:var(--pos);top:0}.stop input{position:absolute;left:-11px;top:-8px;width:22px;height:22px;margin:0;accent-color:var(--accent);cursor:pointer}.stop label{cursor:pointer;display:block;padding-top:22px;white-space:nowrap}.stop:last-child label{transform:translateX(-85%);text-align:right}.price{position:absolute;bottom:calc(100% + 10px);left:-14px}.stop:last-child .price{left:auto;right:0}.stop strong{font:700 26px var(--display)}.stop small{display:block}.stop:has(:checked){color:var(--accent)}button{border-radius:4px}#result{margin-top:36px}#result p{margin:16px 0}@media(max-width:650px){h1{margin-top:30px}fieldset{margin:32px 0 20px 14px;height:300px}.axis{inset:0 auto 0 0;width:5px;height:100%}.axis:before{width:100%;height:var(--fill);transition:height .3s}.stop{left:0;top:calc(var(--pos) * .74 + 6%)}.stop input{top:2px;left:-9px}.stop label,.stop:last-child label{transform:none;text-align:left;padding:0 0 0 24px}.stop .price,.stop:last-child .price{position:static;float:right;margin-left:18px}.stop strong{font-size:20px}.axis{top:6%;height:74%}form button{width:100%}}</style><body><main><header><strong>Relay Notes</strong><span>Pricing</span></header><h1>Transcription plans</h1><p>Choose your monthly interview hours.</p><form id="plans"><fieldset aria-label="Monthly plans"><div class="axis" aria-hidden="true"></div><div class="stop" style="--pos:8.3333%"><input id="Solo" type="radio" name="tier" value="Solo" data-price="12" data-hours="10" ><label for="Solo"><span class="price">$12/mo</span><strong>Solo</strong><small>10 hours</small><small></small></label></div><div class="stop" style="--pos:33.3333%"><input id="Team" type="radio" name="tier" value="Team" data-price="28" data-hours="40" checked><label for="Team"><span class="price">$28/mo</span><strong>Team</strong><small>40 hours</small><small>Shared vocabulary</small></label></div><div class="stop" style="--pos:100.0000%"><input id="Studio" type="radio" name="tier" value="Studio" data-price="60" data-hours="120" ><label for="Studio"><span class="price">$60/mo</span><strong>Studio</strong><small>120 hours</small><small>Approvals</small></label></div></fieldset><button>Continue with Team — $28/month</button></form><section hidden id="result"><h2 tabindex="-1">Plan summary</h2><p></p><button>Change plan</button></section></main><script>const form=document.querySelector('#plans'),result=document.querySelector('#result');
const chosen=()=>form.querySelector(':checked');
form.onchange=()=>{const tier=chosen();form.querySelector('fieldset').style.setProperty('--fill',(tier.dataset.hours/120*100)+'%');form.querySelector('button').textContent='Continue with '+tier.value+' — $'+tier.dataset.price+'/month'};
form.onsubmit=event=>{event.preventDefault();const tier=chosen();result.querySelector('p').textContent=tier.value+' · $'+tier.dataset.price+'/month · '+tier.dataset.hours+' hours';form.hidden=true;result.hidden=false;result.querySelector('h2').focus()};
result.querySelector('button').onclick=()=>{result.hidden=true;form.hidden=false;chosen().focus()};</script></body></html>
